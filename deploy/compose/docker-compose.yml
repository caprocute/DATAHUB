# Hạ tầng DEV cục bộ — IP-04 WP-01
# Usage: từ root repo → make up-dev
name: lgsp

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lgsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lgsp_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-lgsp}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v2.1.0
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
      - "${GARAGE_RPC_PORT:-3901}:3901"
      - "${GARAGE_ADMIN_PORT:-3902}:3902"
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./garage/garage.toml:/etc/garage.toml:ro
    environment:
      RUST_LOG: info
    # Default image Cmd = ["/garage","server"]; config mặc định /etc/garage.toml

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_change_me}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-lgsp.json:/opt/keycloak/data/import/realm-lgsp.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Audit/WORM (CMP-28) — Garage chưa Object Lock; SeaweedFS dùng cho retention DEV
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    ports:
      - "${SEAWEED_S3_PORT:-8333}:8333"
      - "${SEAWEED_MASTER_PORT:-9333}:9333"
    volumes:
      - seaweed_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.port=9333
      - -volume.port=8080

  wiremock:
    image: wiremock/wiremock:3.13.0
    ports:
      - "${WIREMOCK_PORT:-8089}:8080"
    volumes:
      - ./wiremock:/home/wiremock:ro
    command: ["--global-response-templating", "--verbose"]

  apisix:
    build:
      context: ../apisix
      dockerfile: Dockerfile
    image: lgsp/apisix-coraza:3.11.0
    ports:
      - "${APISIX_PORT:-9080}:9080"
    volumes:
      - ../apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak

volumes:
  pgdata:
  garage_meta:
  garage_data:
  seaweed_data:
