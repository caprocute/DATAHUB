# Garage DEV — một nút, không HA. ADR-020 · image dxflrs/garage:v2.1.0
replication_factor = 1

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

# Mount Docker thường world-readable — chỉ DEV
allow_world_readable_secrets = true

# 32 bytes hex (64 ký tự)
rpc_secret = "a1b2c3d4e5f60718293a4b5c6d7e8f90112233445566778899aabbccddeeff00"
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.lgsp.local"

[s3_web]
bind_addr = "[::]:3903"
root_domain = ".web.lgsp.local"

[admin]
api_bind_addr = "[::]:3902"
admin_token = "dev_admin_token_change_me"
