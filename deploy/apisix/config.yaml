apisix:
  node_listen: 9080
  enable_admin: false
  enable_control: true
  control:
    ip: 0.0.0.0
    port: 9092

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

# Coraza WAF via proxy-wasm — WP-12 / ADR-003
wasm:
  plugins:
    - name: coraza-filter
      priority: 7999
      file: /usr/local/apisix/proxywasm/coraza-proxy-wasm.wasm

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
