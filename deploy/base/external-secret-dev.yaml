# Mẫu External Secrets DEV — fake backend. Không dùng PROD.
# Cần External Secrets Operator + ClusterSecretStore "fake" trên cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lgsp-control-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake
    kind: ClusterSecretStore
  target:
    name: lgsp-control-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: /lgsp/dev/postgres
        property: password
