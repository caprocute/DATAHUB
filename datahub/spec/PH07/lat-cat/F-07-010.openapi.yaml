# TỆP SINH bởi datahub/tools/cat_lat_openapi.py — không sửa tay; sửa nguồn rồi cắt lại.
openapi: 3.1.0
info:
  title: Datahub · PH-07 Danh mục dùng chung (RDM) API · lát cắt createCatalogGroup,deleteCatalogGroup,listCatalogGroups,updateCatalogGroup
  version: 1.0.0-draft
  summary: Quản trị, phát hành, khai thác và chuyển mã danh mục dùng chung đa tenant.
  description: "API của phân hệ PH-07 (module `rdm` trong đơn vị triển khai `dh-data`) phục vụ hai nhóm\nngười dùng\
    \ khác nhau và vì vậy được chia thành hai mặt:\n\n* **Mặt quản trị** (người dùng qua giao diện Datahub, token\
    \ Authorization Code + PKCE):\n  tạo danh mục, khai báo lược đồ thuộc tính, soạn bản nháp, nhập tệp, trình duyệt,\n\
    \  phát hành, đồng bộ quốc gia, ánh xạ mã. Phân trang theo trang (`page`, `size` ≤ 200).\n* **Mặt khai thác**\
    \ (HTTT thành viên, token Client Credentials với scope `rdm.read`,\n  `rdm.query`, `rdm.write`): tra cứu một\
    \ mã, tra lô, lấy toàn bộ theo con trỏ, cây,\n  delta, truy vấn có cấu trúc, chuyển mã ĐVHC, chuyển mã qua bảng\
    \ ánh xạ.\n  Phân trang theo con trỏ (`cursor`, `limit` ≤ 1000), có ETag và Cache-Control vì\n  phiên bản đã\
    \ phát hành là bất biến.\n\nQuy ước chung (D03-01 SAD §7.2): tenant lấy từ token, không truyền qua tham số;\
    \ lệnh\ntạo nhận `Idempotency-Key` (lưu 24 giờ, so băm SHA-256 thân yêu cầu); lệnh sửa và lệnh\nđổi trạng thái\
    \ bắt buộc `If-Match` với ETag sinh từ cột `version`; lệnh đổi trạng thái\ndùng hậu tố `:{hành-động}`; lỗi theo\
    \ RFC 9457 (`application/problem+json`) với mã\n`ERR-07-nnn`; header `traceparent` (W3C Trace Context) được\
    \ truyền xuyên suốt.\n\nMọi tên miền, máy chủ, client và dữ liệu trong tài liệu này là **giả lập** phục vụ\n\
    minh họa; không có giá trị kết nối thật.\n"
  contact:
    name: Nhóm phân hệ PH-07
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH07
  x-datahub-phase: PH-07
servers:
- url: https://api.{tenantHost}.datahub.example.vn/api/rdm/v1
  description: Cổng API (APISIX) của một tenant tỉnh — giả lập
  variables:
    tenantHost:
      default: lamdong
      description: Tên máy chủ theo tenant, ví dụ `lamdong` cho tenant T68 (giả lập).
- url: http://localhost:8080/api/rdm/v1
  description: Môi trường phát triển cục bộ (`dh-data` chạy trực tiếp, không qua APISIX)
security:
- oauth2User: []
paths:
  /catalog-groups:
    get:
      tags:
      - Nhóm danh mục
      operationId: listCatalogGroups
      summary: Cây nhóm danh mục
      description: Trả toàn bộ cây nhóm của tenant cộng nhóm COMMON, kèm số danh mục trong mỗi nhóm (không gồm nhóm
        con).
      x-datahub-id: API-07-007
      x-datahub-fr:
      - FR-07-010
      x-datahub-permission:
        permission: PERM-07-read
        scopes:
        - rdm.read
      security:
      - oauth2User: []
      - oauth2Client:
        - rdm.read
      parameters:
      - name: flat
        in: query
        description: '`true` trả danh sách phẳng có `parentId` thay vì cây lồng.'
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Cây nhóm.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogGroup'
              examples:
                cay:
                  $ref: '#/components/examples/CatalogGroupTree'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Nhóm danh mục
      operationId: createCatalogGroup
      summary: Tạo nhóm danh mục
      x-datahub-id: API-07-008
      x-datahub-fr:
      - FR-07-010
      x-datahub-permission:
        permission: PERM-07-create
        note: TENANT_ADMIN với nhóm của tenant; PLATFORM_ADMIN (tenant PLATFORM) với nhóm COMMON.
      x-datahub-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogGroupCreateRequest'
            example:
              code: KINH_TE
              name: Kinh tế, doanh nghiệp
              parentId: null
              sortOrder: 30
              description: Danh mục phục vụ quản lý doanh nghiệp, đầu tư
      responses:
        '201':
          description: Đã tạo nhóm.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              examples:
                daTao:
                  $ref: '#/components/examples/CatalogGroupCreated'
              schema:
                $ref: '#/components/schemas/CatalogGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /catalog-groups/{groupId}:
    parameters:
    - $ref: '#/components/parameters/GroupId'
    patch:
      tags:
      - Nhóm danh mục
      operationId: updateCatalogGroup
      summary: Sửa nhóm danh mục
      description: Sửa tên, mô tả, thứ tự, nhóm cha. Đổi nhóm cha tạo vòng hoặc vượt độ sâu 5 bị từ chối 409 ERR-07-039.
        Không sửa được `code`.
      x-datahub-id: API-07-009
      x-datahub-fr:
      - FR-07-010
      x-datahub-permission:
        permission: PERM-07-update
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            examples:
              chuyenNhom:
                $ref: '#/components/examples/CatalogGroupUpdateExample'
            schema:
              $ref: '#/components/schemas/CatalogGroupUpdateRequest'
          application/json:
            examples:
              chuyenNhom:
                $ref: '#/components/examples/CatalogGroupUpdateExample'
            schema:
              $ref: '#/components/schemas/CatalogGroupUpdateRequest'
      responses:
        '200':
          description: Đã sửa.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              examples:
                daSua:
                  $ref: '#/components/examples/CatalogGroupUpdated'
              schema:
                $ref: '#/components/schemas/CatalogGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Nhóm danh mục
      operationId: deleteCatalogGroup
      summary: Xóa nhóm rỗng
      description: Xóa hẳn nhóm không còn danh mục (kể cả RETIRED và danh mục đã xóa mềm còn tham chiếu) và không
        còn nhóm con; còn thì 409 ERR-07-037.
      x-datahub-id: API-07-010
      x-datahub-fr:
      - FR-07-010
      x-datahub-permission:
        permission: PERM-07-update
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '204':
          description: Đã xóa.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
components:
  examples:
    CatalogGroupCreated:
      summary: Nhóm vừa tạo
      value:
        id: 0193b6a0-7c2e-700d-8a1d-00000000000d
        tenantId: T68
        code: Y_TE
        name: Y tế
        parentId: null
        sortOrder: 3
        description: null
        catalogCount: 0
        children: []
    CatalogGroupTree:
      summary: Cây nhóm danh mục
      value:
        items:
        - id: 0193b6a0-7c2e-700a-8a1d-00000000000a
          tenantId: T68
          code: KINH_TE
          name: Kinh tế
          parentId: null
          sortOrder: 1
          catalogCount: 14
          children:
          - id: 0193b6a0-7c2e-700b-8a1d-00000000000b
            tenantId: T68
            code: DOANH_NGHIEP
            name: Doanh nghiệp
            parentId: 0193b6a0-7c2e-700a-8a1d-00000000000a
            sortOrder: 1
            catalogCount: 6
            children: []
        - id: 0193b6a0-7c2e-700c-8a1d-00000000000c
          tenantId: COMMON
          code: HANH_CHINH
          name: Hành chính
          parentId: null
          sortOrder: 2
          catalogCount: 9
          children: []
    CatalogGroupUpdateExample:
      summary: Chuyển nhóm vào nhóm cha
      value:
        parentId: 0193b6a0-7c2e-700a-8a1d-00000000000a
        sortOrder: 2
    CatalogGroupUpdated:
      summary: Nhóm sau khi sửa
      value:
        id: 0193b6a0-7c2e-700d-8a1d-00000000000d
        tenantId: T68
        code: Y_TE
        name: Y tế
        parentId: 0193b6a0-7c2e-700a-8a1d-00000000000a
        sortOrder: 2
        description: null
        catalogCount: 0
        children: []
  headers:
    ETag:
      description: Thẻ thực thể. Tài nguyên quản trị dùng ETag yếu `W/"{version}"`; tài nguyên khai thác dùng ETag
        mạnh gắn với `versionId` của phiên bản danh mục.
      schema:
        type: string
      example: W/"7"
    Location:
      description: URL tuyệt đối của tài nguyên vừa tạo, tác vụ nền, hoặc URL ký sẵn (302).
      schema:
        type: string
        format: uri
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Khóa chống trùng do client sinh (khuyến nghị UUID v4/v7), 16–128 ký tự. Máy chủ lưu

        (khóa, chủ thể, phương thức, đường dẫn, SHA-256 thân) trong 24 giờ: gửi lại cùng khóa và

        cùng thân trả lại phản hồi đã lưu kèm `Idempotent-Replayed: true`; cùng khóa khác thân trả

        409 ERR-07-022. Bắt buộc với HTTT, khuyến nghị với giao diện.

        '
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag nhận từ lần đọc trước (sinh từ cột `version`). Không khớp trả 412 ERR-07-018; thiếu trả
        428 được quy về 400 ERR-07-040.
      schema:
        type: string
        example: W/"7"
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context. Nếu vắng, APISIX sinh mới. `traceId` trong lỗi lấy từ đây.
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
  responses:
    BadRequest:
      description: Yêu cầu sai cú pháp hoặc vi phạm giới hạn đầu vào (ERR-07-023, 025, 026, 040).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Xung đột trạng thái (ERR-07-002, 004, 005, 008, 013, 016, 020, 022, 029, 032, 033, 037, 039).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Không đủ quyền (ERR-07-046), danh mục chỉ đọc (ERR-07-003), tự duyệt (ERR-07-015), HTTT chưa
        được cấp quyền danh mục hạn chế (ERR-07-030).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Không tìm thấy danh mục (ERR-07-001), phiên bản (ERR-07-006), mã bản ghi tại thời điểm (ERR-07-007),
        ánh xạ (ERR-07-027) hoặc tài nguyên khác (ERR-07-045). Đối tượng của tenant khác luôn trả 404 để không lộ
        sự tồn tại (FR-00-011).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: ETag không khớp, đối tượng đã bị người khác sửa (ERR-07-018).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Thiếu token hoặc token không hợp lệ, hết hạn (ERR-07-041).
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Ví dụ `Bearer realm="dh-t68", error="invalid_token"`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: Dữ liệu đúng cú pháp nhưng vi phạm quy tắc nghiệp vụ (ERR-07-009…012, 014, 017, 019, 021, 024,
        034, 035, 036).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    AuditFields:
      type: object
      properties:
        createdAt:
          $ref: '#/components/schemas/TTs'
        createdBy:
          type: string
          description: Định danh người tạo (T-ID) hoặc `client:{clientId}` với HTTT.
        updatedAt:
          $ref: '#/components/schemas/TTs'
        updatedBy:
          type: string
        version:
          type: integer
          minimum: 0
          description: Khóa lạc quan; ETag = `W/"{version}"`.
    CatalogGroup:
      allOf:
      - $ref: '#/components/schemas/AuditFields'
      - type: object
        required:
        - id
        - code
        - name
        properties:
          id:
            $ref: '#/components/schemas/TId'
          tenantId:
            $ref: '#/components/schemas/TenantCode'
          code:
            $ref: '#/components/schemas/TCode'
          name:
            $ref: '#/components/schemas/TName'
          parentId:
            type:
            - string
            - 'null'
            format: uuid
          sortOrder:
            type: integer
            default: 0
          description:
            type:
            - string
            - 'null'
            maxLength: 4000
          catalogCount:
            type: integer
            readOnly: true
          children:
            type: array
            items:
              $ref: '#/components/schemas/CatalogGroup'
    CatalogGroupCreateRequest:
      type: object
      required:
      - code
      - name
      properties:
        code:
          $ref: '#/components/schemas/TCode'
        name:
          $ref: '#/components/schemas/TName'
        parentId:
          type:
          - string
          - 'null'
          format: uuid
        sortOrder:
          type: integer
          default: 0
        description:
          type:
          - string
          - 'null'
          maxLength: 4000
    CatalogGroupUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/TName'
        parentId:
          type:
          - string
          - 'null'
          format: uuid
        sortOrder:
          type: integer
        description:
          type:
          - string
          - 'null'
          maxLength: 4000
    ProblemDetails:
      type: object
      description: Lỗi theo RFC 9457 mở rộng. `title`, `detail` bằng tiếng Việt (FR-00-080).
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
          description: '`https://datahub.gov.vn/problems/rdm/{slug}` (tên miền giả định, chờ chốt).'
        title:
          type: string
          description: Tóm tắt ngắn, cố định theo `code`.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Mô tả cụ thể lần lỗi này và cách khắc phục.
        instance:
          type: string
          format: uri-reference
          description: Đường dẫn yêu cầu gây lỗi.
        code:
          type: string
          pattern: ^ERR-(07|00)-\d{3}$
          description: Mã lỗi ERR-07-nnn (hoặc ERR-00-nnn của tầng dùng chung).
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: T-TRACE từ `traceparent`.
        timestamp:
          $ref: '#/components/schemas/TTs'
        errors:
          type: array
          maxItems: 1000
          description: Lỗi chi tiết theo dòng/trường. Với lô, `row` là chỉ số thao tác (từ 0); với tệp, `row` là
            số dòng trong tệp (từ 1).
          items:
            $ref: '#/components/schemas/ProblemError'
        errorsTruncated:
          type: boolean
          description: '`true` nếu có hơn 1000 lỗi; tải đầy đủ qua báo cáo lỗi.'
      additionalProperties: true
    ProblemError:
      type: object
      required:
      - code
      - message
      properties:
        row:
          type: integer
          minimum: 0
        itemCode:
          type: string
        field:
          type: string
          description: Trường hoặc đường dẫn, ví dụ `attrs.loai_hinh`, `parentCode`, cột `MA_CHA`.
        code:
          type: string
          description: Mã lỗi con, ví dụ `REQUIRED`, `MAX_LENGTH`, `PATTERN`, `ENUM`, `TYPE`, `UNIQUE`, `REF_NOT_FOUND`,
            `PARENT_NOT_FOUND`, `CYCLE`, `DEPTH`, `LOCAL_RANGE`.
        message:
          type: string
        value:
          description: Giá trị gây lỗi (đã cắt ≤ 200 ký tự).
    TCode:
      type: string
      pattern: ^[A-Z0-9][A-Z0-9_.-]{0,63}$
      description: T-CODE, chữ hoa. Đầu vào chữ thường được chuẩn hóa thành chữ hoa trước khi kiểm tra.
    TId:
      type: string
      format: uuid
      description: T-ID, UUID phiên bản 7.
    TName:
      type: string
      minLength: 1
      maxLength: 255
      description: T-NAME, Unicode NFC.
    TTs:
      type: string
      format: date-time
    TenantCode:
      type: string
      pattern: ^(T\d{2}|PLATFORM|COMMON)$
  securitySchemes:
    oauth2Client:
      type: oauth2
      description: 'HTTT thành viên lấy token bằng Client Credentials tại realm Keycloak của tenant

        (`dh-t68` cho T68). Scope được sinh tự động từ đăng ký sử dụng đã duyệt (D02-08 §5):

        `rdm.read` tra cứu, `rdm.query` truy vấn có cấu trúc, `rdm.write` nhập lô vào bản nháp.

        APISIX kiểm tra chữ ký và scope trước khi chuyển tới `dh-data`; `dh-data` kiểm tra lại

        tenant và quyền khai thác danh mục RESTRICTED (BR-07-019).

        '
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            rdm.read: Tra cứu danh mục (một mã, lô, toàn bộ, cây, delta, lược đồ, ảnh chụp, chuyển mã)
            rdm.query: Truy vấn có cấu trúc bằng DSL (items:query)
            rdm.write: Ghi lô bản ghi vào bản nháp (items:batch) với danh mục được cấp
            platform.tenant.provision: Chỉ client dịch vụ PH-20 — nạp gói danh mục nền (giả định)
    oauth2User:
      type: oauth2
      description: 'Người dùng đăng nhập qua OIDC Authorization Code + PKCE (FR-00-001). Quyền chi tiết

        `PERM-07-*` lấy từ vai trò trong realm tenant và được OPA đánh giá theo D02-08; phạm vi

