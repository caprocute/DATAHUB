title = "LGSP gitleaks"

[extend]
useDefault = true

[allowlist]
description = "DEV placeholders documented — không phải secret production"
paths = [
  '''deploy/compose/keycloak/realm-lgsp\.json''',
  '''\.env\.example''',
  '''deploy/compose/garage/garage\.toml''',
]
regexTarget = "line"
regexes = [
  # Ví dụ khóa idempotency (UUID) trong tài liệu API, không phải bí mật
  '''Idempotency-Key: [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
  '''lgsp_dev_change_me''',
  '''admin_dev_change_me''',
  '''control-dev-secret-change-me''',
  '''dev_admin_token_change_me''',
  '''a1b2c3d4e5f60718293a4b5c6d7e8f90112233445566778899aabbccddeeff00''',
  '''lgsp_audit_dev_secret_change_me''',
  # Ví dụ bí mật sandbox giả trong tài liệu API PH-15 (cổng nhà phát triển), không phải bí mật thật
  '''sbxs_9mXqT2vLw8Rk5HfA3yNcD7bZ''',
  '''sbxs_Pq7Lw2Xv9Tn4KcM8aRf6HdB3''',
  '''dhsk_t68_Zm9vYmFyYmF6cXV4MTIzNDU2Nzg5''',
  '''7c1d9a42-5b3e-4f60-8d17-2a9c0e5f6b31''',
  # Mã quyền trong bảng sinh OpenAPI PH-15, bị nhận nhầm là khóa
  '''x\(87, 'Gửi đăng ký sử dụng API production', 'PERM-02-subscribe'''',
]
