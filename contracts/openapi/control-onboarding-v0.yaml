openapi: 3.1.0
info:
  title: LGSP Control — PH-01 Onboarding
  version: 0.1.0
  description: Thin-slice W1 — nộp / liệt kê / phê duyệt hồ sơ kết nạp.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /onboarding/applications:
    get:
      operationId: listApplications
      summary: Liệt kê hồ sơ kết nạp
      tags: [Onboarding]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: submitApplication
      summary: Nộp hồ sơ kết nạp
      tags: [Onboarding]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationSubmit"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /onboarding/applications/{id}:
    get:
      operationId: getApplication
      summary: Chi tiết hồ sơ
      tags: [Onboarding]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          $ref: "#/components/responses/Problem"
  /onboarding/applications/{id}/approve:
    post:
      operationId: approveApplication
      summary: Phê duyệt hồ sơ (role INTEGRATION_REVIEWER)
      tags: [Onboarding]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /onboarding/status:
    get:
      operationId: onboardingModuleStatus
      summary: Health module (DEV)
      tags: [Onboarding]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
  schemas:
    ProblemDetail:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
    ApplicationSubmit:
      type: object
      required: [systemCode, systemName, ownerOrg]
      properties:
        systemCode: { type: string, example: HE_THONG_MOT_CUA }
        systemName: { type: string }
        ownerOrg: { type: string, example: Sở TT&TT tỉnh Demo }
    Application:
      type: object
      properties:
        id: { type: string, format: uuid }
        systemCode: { type: string }
        systemName: { type: string }
        ownerOrg: { type: string }
        status:
          type: string
          enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]
        clientId: { type: string, nullable: true }
        clientSecretSealed: { type: string, nullable: true, description: "DEV sealed stub — không phải secret thô" }
    ApplicationPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Application" }
        nextCursor: { type: string, nullable: true }
