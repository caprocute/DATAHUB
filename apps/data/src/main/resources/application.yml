server:
  port: ${DATA_PORT:8083}

spring:
  application:
    name: lgsp-data
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:lgsp}
    username: ${POSTGRES_USER:lgsp}
    password: ${POSTGRES_PASSWORD:lgsp_dev_change_me}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/lgsp}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.modulith: INFO
    vn.lgsp.data: INFO

lgsp:
  opa:
    enabled: ${LGSP_OPA_ENABLED:true}
    url: ${LGSP_OPA_URL:http://localhost:8181}
