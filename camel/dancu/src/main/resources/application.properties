quarkus.application.name=lgsp-camel-dancu
quarkus.http.port=8088
%test.quarkus.http.port=0

# YAML DSL routes (ping)
camel.main.routes-include-pattern=classpath:routes/*.camel.yaml

# Bộ chuyển kiểu Jackson (camel-jackson): cho phép List/Map ↔ JsonNode ↔ String —
# luồng thiết kế trên console dùng transform JQ nên body SQL phải đổi được sang JsonNode.
camel.main.global-options[CamelJacksonEnableTypeConverter]=true

# Datasource Postgres DEV (compose lgsp-postgres-1) — mật khẩu là default DEV đã công khai
# trong docker-compose.yml, override bằng env khi khác môi trường (không phải secret mới).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:lgsp}
quarkus.datasource.password=${POSTGRES_PASSWORD:lgsp_dev_change_me}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:lgsp}
quarkus.datasource.devservices.enabled=false

lgsp.adapter-mgr.base-url=http://localhost:8082
lgsp.adapter.id=http-mock-tra-cuu
