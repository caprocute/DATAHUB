# D03-04-PH17 · OpenAPI PH-17 (module assist của dh-assist). SINH TỰ ĐỘNG bởi tools/gen_openapi.py, không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-17 Trợ lý AI và quản trị AI
  version: 1.0.0-draft
  summary: Chính sách bật tắt theo tenant, cổng và sổ mô hình, kho tri thức, hỏi đáp tìm dịch vụ, gợi ý ánh xạ, giải thích sự cố, công cụ chỉ đọc, chặn an toàn, đánh
    giá và ca đỏ, nhật ký, báo cáo, dịch vụ AI cho phân hệ khác.
  description: 'Module `assist` của `dh-assist` (package `vn.datahub.assist`): control plane `/api/assist/v1` qua APISIX và BFF; data plane `/assist/v1` chỉ trong
    cụm (mTLS, SPIFFE).


    Quy ước (D03-04-PH17 §1): tenant lấy từ token, không từ tham số; mọi `POST` đổi dữ liệu nhận `Idempotency-Key`; `PUT`, `PATCH`, hành động có `If-Match`; hậu tố
    `:{hành-động}`; phân trang `page`, `size`, `sort`; lỗi RFC 9457 mã `ERR-17-nnn`; câu trả lời phát trực tuyến bằng SSE. Không có nội dung hội thoại chưa che, bí
    mật nhà cung cấp hay vector ở phản hồi. Mọi tên, mã, số trong ví dụ là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-17
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH17
  x-datahub-phase: PH-17
servers:
- url: https://api.{tenantHost}.datahub.example.vn/api/assist/v1
  description: Control plane qua APISIX (giả lập)
  variables:
    tenantHost:
      default: t68
      description: Ví dụ `t68` (giả lập).
- url: http://dh-assist.dh-assist.svc:8080/api/assist/v1
  description: Control plane trong cụm
- url: http://localhost:8087/api/assist/v1
  description: Phát triển cục bộ
security:
- oauth2User: []
tags:
- name: Chính sách
  description: Trạng thái, chính sách theo tenant, đề nghị đổi bốn mắt, năng lực, danh sách trắng nhà cung cấp, hạn mức, điều khoản, tắt khẩn (FR-17-001…006).
- name: Cổng mô hình
  description: Nhà cung cấp, cam kết, mô hình, phiên bản, mô hình của tenant, tuyến egress, giới hạn cổng, cầu dao, vết lời gọi, sức khỏe (FR-17-007…014).
- name: Kho tri thức
  description: Nguồn, lập chỉ mục, kiểm mức phân loại, tài liệu, xóa lan truyền, tài liệu tải lên, tình trạng chỉ mục (FR-17-015…021).
- name: Hội thoại và tìm kiếm
  description: Hội thoại, tin nhắn (đầy đủ và phát trực tuyến), tìm dịch vụ, câu hỏi gợi ý, ngữ cảnh màn hình (FR-17-022…029).
- name: Gợi ý ánh xạ
  description: Gợi ý ánh xạ trường và mã, kiểm biểu thức, xem trước, áp dụng, sửa, từ chối (FR-17-030…035).
- name: Giải thích sự cố
  description: Giải thích mã lỗi, vết, bản tin DLQ, danh sách kiểm khắc phục, tóm tắt sự cố, xem trước che log (FR-17-036…041).
- name: Công cụ và an toàn
  description: Công cụ chỉ đọc, nhật ký gọi công cụ, giới hạn, quy tắc lọc, danh sách trắng liên kết (FR-17-042…047).
- name: Quản trị AI
  description: Chỉ dẫn hệ thống, bộ đánh giá, ca đỏ, cổng phát hành, phản hồi, chất lượng, sổ hệ thống AI, tập ẩn danh (FR-17-049…054, 062).
- name: Nhật ký và báo cáo
  description: Nhật ký hội thoại đã che, phiếu truy cập, hạn lưu, gói bằng chứng, báo cáo sử dụng, tham số (FR-17-055…059).
- name: Data plane
  description: Suy luận nội bộ cho PH-04, gợi ý bước quy trình cho PH-11, cấu hình hiệu lực, sẵn sàng; chỉ trong cụm (FR-17-060, 061).
