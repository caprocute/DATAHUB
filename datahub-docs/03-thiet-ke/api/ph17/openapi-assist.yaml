components:
  securitySchemes:
    oauth2User:
      type: oauth2
      description: Người dùng đăng nhập Keycloak (realm của tenant), Authorization Code với PKCE qua BFF; quyền chức năng `PERM-17-*` ở claim `permissions`.
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes: {}
    oauth2Machine:
      type: oauth2
      description: Token dịch vụ (client_credentials với mTLS hoặc private_key_jwt) của DU gọi.
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            assist:infer: Suy luận nội bộ cho DU gọi (PH-04, PH-11)
            assist:report: Nguồn số liệu sử dụng cho PH-16
    mtlsSpiffe:
      type: mutualTLS
      description: Danh tính DU theo SPIFFE ID của Istio; data plane kiểm DU nào có scope nào (SEC-15).
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Số trang, từ 0.
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Cỡ trang, 1…100.
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: Khóa sắp xếp; tiền tố `-` là giảm dần.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Khóa chống trùng (BR-17-087); giữ 24 giờ; cùng khóa và thân trả lại phản hồi cũ.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: '`ETag` của đối tượng; thiếu trả `428`, lệch trả `409` ERR-17-004.'
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
        pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      description: W3C Trace Context.
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - vi
        - en
      description: Ngôn ngữ thông báo lỗi.
  responses:
    BadRequest:
      description: 'Lỗi 400 (RFC 9457): ERR-17-003.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            ERR_17_003:
              summary: 'Dữ liệu không hợp lệ: {chi tiết}.'
              value:
                type: https://datahub.gov.vn/errors/ERR-17-003
                title: 'Dữ liệu không hợp lệ: {chi tiết}.'
                status: 400
                code: ERR-17-003
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unauthorized:
      description: Lỗi 401 (RFC 9457) theo mã nền ERR-00-401.
      content:
        application/problem+json:
