components:
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
      description: Con trỏ mờ từ `page.next`.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
      description: Mặc định 20, tối đa 200 (khung §10.1).
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: ETag hiện tại (`W/"{version}"`); lệch trả ERR-19-045 (412).
    IdempotencyKeyOpt:
      name: Idempotency-Key
