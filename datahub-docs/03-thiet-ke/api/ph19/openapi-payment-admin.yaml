# D03-04-PH19 · Datahub · PH-19 Thanh toán · API quản trị. SINH TỰ ĐỘNG bởi tools/gen_openapi.py — không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-19 Thanh toán · API quản trị
  version: 1.0.0-draft
  summary: 'API quản trị của `dh-payment` (vai trò `api`) cho `dh-console`: NCC, dịch vụ, đối tác, phê duyệt bốn mắt, giao dịch, IPN, hoàn tiền,
    đối soát, chênh lệch, nhật ký, webhook, dashboard, báo cáo, cấu hình, di trú.'
  description: 'API quản trị của `dh-payment` (vai trò `api`) cho `dh-console`: NCC, dịch vụ, đối tác, phê duyệt bốn mắt, giao dịch, IPN, hoàn
    tiền, đối soát, chênh lệch, nhật ký, webhook, dashboard, báo cáo, cấu hình, di trú. Token OIDC người dùng (Authorization Code + PKCE qua BFF),
    quyền `PERM-19-*` kiểm ở OPA, dữ liệu giới hạn trong tenant của token (RLS).


    Quy ước chung, bảng mã lỗi: D03-04-PH19 §1, §6. Mọi tên miền, dữ liệu là giả lập. Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-19
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH19
  x-datahub-phase: PH-19
servers:
- url: https://{host}/api/payment/v1
  description: Qua APISIX — giả lập
  variables:
    host:
      default: console.t68.datahub.example.vn
- url: http://localhost:8089/api/payment/v1
  description: Phát triển cục bộ
security:
- oauth2User: []
tags:
- name: Nhà cung cấp
- name: Nhóm dịch vụ
- name: Dịch vụ
- name: Đối tác
- name: Phê duyệt
- name: Giao dịch
- name: Thông báo IPN
- name: Hoàn tiền
- name: Đối soát
- name: Chênh lệch
- name: Nhật ký và webhook
- name: Dashboard và báo cáo
- name: Cấu hình, tệp, di trú
paths:
  /providers:
    get:
      tags:
      - Nhà cung cấp
      operationId: listProviders
      summary: Danh sách NCC, lọc trạng thái, sức khỏe, từ khóa
      x-datahub-id: API-19-001
      x-datahub-fr:
      - FR-19-007
      x-datahub-permission: provider-read
      parameters:
      - name: status
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ProviderStatus'
        style: form
        explode: false
      - name: health
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/HealthStatus'
        style: form
        explode: false
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
          minLength: 2
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPage'
        '400':
          $ref: '#/components/responses/Err001'
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
          $ref: '#/components/responses/Err046'
        '429':
          $ref: '#/components/responses/Err048'
        '500':
          $ref: '#/components/responses/Err099'
        '503':
          $ref: '#/components/responses/Err049'
    post:
      tags:
      - Nhà cung cấp
      operationId: createProvider
      summary: Khai báo NCC (`DRAFT`)
      x-datahub-id: API-19-002
      x-datahub-fr:
      - FR-19-001
      x-datahub-permission: provider-write
      description: Tạo NCC `DRAFT`, sinh `connectionKey` (lưu OpenBao, CSDL chỉ giữ băm) và dòng `callback_route`; với adapter `PAYGOV` nạp bảng
        ánh xạ mã mặc định phiên bản 1 (giả định, SDD §7.3).
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyOpt'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreate'
      responses:
        '201':
          description: Đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetail'
          headers:
            ETag:
              schema:
                type: string
              description: '`W/"{version}"`'
            Location:
              schema:
                type: string
            Idempotent-Replayed:
              schema: &id001
                type: boolean
              description: '`true` khi trả lại phản hồi đã lưu.'
        '400':
          $ref: '#/components/responses/Err001'
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
          $ref: '#/components/responses/Err046'
        '409':
          $ref: '#/components/responses/Err038'
        '429':
          $ref: '#/components/responses/Err048'
        '500':
          $ref: '#/components/responses/Err099'
        '503':
          $ref: '#/components/responses/Err049_050'
  /providers/{providerId}:
    get:
      tags:
      - Nhà cung cấp
      operationId: getProvider
      summary: Chi tiết NCC kèm sức khỏe, mạch ngắt, hạn chứng thư, số dịch vụ
      x-datahub-id: API-19-003
      x-datahub-fr:
      - FR-19-008
      - FR-19-011
      x-datahub-permission: provider-read
      parameters:
      - $ref: '#/components/parameters/providerId'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetail'
          headers:
            ETag:
              schema:
                type: string
              description: '`W/"{version}"`'
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
          $ref: '#/components/responses/Err046'
        '404':
          $ref: '#/components/responses/Err020'
        '429':
          $ref: '#/components/responses/Err048'
        '500':
          $ref: '#/components/responses/Err099'
        '503':
          $ref: '#/components/responses/Err049'
    patch:
      tags:
      - Nhà cung cấp
      operationId: updateProvider
      summary: Sửa NCC (BR-19-026)
      x-datahub-id: API-19-004
      x-datahub-fr:
      - FR-19-009
      x-datahub-permission: provider-write
      description: 'NCC `ACTIVE`: trường kỹ thuật vào `pendingChange` và tạo đề nghị phê duyệt (BR-19-026); trường liên hệ áp ngay.'
      parameters:
      - $ref: '#/components/parameters/providerId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderUpdate'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetail'
          headers:
            ETag:
              schema:
                type: string
              description: '`W/"{version}"`'
        '400':
          $ref: '#/components/responses/Err001'
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
          $ref: '#/components/responses/Err046'
        '404':
          $ref: '#/components/responses/Err020'
        '409':
          $ref: '#/components/responses/Err021'
        '412':
          $ref: '#/components/responses/Err045'
        '429':
          $ref: '#/components/responses/Err048'
        '500':
          $ref: '#/components/responses/Err099'
        '503':
          $ref: '#/components/responses/Err049_050'
    delete:
      tags:
      - Nhà cung cấp
      operationId: deleteProvider
      summary: Xóa cứng NCC `DRAFT`
      x-datahub-id: API-19-005
      x-datahub-fr:
      - FR-19-010
      x-datahub-permission: provider-delete
      description: Chỉ NCC `DRAFT` chưa có dịch vụ, giao dịch.
      parameters:
      - $ref: '#/components/parameters/providerId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '204':
          description: Đã xóa.
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
          $ref: '#/components/responses/Err046'
        '404':
          $ref: '#/components/responses/Err020'
        '409':
          $ref: '#/components/responses/Err021_037'
        '412':
          $ref: '#/components/responses/Err045'
        '429':
          $ref: '#/components/responses/Err048'
        '500':
          $ref: '#/components/responses/Err099'
        '503':
          $ref: '#/components/responses/Err049_050'
  /providers/{providerId}/credentials:
    get:
      tags:
      - Nhà cung cấp
      operationId: listProviderCredentials
      summary: Danh sách tham chiếu bí mật (chỉ siêu dữ liệu)
      x-datahub-id: API-19-006
      x-datahub-fr:
      - FR-19-002
      x-datahub-permission: provider-read
      parameters:
      - $ref: '#/components/parameters/providerId'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialList'
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
          $ref: '#/components/responses/Err046'
        '404':
          $ref: '#/components/responses/Err020'
        '429':
          $ref: '#/components/responses/Err048'
        '500':
          $ref: '#/components/responses/Err099'
        '503':
          $ref: '#/components/responses/Err049'
  /providers/{providerId}/credentials/{environment}:
    put:
      tags:
      - Nhà cung cấp
      operationId: bindProviderCredentials
      summary: Gắn tham chiếu bí mật của một môi trường
      x-datahub-id: API-19-007
      x-datahub-fr:
      - FR-19-002
      x-datahub-permission: credential-manage
      description: Chỉ nhận tham chiếu OpenBao; giá trị bí mật nạp bằng quy trình riêng của SEC (NFR-19-022).
      parameters:
      - $ref: '#/components/parameters/providerId'
      - $ref: '#/components/parameters/environment'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialBind'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialList'
        '400':
          $ref: '#/components/responses/Err001'
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
          $ref: '#/components/responses/Err046'
        '404':
          $ref: '#/components/responses/Err020'
        '412':
          $ref: '#/components/responses/Err045'
        '422':
          $ref: '#/components/responses/Err022'
        '429':
          $ref: '#/components/responses/Err048'
        '500':
          $ref: '#/components/responses/Err099'
        '503':
          $ref: '#/components/responses/Err049_050'
  /providers/{providerId}/credentials/{environment}/rotations:
    post:
      tags:
      - Nhà cung cấp
      operationId: rotateProviderCredential
      summary: Xoay khóa, chứng thư (tạo bản `NEXT`, chuyển tiếp)
      x-datahub-id: API-19-008
      x-datahub-fr:
      - FR-19-012
      x-datahub-permission: credential-manage
      description: Khóa mới ở `NEXT`, khóa cũ hợp lệ tới `transitionUntil` (BR-19-026, `19.provider.credential-transition-days`).
      parameters:
      - $ref: '#/components/parameters/providerId'
      - $ref: '#/components/parameters/environment'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRotation'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialList'
        '400':
          $ref: '#/components/responses/Err001'
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
          $ref: '#/components/responses/Err046'
        '404':
          $ref: '#/components/responses/Err020'
        '412':
          $ref: '#/components/responses/Err045'
        '422':
          $ref: '#/components/responses/Err022'
        '429':
          $ref: '#/components/responses/Err048'
        '500':
          $ref: '#/components/responses/Err099'
        '503':
          $ref: '#/components/responses/Err049_050'
  /providers/{providerId}/connection-tests:
    post:
      tags:
      - Nhà cung cấp
      operationId: runConnectionTest
      summary: Chạy kiểm tra kết nối
      x-datahub-id: API-19-009
      x-datahub-fr:
      - FR-19-003
      x-datahub-permission: provider-test
      parameters:
      - $ref: '#/components/parameters/providerId'
      - $ref: '#/components/parameters/IdempotencyKeyOpt'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionTestRequest'
      responses:
        '202':
          description: Đã tiếp nhận, xử lý bất đồng bộ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRun'
          headers:
            Location:
              schema:
                type: string
            Idempotent-Replayed:
              schema: *id001
              description: '`true` khi trả lại phản hồi đã lưu.'
        '400':
          $ref: '#/components/responses/Err001'
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
          $ref: '#/components/responses/Err046'
        '404':
          $ref: '#/components/responses/Err020'
        '409':
          $ref: '#/components/responses/Err021'
        '422':
          $ref: '#/components/responses/Err022'
        '429':
          $ref: '#/components/responses/Err048'
        '500':
          $ref: '#/components/responses/Err099'
        '503':
          $ref: '#/components/responses/Err049_050'
  /providers/{providerId}/test-transactions:
    post:
      tags:
      - Nhà cung cấp
      operationId: createTestTransaction
      summary: Tạo giao dịch thử
      x-datahub-id: API-19-010
      x-datahub-fr:
      - FR-19-004
      x-datahub-permission: provider-test
      description: Giao dịch thử thuộc đối tác ẩn `__TEST__`, không vào số liệu (BR-19-033).
      parameters:
      - $ref: '#/components/parameters/providerId'
      - $ref: '#/components/parameters/IdempotencyKeyOpt'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestTransactionRequest'
      responses:
        '202':
          description: Đã tiếp nhận, xử lý bất đồng bộ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRun'
          headers:
            Location:
              schema:
                type: string
            Idempotent-Replayed:
              schema: *id001
              description: '`true` khi trả lại phản hồi đã lưu.'
        '400':
          $ref: '#/components/responses/Err001'
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
          $ref: '#/components/responses/Err046'
        '404':
          $ref: '#/components/responses/Err020'
        '409':
          $ref: '#/components/responses/Err021'
        '422':
          $ref: '#/components/responses/Err022'
        '429':
          $ref: '#/components/responses/Err048'
        '500':
          $ref: '#/components/responses/Err099'
        '503':
          $ref: '#/components/responses/Err049_050'
  /providers/{providerId}/check-runs:
    get:
      tags:
      - Nhà cung cấp
      operationId: listProviderCheckRuns
      summary: Kết quả kiểm tra, giao dịch thử, trạng thái checklist
      x-datahub-id: API-19-011
      x-datahub-fr:
      - FR-19-003
      - FR-19-004
      - FR-19-005
      x-datahub-permission: provider-read
      parameters:
      - $ref: '#/components/parameters/providerId'
      - name: checkType
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/CheckType'
        style: form
        explode: false
      - name: environment
        in: query
        schema:
          $ref: '#/components/schemas/Environment'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRunList'
        '400':
          $ref: '#/components/responses/Err001'
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
          $ref: '#/components/responses/Err046'
        '404':
          $ref: '#/components/responses/Err020'
        '429':
          $ref: '#/components/responses/Err048'
        '500':
          $ref: '#/components/responses/Err099'
        '503':
          $ref: '#/components/responses/Err049'
  /providers/{providerId}/lifecycle-requests:
    post:
      tags:
      - Nhà cung cấp
      operationId: requestProviderLifecycle
      summary: Đề nghị `ACTIVATE` hoặc `RETIRE` (tạo `approval_request`)
      x-datahub-id: API-19-012
      x-datahub-fr:
      - FR-19-005
      - FR-19-010
      x-datahub-permission: provider-write (ACTIVATE); provider-delete (RETIRE)
      description: '`ACTIVATE` cần `provider-write`, `RETIRE` cần `provider-delete`. Checklist BR-19-010 chụp vào `payload` của đề nghị.'
      parameters:
      - $ref: '#/components/parameters/providerId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderLifecycleRequest'
      responses:
        '201':
          description: Đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRef'
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Err001'
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
          $ref: '#/components/responses/Err046'
        '404':
          $ref: '#/components/responses/Err020'
        '409':
          $ref: '#/components/responses/Err021_036'
        '412':
          $ref: '#/components/responses/Err045'
        '422':
          $ref: '#/components/responses/Err035'
        '429':
          $ref: '#/components/responses/Err048'
        '500':
          $ref: '#/components/responses/Err099'
        '503':
          $ref: '#/components/responses/Err049_050'
  /providers/{providerId}/suspensions:
    post:
      tags:
      - Nhà cung cấp
      operationId: suspendProvider
      summary: Tạm dừng NCC
      x-datahub-id: API-19-013
      x-datahub-fr:
      - FR-19-006
      x-datahub-permission: provider-suspend
      description: Hiệu lực ngay; giao dịch mới tới dịch vụ của NCC trả ERR-19-017.
      parameters:
      - $ref: '#/components/parameters/providerId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChange'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetail'
          headers:
            ETag:
              schema:
                type: string
              description: '`W/"{version}"`'
        '400':
          $ref: '#/components/responses/Err001'
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
          $ref: '#/components/responses/Err046'
        '404':
          $ref: '#/components/responses/Err020'
        '409':
          $ref: '#/components/responses/Err021'
        '412':
          $ref: '#/components/responses/Err045'
        '429':
          $ref: '#/components/responses/Err048'
        '500':
          $ref: '#/components/responses/Err099'
        '503':
          $ref: '#/components/responses/Err049_050'
  /providers/{providerId}/resumptions:
    post:
      tags:
      - Nhà cung cấp
      operationId: resumeProvider
      summary: Mở lại NCC
      x-datahub-id: API-19-014
      x-datahub-fr:
      - FR-19-006
      x-datahub-permission: provider-suspend
      parameters:
      - $ref: '#/components/parameters/providerId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
