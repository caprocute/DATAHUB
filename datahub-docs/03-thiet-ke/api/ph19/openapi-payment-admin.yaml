  schemas:
    ActivationChecklist:
      type: object
      properties:
        ready: &id007
          type: boolean
        items:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                maxLength: 64
              label:
                type: string
                maxLength: 255
              passed: *id007
              evidenceId:
                type:
                - string
                - 'null'
                format: uuid
            additionalProperties: false
      additionalProperties: false
      required:
      - ready
      - items
      description: Checklist kích hoạt BR-19-010.
    AdapterType:
      type: string
      enum:
      - PAYGOV
      - MOCK
    AdminCancellation:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
      additionalProperties: false
      required:
      - reason
    AllowedActions:
      type: object
      properties:
        allowedActions:
          type: array
          items:
            type: string
          description: Hành động người gọi được làm ngay (D03-06-PH19 §2).
        disabledReasons:
          type: object
          additionalProperties:
            type: string
          description: Hành động có quyền nhưng trạng thái chưa cho phép → lý do tiếng Việt.
      additionalProperties: false
    Approval:
      allOf:
      - type: object
        properties:
          id: &id008
            type: string
            format: uuid
          approvalType:
            $ref: '#/components/schemas/ApprovalType'
          targetType:
            type: string
            maxLength: 32
          targetId: *id008
          targetLabel:
            type: string
            maxLength: 255
          payload:
            type: object
            additionalProperties: true
          requiredApprovals:
            type: integer
            minimum: 1
            maximum: 2
          status:
            $ref: '#/components/schemas/ApprovalStatus'
          requestedBy:
            type: string
            maxLength: 64
          requestedAt: &id009
            type: string
            format: date-time
          requestNote:
            type: string
            maxLength: 2000
          firstApproverId:
            type:
            - string
            - 'null'
            maxLength: 64
          firstDecidedAt:
            type:
            - string
            - 'null'
            format: date-time
          secondApproverId:
            type:
            - string
            - 'null'
            maxLength: 64
          secondDecidedAt:
            type:
            - string
            - 'null'
            format: date-time
          decisionNote:
            type:
            - string
            - 'null'
            maxLength: 2000
          expiresAt: *id009
          version:
            type: integer
        additionalProperties: false
        required:
        - id
        - approvalType
        - targetType
        - targetId
        - status
        - requestedBy
        - expiresAt
      - $ref: '#/components/schemas/AllowedActions'
    ApprovalDecision:
      type: object
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
          - WITHDRAW
        note:
          type: string
          maxLength: 2000
      additionalProperties: false
      required:
      - decision
      description: '`REJECT` bắt buộc `note`; `WITHDRAW` chỉ người lập.'
    ApprovalPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
        page:
          $ref: '#/components/schemas/CursorMeta'
      additionalProperties: false
      required:
      - items
      - page
    ApprovalRef:
      type: object
      properties:
        approvalId:
          type: string
          format: uuid
        approvalType:
          $ref: '#/components/schemas/ApprovalType'
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        requiredApprovals:
          type: integer
          minimum: 1
          maximum: 2
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - approvalId
      - approvalType
      - status
      description: Đề nghị phê duyệt vừa tạo (ADR-046).
    ApprovalStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - WITHDRAWN
      - EXPIRED
    ApprovalType:
      type: string
      enum:
      - PROVIDER_ACTIVATE
      - PROVIDER_RETIRE
      - PARTNER_ONBOARD
      - PARTNER_TERMINATE
      - REFUND
      - DISCREPANCY_RESOLUTION
      - RECON_REOPEN
      - ROUTING_MODE_CHANGE
      - RESULT_MAPPING_CHANGE
    AuthMethod:
      type: string
      enum:
      - MTLS
      - PRIVATE_KEY_JWT
    CallbackDetail:
      allOf:
      - $ref: '#/components/schemas/CallbackSummary'
      - type: object
        properties:
          rawHeaders:
            type: object
            additionalProperties: true
          rawBodyMasked:
            type: string
            maxLength: 65536
          rawHash:
            type: string
            maxLength: 64
          processingError:
            type:
            - string
            - 'null'
            maxLength: 2000
          processedAt:
            type:
            - string
            - 'null'
            format: date-time
          mappingVersion:
            type:
            - integer
            - 'null'
          transactionId:
            type:
            - string
            - 'null'
            format: uuid
          traceId:
            type: string
            maxLength: 32
        additionalProperties: false
      - $ref: '#/components/schemas/AllowedActions'
    CallbackPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CallbackSummary'
        page:
          $ref: '#/components/schemas/CursorMeta'
      additionalProperties: false
      required:
      - items
      - page
    CallbackReplay:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
      additionalProperties: false
      required:
      - reason
    CallbackSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        providerCode:
          type: string
          maxLength: 64
          pattern: ^[A-Z][A-Z0-9_-]{1,63}$
        callbackType:
          $ref: '#/components/schemas/CallbackType'
        receivedAt:
          type: string
          format: date-time
        sourceIp:
          type: string
          maxLength: 45
        transactionCode:
          type:
          - string
          - 'null'
          maxLength: 32
        providerReference:
          type:
          - string
          - 'null'
          maxLength: 128
        providerResultCode:
          type:
          - string
          - 'null'
          maxLength: 64
        verificationResult:
          $ref: '#/components/schemas/VerificationResult'
        processingStatus:
          $ref: '#/components/schemas/ProcessingStatus'
        quarantineReason:
          anyOf:
          - $ref: '#/components/schemas/QuarantineReason'
          - type: 'null'
        attemptCount:
          type: integer
      additionalProperties: false
      required:
      - id
      - callbackType
      - receivedAt
      - verificationResult
      - processingStatus
    CallbackType:
      type: string
      enum:
      - PAYMENT
      - REFUND
      - RECON_NOTICE
    CatalogItemList:
      type: object
      properties:
        catalogCode:
          type: string
          maxLength: 64
        items:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                maxLength: 64
              name:
                type: string
                maxLength: 500
              parentCode:
                type:
                - string
                - 'null'
                maxLength: 64
              validTo:
                type:
                - string
                - 'null'
                format: date
            additionalProperties: false
        cachedAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - catalogCode
      - items
    CheckResult:
      type: string
      enum:
      - RUNNING
      - PASSED
      - PASSED_WITHOUT_IPN
      - FAILED
    CheckRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        checkType:
          $ref: '#/components/schemas/CheckType'
        environment:
          $ref: '#/components/schemas/Environment'
        result:
          $ref: '#/components/schemas/CheckResult'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CheckStep'
        testTransactionCode:
          anyOf:
          - $ref: '#/components/schemas/TransactionCode'
          - type: 'null'
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
        startedBy:
          type: string
          maxLength: 64
        traceId:
          type: string
          maxLength: 32
      additionalProperties: false
      required:
      - id
      - checkType
      - environment
      - result
    CheckRunList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckRun'
        checklist:
          $ref: '#/components/schemas/ActivationChecklist'
      additionalProperties: false
      required:
      - items
    CheckStep:
      type: object
      properties:
        step:
          type: string
          maxLength: 64
        result:
          type: string
          enum:
          - PASSED
          - FAILED
          - SKIPPED
        durationMs:
          type: integer
        message:
          type: string
          maxLength: 500
      additionalProperties: false
      required:
      - step
      - result
    CheckType:
      type: string
      enum:
      - CONNECTION
      - TEST_TRANSACTION
    CircuitState:
      type: string
      enum:
      - CLOSED
      - OPEN
      - HALF_OPEN
    Code:
      type: string
      maxLength: 64
      pattern: ^[A-Z][A-Z0-9_-]{1,63}$
    ConfigVersion:
      type: object
      properties:
        configVersion:
          type: integer
          minimum: 1
        effectiveFrom: &id010
          type: string
          format: date-time
        settings:
          $ref: '#/components/schemas/PaymentSettings'
        moduleEnabled:
          type: boolean
        changeNote:
          type:
          - string
          - 'null'
          maxLength: 2000
        createdAt: *id010
        createdBy:
          type: string
          maxLength: 64
      additionalProperties: false
      required:
      - configVersion
      - effectiveFrom
      - settings
      - moduleEnabled
    ConfigVersionCreate:
      type: object
      properties:
        effectiveFrom:
          type: string
          format: date-time
        settings:
          $ref: '#/components/schemas/PaymentSettings'
        changeNote:
          type: string
          maxLength: 2000
          minLength: 10
      additionalProperties: false
      required:
      - effectiveFrom
      - settings
      - changeNote
      description: Chỉ gửi khóa thay đổi; phiên bản mới = hiện hành + thay đổi. `moduleEnabled` chỉ PH-20 đặt.
    ConfigView:
      type: object
      properties:
        current:
          $ref: '#/components/schemas/ConfigVersion'
        scheduled:
          type: array
          items:
            $ref: '#/components/schemas/ConfigVersion'
        history:
          type: array
          items:
            $ref: '#/components/schemas/ConfigVersion'
      additionalProperties: false
      required:
      - current
    ConnectionTestRequest:
      type: object
      properties:
        environment:
          $ref: '#/components/schemas/Environment'
      additionalProperties: false
      required:
      - environment
    Contact:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          maxLength: 254
          format: email
      additionalProperties: false
    Credential:
      type: object
      properties:
        id:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        purpose:
          $ref: '#/components/schemas/CredentialPurpose'
        secretRef:
          type: string
          maxLength: 512
          description: Đường OpenBao; không bao giờ có giá trị bí mật.
        fingerprint:
          type: string
          maxLength: 128
        algorithm:
          type: string
          maxLength: 32
        validFrom:
          type:
          - string
          - 'null'
          format: date-time
        validTo:
          type:
          - string
          - 'null'
          format: date-time
        credentialStatus:
          $ref: '#/components/schemas/CredentialStatus'
        transitionUntil:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
      required:
      - id
      - environment
      - purpose
      - secretRef
      - credentialStatus
    CredentialBind:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              purpose:
                $ref: '#/components/schemas/CredentialPurpose'
              secretRef:
                type: string
                maxLength: 512
                pattern: ^(kv|transit)/dh/[a-z0-9]+/payment/
              validTo:
                type: string
                format: date-time
            additionalProperties: false
            required:
            - purpose
            - secretRef
          minItems: 1
          maxItems: 4
      additionalProperties: false
      required:
      - items
      description: Gắn tham chiếu đã nạp sẵn ở OpenBao (FR-19-002); PH-19 đọc siêu dữ liệu chứng thư để điền `fingerprint`, `validTo`.
    CredentialList:
      type: object
      properties:
        items:
          type: array
          items:
