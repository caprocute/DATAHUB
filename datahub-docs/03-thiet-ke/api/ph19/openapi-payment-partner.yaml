          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
        '400':
          $ref: '#/components/responses/Err001'
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
