components:
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
      description: Con trỏ mờ từ `page.next`.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
      description: Mặc định 20, tối đa 200 (khung §10.1).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
        minLength: 16
        pattern: ^[A-Za-z0-9_-]{16,64}$
      description: 16…64 ký tự `[A-Za-z0-9_-]`, lưu 24 giờ (BR-19-006); thiếu ERR-19-002, khác nội dung ERR-19-003, đang xử lý ERR-19-004.
    IdempotencyKeyOpt:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        minLength: 16
        pattern: ^[A-Za-z0-9_-]{16,64}$
      description: Khuyến nghị cho thao tác tạo của giao diện (chống bấm hai lần).
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
        maxLength: 55
      description: W3C Trace Context.
    transactionCode:
      name: transactionCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TransactionCode'
    refundCode:
      name: refundCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RefundCode'
    operation:
      name: operation
      in: path
      required: true
      schema:
        type: string
        enum:
        - create
        - query
        - refund
        - query-refund
