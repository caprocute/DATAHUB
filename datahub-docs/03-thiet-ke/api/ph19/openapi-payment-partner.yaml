webhooks:
  transaction.succeeded:
    post:
      summary: Webhook `transaction.succeeded` (EVT-19-07)
      operationId: webhook_transaction_succeeded
      x-datahub-id: EVT-19-07
      description: Datahub gọi đầu nhận của đối tác. Kiểm `X-Datahub-Signature` = `t={unix},v1={hex(HMAC_SHA256(secret, id + "." + t + "." + body))}`
        (có thể hai `v1` khi xoay bí mật), lệch thời gian ≤ 5 phút, bỏ trùng theo `Webhook-Id`, sắp theo `sequence` (ADR-044, BR-19-021). Trả
        2xx trong 10 giây.
      parameters:
      - name: Webhook-Id
        in: header
        required: true
        schema: &id002
          type: string
          format: uuid
      - name: Webhook-Timestamp
        in: header
        required: true
        schema:
          type: integer
      - name: X-Datahub-Signature
        in: header
        required: true
        schema:
          type: string
          maxLength: 300
          pattern: ^t=[0-9]+(,v1=[0-9a-f]{64})+$
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/CloudEvent'
      responses:
        2XX:
          description: Đã nhận.
        default:
          description: 'Lỗi: 408, 425, 429, 5xx thử lại theo `19.webhook.retry-schedule`; 4xx khác dừng (EXHAUSTED).'
  transaction.failed:
    post:
      summary: Webhook `transaction.failed` (EVT-19-08)
      operationId: webhook_transaction_failed
      x-datahub-id: EVT-19-08
      description: Datahub gọi đầu nhận của đối tác. Kiểm `X-Datahub-Signature` = `t={unix},v1={hex(HMAC_SHA256(secret, id + "." + t + "." + body))}`
        (có thể hai `v1` khi xoay bí mật), lệch thời gian ≤ 5 phút, bỏ trùng theo `Webhook-Id`, sắp theo `sequence` (ADR-044, BR-19-021). Trả
        2xx trong 10 giây.
      parameters:
      - name: Webhook-Id
        in: header
        required: true
        schema: *id002
      - name: Webhook-Timestamp
        in: header
        required: true
        schema:
          type: integer
      - name: X-Datahub-Signature
        in: header
        required: true
        schema:
          type: string
          maxLength: 300
          pattern: ^t=[0-9]+(,v1=[0-9a-f]{64})+$
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/CloudEvent'
      responses:
        2XX:
          description: Đã nhận.
        default:
          description: 'Lỗi: 408, 425, 429, 5xx thử lại theo `19.webhook.retry-schedule`; 4xx khác dừng (EXHAUSTED).'
  transaction.cancelled:
    post:
