  schemas:
    CloudEvent:
      type: object
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
        type:
          type: string
          maxLength: 128
          pattern: ^vn\.datahub\.payment\.[a-z-]+\.[a-z-]+\.v[0-9]+$
        source:
          type: string
          maxLength: 64
          pattern: ^/t[0-9]{2}/payment$
        subject:
          type: string
          maxLength: 64
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        tenantid:
          $ref: '#/components/schemas/TenantId'
        sequence:
          type: integer
          minimum: 1
        traceparent:
          type: string
          maxLength: 55
        data:
          type: object
          additionalProperties: true
      additionalProperties: false
      required:
      - specversion
      - id
      - type
      - source
      - time
      - tenantid
      - data
      description: CloudEvents 1.0 dạng cấu trúc; webhook và Kafka cùng `id`, cùng `data` (khung §10.4, SDD §6.4).
    CursorMeta:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
          maxLength: 2048
        hasMore:
          type: boolean
        total:
          type: integer
          minimum: 0
          description: Đếm chính xác tới 10.000.
        totalApprox:
          type: integer
          minimum: 0
          description: Ước lượng khi vượt 10.000 (FR-19-049).
      additionalProperties: false
      required:
      - hasMore
    LegacyCompatRequest:
      type: object
      additionalProperties: true
      description: Thân theo hợp đồng hệ cũ của thao tác (`create`, `query`, `refund`); ánh xạ sang API-19-101…106 (ADR-049). Chỉ trong thời gian
        chuyển đổi.
    LegacyCompatResponse:
      type: object
      additionalProperties: true
      description: Phản hồi theo hợp đồng hệ cũ.
    Money:
      type: integer
      minimum: 1
      maximum: 999999999999
      description: Số tiền VND, số nguyên đồng (T-MONEY, BR-19-001).
    MoneyOrZero:
      type: integer
      minimum: 0
      maximum: 999999999999
    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CloudEvent'
        next:
          type:
          - string
          - 'null'
          maxLength: 64
          description: '`id` cuối đã trả; dùng làm `after`.'
        hasMore:
          type: boolean
      additionalProperties: false
      required:
      - items
      - hasMore
    PartnerCancel:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
      additionalProperties: false
    PartnerOrderId:
      type: string
      maxLength: 64
      minLength: 1
      pattern: ^[A-Za-z0-9._:/-]{1,64}$
      description: Mã đơn hàng, mã hồ sơ của đối tác (T-ORDER-ID).
      examples:
      - H68.12-261121-0042
    PartnerReconReport:
      type: object
      properties:
        date:
          type: string
          format: date
        provisional:
          type: boolean
        sessionStatus:
          anyOf:
          - $ref: '#/components/schemas/SessionStatus'
          - type: 'null'
        items:
          type: array
          items:
            type: object
            properties:
              transactionCode:
                $ref: '#/components/schemas/TransactionCode'
              partnerOrderId:
                $ref: '#/components/schemas/PartnerOrderId'
              amount:
                $ref: '#/components/schemas/Money'
              status:
                $ref: '#/components/schemas/TransactionStatus'
              reconStatus:
                $ref: '#/components/schemas/ReconStatus'
              paidAt:
                type:
                - string
                - 'null'
                format: date-time
              refundedAmount:
                $ref: '#/components/schemas/MoneyOrZero'
            additionalProperties: false
        totals:
          type: object
          properties:
            count:
              type: integer
            amount:
              $ref: '#/components/schemas/MoneyOrZero'
            refundedAmount:
              $ref: '#/components/schemas/MoneyOrZero'
          additionalProperties: false
        page:
          $ref: '#/components/schemas/CursorMeta'
      additionalProperties: false
      required:
      - date
      - provisional
      - items
    PartnerRefund:
      type: object
      properties:
        refundCode:
          $ref: '#/components/schemas/RefundCode'
        partnerRefundId:
          type: string
          maxLength: 64
        transactionCode:
          $ref: '#/components/schemas/TransactionCode'
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/RefundStatus'
        mode:
          $ref: '#/components/schemas/RefundMode'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        reasonCode:
          type: string
          maxLength: 64
      additionalProperties: false
      required:
      - refundCode
      - partnerRefundId
      - transactionCode
      - amount
      - status
      - createdAt
    PartnerRefundCreate:
      type: object
      properties:
        transactionCode:
          $ref: '#/components/schemas/TransactionCode'
        partnerRefundId:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9._:/-]{1,64}$
        amount:
          $ref: '#/components/schemas/Money'
        reasonCode:
          type: string
          maxLength: 64
          description: Mã mục danh mục PH-07.
        reasonText:
          type: string
          maxLength: 2000
      additionalProperties: false
      required:
      - transactionCode
      - partnerRefundId
      - amount
      - reasonCode
    PartnerServiceList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              serviceCode:
                type: string
                maxLength: 64
                pattern: ^[A-Z][A-Z0-9_-]{1,63}$
              serviceName:
                type: string
                maxLength: 255
              status:
                $ref: '#/components/schemas/ServiceStatus'
              minAmount: &id003
                $ref: '#/components/schemas/Money'
              maxAmount: *id003
              maxAmountPerTxn: &id004
                anyOf:
                - $ref: '#/components/schemas/Money'
                - type: 'null'
              dailyTxnLimit:
                type:
                - integer
                - 'null'
              dailyAmountLimit: *id004
              usedToday:
                type: object
                properties:
                  count:
                    type: integer
                  amount:
                    $ref: '#/components/schemas/MoneyOrZero'
                additionalProperties: false
            additionalProperties: false
            required:
            - serviceCode
            - status
      additionalProperties: false
      required:
      - items
    Payer:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        idNumber:
          type: string
          maxLength: 20
        phone:
          type: string
          maxLength: 20
          pattern: ^\+?[0-9]{9,15}$
        email:
          type: string
          maxLength: 254
          format: email
      additionalProperties: false
      description: Dữ liệu cá nhân người nộp; mã hóa ngay khi nhận (ADR-048), không bao giờ trả lại nguyên văn qua API đối tác.
    Payment:
      type: object
      properties:
        transactionCode:
          $ref: '#/components/schemas/TransactionCode'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        serviceCode:
          type: string
          maxLength: 64
          pattern: ^[A-Z][A-Z0-9_-]{1,63}$
        partnerOrderId:
          $ref: '#/components/schemas/PartnerOrderId'
        amount:
          $ref: '#/components/schemas/Money'
        refundedAmount:
          $ref: '#/components/schemas/MoneyOrZero'
        currency:
          type: string
          const: VND
        paymentUrl:
          type:
          - string
          - 'null'
          maxLength: 2048
          format: uri
        expiresAt: &id005
          type: string
          format: date-time
        createdAt: *id005
        paidAt:
          type:
          - string
          - 'null'
          format: date-time
        providerReference:
          type:
          - string
          - 'null'
          maxLength: 128
        channelCode:
          type:
          - string
          - 'null'
          maxLength: 64
        bankCode:
          type:
          - string
          - 'null'
          maxLength: 64
        reasonCode:
          type:
          - string
          - 'null'
          maxLength: 64
        reasonMessage:
          type:
          - string
          - 'null'
          maxLength: 500
        latePaid:
          type: boolean
        sequence:
          type: integer
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 255
      additionalProperties: false
      required:
      - transactionCode
      - status
      - serviceCode
      - partnerOrderId
      - amount
      - expiresAt
      - createdAt
      - sequence
    PaymentCreate:
      type: object
      properties:
        serviceCode:
          type: string
          maxLength: 64
          pattern: ^[A-Z][A-Z0-9_-]{1,63}$
        partnerOrderId:
          $ref: '#/components/schemas/PartnerOrderId'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          const: VND
          default: VND
        description:
          type: string
          maxLength: 255
          minLength: 1
        returnUrl:
          type: string
          maxLength: 2048
          pattern: ^https://
        payer:
          $ref: '#/components/schemas/Payer'
        procedureCode:
          type: string
          maxLength: 64
          description: Mã mục danh mục PH-07.
        expiryMinutes:
          type: integer
          minimum: 5
          maximum: 1440
        clientIp:
          type: string
          maxLength: 45
        metadata:
          type: object
          maxProperties: 10
          additionalProperties:
            type: string
            maxLength: 255
          description: Trả lại nguyên trong truy vấn, webhook; không chứa dữ liệu cá nhân.
      additionalProperties: false
      required:
      - serviceCode
      - partnerOrderId
      - amount
      - description
      - returnUrl
    PaymentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
          description: Mọi lượt thanh toán của mã đơn hàng, mới nhất trước.
      additionalProperties: false
      required:
      - items
    ProblemDetails:
      type: object
      description: RFC 9457, mở rộng theo khung §12 và D03-04-PH19 §6.
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          description: '`/problems/ERR-19-nnn`'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: ^ERR-19-[0-9]{3}$
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              rule:
                type: string
              message:
                type: string
            additionalProperties: false
          description: Lỗi trường (ERR-19-001).
        missing:
          type: array
          items:
            type: string
          description: Mục checklist chưa đạt (ERR-19-035).
        existingTransactionCode:
          $ref: '#/components/schemas/TransactionCode'
        currentEtag:
          type: string
        retryAfterSeconds:
          type: integer
      additionalProperties: true
    ReconStatus:
      type: string
      enum:
      - UNRECONCILED
      - MATCHED
      - MISMATCHED
      description: Chưa đối soát, Khớp, Lệch (GĐ-03).
    RefundCode:
      type: string
      maxLength: 15
      pattern: ^R[0-9A-HJKMNP-TV-Z]{14}$
      examples:
      - RK7M2Q9XW4P3H8T
    RefundMode:
      type: string
      enum:
      - API
      - MANUAL
    RefundStatus:
      type: string
      enum:
      - PENDING_APPROVAL
      - PENDING_SECOND_APPROVAL
      - APPROVED
      - PROCESSING
      - AWAITING_MANUAL
      - SUCCEEDED
      - FAILED
      - REJECTED
      - CANCELLED
    ServiceStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
      - SUSPENDED
      - RETIRED
    SessionStatus:
      type: string
      enum:
      - SCHEDULED
      - COLLECTING
      - WAITING_DATA
      - MATCHING
      - IN_REVIEW
      - READY_TO_CLOSE
      - CLOSED
      - REOPEN_PENDING
      - FAILED
    TenantId:
      type: string
      maxLength: 16
      pattern: ^T[0-9]{2}$
      description: Mã tenant T-TENANT (D00-01).
    TransactionCode:
      type: string
      maxLength: 19
      pattern: ^T[0-9]{2}[0-9]{6}[0-9A-HJKMNP-TV-Z]{10}$
      description: T{nn} + yyMMdd + 10 ký tự Base32 Crockford, duy nhất toàn cục (BR-19-002).
      examples:
      - T68261126K7M2Q9XW4P
    TransactionStatus:
      type: string
      enum:
      - CREATED
      - PENDING
      - SUCCEEDED
      - FAILED
      - EXPIRED
      - CANCELLED
      - PARTIALLY_REFUNDED
      - REFUNDED
  securitySchemes:
    oauth2Client:
      type: oauth2
      description: Client credentials, xác thực client bằng mTLS (RFC 8705) hoặc `private_key_jwt`; token ≤ 5 phút, ràng buộc chứng thư.
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes: {}
