# D03-04-PH19 · Datahub · PH-19 Thanh toán · API đối tác. SINH TỰ ĐỘNG bởi tools/gen_openapi.py — không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-19 Thanh toán · API đối tác
  version: 1.0.0-draft
  summary: API cho HTTT đối tác thu phí, lệ phí qua PH-19 và nhận kết quả.
  description: 'API cho HTTT đối tác thu phí, lệ phí qua PH-19 và nhận kết quả. Token máy-máy (client credentials với mTLS hoặc `private_key_jwt`,
    NFR-19-019) vai trò `ROLE-PARTNER_SYSTEM`; mọi truy vấn chỉ thấy dữ liệu của chính đối tác. Mọi `POST` bắt buộc `Idempotency-Key`. Kết quả
    thanh toán đến qua **webhook** ký HMAC (mục `webhooks`), dự phòng kéo bằng API-19-109.


    Quy ước chung, bảng mã lỗi: D03-04-PH19 §1, §6. Mọi tên miền, dữ liệu là giả lập. Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-19
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH19
  x-datahub-phase: PH-19
servers:
- url: https://{host}/api/payment-partner/v1
  description: Qua APISIX — giả lập
  variables:
    host:
      default: api.t68.datahub.example.vn
- url: http://localhost:8089/api/payment-partner/v1
  description: Phát triển cục bộ
security:
- oauth2Client: []
tags:
- name: Thanh toán
- name: Hoàn tiền đối tác
- name: Đối soát đối tác
- name: Tương thích hệ cũ
paths:
  /payments:
    post:
      tags:
      - Thanh toán
      operationId: createPayment
      summary: Tạo giao dịch, trả `transactionCode`, `paymentUrl`, `expiresAt`
      x-datahub-id: API-19-101
      x-datahub-fr:
      - FR-19-022
      - FR-19-023
      - FR-19-024
      - FR-19-033
      - FR-19-034
      x-datahub-permission: partner-pay-create
      description: 'Kiểm tra theo thứ tự BR-19-004, dừng ở lỗi đầu tiên. Chế độ `SHADOW` không gọi NCC, trả `CREATED`, `paymentUrl = null`. Header
        `Location`; `Idempotent-Replayed: true` khi trả lại kết quả cũ.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
            example:
              serviceCode: LPTB-OTO
              partnerOrderId: H68.12-261121-0042
              amount: 2350000000
              description: Lệ phí trước bạ hồ sơ H68.12-261121-0042
              returnUrl: https://dichvucong.t68.gov.vn/thanh-toan/ket-qua
              payer:
                name: Nguyễn Văn An
                phone: '+84912345678'
              expiryMinutes: 15
              metadata:
                hoSoId: '42'
      responses:
        '201':
          description: Đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          headers:
            Location:
              schema:
                type: string
            Idempotent-Replayed:
              schema: &id001
                type: boolean
              description: '`true` khi trả lại phản hồi đã lưu.'
        '400':
          $ref: '#/components/responses/Err001_002'
        '401':
          description: Thiếu hoặc sai token (PH-12, PH-03 trả; không thuộc dải ERR-19).
        '403':
          $ref: '#/components/responses/Err005_009_046'
        '404':
          $ref: '#/components/responses/Err007'
        '409':
          $ref: '#/components/responses/Err006_015_004'
        '422':
          $ref: '#/components/responses/Err008_010_011_012_013_014_016_039_003'
        '429':
          $ref: '#/components/responses/Err048'
        '500':
          $ref: '#/components/responses/Err099'
        '502':
          $ref: '#/components/responses/Err018'
        '503':
          $ref: '#/components/responses/Err017_049_050'
        '504':
          $ref: '#/components/responses/Err019'
    get:
      tags:
      - Thanh toán
      operationId: listPaymentsByOrder
      summary: Truy vấn theo mã đơn hàng (mọi lượt giao dịch của mã đó)
      x-datahub-id: API-19-103
      x-datahub-fr:
      - FR-19-035
      x-datahub-permission: partner-pay-read
      parameters:
