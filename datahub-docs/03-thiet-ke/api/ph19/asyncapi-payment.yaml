# D03-04-PH19 · AsyncAPI PH-19. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py — không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: 3.0.0
info:
  title: Datahub PH-19 Thanh toán — sự kiện
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-19-01…18 (khung D02-03-PH19-00 §10.4, D03-04-PH19 §4).


    Sự kiện ghi vào `ph19_payment.outbox_event` cùng giao dịch CSDL với thay đổi trạng thái, Debezium (hoặc `OutboxRelay`) đưa lên Kafka; CloudEvents
    1.0 chế độ nhị phân (tiêu đề `ce_*`, `dhtenant`), thân là `data`. Mỗi sự kiện một topic `{tenant}.payment.{thực-thể}.{sự-kiện}.v1`, `{tenant}`
    viết thường. Mọi payload có `eventId`, `occurredAt`, `tenantId`, `traceId`, `sequence` (BR-19-021), không chứa dữ liệu cá nhân người nộp.
    Webhook tới đối tác dùng cùng `eventId`, cùng `data` nhưng ở dạng cấu trúc (OpenAPI đối tác, mục `webhooks`) và không đi qua Kafka (NFR-19-013).
    Tương thích: chỉ thêm trường tùy chọn trong `v1`; thay đổi phá vỡ sang `v2`, phát song song ≥ 6 tháng (Apicurio BACKWARD). Dữ liệu ví dụ là
    giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  license:
    name: Tài liệu nội bộ dự án Datahub
defaultContentType: application/json
servers:
