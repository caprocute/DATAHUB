  messages:
    providerStatusChanged:
      name: providerStatusChanged
      title: EVT-19-01
      summary: PH-13, PH-16. FR-19-005, 006, 010.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CloudEventHeaders'
      payload:
        $ref: '#/components/schemas/ProviderStatusChanged'
      x-datahub-cloudevents-type: vn.datahub.payment.provider.status-changed.v1
      x-datahub-webhook: false
      bindings:
        kafka:
          key:
            type: string
            description: '`providerId` (UUID)'
    providerHealthChanged:
      name: providerHealthChanged
      title: EVT-19-02
      summary: PH-13, PH-18. FR-19-011.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CloudEventHeaders'
      payload:
        $ref: '#/components/schemas/ProviderHealthChanged'
      x-datahub-cloudevents-type: vn.datahub.payment.provider.health-changed.v1
      x-datahub-webhook: false
      bindings:
