components:
  securitySchemes:
    oauth2User:
      type: oauth2
      description: Keycloak realm dh-{tenant}; vai trò ánh xạ PERM-13-* (D02-08). Thao tác nhạy cảm cần xác thực lại phiên (step-up, ERR-13-028).
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes: {}
    oauth2Service:
      type: oauth2
      description: Token dịch vụ cấp khi triển khai, không cấp cho người hay cho HTTT thành viên.
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            audit:write: DU nguồn ghi bản ghi kiểm toán dự phòng
            audit:history-read: BFF của DU lấy lịch sử đối tượng
            obs:metrics-read: PH-16 truy vấn số liệu tổng hợp
            obs:diagnostics-read: PH-18 lấy ngữ cảnh chẩn đoán
            obs:health-read: Phân hệ khác đọc sức khỏe thành phần
            obs:tenant-provision: PH-20 khởi tạo và đóng chuỗi kiểm toán theo tenant
    mtlsAlertmanager:
      type: mutualTLS
      description: Alertmanager gọi webhook bằng chứng thư client do cert-manager cấp; PH-13 kiểm SPIFFE ID (SEC-15).
  parameters:
    DeploymentcodePath:
      name: deploymentCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 63
        pattern: ^[a-z][a-z0-9-]{2,62}$
    FlowcodePath:
      name: flowCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 63
        pattern: ^[a-z][a-z0-9-]{2,62}$
    RouteidPath:
      name: routeId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
    SystemcodePath:
      name: systemCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    NodeidPath:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    SetcodePath:
      name: setCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 63
        pattern: ^[a-z][a-z0-9-]{2,62}$
    LogidPath:
      name: logId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
    TraceidPath:
      name: traceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TraceId'
    RecordidPath:
      name: recordId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    QueryidPath:
      name: queryId
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
    AlertidPath:
      name: alertId
      in: path
      required: true
      schema: *id001
    RulecodePath:
      name: ruleCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 63
        pattern: ^[a-z][a-z0-9-]{2,62}$
    RunbookcodePath:
      name: runbookCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 63
        pattern: ^[a-z][a-z0-9-]{2,62}$
    SchedulecodePath:
      name: scheduleCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 63
        pattern: ^[a-z][a-z0-9-]{2,62}$
    ChannelcodePath:
