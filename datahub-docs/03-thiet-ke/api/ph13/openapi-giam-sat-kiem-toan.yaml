      in: query
      schema: *id002
      description: Cuối khoảng thời gian; vượt giới hạn mỗi lần tra trả ERR-13-005.
    Q_step:
      name: step
      in: query
      schema:
        type: string
        maxLength: 8
        pattern: ^[0-9]+[smhd]$
      description: Bước thời gian, ví dụ `1m`, `1h`.
    Q_page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Trang, từ 1.
    Q_size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Số dòng mỗi trang, tối đa 200 (ERR-13-038).
    Q_q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 255
      description: Tìm theo tên hoặc mã, không dấu.
    Q_sort:
      name: sort
      in: query
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-zA-Z]+:(asc|desc)$
      description: '`trường:asc|desc`.'
    Q_cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
      description: Con trỏ mờ từ `page.next` của lần trước.
    Q_layer:
      name: layer
      in: query
      schema:
        type: string
        maxLength: 32
      description: Lớp thành phần.
    Q_status:
      name: status
      in: query
      schema:
        type: string
        maxLength: 64
      description: Lọc trạng thái, nhiều giá trị cách nhau dấu phẩy.
    Q_scope:
      name: scope
      in: query
      schema:
        type: string
        enum:
        - PLATFORM
        - TENANT
      description: Luật chuẩn nền tảng hoặc luật của tenant.
    Q_severity:
      name: severity
      in: query
      schema:
        $ref: '#/components/schemas/Severity'
      description: Mức độ.
    Q_ruleCode:
      name: ruleCode
      in: query
      schema:
        type: string
        maxLength: 63
      description: Mã luật.
    Q_groupKey:
      name: groupKey
      in: query
      schema:
        type: string
        maxLength: 128
      description: Nhãn gom nhóm.
    Q_api:
      name: api
      in: query
      schema:
        type: string
        maxLength: 64
      description: Mã API.
    Q_system:
      name: system
      in: query
      schema:
        type: string
        maxLength: 64
      description: Mã HTTT.
    Q_service:
      name: service
      in: query
      schema:
        type: string
        maxLength: 64
      description: Tên dịch vụ.
    Q_du:
      name: du
      in: query
      schema:
        type: string
        maxLength: 32
      description: Mã DU.
    Q_flow:
      name: flow
      in: query
      schema:
        type: string
        maxLength: 63
      description: Mã luồng.
    Q_level:
      name: level
      in: query
      schema:
        type: string
        enum:
        - DEBUG
        - INFO
        - WARN
        - ERROR
      description: Mức log.
    Q_minDurationMs:
      name: minDurationMs
      in: query
      schema:
        type: integer
        minimum: 0
      description: Thời gian tối thiểu (ms).
    Q_kind:
      name: kind
      in: query
      schema:
        type: string
        maxLength: 16
      description: Loại.
    Q_enabled:
      name: enabled
      in: query
      schema: &id003
        type: boolean
      description: Đang bật.
    Q_actorId:
      name: actorId
      in: query
      schema:
        type: string
        maxLength: 128
      description: Mã người hoặc client thao tác.
    Q_before:
      name: before
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 200
        default: 20
      description: Số dòng trước.
    Q_after:
      name: after
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 200
        default: 20
      description: Số dòng sau.
    Q_query:
      name: query
      in: query
      schema:
        type: string
        maxLength: 4096
      description: Biểu thức lọc log (LogQL rút gọn).
    TargetTenant:
      name: targetTenant
      in: query
      schema:
        $ref: '#/components/schemas/TenantCode'
      description: Tenant đích, chỉ dành cho người dùng nền tảng có phiên liên tenant còn hiệu lực (FR-00-012); thiếu phiên trả ERR-13-036.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: ETag hiện tại; lệch trả ERR-13-007 (412).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 16
      description: Lưu 24 giờ; cùng khóa khác nội dung trả ERR-13-037.
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
        maxLength: 55
      description: W3C Trace Context.
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - vi
        - en
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ theo lược đồ hoặc tham số ngoài miền; mã cụ thể trong `code` (ERR-13-003, 004, 006, 008, 038).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-13-003
            title: Dữ liệu không hợp lệ theo lược đồ hoặc tham số ngoài miền
            status: 400
            code: ERR-13-003
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unauthorized:
      description: Thiếu token hoặc phiên hết hạn (ERR-13-010).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-13-010
            title: Thiếu token hoặc phiên hết hạn
            status: 401
            code: ERR-13-010
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Forbidden:
      description: Không đủ quyền hoặc cần xác thực lại, hoặc truy cập tenant khác (ERR-13-009, 019, 028, 036, 044).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-13-009
            title: Không đủ quyền hoặc cần xác thực lại, hoặc truy cập tenant khác
            status: 403
            code: ERR-13-009
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    NotFound:
      description: Không tìm thấy hoặc thuộc tenant khác, không phân biệt (ERR-13-001, 030).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-13-001
            title: Không tìm thấy hoặc thuộc tenant khác, không phân biệt
            status: 404
            code: ERR-13-001
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Conflict:
      description: Xung đột mã hoặc trạng thái (ERR-13-002, 020, 025, 032, 037, 042, 043).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-13-002
            title: Xung đột mã hoặc trạng thái
            status: 409
            code: ERR-13-002
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Gone:
      description: Tệp bằng chứng đã hết hạn tải (ERR-13-027).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-13-027
            title: Tệp bằng chứng đã hết hạn tải
            status: 410
            code: ERR-13-027
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    PreconditionFailed:
      description: ETag không khớp; kèm `currentEtag` (ERR-13-007).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-13-007
            title: ETag không khớp
            status: 412
            code: ERR-13-007
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unprocessable:
      description: Lỗi nghiệp vụ dạng dữ liệu; mã cụ thể trong `code` (ERR-13-005, 012, 013, 017, 018, 021…024, 029, 031, 033…035, 039…041).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-13-005
            title: Lỗi nghiệp vụ dạng dữ liệu
            status: 422
            code: ERR-13-005
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Locked:
      description: Tenant đang tạm ngừng, chỉ đọc (ERR-13-016).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-13-016
            title: Tenant đang tạm ngừng, chỉ đọc
            status: 423
            code: ERR-13-016
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    TooManyRequests:
      description: Quá nhiều truy vấn đồng thời; kèm `retryAfterSeconds` (ERR-13-011).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-13-011
            title: Quá nhiều truy vấn đồng thời
            status: 429
            code: ERR-13-011
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    ServiceUnavailable:
      description: Phụ thuộc không khả dụng hoặc không ký số được (ERR-13-014, 026).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-13-014
            title: Phụ thuộc không khả dụng hoặc không ký số được
            status: 503
            code: ERR-13-014
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    GatewayTimeout:
      description: Truy vấn quá thời gian chờ (ERR-13-015).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-13-015
            title: Truy vấn quá thời gian chờ
            status: 504
            code: ERR-13-015
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
  schemas:
    TenantCode:
      type: string
      maxLength: 32
      pattern: ^(T[0-9]{2}|COMMON|PLATFORM)$
      description: Mã tenant, ví dụ `T68`; `PLATFORM` là tenant nền tảng.
    TraceId:
      type: string
      maxLength: 32
      pattern: ^[0-9a-f]{32}$
      description: 32 ký tự thập lục phân (W3C Trace Context).
    Severity:
      type: string
      enum:
      - CRITICAL
      - WARNING
      - INFO
      description: Nghiêm trọng, Cảnh báo, Thông tin (BR-13-009).
    AlertStatus:
      type: string
      enum:
      - FIRING
      - ACKNOWLEDGED
      - SILENCED
      - RESOLVED
    SecurityAlertStatus:
      type: string
      enum:
      - NEW
      - ACKNOWLEDGED
      - CLOSED
    RuleStatus:
      type: string
      enum:
      - ACTIVE
      - DISABLED
      - RETIRED
    ExportStatus:
      type: string
      enum:
      - REQUESTED
      - RUNNING
      - READY
      - FAILED
      - EXPIRED
      - CANCELLED
    VerificationStatus:
      type: string
      enum:
      - RUNNING
      - PASSED
      - FAILED
    Health:
      type: string
      enum:
      - UP
      - DEGRADED
      - DOWN
      - UNKNOWN
    Reason:
      type: string
      maxLength: 500
      minLength: 10
      description: Lý do 10…500 ký tự (ERR-13-008, ERR-13-012 khi thiếu).
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
        hasMore: *id003
      required:
      - page
      - size
      - total
    CursorMeta:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
          maxLength: 2048
        hasMore: *id003
      required:
      - hasMore
    AllowedActions:
      type: object
      properties:
        allowedActions:
          type: array
          items:
            type: string
          description: Hành động người gọi làm được ngay bây giờ.
        disabledReasons:
          type: object
          additionalProperties:
            type: string
          description: Hành động có quyền nhưng trạng thái chưa cho phép, kèm lý do tiếng Việt.
    ProblemDetails:
      type: object
      description: RFC 9457, mở rộng theo D03-04-PH13 §1.
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: ^ERR-13-[0-9]{3}$
        traceId:
          $ref: '#/components/schemas/TraceId'
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              rule:
                type: string
              message:
                type: string
        currentEtag:
          type: string
        retryAfterSeconds:
          type: integer
        maxDays:
          type: integer
        recordCount:
          type: integer
      additionalProperties: true
    StateChangeRequest:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
      additionalProperties: false
      required:
      - reason
    Point:
      type: array
      items:
        oneOf:
        - *id002
        - &id004
          type: number
      minItems: 2
      maxItems: 2
      description: '`[thời điểm, giá trị]`.'
    Series:
      type: object
      properties:
        labels: &id006
          type: object
          additionalProperties:
            type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/Point'
      required:
      - points
    Panel:
      type: object
      properties:
        panelId:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 255
        kind:
          type: string
          enum:
          - STAT
          - TIMESERIES
          - TABLE
          - GAUGE
          - HEATMAP
        unit:
          type: string
          maxLength: 16
        value:
          type:
          - number
          - 'null'
        status:
          type: string
          enum:
          - OK
          - WARN
          - CRIT
          - NO_DATA
        series:
          type: array
          items:
            $ref: '#/components/schemas/Series'
        rows:
          type: array
          items: &id005
            type: object
            additionalProperties: true
        sloTarget: *id004
        note:
          type: string
          maxLength: 500
      required:
      - panelId
      - title
      - kind
    PanelSet:
      type: object
      properties:
        range:
          type: object
          properties:
            from: *id002
            to: *id002
            step:
              type: string
              maxLength: 8
        panels:
          type: array
          items:
            $ref: '#/components/schemas/Panel'
        generatedAt: *id002
        cacheTtlSeconds:
          type: integer
      required:
      - panels
    Overview:
      type: object
      properties:
        tiles:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                maxLength: 32
              title:
                type: string
                maxLength: 128
              value:
                type:
                - number
                - 'null'
              unit:
                type: string
                maxLength: 16
              trend:
                type: string
                enum:
                - UP
                - DOWN
                - FLAT
              status:
                type: string
                enum:
                - OK
                - WARN
                - CRIT
                - NO_DATA
            required:
            - key
            - title
        recentAlerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertSummary'
          maxItems: 5
        panels:
          type: array
          items:
            $ref: '#/components/schemas/Panel'
        generatedAt: *id002
      required:
      - tiles
      - panels
    Component:
      type: object
      properties:
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 128
        layer:
          type: string
          enum:
          - DU
          - DATA
          - GATEWAY
          - MESSAGING
          - STORAGE
          - OBSERVABILITY
          - IDENTITY
        status:
          $ref: '#/components/schemas/Health'
        since: *id002
        version:
          type: string
          maxLength: 32
        lastCheckAt: *id002
        detail:
          type: string
          maxLength: 1000
      required:
      - code
      - name
      - layer
      - status
    ComponentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Component'
        summary:
          type: object
          additionalProperties:
            type: integer
      required:
      - items
    Deployment:
      type: object
      properties:
        deploymentCode:
          type: string
          maxLength: 63
        du:
          type: string
          maxLength: 32
        flowCount:
          type: integer
        replicas:
          type: object
          properties:
            desired:
              type: integer
            ready:
              type: integer
        cpuPercent: *id004
        memoryPercent: *id004
        restarts24h:
          type: integer
        status:
          $ref: '#/components/schemas/Health'
        version:
          type: string
          maxLength: 32
        updatedAt: *id002
      required:
      - deploymentCode
      - status
    DeploymentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Deployment'
        page:
          $ref: '#/components/schemas/PageMeta'
      required:
      - items
      - page
    FlowRow:
      type: object
      properties:
        flowCode:
          type: string
          maxLength: 63
        name:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/Health'
        deploymentCode:
          type: string
          maxLength: 63
        requestsPerSecond: *id004
        errorRate: *id004
        p95Ms:
          type: integer
        lag:
          type: integer
      required:
      - flowCode
      - status
    FlowPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FlowRow'
        page:
          $ref: '#/components/schemas/PageMeta'
      required:
      - items
      - page
    StatTable:
      type: object
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                maxLength: 32
              title:
                type: string
                maxLength: 128
              unit:
                type: string
                maxLength: 16
            required:
            - key
            - title
        rows:
          type: array
          items: *id005
        page:
          $ref: '#/components/schemas/PageMeta'
        truncated: *id003
      required:
      - columns
      - rows
    Gateway:
      type: object
      properties:
        nodeId:
          type: string
          maxLength: 64
        zone:
          type: string
          maxLength: 8
        status:
          $ref: '#/components/schemas/Health'
        version:
          type: string
          maxLength: 32
        uptimeSeconds:
          type: integer
        requestsPerSecond: *id004
        activeConnections:
          type: integer
        cpuPercent: *id004
        memoryPercent: *id004
        configVersion:
          type: integer
        lastSyncAt: *id002
      required:
      - nodeId
      - status
    GatewayPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Gateway'
        page:
          $ref: '#/components/schemas/PageMeta'
      required:
      - items
      - page
    DashboardSet:
      type: object
      properties:
        setCode:
          type: string
          maxLength: 63
        version:
          type: string
          maxLength: 16
        grafanaOrgId:
          type: integer
        status:
          type: string
          enum:
          - SYNCED
          - OUT_OF_SYNC
          - PENDING
          - FAILED
        dashboardCount:
          type: integer
        syncedAt: &id007
          type:
          - string
          - 'null'
          format: date-time
        etag:
          type: string
      required:
      - setCode
      - version
      - status
    DashboardSetList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DashboardSet'
      required:
      - items
    DashboardSyncRequest:
      type: object
      properties:
        force: *id003
        dryRun: *id003
      additionalProperties: false
    DashboardSetSync:
      type: object
      properties:
        setCode:
          type: string
          maxLength: 63
        syncId: *id001
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
        startedAt: *id002
      required:
      - setCode
      - syncId
      - status
    LogLine:
      type: object
      properties:
        id:
          type: string
          maxLength: 128
        ts: *id002
        level:
          type: string
          enum:
          - DEBUG
          - INFO
          - WARN
          - ERROR
        du:
          type: string
          maxLength: 32
        service:
          type: string
          maxLength: 64
        namespace:
          type: string
          maxLength: 63
        message:
          type: string
        fields: *id005
        traceId:
          $ref: '#/components/schemas/TraceId'
        spanId:
          type: string
          maxLength: 16
      required:
      - id
      - ts
      - level
      - message
    LogSearchRequest:
      type: object
      properties:
        query:
