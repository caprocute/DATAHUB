# D03-04-PH13 · OpenAPI PH-13 (dh-platform, module observability và audit). SINH TỰ ĐỘNG bởi tools/gen_openapi.py — không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-13 Giám sát và kiểm toán API
  version: 1.0.0-draft
  summary: Bảng điều khiển, log, trace, cảnh báo, phát hiện bất thường an ninh, SIEM; tra cứu, xác minh toàn vẹn, xuất bằng chứng kiểm toán; vòng
    đời tenant.
  description: 'API của hai module `observability` và `audit` trong `dh-platform` (control plane PH-13), chia ba nhóm đường gốc: `/api/observability/v1`
    (quan sát), `/api/audit/v1` (kiểm toán), `/api/platform/v1` (vòng đời tenant do PH-20 gọi). Người dùng gọi qua BFF console (Authorization
    Code + PKCE); phân hệ khác và DU gọi bằng token dịch vụ (client credentials) với scope riêng; Alertmanager gọi webhook bằng mTLS.


    Quy ước (D03-04-PH13 §1): tenant lấy từ token (`targetTenant` chỉ cho phiên liên tenant có lý do); tạo mới nhận `Idempotency-Key`; sửa và
    đổi trạng thái bắt buộc `If-Match`; hậu tố `:{hành-động}`; phân trang `page`/`size` (≤ 200) hoặc con trỏ `cursor`; lỗi RFC 9457 mã `ERR-13-nnn`.
    Không API nào ghi, sửa, xóa bản ghi kiểm toán qua đường người dùng; chỉ có đường ghi dự phòng của DU (API-13-089). Không API nào trả bí mật
    (kênh thông báo, SIEM chỉ ghi một chiều). Dữ liệu ví dụ là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-13
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH13
  x-datahub-phase: PH-13
servers:
- url: https://console.{tenantHost}.datahub.example.vn
  description: Qua BFF console của tenant — giả lập
  variables:
    tenantHost:
      default: lamdong
      description: Ví dụ `lamdong` cho T68 (giả lập).
- url: http://dh-platform.dh-control.svc:8080
  description: Trong cụm, cho PH-16, PH-18, PH-20, DU nguồn và Alertmanager
- url: http://localhost:8082
  description: Phát triển cục bộ
security:
- oauth2User: []
tags:
- name: Bảng điều khiển
- name: Log, trace, nhật ký truy cập API
- name: Cảnh báo
- name: Luật cảnh báo và runbook
- name: Lịch trực và kênh thông báo
- name: An ninh, SIEM và báo cáo sự cố
- name: Dịch vụ cho phân hệ khác
- name: Tham số quan sát
- name: Vòng đời tenant
- name: Tra cứu nhật ký kiểm toán
- name: Toàn vẹn, neo và đối chiếu
- name: Xuất bằng chứng
- name: Nội bộ (DU nguồn)
- name: Nội bộ (Alertmanager)
