# D03-04-PH13 · AsyncAPI PH-13. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py — không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: 3.0.0
info:
  title: Datahub PH-13 Giám sát và kiểm toán — sự kiện
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-13-01…14 (D03-04-PH13 §4, FRS §9.3) và hai topic vào của PH-13.


    Sự kiện EVT-13 ghi vào `outbox` của `dh-platform` cùng giao dịch với thay đổi, Debezium đưa lên Kafka, CloudEvents 1.0 chế độ nhị phân. Tenant
    `PLATFORM` dùng tiền tố `platform`. Không sự kiện nào mang bằng chứng kiểm toán, giá trị Nhạy cảm hay bí mật; người nhận đọc chi tiết qua
    API. Người nhận xử lý lũy đẳng theo khóa phân vùng và thời điểm. Hai topic vào do DU và APISIX phát: `audit.recorded` mang chữ ký nguồn (`dh-du`,
    `dh-kid`, `dh-mac`) và PH-13 gán `seq`, `hash` khi ghi chuỗi; `access.logged` chỉ có siêu dữ liệu lượt gọi. Tương thích: chỉ thêm trường tùy
    chọn trong `v1` (Apicurio, BACKWARD). Dữ liệu ví dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  license:
    name: Tài liệu nội bộ dự án Datahub
defaultContentType: application/json
