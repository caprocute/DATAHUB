components:
  parameters:
    tenant:
      description: Mã tenant chữ thường (`t68`) hoặc `platform`.
      examples:
      - t68
  securitySchemes:
    mtls:
      type: X509
      description: Chứng thư do cert-manager cấp; ACL Kafka theo CN.
  messages:
    alertFired:
      name: alertFired
      title: EVT-13-01
      summary: Cảnh báo sang `FIRING` (FR-13-044).
      payload:
        $ref: '#/components/schemas/AlertFired'
      headers: &id001
        type: object
        properties:
          ce_specversion:
            type: string
            const: '1.0'
          ce_id: &id002
            type: string
            format: uuid
          ce_source:
            type: string
            description: '`/tenants/{tenant}/obs`'
          ce_type:
            type: string
            description: '`vn.datahub.obs.{đối tượng}.{sự kiện}.v1`'
          ce_time: &id003
            type: string
            format: date-time
          ce_subject:
            type: string
            description: Mã đối tượng, trùng khóa phân vùng.
          ce_datacontenttype:
            type: string
            const: application/json
          traceparent:
            type: string
        required:
        - ce_specversion
        - ce_id
        - ce_source
        - ce_type
        - ce_time
      bindings:
        kafka:
          key:
            type: string
            description: '`alertId`'
    alertResolved:
      name: alertResolved
      title: EVT-13-02
      summary: Cảnh báo sang `RESOLVED`, tự động hoặc thủ công (FR-13-044, 047).
      payload:
        $ref: '#/components/schemas/AlertResolved'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`alertId`'
    alertEscalated:
      name: alertEscalated
      title: EVT-13-03
      summary: Cảnh báo leo thang lên cấp mới hoặc hết cấp (FR-13-046).
      payload:
        $ref: '#/components/schemas/AlertEscalated'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`alertId`'
    securityAlertRaised:
      name: securityAlertRaised
      title: EVT-13-04
      summary: Cảnh báo an ninh phát hiện (FR-13-052); đề xuất tạm ngừng HTTT đi bằng API-01-089 của PH-01, không qua topic này (FR-13-053).
      payload:
        $ref: '#/components/schemas/SecurityAlertRaised'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`alertId`'
    chainBroken:
      name: chainBroken
      title: EVT-13-05
      summary: Phát hiện đứt chuỗi kiểm toán hoặc neo không khớp (FR-13-015).
      payload:
        $ref: '#/components/schemas/ChainBroken'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`tenantId`'
    anchorCreated:
      name: anchorCreated
      title: EVT-13-06
      summary: Neo băm mới được ký (FR-13-012).
      payload:
        $ref: '#/components/schemas/AnchorCreated'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`anchorId`'
    verificationCompleted:
      name: verificationCompleted
      title: EVT-13-07
      summary: Kiểm tra toàn vẹn xong (FR-13-014).
      payload:
        $ref: '#/components/schemas/VerificationCompleted'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`verificationId`'
    exportReady:
      name: exportReady
      title: EVT-13-08
      summary: Gói bằng chứng sẵn sàng tải (FR-13-024).
      payload:
        $ref: '#/components/schemas/ExportReady'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`exportId`'
    reconciliationMismatch:
      name: reconciliationMismatch
      title: EVT-13-09
      summary: Đối chiếu số bản ghi theo DU lệch (FR-13-017).
      payload:
        $ref: '#/components/schemas/ReconciliationMismatch'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`duCode`'
    ruleChanged:
      name: ruleChanged
      title: EVT-13-10
      summary: Luật cảnh báo, luật phát hiện, luật chuẩn hoặc tham số đổi (FR-13-042, 043, 051, 061).
