      name: crossTenantAccess
      title: EVT-13-12
      summary: Mở phiên truy cập liên tenant (FR-13-025). Phát vào tenant bị truy cập.
      payload:
        $ref: '#/components/schemas/CrossTenantAccess'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`sessionId`'
    probeFailed:
      name: probeFailed
      title: EVT-13-13
      summary: Kiểm tra tổng hợp thất bại liên tiếp (FR-13-008).
      payload:
        $ref: '#/components/schemas/ProbeFailed'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`probeCode`'
    capacityWarning:
      name: capacityWarning
      title: EVT-13-14
      summary: Số chuỗi hoặc dung lượng kho đạt 85% (FR-13-007, 061).
      payload:
        $ref: '#/components/schemas/CapacityWarning'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`resource`'
    auditRecorded:
      name: auditRecorded
      title: 'Topic vào: audit.recorded'
      summary: Bản ghi kiểm toán từ `dh-audit` của mọi DU (FR-13-010). Tenant `PLATFORM` dùng `platform.obs.audit.recorded.v1`.
      payload:
        $ref: '#/components/schemas/AuditEventV1'
      headers:
        type: object
        properties:
          dh-du:
            type: string
            description: DU nguồn, ví dụ `dh-data`.
          dh-kid:
            type: string
            description: Mã phiên bản khóa nguồn.
          dh-mac:
            type: string
            description: HMAC-SHA256(khóa nguồn của DU, tenant ‖ id ‖ SHA-256(payload)), base64.
          traceparent:
            type: string
        required:
        - dh-du
        - dh-kid
        - dh-mac
      bindings:
        kafka:
          key:
            type: string
            description: '`id` (UUID v7)'
    accessLogged:
      name: accessLogged
      title: 'Topic vào: access.logged'
      summary: Siêu dữ liệu lượt gọi từ plugin `kafka-logger` của APISIX (FR-13-006).
      payload:
        $ref: '#/components/schemas/AccessLogged'
      headers:
        type: object
        properties:
          traceparent:
            type: string
      bindings:
        kafka:
          key:
            type: string
            description: '`route`'
