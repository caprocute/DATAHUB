components:
  securitySchemes:
    oauth2User:
      type: oauth2
      description: Người dùng đăng nhập Keycloak (realm của tenant), Authorization Code với PKCE qua BFF; quyền `PERM-18-*` ở claim `permissions` (PH-12).
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes: {}
    oauth2Machine:
      type: oauth2
      description: Token dịch vụ của DU gọi (client_credentials với mTLS hoặc private_key_jwt); scope máy cấp khi triển khai, không gán cho người.
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            ops:param-read: Đọc lô giá trị tham số, cờ, egress (mọi DU)
            ops:param-register: Đăng ký lược đồ không gian tên của mình (mọi DU)
            ops:param-write: Ghi mặc định khi khởi tạo tenant (PH-20)
            ops:dlq-write: Ghi DLQ qua API, đăng ký nguồn (PH-01, PH-06, PH-08, PH-19, dh-runtime)
            ops:dlq-read: Đọc siêu dữ liệu DLQ và sổ tay ERR bằng token đổi từ người dùng (PH-17, PH-13)
            ops:replay-callback: Nguồn báo kết quả phát lại
            ops:notify: Gửi thông báo, tra trạng thái, báo thư trả lại
            ops:task: Đăng ký loại việc, tạo, đóng việc
            ops:calendar-read: Tính ngày làm việc, trạng thái đóng băng
            ops:incident-write: Mở, cập nhật sự cố (PH-13, PH-09)
            ops:migration-import: Phân hệ đích nhận lô di trú từ dh-migrate (PH-18 gọi ra)
            ops:backup-report: Báo bản sao lưu, kết quả kiểm tra khôi phục
            ops:merge-transfer: Yêu cầu, hủy chuyển dữ liệu sáp nhập (PH-20)
            ops:shadow-ingest: Bộ so sánh bóng gửi cặp phản hồi đã băm
    mtlsSpiffe:
      type: mutualTLS
      description: Danh tính DU theo SPIFFE ID của Istio; bắt buộc cho mọi đường dẫn `/ops/internal/v1`.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Số trang, từ 0.
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Cỡ trang, 1…100.
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: Khóa sắp xếp; tiền tố `-` là giảm dần, ví dụ `-receivedAt`.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 64
      example: dh-2026-11-27-0001
      description: Khóa chống trùng (BR-18-049); giữ 24 giờ; cùng khóa cùng thân trả lại phản hồi cũ, khác thân trả `409` ERR-18-009.
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 64
      description: Tùy chọn; thao tác đã lũy đẳng theo khóa tự nhiên trong thân (ví dụ `idempotencyKey`, `messageRef`).
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      example: W/"3"
      description: '`ETag` của đối tượng; thiếu trả `428` ERR-00-428, lệch trả `412` ERR-18-004.'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: '`ETag` của ảnh chụp trước; không đổi thì trả `304`.'
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
        pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      description: W3C Trace Context.
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - vi
        - en
      description: Ngôn ngữ thông báo lỗi.
