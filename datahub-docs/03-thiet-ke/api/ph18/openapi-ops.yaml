# D03-04-PH18 · OpenAPI PH-18 (module ops của dh-platform). SINH TỰ ĐỘNG bởi tools/gen_openapi.py, không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-18 Vận hành và xử lý lỗi
  version: 1.0.0-draft
  summary: Kho tham số và cờ tính năng, DLQ hợp nhất và phát lại, thông báo, Việc của tôi và lịch, sự cố vận hành, sao lưu và khôi phục tenant, di trú hệ cũ và cắt
    chuyển.
  description: 'Module `ops` của `dh-platform` (package `vn.datahub.platform.ops`): API người dùng `/api/ops/v1` qua APISIX và BFF; API nội bộ `/ops/internal/v1`
    chỉ trong cụm (mTLS, SPIFFE, scope máy). Đường dẫn trong tệp viết đầy đủ cả tiền tố.


    Quy ước (D03-04-PH18 §1): tenant lấy từ token (API nội bộ nhận `tenant` trong đường dẫn hoặc thân và đối chiếu danh tính gọi); mọi `POST` đổi dữ liệu nhận `Idempotency-Key`;
    `PUT`, `PATCH`, hành động chuyển trạng thái có `If-Match`; hậu tố `:{hành-động}`; phân trang `page`, `size`, `sort`; lỗi RFC 9457 mã `ERR-18-nnn` (401, 403, 428
    dùng ERR-00-401, 403, 428). Không có payload DLQ ở danh sách hay sự kiện, không có địa chỉ người nhận chưa che, không có giá trị bí mật (chỉ tham chiếu OpenBao).
    Mọi tên, mã, số trong ví dụ là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-18
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH18
  x-datahub-phase: PH-18
servers:
- url: https://api.{tenantHost}.datahub.example.vn
  description: API người dùng qua APISIX (giả lập)
  variables:
    tenantHost:
      default: t68
      description: Ví dụ `t68` (giả lập).
- url: http://localhost:8080
  description: Phát triển cục bộ (`dh-platform`)
security:
- oauth2User: []
tags:
- name: Tham số và cờ tính năng
  description: Không gian tên và lược đồ khóa, giá trị theo tenant có kiểm miền và trần, đề nghị bốn mắt cho khóa ★, phiên bản, gói tham số, cờ tính năng, egress,
    API nội bộ `ParameterApi` (FR-18-001…011).
- name: Tiếp nhận DLQ
  description: Nguồn DLQ và cổng phát lại, ghi DLQ qua API cho phân hệ khác, đối soát chỉ mục với Kafka, liên thông DLQ tầng sự kiện của PH-10 (FR-18-012…018).
- name: Phân loại và xử lý DLQ
  description: Danh sách có `facets`, nhóm dấu hiệu lỗi, chi tiết và chẩn đoán từ PH-13, xem payload có lý do, phân loại, gán, bản sửa payload, sổ tay mã lỗi, API
    đọc cho PH-17 và PH-13 (FR-18-019…026).
- name: Phát lại, bỏ qua và lưu giữ
  description: Phát lại một mục, lượt phát lại loạt có bốn mắt, điều khiển tốc độ, kết quả lũy đẳng, bỏ qua, mở lại, lưu giữ, thống kê (FR-18-027…034).
- name: Thông báo
  description: Mẫu thông báo có phiên bản và kiểm trường cấm, `NotificationApi` bất đồng bộ và đồng bộ, người nhận, tùy chọn nhận, quy tắc theo sự kiện, nhật ký gửi,
    thư trả lại, danh sách chặn (FR-18-035…041).
- name: Việc của tôi và lịch
  description: '`TaskInboxApi` (loại việc, tạo, đóng việc lũy đẳng, Việc của tôi), `WorkingCalendarApi` (lịch năm, tính hạn), cửa sổ bảo trì và đóng băng (FR-18-042…046).'
- name: Sự cố vận hành
  description: Hồ sơ sự cố từ sự kiện hoặc tạo tay, vòng đời, mốc thời gian, liên kết, chuyển PH-09, đóng có nguyên nhân và bài học (FR-18-047…051).
- name: Sao lưu, khôi phục và sáp nhập
  description: Bảng sao lưu, kiểm tra khôi phục, khôi phục tenant tám bước có bốn mắt, xuất tenant, chuyển dữ liệu khi sáp nhập (PH-20), ghi nhận diễn tập DR (FR-18-052…058).
- name: Di trú và chạy song song
  description: Nguồn hệ cũ chỉ đọc, kế hoạch di trú, chạy thử và chạy thật có bốn mắt, bản ghi lỗi, đối chiếu, cấp lại thông tin xác thực, chạy song song, mẫu so
    sánh bóng, cắt chuyển và quay lui (FR-18-059…068).
- name: Quản trị và báo cáo
  description: Nhật ký thao tác vận hành, báo cáo định kỳ, sức khỏe phân hệ và chế độ suy giảm (FR-18-069…072).
