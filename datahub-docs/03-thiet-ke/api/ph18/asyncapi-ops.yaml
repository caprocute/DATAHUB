# D03-04-PH18 · AsyncAPI PH-18. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py, không sửa tay.
asyncapi: 3.0.0
info:
  title: Datahub · PH-18 Sự kiện vận hành và xử lý lỗi
  version: 1.0.0-draft
  description: 'Sự kiện của PH-18 (EVT-18-01…29) phát từ bảng `outbox_event` qua Debezium Outbox Event Router; phong bì CloudEvents 1.0, khóa phân vùng theo FRS §9.3,
    bên tiêu thụ khử trùng theo `eventId`. Dữ liệu chỉ mang mã, trạng thái, số đếm, thời điểm; không payload DLQ, không giá trị tham số ★, không địa chỉ người nhận
    (BR-18-050). Kèm các kênh PH-18 tiêu thụ: topic DLQ chung `{tenant}.ops.dlq.v1` và sự kiện của PH-10, PH-13, PH-20. Tệp sinh bởi `tools/gen_asyncapi.py`; không
    sửa tay.'
  contact:
    name: Nhóm phân hệ PH-18
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
  x-datahub-document: D03-04-PH18
