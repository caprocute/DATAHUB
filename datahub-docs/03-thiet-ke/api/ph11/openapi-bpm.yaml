# D03-04-PH11 · OpenAPI PH-11 (module bpm của dh-platform). SINH TỰ ĐỘNG bởi tools/gen_openapi.py, không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-11 Quy trình liên thông API
  version: 1.0.0-draft
  summary: Mô hình quy trình, phiên bản, duyệt phát hành, phiên, việc, hạn, Saga, tiến độ cho kênh DVC, giám sát, cấu hình.
  description: 'Module `bpm` của `dh-platform` (Flowable nhúng), gốc `/api/bpm/v1`. Người dùng gọi qua BFF; Cổng DVC, HTTT một cửa, PH-01, PH-07, PH-19 gọi bằng token
    máy qua PH-03.


    Quy ước (D03-04-PH11 §1): tenant lấy từ token; tạo và khởi tạo nhận `Idempotency-Key`; sửa và hành động có `If-Match`; hậu tố `:{hành-động}`; lỗi RFC 9457 mã
    `ERR-11-nnn`; phân trang `page`, `size`.


    Mọi tên miền, dữ liệu là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-11
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH11
  x-datahub-phase: PH-11
servers:
- url: https://console.{tenantHost}.datahub.example.vn/api/bpm/v1
  description: Qua BFF console của tenant (giả lập)
