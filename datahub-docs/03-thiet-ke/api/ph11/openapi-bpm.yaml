      properties:
        processKey:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,63}$
        name:
          type: string
        group:
          type: string
        description:
          type: string
        templateCode:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
        defaultDue:
          $ref: '#/components/schemas/Due'
        allowedStarters:
          type: array
          items:
            type: string
        allowManualStart:
          type: boolean
      required:
      - processKey
      - name
      - group
    ModelCreated:
