        processKey:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,63}$
        version:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        validation:
          $ref: '#/components/schemas/ValidationSummary'
      required:
      - processKey
      - version
      - status
    ModelImportRequest:
      type: object
