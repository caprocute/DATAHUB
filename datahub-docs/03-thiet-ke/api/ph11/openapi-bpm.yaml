      properties:
        file:
          type: string
          format: binary
        processKey:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,63}$
        name:
          type: string
        group:
          type: string
      required:
      - file
      - processKey
      - name
      - group
    ImportReport:
      type: object
      description: 'Báo cáo nhập: phần tử bị gỡ, cảnh báo, ý định thiếu.'
      properties:
        removed:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        missingIntents:
          type: array
          items:
            type: string
    ModelImported:
      type: object
      description: Kết quả nhập tệp BPMN.
      properties:
        processKey:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,63}$
        version:
          type: integer
        report:
          $ref: '#/components/schemas/ImportReport'
      required:
      - processKey
      - version
      - report
    ModelUpdate:
      type: object
      description: Sửa thuộc tính mô hình.
      properties:
        name:
          type: string
        group:
          type: string
        description:
          type: string
        defaultDue:
          $ref: '#/components/schemas/Due'
        allowedStarters:
          type: array
          items:
            type: string
        allowManualStart:
          type: boolean
    VersionSummary:
      type: object
      description: Phiên bản mô hình.
      properties:
        processKey:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,63}$
        version:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        checksum:
          type: string
        basedOn:
          type: integer
        lockOwner:
          type: string
        lockUntil:
          type: string
          format: date-time
        validation:
          $ref: '#/components/schemas/ValidationSummary'
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - processKey
      - version
      - status
    VersionPage:
      type: object
      description: Trang kết quả.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VersionSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
      required:
      - items
      - page
      - size
      - totalElements
    VersionDetail:
      type: object
      description: Phiên bản kèm BPMN XML.
      properties:
        processKey:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,63}$
        version:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'
        checksum:
          type: string
        basedOn:
          type: integer
        changeSummary:
          type: string
        bpmnXml:
          type: string
        lockOwner:
          type: string
        lockUntil:
          type: string
          format: date-time
        deploymentId:
          type: string
        validation:
          $ref: '#/components/schemas/ValidationSummary'
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - processKey
      - version
      - status
    VersionCreate:
      type: object
      description: Tạo bản nháp mới từ phiên bản có sẵn.
      properties:
        basedOn:
          type: integer
        changeSummary:
          type: string
          maxLength: 2000
    BpmnPut:
      type: object
      description: Lưu sơ đồ BPMN do bpmn-js sinh (`If-Match` theo ETag phiên bản).
      properties:
        bpmnXml:
          type: string
          minLength: 1
      required:
      - bpmnXml
    BpmnSaved:
      type: object
      description: Kết quả lưu sơ đồ.
      properties:
        version:
          type: integer
        checksum:
          type: string
        validation:
          $ref: '#/components/schemas/ValidationReport'
      required:
      - version
      - checksum
      - validation
    Assignment:
