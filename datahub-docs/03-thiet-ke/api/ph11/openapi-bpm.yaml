        allowedStarters:
          type: array
          items:
            type: string
        allowManualStart:
          type: boolean
        archived:
          type: boolean
        latestVersion:
          type: integer
        publishedVersion:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - processKey
      - name
      - group
      - archived
    ModelCreate:
