                    lockOwner: ie.tranvanc
                    requestedAt: '2026-11-26T08:00:00+07:00'
          headers:
            ETag:
              schema:
                type: string
              description: '`W/"{version}"`.'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
components:
  securitySchemes:
    oauth2User:
      type: oauth2
      description: Người dùng qua Keycloak (OIDC, PKCE qua BFF); quyền `PERM-11-*`.
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/datahub/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/datahub/protocol/openid-connect/token
          scopes: {}
    oauth2Machine:
      type: oauth2
      description: Máy với máy (client_credentials, mTLS hoặc private_key_jwt).
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/datahub/protocol/openid-connect/token
          scopes:
            bpm.instance.start: Khởi tạo phiên, gửi thông điệp, báo đã bổ sung hồ sơ
            bpm.instance.read: Đọc phiên do chính client khởi tạo (đã che)
            bpm.task.read: Đọc việc của đơn vị, không có biến SENSITIVE
            bpm.progress.read: Tra tiến độ hồ sơ cho kênh DVC (đã che)
            bpm.service.worker: PH-04 tiêu thụ lệnh service task qua Kafka (không có REST)
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do bên gọi sinh; gửi lại cùng khóa trong 24 giờ trả đúng phản hồi lần đầu; dùng lại với nội dung khác trả `409` (ERR-11-051).
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: '`ETag` của tài nguyên (`W/"{version}"`); không khớp trả ERR-11-004. Thiếu tiêu đề trả `428` (ERR-00-428).'
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
      description: W3C Trace Context.
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        default: vi
        enum:
        - vi
        - en
    UnmaskReason:
      name: X-Unmask-Reason
      in: header
      required: false
      schema:
        type: string
        minLength: 20
        maxLength: 500
      description: Lý do xem giá trị `SENSITIVE` đầy đủ, bắt buộc khi `unmask=true`; ở tiêu đề để không vào log đường dẫn.
    ProcessKey:
      name: processKey
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Z][A-Z0-9_]{2,63}$
      example: LT_KHAI_SINH
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
      example: 3
    ElementId:
      name: elementId
      in: path
      required: true
      schema:
        type: string
      example: Task_DangKyKhaiSinh
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FormKey:
      name: formKey
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
      example: BM_TIEP_NHAN
    IntentCode:
      name: intentCode
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
      example: DK_KHAI_SINH
    TemplateCode:
      name: templateCode
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
      example: MAU_LIEN_THONG_3_CO_QUAN
    Code:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
      example: BANG_RE_NHANH_HO_SO
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommandId:
      name: commandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Year:
      name: year
      in: path
      required: true
      schema:
        type: integer
      example: 2026
    SagaId:
      name: sagaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StepId:
      name: stepId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BusinessKey:
      name: businessKey
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 100
      example: HS-T68-2026-000142
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HoldId:
      name: holdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            vi-du:
              value:
                type: https://datahub.example.vn/errors/ERR-11-003
                title: Dữ liệu không hợp lệ
                status: 400
                detail: Dữ liệu không hợp lệ.
                code: ERR-11-003
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unauthorized:
      description: Chưa xác thực.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            vi-du:
              value:
                type: https://datahub.example.vn/errors/ERR-00-401
                title: Chưa xác thực
                status: 401
                detail: Chưa xác thực.
                code: ERR-00-401
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Forbidden:
      description: Không đủ quyền hoặc ngoài phạm vi.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            vi-du:
              value:
                type: https://datahub.example.vn/errors/ERR-11-034
                title: Không đủ quyền hoặc ngoài phạm vi
                status: 403
                detail: Không đủ quyền hoặc ngoài phạm vi.
                code: ERR-11-034
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    NotFound:
      description: Không tìm thấy.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            vi-du:
              value:
                type: https://datahub.example.vn/errors/ERR-11-001
                title: Không tìm thấy
                status: 404
                detail: Không tìm thấy.
                code: ERR-11-001
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Conflict:
      description: Xung đột trạng thái hoặc ETag.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            vi-du:
              value:
                type: https://datahub.example.vn/errors/ERR-11-004
                title: Xung đột trạng thái hoặc ETag
                status: 409
                detail: Xung đột trạng thái hoặc ETag.
                code: ERR-11-004
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Gone:
      description: Đã hết lưu giữ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            vi-du:
              value:
                type: https://datahub.example.vn/errors/ERR-11-001
                title: Đã hết lưu giữ
                status: 410
                detail: Đã hết lưu giữ.
                code: ERR-11-001
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    PayloadTooLarge:
      description: Vượt giới hạn cỡ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            vi-du:
              value:
                type: https://datahub.example.vn/errors/ERR-11-009
                title: Vượt giới hạn cỡ
                status: 413
                detail: Vượt giới hạn cỡ.
                code: ERR-11-009
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unprocessable:
      description: Không xử lý được.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            vi-du:
              value:
                type: https://datahub.example.vn/errors/ERR-11-007
                title: Không xử lý được
                status: 422
                detail: Không xử lý được.
                code: ERR-11-007
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    TooManyRequests:
      description: Vượt hạn mức gọi.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            vi-du:
              value:
                type: https://datahub.example.vn/errors/ERR-11-041
                title: Vượt hạn mức gọi
                status: 429
                detail: Vượt hạn mức gọi.
                code: ERR-11-041
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    ServiceUnavailable:
      description: Dịch vụ phụ thuộc không khả dụng.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            vi-du:
              value:
                type: https://datahub.example.vn/errors/ERR-11-046
                title: Dịch vụ phụ thuộc không khả dụng
                status: 503
                detail: Dịch vụ phụ thuộc không khả dụng.
                code: ERR-11-046
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    PreconditionRequired:
      description: Thiếu `If-Match`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            vi-du:
              value:
                type: https://datahub.example.vn/errors/ERR-00-428
                title: Thiếu If-Match
                status: 428
                code: ERR-00-428
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
  schemas:
    FieldError:
      type: object
      description: Lỗi theo trường.
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    Problem:
      type: object
      description: Lỗi theo RFC 9457.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - type
      - title
      - status
      - code
      - traceId
    CommentBody:
      type: object
      description: Ý kiến kèm hành động.
      properties:
        comment:
          type: string
          maxLength: 2000
    WaiverDecision:
      type: object
      description: Quyết định một miễn bù trừ `NONE_APPROVED` (khác người đề nghị, ERR-11-005).
      properties:
        elementId:
          type: string
        decision:
          $ref: '#/components/schemas/Decision'
        reason:
          type: string
      required:
      - elementId
      - decision
    PublishApprove:
      type: object
      description: Duyệt phát hành; `waiverDecisions[]` quyết định từng miễn bù trừ (mỗi giá trị `decision` là `APPROVE` hoặc `REJECT`).
      properties:
        comment:
          type: string
          maxLength: 2000
        waiverDecisions:
          type: array
          items:
            $ref: '#/components/schemas/WaiverDecision'
    RejectBody:
      type: object
      description: 'Từ chối: bắt buộc nêu lý do từ 20 ký tự (BR-11-016).'
      properties:
        comment:
          type: string
          minLength: 20
          maxLength: 2000
      required:
      - comment
    ReasonBody:
      type: object
      description: Hành động kèm lý do từ 10 ký tự.
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 2000
      required:
      - reason
    SkippedItem:
      type: object
      description: Phần tử bị bỏ qua.
      properties:
        id:
          type: string
        reason:
          type: string
      required:
      - id
      - reason
    Due:
      type: object
      description: 'Hạn xử lý (kiểu T-DUE: giá trị và đơn vị).'
      properties:
        value:
          type: integer
          minimum: 1
          maximum: 3650
        unit:
          $ref: '#/components/schemas/DueUnit'
      required:
      - value
      - unit
    DueInfo:
      type: object
      description: Hạn của phiên hoặc việc.
      properties:
        status:
          $ref: '#/components/schemas/DueStatus'
        dueAt:
          type: string
          format: date-time
        dueSoonAt:
          type: string
          format: date-time
        pausedAt:
          type: string
          format: date-time
        pauseReason:
          $ref: '#/components/schemas/PauseReason'
        escalationLevel:
          type: integer
        result:
          $ref: '#/components/schemas/DueResult'
      required:
      - status
    ExportAccepted:
      type: object
      description: Yêu cầu xuất đã nhận, chạy bất đồng bộ.
      properties:
        exportId:
          type: string
          format: uuid
        status:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - exportId
      - status
    CheckItem:
      type: object
      description: Một kết quả kiểm tra tĩnh (FR-11-005).
      properties:
        ruleCode:
          type: string
        severity:
          $ref: '#/components/schemas/CheckSeverity'
        elementId:
          type: string
        message:
          type: string
      required:
      - ruleCode
      - severity
      - message
    ValidationReport:
      type: object
      description: Kết quả kiểm tra tĩnh.
      properties:
        blocking:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CheckItem'
        checkedAt:
          type: string
          format: date-time
      required:
      - blocking
      - errors
      - checkedAt
    ValidationSummary:
      type: object
      description: Tóm tắt kiểm tra tĩnh.
      properties:
        blocking:
          type: boolean
        errorCount:
          type: integer
        warningCount:
          type: integer
        checkedAt:
          type: string
          format: date-time
      required:
      - blocking
    ModelSummary:
      type: object
      description: Mô hình quy trình (dòng danh sách).
      properties:
        processKey:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,63}$
        name:
          type: string
        group:
          type: string
        latestVersion:
          type: integer
        latestStatus:
          $ref: '#/components/schemas/VersionStatus'
        publishedVersion:
          type: integer
        runningInstances:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required:
      - processKey
      - name
      - group
    ModelPage:
      type: object
      description: Trang kết quả.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
      required:
      - items
      - page
      - size
      - totalElements
    ModelDetail:
