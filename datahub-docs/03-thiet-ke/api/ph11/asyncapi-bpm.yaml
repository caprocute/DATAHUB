components:
  securitySchemes:
    mtls:
      type: X509
      description: mTLS, ACL theo CN và tiền tố tenant.
  parameters:
    tenant:
      description: Mã tenant chữ thường, ví dụ `t68`.
      examples:
      - t68
  messages:
    modelPublished:
      name: modelPublished
      title: EVT-11-01
      summary: 'EVT-11-01: model.published. Trường chính: `processKey`, `version`, `checksum`, `publishedBy`, `approvedBy`'
      contentType: application/json
      payload:
        $ref: '#/components/schemas/modelPublishedEvent'
      bindings:
        kafka:
          key:
            type: string
            description: 'Khóa phân vùng: `processKey`.'
      examples:
      - name: vi-du
        payload:
          specversion: '1.0'
          id: 0193a0c3-0000-7000-8000-000000000001
          type: vn.datahub.bpm.model.published.v1
          source: dh-platform/bpm/T68
          time: '2026-11-26T09:15:00+07:00'
          datacontenttype: application/json
          data:
            processKey: LT_KHAI_SINH
            version: 3
            checksum: sha256:3f2a9c
            publishedBy: ie.tranvanc
            approvedBy: ia.lethid
    modelRetired:
      name: modelRetired
      title: EVT-11-02
      summary: 'EVT-11-02: model.retired. Trường chính: `processKey`, `version`, `status` (`DEPRECATED`, `RETIRED`), `reason`'
      contentType: application/json
      payload:
        $ref: '#/components/schemas/modelRetiredEvent'
      bindings:
        kafka:
          key:
            type: string
            description: 'Khóa phân vùng: `processKey`.'
      examples:
      - name: vi-du
        payload:
          specversion: '1.0'
          id: 0193a0c3-0000-7000-8000-000000000002
          type: vn.datahub.bpm.model.retired.v1
          source: dh-platform/bpm/T68
          time: '2026-11-26T09:15:00+07:00'
          datacontenttype: application/json
          data:
            processKey: LT_KHAI_SINH
            version: 2
            status: DEPRECATED
            reason: Thay bằng phiên bản 3.
    instanceStarted:
      name: instanceStarted
      title: EVT-11-03
      summary: 'EVT-11-03: instance.started. Trường chính: `instanceId`, `processKey`, `version`, `businessKey`, `startChannel`, `dueAt`'
      contentType: application/json
      payload:
        $ref: '#/components/schemas/instanceStartedEvent'
      bindings:
        kafka:
          key:
            type: string
            description: 'Khóa phân vùng: `businessKey`.'
      examples:
      - name: vi-du
        payload:
          specversion: '1.0'
          id: 0193a0c3-0000-7000-8000-000000000003
          type: vn.datahub.bpm.instance.started.v1
          source: dh-platform/bpm/T68
          time: '2026-11-26T09:15:00+07:00'
          datacontenttype: application/json
          data:
            instanceId: 0193b1d4-7c2a-7b10-9f3e-5a6c8d2e4f01
            processKey: LT_KHAI_SINH
            version: 3
            businessKey: HS-T68-2026-000142
            startChannel: API
            dueAt: '2026-11-26T08:00:00+07:00'
    instanceStepCompleted:
