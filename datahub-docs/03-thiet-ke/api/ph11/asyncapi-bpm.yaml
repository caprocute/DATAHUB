# D03-04-PH11 · AsyncAPI PH-11. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py, không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: 3.0.0
info:
  title: 'Datahub PH-11 Quy trình liên thông: sự kiện'
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-11-01…21 (D03-04-PH11 §4, FRS 9.3). Ghi vào `ph11_bpm.outbox_event` cùng giao dịch nghiệp vụ (ADR-042), bộ chuyển outbox đưa
    lên Kafka; CloudEvents 1.0 dạng cấu trúc, khóa phân vùng `businessKey` giữ thứ tự theo hồ sơ. Không sự kiện nào mang giá trị biến. EVT-11-17 là lệnh tới PH-04
    (ADR 112, PH-11 không gọi HTTT trực tiếp); EVT-11-18, 19 do PH-04 phát, PH-11 tiêu thụ và tương quan theo `commandId`. Tương thích BACKWARD: chỉ thêm trường tùy
    chọn trong `v1` (ADR-070). Dữ liệu ví dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
defaultContentType: application/json
servers:
  kafka-internal:
    host: dh-kafka-kafka-bootstrap.dh-kafka.svc:9093
    protocol: kafka-secure
    description: 'Listener `internal`: DU, `dh-runtime`, Kafka Connect; mTLS, ACL theo tiền tố tenant.'
    security:
    - $ref: '#/components/securitySchemes/mtls'
