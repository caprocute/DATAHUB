# D03-04-PH15 · AsyncAPI PH-15. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py, không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: 3.0.0
info:
  title: 'Datahub PH-15 Cổng nhà phát triển: sự kiện'
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-15-01…14 do PH-15 phát (outbox `ph15_portal.outbox_event`, Debezium, Kafka) và các sự kiện EVT-02-* do PH-02 phát mà cổng tiêu
    thụ (D03-04-PH15 §4, FRS §9.2). CloudEvents 1.0 nhị phân, `ce_type = vn.datahub.portal.{thực-thể}.{sự-kiện}`; lược đồ Avro tương ứng ở Apicurio, chế độ BACKWARD
    (ở đây mô tả bằng JSON Schema). Sự kiện không mang bí mật hay thân yêu cầu. Lưu giữ 7 ngày, 3 phân vùng (giả định theo mức của PH-10, Q15-58). Người nhận xử lý
    lũy đẳng theo `ce_id` (inbox). Tương thích: chỉ thêm trường tùy chọn trong `v1`. Dữ liệu ví dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
defaultContentType: application/json
servers:
  kafka-internal:
    host: dh-kafka-kafka-bootstrap.dh-kafka.svc:9093
    protocol: kafka-secure
    description: 'Listener `internal`: DU `dh-connect` (vai trò `worker`), Kafka Connect; mTLS, ACL theo CN và tiền tố tenant (D03-09).'
    security:
    - $ref: '#/components/securitySchemes/mtls'
