    name: Nhóm phân hệ PH-15
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH15
  x-datahub-phase: PH-15
