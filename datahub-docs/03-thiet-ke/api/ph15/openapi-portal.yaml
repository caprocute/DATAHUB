# D03-04-PH15 · OpenAPI PH-15 (module portal của dh-connect). SINH TỰ ĐỘNG bởi tools/gen_openapi.py, không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-15 Cổng nhà phát triển API
  version: 1.0.0-draft
  summary: Danh mục và tìm kiếm, tài liệu API, nội dung, tài khoản nhà phát triển, ứng dụng và thông tin xác thực sandbox, thử API, ủy thác đăng ký, theo dõi, hỗ
    trợ, quản trị cổng.
  description: 'Module `portal` của `dh-connect` (package `vn.datahub.connect.portal`), gốc `/api/portal/v1` qua BFF của `dh-portal`; phần ẩn danh `/public`, thử
    API `/try`, quản trị `/admin`, nội bộ gateway sandbox `/internal/v1` (cổng 8081, chỉ APISIX).


    Quy ước (D03-04-PH15 §1): tenant lấy từ phiên/host, không nhận từ tham số; tạo nhận `Idempotency-Key`; sửa và hành động nhận `If-Match`; hậu tố `:{hành-động}`;
    phân trang `trang`, `co` (10, 20, 50, 100), `sap-xep`; lỗi RFC 9457 mã `ERR-15-nnn`. Cổng không giữ bí mật ứng dụng; bí mật sandbox chỉ hiện một lần. Mọi tên
    miền, dữ liệu là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
