components:
  securitySchemes:
    oauth2User:
      type: oauth2
      description: Người dùng đăng nhập Keycloak (realm tenant hoặc `dh-dev`), Authorization Code + PKCE qua BFF `dh-portal`; trình duyệt chỉ giữ cookie phiên, BFF
        gắn token (SEC-21). Hạng người xem suy từ phiên.
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes: {}
    mtlsMesh:
      type: mutualTLS
      description: Chứng thư SPIFFE của APISIX trong mesh; chỉ dùng cho API-15-082.
  parameters:
    Q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
      description: Từ khóa tìm kiếm.
    Trang:
      name: trang
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Số trang, từ 1.
    Co:
      name: co
      in: query
      schema:
        type: integer
        enum:
        - 10
        - 20
        - 50
        - 100
        default: 20
      description: Cỡ trang.
    SapXep:
      name: sap-xep
      in: query
      schema:
        type: string
      description: Khóa sắp xếp; tiền tố `-` là giảm dần.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Khóa chống trùng (ADR-041, BR-15-034); lưu 24 giờ.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: '`ETag` của đối tượng; lệch trả `412` (ERR-15-006).'
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
      description: Trả `304` nếu nội dung không đổi.
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
        pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      description: W3C Trace Context.
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - vi
        - en
      description: Ngôn ngữ thông báo lỗi.
  responses:
    BadRequest:
      description: 'Lỗi 400 (RFC 9457): ERR-15-003, ERR-15-013.'
