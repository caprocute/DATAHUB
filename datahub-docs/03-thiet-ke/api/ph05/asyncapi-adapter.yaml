components:
  parameters:
    tenant:
      description: Mã tenant chữ thường (`t68`) hoặc `common`.
      examples:
      - t68
  securitySchemes:
    mtls:
      type: X509
      description: Chứng thư do cert-manager cấp; ACL Kafka theo CN.
  messages:
    connectionEnabled:
      name: connectionEnabled
      title: EVT-05-01
      summary: Giá trị môi trường được bật (FR-05-007).
      payload:
        $ref: '#/components/schemas/ConnectionEnabled'
      headers: &id001
        type: object
        properties:
          ce_specversion:
            type: string
            const: '1.0'
          ce_id:
            type: string
            format: uuid
          ce_source:
            type: string
            description: '`/tenants/{tenant}/adapter`'
          ce_type:
            type: string
            description: '`vn.datahub.adapter.{đối tượng}.{sự kiện}.v1`'
          ce_time: &id004
            type: string
            format: date-time
          ce_subject:
            type: string
            description: Mã kết nối hoặc bộ điều hợp.
          ce_datacontenttype:
            type: string
            const: application/json
          traceparent:
            type: string
        required:
        - ce_specversion
        - ce_id
        - ce_source
        - ce_type
        - ce_time
      bindings:
        kafka:
          key:
            type: string
            description: '`{connectionCode}`'
    connectionChanged:
      name: connectionChanged
      title: EVT-05-02
      summary: Tham số không bí mật đổi ở giá trị đang bật (FR-05-006).
      payload:
        $ref: '#/components/schemas/ConnectionChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{connectionCode}`'
    secretRotated:
      name: secretRotated
      title: EVT-05-03
      summary: Bí mật mới có hiệu lực, hoặc kết thúc chuyển tiếp (FR-05-012). Không mang giá trị bí mật.
      payload:
        $ref: '#/components/schemas/SecretRotated'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{connectionCode}`'
    connectionStateChanged:
      name: connectionStateChanged
      title: EVT-05-04
      summary: Tạm ngừng, tiếp tục, ngừng dùng kết nối; tắt môi trường (FR-05-007, 008).
      payload:
        $ref: '#/components/schemas/ConnectionStateChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{connectionCode}`'
    grantChanged:
      name: grantChanged
      title: EVT-05-05
      summary: Cấp, thu hồi, hết hạn cấp kết nối (FR-05-009).
      payload:
        $ref: '#/components/schemas/GrantChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{connectionCode}`'
    healthChanged:
      name: healthChanged
      title: EVT-05-06
      summary: Mức sức khỏe đổi sau chống dao động (FR-05-021).
      payload:
        $ref: '#/components/schemas/HealthChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{kind}:{code}`'
    adapterVersionApproved:
      name: adapterVersionApproved
      title: EVT-05-07
      summary: Phiên bản bộ điều hợp được duyệt, kèm Kamelet sinh (FR-05-044, 047).
      payload:
        $ref: '#/components/schemas/AdapterVersionApproved'
