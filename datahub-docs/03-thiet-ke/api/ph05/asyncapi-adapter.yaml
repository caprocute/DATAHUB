# D03-04-PH05 · AsyncAPI PH-05. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py — không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: 3.0.0
info:
  title: Datahub PH-05 Bộ điều hợp và kết nối — sự kiện
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-05-01…15 (D03-04-PH05 §4, FRS §8.2) và hai topic nội bộ của bộ chạy kiểm tra.


    EVT-05-01…12, 15 ghi vào `ph05_adapter.outbox` cùng giao dịch, Debezium đưa lên Kafka, CloudEvents 1.0 chế độ nhị phân. EVT-05-13 do Kafka
    Connect (Debezium) phát vào topic PH-10 đăng ký; EVT-05-14 do runtime phát trực tiếp. Không sự kiện nào mang giá trị bí mật (ràng buộc `ck_outbox_no_secret`,
    kiểm thử canary). Người nhận xử lý lũy đẳng theo `configVersion` hoặc `secretVersion`. Tương thích: chỉ thêm trường tùy chọn trong `v1`. Dữ
    liệu ví dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  license:
    name: Tài liệu nội bộ dự án Datahub
defaultContentType: application/json
