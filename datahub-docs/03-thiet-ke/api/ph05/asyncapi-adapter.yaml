          key:
            type: string
            description: '`{name}`'
    cdcSchemaChanged:
      name: cdcSchemaChanged
      title: EVT-05-11
      summary: Phát hiện thay đổi lược đồ nguồn (FR-05-051).
      payload:
        $ref: '#/components/schemas/CdcSchemaChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{adapterCode}`'
    cdcStateChanged:
      name: cdcStateChanged
      title: EVT-05-12
      summary: Trạng thái CDC đổi (FR-05-050).
      payload:
        $ref: '#/components/schemas/CdcStateChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{adapterCode}`'
    cdcChange:
      name: cdcChange
      title: EVT-05-13
      summary: Bản ghi thay đổi Debezium (khung chuẩn, Avro qua Apicurio; lược đồ JSON tương đương ở đây). Topic do PH-10 đăng ký.
      payload:
        $ref: '#/components/schemas/CdcChangeRecord'
      headers:
        type: object
        properties:
          traceparent:
            type: string
          ce_id:
            type: string
            format: uuid
      bindings:
        kafka:
          key:
            type: string
            description: Khóa chính bảng nguồn
    dbAccessRecorded:
      name: dbAccessRecorded
      title: EVT-05-14
      summary: Mỗi câu lệnh CSDL của luồng (FR-05-027). Không có câu lệnh đầy đủ, chỉ băm.
      payload:
        $ref: '#/components/schemas/DbAccessRecorded'
      headers:
        type: object
        properties:
          traceparent:
            type: string
          ce_id:
            type: string
            format: uuid
      bindings:
        kafka:
          key:
            type: string
            description: '`{flowCode}`'
    flowAccountChanged:
      name: flowAccountChanged
      title: EVT-05-15
      summary: Cấp, thu hồi, hết hạn tài khoản CSDL cho luồng (FR-05-024, 028).
      payload:
        $ref: '#/components/schemas/FlowAccountChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{connectionCode}:{flowCode}`'
    probeCommand:
      name: probeCommand
      title: nội bộ
      summary: Lệnh kiểm tra, thăm dò gửi `probe-jvm` (SDD §4.4). Không có bí mật; worker tự đọc OpenBao.
      payload:
        $ref: '#/components/schemas/ProbeCommand'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{connectionCode}`'
    probeResult:
      name: probeResult
      title: nội bộ
      summary: Kết quả từng bước và kết quả cuối.
      payload:
        $ref: '#/components/schemas/ProbeResult'
      headers:
        type: object
        properties:
          traceparent:
            type: string
          ce_id:
            type: string
            format: uuid
      bindings:
        kafka:
          key:
            type: string
            description: '`{testId}`'
  schemas:
    Actor:
      type: object
      properties:
        userId:
          type: string
        type:
          type: string
          enum:
          - USER
          - SYSTEM
      required:
      - userId
      - type
    ConnRef:
      type: object
      properties:
        tenantId: &id005
          type: string
          pattern: ^(T[0-9]{2}|COMMON)$
        connectionCode:
          type: string
        typeCode:
          type: string
        configVersion: &id002
          type: integer
      required:
      - tenantId
      - connectionCode
      - configVersion
    ConnectionEnabled:
      allOf:
      - $ref: '#/components/schemas/ConnRef'
      - type: object
        properties:
          env: &id003
            type: string
            enum:
            - TEST
            - STAGING
            - PROD
          secretVersion: *id002
          paramsHash:
            type: string
          approvedBy:
            type: string
          actor:
            $ref: '#/components/schemas/Actor'
        required:
        - env
        - secretVersion
    ConnectionChanged:
      allOf:
      - $ref: '#/components/schemas/ConnRef'
      - type: object
        properties:
          env: *id003
          changedKeys:
            type: array
            items:
              type: string
          paramsHash:
            type: string
          actor:
            $ref: '#/components/schemas/Actor'
        required:
        - env
        - changedKeys
    SecretRotated:
      allOf:
      - $ref: '#/components/schemas/ConnRef'
      - type: object
        properties:
          env: *id003
          secretVersion: *id002
          fallbackVersion:
            type:
            - integer
            - 'null'
          transitionUntil: *id004
          phase:
            type: string
            enum:
            - TRANSITION
            - COMPLETED
        required:
        - env
        - secretVersion
        - phase
    ConnectionStateChanged:
      allOf:
      - $ref: '#/components/schemas/ConnRef'
      - type: object
        properties:
          scope:
            type: string
            enum:
            - CONNECTION
            - ENVIRONMENT
          env: *id003
          from:
            type: string
          to:
            type: string
            enum:
            - ACTIVE
            - SUSPENDED
            - RETIRED
            - DISABLED
            - ENABLED
          reason:
            type: string
            maxLength: 1000
          actor:
            $ref: '#/components/schemas/Actor'
        required:
        - scope
        - to
    GrantChanged:
      allOf:
      - $ref: '#/components/schemas/ConnRef'
      - type: object
        properties:
          grantId:
            type: string
            format: uuid
          change:
            type: string
            enum:
            - GRANTED
            - REVOKED
            - EXPIRED
          scope:
            type: string
            enum:
            - WORKSPACE
            - FLOW
          targetCode:
            type: string
          environments:
            type: array
            items: *id003
        required:
        - grantId
        - change
        - scope
        - targetCode
    HealthChanged:
      type: object
      properties:
        tenantId: *id005
        kind:
          type: string
          enum:
          - CONNECTION
          - ADAPTER
        code:
          type: string
        env: *id003
        from:
          type: string
          enum:
          - HEALTHY
          - DEGRADED
          - UNHEALTHY
          - UNKNOWN
        to:
          type: string
          enum:
          - HEALTHY
          - DEGRADED
          - UNHEALTHY
          - UNKNOWN
        reasonCode:
          type: string
        reasonDetail:
          type: string
          maxLength: 1000
        evaluatedAt: *id004
        metrics:
          type: object
          properties:
            calls5m: *id002
            errorRate5m:
              type: number
            p95Ms: *id002
            poolWaitP95Ms: *id002
      required:
      - tenantId
      - kind
      - code
      - env
      - to
    AdapterVersionApproved:
      type: object
      properties:
        tenantId: *id005
        adapterCode:
          type: string
        version:
          type: string
        contentHash:
          type: string
        maxConcurrency: *id002
        operations:
          type: array
          items:
            type: object
            properties:
              operationCode:
                type: string
              kameletName:
                type: string
              yamlHash:
                type: string
            required:
            - operationCode
            - kameletName
        supersededVersion:
          type:
          - string
          - 'null'
        actor:
          $ref: '#/components/schemas/Actor'
      required:
      - tenantId
      - adapterCode
      - version
      - operations
    AdapterStateChanged:
      type: object
      properties:
        tenantId: *id005
        adapterCode:
          type: string
        from:
          type: string
        to:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - RETIRED
        reason:
          type: string
          maxLength: 1000
        actor:
          $ref: '#/components/schemas/Actor'
      required:
      - tenantId
      - adapterCode
      - to
    KameletPublished:
      type: object
      properties:
        tenantId: *id005
        name:
          type: string
        version:
          type: string
        scope:
          type: string
          enum:
          - BASE
          - COMMON
          - TENANT
        type:
          type: string
          enum:
          - source
          - sink
          - action
        yamlHash:
          type: string
        origin:
          type: string
          enum:
          - EDITOR
          - DESIGNER
          - GENERATED
          - PLATFORM
        runtimeProfiles:
          type: array
          items:
            type: string
        actor:
          $ref: '#/components/schemas/Actor'
      required:
      - tenantId
      - name
      - version
      - yamlHash
    KameletLifecycleChanged:
      type: object
      properties:
        tenantId: *id005
        name:
          type: string
        version:
          type: string
        to:
          type: string
          enum:
          - DEPRECATED
          - WITHDRAWN
        reason:
          type: string
          maxLength: 1000
        affectedFlows: *id002
        actor:
          $ref: '#/components/schemas/Actor'
      required:
      - tenantId
      - name
      - version
      - to
    CdcSchemaChanged:
      type: object
      properties:
        tenantId: *id005
        adapterCode:
          type: string
        env: *id003
        changeId:
          type: string
          format: uuid
        table:
          type: string
        changeKind:
          type: string
        severity:
          type: string
          enum:
          - COMPATIBLE
          - BREAKING
        sourcePosition:
          type: string
        cdcPaused: &id006
          type: boolean
        detectedAt: *id004
      required:
      - tenantId
      - adapterCode
      - changeId
      - table
      - severity
    CdcStateChanged:
      type: object
      properties:
        tenantId: *id005
        adapterCode:
          type: string
        env: *id003
        from:
          type: string
        to:
          type: string
          enum:
          - STOPPED
          - SNAPSHOTTING
          - STREAMING
          - PAUSED
          - PAUSED_SCHEMA
          - FAILED
        reason:
          type: string
          maxLength: 1000
        lastPosition:
          type: string
        actor:
          $ref: '#/components/schemas/Actor'
      required:
      - tenantId
      - adapterCode
      - env
      - to
    CdcChangeRecord:
      type: object
      properties:
        before:
          type:
          - object
          - 'null'
        after:
          type:
          - object
          - 'null'
        source:
          type: object
          properties:
            connector:
              type: string
              enum:
              - postgresql
              - mysql
              - oracle
              - sqlserver
            db:
              type: string
            schema:
              type: string
            table:
              type: string
            ts_ms: *id002
            lsn:
              type: string
            scn:
              type: string
            gtid:
              type: string
            snapshot:
              type: string
          required:
          - connector
          - table
          - ts_ms
        op:
          type: string
          enum:
          - c
          - u
          - d
          - r
          - t
        ts_ms: *id002
      required:
      - op
      - source
      - ts_ms
    DbAccessRecorded:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        tenantId: *id005
        connectionCode:
          type: string
        flowCode:
          type: string
        flowVersion: *id002
        env: *id003
        dbUsername:
          type: string
        statementHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        statementKind:
          type: string
          enum:
          - SELECT
          - INSERT
          - UPDATE
          - DELETE
          - CALL
        rowCount: *id002
        durationMs: *id002
        outcome:
          type: string
          enum:
          - OK
          - DENIED
          - ERROR
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
        occurredAt: *id004
      required:
      - eventId
      - tenantId
      - flowCode
      - statementHash
      - statementKind
      - outcome
      - occurredAt
    FlowAccountChanged:
      type: object
      properties:
        tenantId: *id005
        accountId:
          type: string
          format: uuid
        connectionCode:
          type: string
        flowCode:
          type: string
        env: *id003
        accessMode:
          type: string
          enum:
          - READ
          - WRITE
        to:
          type: string
          enum:
          - ISSUED
          - REVOKED
          - EXPIRED
          - REJECTED
        openbaoRole:
          type: string
        validUntil:
          type: string
          format: date
        actor:
          $ref: '#/components/schemas/Actor'
      required:
      - tenantId
      - accountId
      - flowCode
      - env
      - to
    ProbeCommand:
      type: object
      properties:
        testId:
          type: string
          format: uuid
        tenantId: *id005
        connectionCode:
          type: string
        typeCode:
          type: string
        env: *id003
        kind:
          type: string
          enum:
          - MANUAL
          - ROTATION
          - PRIVILEGE
          - CDC_PREREQ
          - HEALTH
        secretVersion: *id002
        paramsHash:
          type: string
        params:
          type: object
          properties: {}
        steps:
          type: array
          items:
            type: string
        deadline: *id004
      required:
      - testId
      - tenantId
      - connectionCode
      - env
      - kind
      - secretVersion
      - deadline
    ProbeResult:
      type: object
      properties:
        testId:
          type: string
          format: uuid
        tenantId: *id005
        final: *id006
        step:
          type: object
          properties:
            name:
              type: string
            status:
              type: string
              enum:
              - PASSED
              - FAILED
              - SKIPPED
              - TIMEOUT
            durationMs: *id002
            causeCode:
              type: string
            hint:
              type: string
        status:
          type: string
          enum:
          - PASSED
          - FAILED
        latencyMs: *id002
        worker:
          type: string
      required:
      - testId
      - tenantId
      - final
