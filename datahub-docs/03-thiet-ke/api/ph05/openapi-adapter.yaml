            ETag:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /settings/connection-types/{typeCode}:
    put:
      tags:
      - Tham số và báo cáo
      operationId: putConnectionTypeSetting
      summary: Bật, tắt loại kết nối và trần tham số
      x-datahub-id: API-05-091
      x-datahub-fr:
      - FR-05-061
      x-datahub-permission:
        permission: PERM-05-admin
      description: Tắt loại còn kết nối ACTIVE ERR-05-010 trừ khi `blockNew`; trần chỉ thu hẹp (ERR-05-030).
      parameters:
      - $ref: '#/components/parameters/TypeCodePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionTypeSetting'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /reports/usage:
    get:
      tags:
      - Tham số và báo cáo
      operationId: getUsageReport
      summary: Báo cáo sử dụng kết nối và bộ điều hợp
      x-datahub-id: API-05-092
      x-datahub-fr:
      - FR-05-062
      x-datahub-permission:
        permission: PERM-05-read
      description: '`Accept: text/csv` hoặc XLSX để xuất.'
      parameters:
      - name: month
        in: query
        schema:
          type: string
          maxLength: 7
          pattern: ^[0-9]{4}-[0-9]{2}$
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReport'
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                contentEncoding: binary
          headers:
            ETag:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/health/states:
    get:
      tags:
      - Nội bộ (PH-04, runtime)
      operationId: listHealthStates
      summary: Trạng thái sức khỏe cho PH-04 và PH-13
      x-datahub-id: API-05-093
      x-datahub-fr:
      - FR-05-021
      x-datahub-permission:
        serviceScope: adapter:health-read
      security:
      - oauth2Service:
        - adapter:health-read
      description: Gọi bởi PH-04, PH-13 (scope `adapter:health-read`).
      parameters:
      - name: env
        in: query
        schema:
          $ref: '#/components/schemas/Environment'
      - name: level
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/HealthLevel'
        style: form
        explode: false
      - name: since
        in: query
        schema: *id001
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStateList'
          headers:
            ETag:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    oauth2User:
      type: oauth2
      description: Keycloak realm dh-{tenant}; vai trò ánh xạ PERM-05-* (D02-08).
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes: {}
    oauth2Service:
      type: oauth2
      description: Token dịch vụ của PH-04 (`dh-integration` khi tách DU), `dh-runtime` của tenant.
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            adapter:verify: Xác minh tham chiếu
            adapter:runtime-config: Đọc cấu hình kết nối không bí mật và catalog Kamelet
            adapter:health-read: Đọc trạng thái sức khỏe
  parameters:
    ConnectionCodePath:
      name: connectionCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConnectionCode'
    EnvPath:
      name: env
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Environment'
    TypeCodePath:
      name: typeCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TypeCode'
    TestIdPath:
      name: testId
      in: path
      required: true
      schema: &id003
        type: string
        format: uuid
    GrantIdPath:
      name: grantId
      in: path
      required: true
      schema: *id003
    JobIdPath:
      name: jobId
      in: path
      required: true
      schema: *id003
    AccountIdPath:
      name: accountId
      in: path
      required: true
      schema: *id003
    AdapterCodePath:
      name: adapterCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AdapterCode'
    VersionPath:
      name: version
      in: path
      required: true
      schema:
        type: string
        maxLength: 20
        pattern: ^[0-9]+\.[0-9]+(\.[0-9]+)?$
      description: '`major.minor` (bộ điều hợp) hoặc SemVer (Kamelet).'
    OperationCodePath:
      name: operationCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OperationCode'
    ComparisonIdPath:
      name: comparisonId
      in: path
      required: true
      schema: *id003
    ChangeIdPath:
      name: changeId
      in: path
      required: true
      schema: *id003
    KameletNamePath:
      name: kameletName
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/KameletName'
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
      description: Con trỏ mờ từ `page.next`.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: ETag hiện tại; lệch trả ERR-05-007 (412).
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 16
      description: Lưu 24 giờ; cùng khóa khác thân trả ERR-05-039.
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
        maxLength: 55
      description: W3C Trace Context.
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - vi
        - en
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ theo lược đồ; kèm `errors` theo trường (gồm ERR-05-038 thiếu lý do).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/adapter/err-05-003
            title: Dữ liệu không hợp lệ theo lược đồ
            status: 400
            code: ERR-05-003
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unauthorized:
      description: Thiếu token hoặc token hết hạn.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/adapter/err-05-012
            title: Thiếu token hoặc token hết hạn
            status: 401
            code: ERR-05-012
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Forbidden:
      description: Không đủ quyền (gồm ERR-05-011 vi phạm bốn mắt, ERR-05-040 ghi đối tượng COMMON).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/adapter/err-05-012
            title: Không đủ quyền
            status: 403
            code: ERR-05-012
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    NotFound:
      description: Không tìm thấy hoặc thuộc tenant khác (không phân biệt).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/adapter/err-05-001
            title: Không tìm thấy hoặc thuộc tenant khác
            status: 404
            code: ERR-05-001
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Conflict:
      description: Trạng thái không cho phép; mã cụ thể trong `code` (ERR-05-002, 009, 010, 017, 018, 026, 036).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/adapter/err-05-008
            title: Trạng thái không cho phép
            status: 409
            code: ERR-05-008
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    PreconditionFailed:
      description: ETag không khớp; kèm `currentEtag`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/adapter/err-05-007
            title: ETag không khớp
            status: 412
            code: ERR-05-007
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    PayloadTooLarge:
      description: Dữ liệu mẫu vượt 1 MiB hoặc tệp nhập quá lớn (ERR-05-024).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/adapter/err-05-035
            title: Dữ liệu mẫu vượt 1 MiB hoặc tệp nhập quá lớn
            status: 413
            code: ERR-05-035
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unprocessable:
      description: Lỗi nghiệp vụ dạng dữ liệu; mã cụ thể trong `code` (ERR-05-004…006, 013…016, 020…023, 025, 027, 030, 033, 034, 037, 039).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/adapter/err-05-032
            title: Lỗi nghiệp vụ dạng dữ liệu
            status: 422
            code: ERR-05-032
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Locked:
      description: Đang đóng băng thay đổi PROD.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/adapter/err-05-031
            title: Đang đóng băng thay đổi PROD
            status: 423
            code: ERR-05-031
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    TooManyRequests:
      description: Vượt số lần kiểm tra cho phép; kèm `retryAfterSeconds`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/adapter/err-05-019
            title: Vượt số lần kiểm tra cho phép
            status: 429
            code: ERR-05-019
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    ServiceUnavailable:
      description: Phụ thuộc chưa sẵn sàng (gồm ERR-05-028 OpenBao).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/adapter/err-05-029
            title: Phụ thuộc chưa sẵn sàng
            status: 503
            code: ERR-05-029
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    NotModified:
      description: Không đổi (If-None-Match khớp).
  schemas:
    ConnectionCode:
      type: string
      maxLength: 63
      pattern: ^[a-z][a-z0-9-]{2,62}$
      description: Mã kết nối, bất biến, không dùng lại (BR-05-004).
    AdapterCode:
      type: string
      maxLength: 40
      pattern: ^[a-z][a-z0-9-]{2,39}$
    OperationCode:
      type: string
      maxLength: 41
      pattern: ^[a-z][a-z0-9-]{1,40}$
    KameletName:
      type: string
      maxLength: 100
      pattern: ^[a-z][a-z0-9-]{2,90}-(sink|source|action)$
    TypeCode:
      type: string
      maxLength: 32
      pattern: ^[a-z][a-z0-9-]{1,31}$
    SystemCode:
      type: string
      maxLength: 64
      description: Mã HTTT ở PH-01.
    Environment:
      type: string
      enum:
      - TEST
      - STAGING
      - PROD
    ConnectionStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
      - SUSPENDED
      - RETIRED
    EnvStatus:
      type: string
      enum:
      - CONFIGURED
      - PENDING_APPROVAL
      - ENABLED
      - DISABLED
    Purpose:
      type: string
      enum:
      - READ
      - READ_WRITE
    Protocol:
      type: string
      enum:
      - REST
      - SOAP
      - MESSAGING
      - FILE
      - DATABASE
      - MAIL
      - DIRECTORY
      - CDC
    ProtocolGroup:
      type: string
      enum:
      - HTTP
      - SOAP
      - JDBC
      - FILE
      - MESSAGING
      - MAIL
      - DIRECTORY
      - CDC
    AdapterStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
      - SUSPENDED
      - RETIRED
    VersionStatus:
      type: string
      enum:
      - DRAFT
      - SUBMITTED
      - APPROVED
      - SUPERSEDED
    HealthLevel:
      type: string
      enum:
      - HEALTHY
      - DEGRADED
      - UNHEALTHY
      - UNKNOWN
    CdcState:
      type: string
      enum:
      - STOPPED
      - SNAPSHOTTING
      - STREAMING
      - PAUSED
      - PAUSED_SCHEMA
      - FAILED
    KameletScope:
      type: string
      enum:
      - BASE
      - COMMON
      - TENANT
    KameletType:
      type: string
      enum:
      - source
      - sink
      - action
    KameletStatus:
      type: string
      enum:
      - DRAFT
      - SUBMITTED
      - APPROVED
      - DEPRECATED
      - WITHDRAWN
    AccountStatus:
      type: string
      enum:
      - REQUESTED
      - CONSENTED
      - ISSUED
      - REJECTED
      - REVOKED
      - EXPIRED
    AccessMode:
      type: string
      enum:
      - READ
      - WRITE
    Format:
      type: string
      enum:
      - JSON
      - XML
      - SOAP
      - CSV
      - FIXED_WIDTH
      - BINARY
      - NONE
    Reason:
      type: string
      maxLength: 1000
      minLength: 10
      description: Lý do 10…1.000 ký tự (ERR-05-038 khi thiếu).
    AllowedActions:
      type: object
      properties:
        allowedActions:
          type: array
          items:
            type: string
          description: Hành động người gọi được làm ngay bây giờ.
        disabledReasons:
          type: object
          additionalProperties:
            type: string
          description: Hành động có quyền nhưng trạng thái chưa cho phép → lý do tiếng Việt.
      additionalProperties: false
    CursorMeta:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
          maxLength: 2048
        hasMore: *id002
      additionalProperties: false
      required:
      - hasMore
    ProblemDetails:
      type: object
      description: RFC 9457, mở rộng theo D03-04-PH05 §1.
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: ^ERR-05-[0-9]{3}$
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              rule:
                type: string
              message:
                type: string
            additionalProperties: false
        usages:
          type: array
          items:
            $ref: '#/components/schemas/Usage'
          description: Kèm ERR-05-010.
        findings:
          type: array
          items:
            $ref: '#/components/schemas/StaticFinding'
          description: Kèm ERR-05-020…022.
        currentEtag:
          type: string
        retryAfterSeconds:
          type: integer
      additionalProperties: true
    ConnectionType:
      type: object
      properties:
        typeCode:
          $ref: '#/components/schemas/TypeCode'
        title:
          type: string
          maxLength: 255
        group:
          $ref: '#/components/schemas/ProtocolGroup'
        supportLevel:
          type: string
          enum:
          - STABLE
          - PREVIEW
          - DEPRECATED
        secretKeys:
          type: array
          items:
            type: string
            maxLength: 64
          description: Khóa bí mật khai qua API-05-012; không bao giờ trả giá trị.
        kamelets:
          type: array
          items:
            $ref: '#/components/schemas/KameletName'
        probeSteps:
          type: array
          items:
            type: string
            maxLength: 32
        runtimeProfiles:
          type: array
          items:
            type: string
            maxLength: 16
        enabledForTenant: *id002
        blockNew: *id002
        ceilings: &id004
          type: object
          additionalProperties: true
      additionalProperties: false
      required:
      - typeCode
      - title
      - group
      - secretKeys
    ConnectionTypeDetail:
      allOf:
      - $ref: '#/components/schemas/ConnectionType'
      - type: object
        properties:
          paramsSchema: *id004
          example: *id004
        additionalProperties: false
        required:
        - paramsSchema
    ConnectionTypeList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionType'
      additionalProperties: false
      required:
      - items
    EnvSummary:
      type: object
      properties:
        env:
          $ref: '#/components/schemas/Environment'
        status:
          $ref: '#/components/schemas/EnvStatus'
        secretVersion:
          type: integer
        hasPendingChange: *id002
        lastPassedAt:
          type:
          - string
          - 'null'
          format: date-time
        health:
          $ref: '#/components/schemas/HealthLevel'
      additionalProperties: false
      required:
      - env
      - status
    ConnectionSummary:
      allOf:
      - type: object
        properties:
          code:
            $ref: '#/components/schemas/ConnectionCode'
          name:
            type: string
            maxLength: 255
          typeCode:
            $ref: '#/components/schemas/TypeCode'
          systemCode:
            $ref: '#/components/schemas/SystemCode'
          systemName:
            type: string
            maxLength: 255
          purpose:
            $ref: '#/components/schemas/Purpose'
          status:
            $ref: '#/components/schemas/ConnectionStatus'
          owner:
            type: string
            maxLength: 64
          labels:
            type: array
            items:
              type: string
              maxLength: 32
            maxItems: 10
          environments:
            type: array
            items:
              $ref: '#/components/schemas/EnvSummary'
          usageCount:
            type: integer
          secretAgeDays:
            type: integer
          updatedAt: *id001
        additionalProperties: false
        required:
        - code
        - name
        - typeCode
        - systemCode
        - status
      - $ref: '#/components/schemas/AllowedActions'
    ConnectionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionSummary'
        page:
          $ref: '#/components/schemas/CursorMeta'
        facets:
          type: object
          properties:
            status: &id005
              type: object
              additionalProperties:
                type: integer
            typeCode: *id005
            health: *id005
          additionalProperties: false
      additionalProperties: false
      required:
      - items
      - page
    ConnectionDetail:
      allOf:
      - $ref: '#/components/schemas/ConnectionSummary'
      - type: object
        properties:
          description:
            type: string
            maxLength: 2000
          configVersion:
            type: integer
          legacyRef:
            type: string
            maxLength: 255
          createdAt: *id001
          createdBy:
            type: string
            maxLength: 64
          statusReason:
            type: string
            maxLength: 1000
          retiredAt: *id001
          grantsCount:
            type: integer
          flowAccountsCount:
            type: integer
        additionalProperties: false
    ConnectionCreate:
      type: object
      properties:
        connectionCode:
          $ref: '#/components/schemas/ConnectionCode'
        name:
          type: string
          maxLength: 255
          minLength: 3
        typeCode:
          $ref: '#/components/schemas/TypeCode'
        systemCode:
          $ref: '#/components/schemas/SystemCode'
        purpose:
          $ref: '#/components/schemas/Purpose'
        description:
          type: string
          maxLength: 2000
        owner:
          type: string
          maxLength: 64
        labels:
          type: array
          items:
            type: string
            maxLength: 32
          maxItems: 10
      additionalProperties: false
      required:
      - connectionCode
      - name
      - typeCode
      - systemCode
      - purpose
      examples:
      - connectionCode: ndxp-ho-tich
        name: NDXP tra cứu hộ tịch
        typeCode: http-rest
        systemCode: NDXP
        purpose: READ
        description: Kết nối tới Nền tảng chia sẻ, điều phối dữ liệu quốc gia cho nghiệp vụ hộ tịch.
        owner: an.nv
        labels:
