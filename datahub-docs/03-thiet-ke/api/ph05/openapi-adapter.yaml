# D03-04-PH05 · OpenAPI PH-05 (dh-integration, module adapter). SINH TỰ ĐỘNG bởi tools/gen_openapi.py — không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-05 Bộ điều hợp và kết nối API
  version: 1.0.0-draft
  summary: Kết nối nguồn, bí mật một chiều, kiểm tra, sức khỏe, tài khoản CSDL cho luồng, bộ điều hợp, CDC, Kamelet.
  description: 'API của module `adapter` trong `dh-integration` (control plane PH-05). Người dùng gọi qua BFF console (Authorization Code + PKCE);
    `/internal/*` do PH-04 và `dh-runtime` gọi bằng token dịch vụ (client credentials). HTTT thành viên không gọi API này.


    Quy ước (D03-04-PH05 §1): tenant lấy từ token; tạo nhận `Idempotency-Key`; sửa và đổi trạng thái bắt buộc `If-Match`; hậu tố `:{hành-động}`;
    lỗi RFC 9457 mã `ERR-05-nnn`; phân trang con trỏ. Không API nào trả giá trị bí mật. Mọi tên miền, dữ liệu là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-05
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH05
  x-datahub-phase: PH-05
servers:
- url: https://console.{tenantHost}.datahub.example.vn/api/adapter/v1
  description: Qua BFF console của tenant — giả lập
  variables:
    tenantHost:
      default: lamdong
      description: Ví dụ `lamdong` cho T68 (giả lập).
- url: http://dh-integration.dh-control.svc:8080/api/adapter/v1
  description: Trong cụm, cho PH-04 và runtime
- url: http://localhost:8081/api/adapter/v1
  description: Phát triển cục bộ
security:
- oauth2User: []
tags:
- name: Loại kết nối
- name: Kết nối nguồn
- name: Giá trị môi trường và bí mật
- name: Kiểm tra kết nối
- name: Cấp kết nối
- name: Nhập hệ cũ
- name: Nội bộ (PH-04, runtime)
- name: Sức khỏe
- name: Tài khoản CSDL cho luồng
- name: Bộ điều hợp
- name: CDC
- name: Kamelet
- name: Tham số và báo cáo
paths:
  /connection-types:
    get:
      tags:
      - Loại kết nối
      operationId: listConnectionTypes
      summary: Danh sách loại kết nối được hỗ trợ
      x-datahub-id: API-05-001
      x-datahub-fr:
      - FR-05-001
      x-datahub-permission:
        permission: PERM-05-read
      parameters:
      - name: group
        in: query
        schema:
          $ref: '#/components/schemas/ProtocolGroup'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTypeList'
          headers:
            ETag:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /connection-types/{typeCode}:
    get:
      tags:
      - Loại kết nối
      operationId: getConnectionType
      summary: Lược đồ tham số của một loại kết nối
      x-datahub-id: API-05-002
      x-datahub-fr:
      - FR-05-001
      x-datahub-permission:
        permission: PERM-05-read
      description: Trả `paramsSchema` (JSON Schema 2020-12) để giao diện dựng biểu mẫu; trần đã áp theo tenant.
      parameters:
      - $ref: '#/components/parameters/TypeCodePath'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTypeDetail'
          headers:
            ETag:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /connections:
    get:
      tags:
      - Kết nối nguồn
      operationId: listConnections
      summary: Danh sách, tìm kiếm kết nối nguồn
      x-datahub-id: API-05-003
      x-datahub-fr:
      - FR-05-002
      x-datahub-permission:
        permission: PERM-05-read
      description: Kèm `facets`. Kết nối có môi trường UNHEALTHY xếp đầu khi không chỉ định `sort` (BR-05-014).
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
          minLength: 2
        description: Tìm không dấu trên mã, tên, HTTT.
      - name: status
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionStatus'
        style: form
        explode: false
      - name: typeCode
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TypeCode'
        style: form
        explode: false
      - name: systemCode
        in: query
        schema:
          $ref: '#/components/schemas/SystemCode'
      - name: health
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/HealthLevel'
        style: form
        explode: false
      - name: env
        in: query
        schema:
          $ref: '#/components/schemas/Environment'
      - name: label
        in: query
        schema:
          type: string
          maxLength: 32
      - name: secretOverdue
        in: query
        schema: &id002
          type: boolean
      - name: sort
        in: query
        schema:
          type: string
          pattern: ^-?(code|name|updatedAt|health)$
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionPage'
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Kết nối nguồn
      operationId: createConnection
      summary: Tạo kết nối nguồn
      x-datahub-id: API-05-004
      x-datahub-fr:
      - FR-05-004
      x-datahub-permission:
        permission: PERM-05-connection
      description: Mã trùng ERR-05-002; loại tắt ERR-05-004; HTTT không ACTIVE ERR-05-005. Trạng thái DRAFT.
      x-datahub-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreate'
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /connections/{connectionCode}:
    get:
      tags:
      - Kết nối nguồn
      operationId: getConnection
      summary: Chi tiết kết nối
      x-datahub-id: API-05-005
      x-datahub-fr:
      - FR-05-003
      x-datahub-permission:
        permission: PERM-05-read
      parameters:
      - $ref: '#/components/parameters/ConnectionCodePath'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDetail'
          headers:
            ETag:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Kết nối nguồn
      operationId: updateConnection
      summary: Sửa thông tin kết nối
      x-datahub-id: API-05-006
      x-datahub-fr:
      - FR-05-006
      x-datahub-permission:
        permission: PERM-05-connection
      description: Đổi mục đích sang READ khi còn tài khoản ghi hiệu lực trả ERR-05-010.
      parameters:
      - $ref: '#/components/parameters/ConnectionCodePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionUpdate'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /connections/{connectionCode}:suspend:
    post:
      tags:
      - Kết nối nguồn
      operationId: suspendConnection
      summary: Tạm ngừng kết nối
      x-datahub-id: API-05-007
      x-datahub-fr:
      - FR-05-008
      x-datahub-permission:
        permission: PERM-05-operate
      description: Phát EVT-05-04; runtime từ chối lượt gọi mới bằng ERR-05-118.
      parameters:
      - $ref: '#/components/parameters/ConnectionCodePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateChangeRequest'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /connections/{connectionCode}:resume:
    post:
      tags:
      - Kết nối nguồn
      operationId: resumeConnection
      summary: Tiếp tục kết nối
      x-datahub-id: API-05-008
      x-datahub-fr:
      - FR-05-008
      x-datahub-permission:
        permission: PERM-05-operate
      description: Kết nối do SO tạm ngừng chỉ SO tiếp tục (ERR-05-011).
      parameters:
      - $ref: '#/components/parameters/ConnectionCodePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateChangeRequest'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /connections/{connectionCode}:retire:
    post:
      tags:
      - Kết nối nguồn
      operationId: retireConnection
      summary: Ngừng dùng kết nối
      x-datahub-id: API-05-009
      x-datahub-fr:
      - FR-05-008
      x-datahub-permission:
        permission: PERM-05-connection
      description: Còn nơi dùng trả ERR-05-010 kèm `usages`. Thu hồi cấp, tài khoản CSDL; hủy bí mật sau 30 ngày.
      parameters:
      - $ref: '#/components/parameters/ConnectionCodePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateChangeRequest'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /connections/{connectionCode}/environments:
    get:
      tags:
      - Giá trị môi trường và bí mật
      operationId: listEnvironments
      summary: Giá trị kết nối theo môi trường
      x-datahub-id: API-05-010
      x-datahub-fr:
      - FR-05-005
      x-datahub-permission:
        permission: PERM-05-read
      parameters:
      - $ref: '#/components/parameters/ConnectionCodePath'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentList'
          headers:
            ETag:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /connections/{connectionCode}/environments/{env}:
    put:
      tags:
      - Giá trị môi trường và bí mật
      operationId: putEnvironmentParams
      summary: Khai báo tham số không bí mật cho môi trường
      x-datahub-id: API-05-011
      x-datahub-fr:
      - FR-05-005
      x-datahub-permission:
        permission: PERM-05-connection
      description: 'Sai lược đồ ERR-05-003; khóa bí mật ERR-05-006; vượt trần ERR-05-030; đích ngoài egress cho phép ERR-05-027. PROD đang ENABLED:
        lưu bản chờ (BR-05-010).'
      parameters:
      - $ref: '#/components/parameters/ConnectionCodePath'
      - $ref: '#/components/parameters/EnvPath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentParams'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment_'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
  /connections/{connectionCode}/environments/{env}/secret:
    put:
      tags:
      - Giá trị môi trường và bí mật
      operationId: putEnvironmentSecret
      summary: Ghi bí mật một chiều cho môi trường
      x-datahub-id: API-05-012
      x-datahub-fr:
      - FR-05-005
      - FR-05-011
      x-datahub-permission:
        permission: PERM-05-connection
      description: Ghi một chiều vào OpenBao (cas theo phiên bản). Khóa ngoài `secretKeys` ERR-05-003. Trả 204, không trả giá trị; ghi giá trị
        trùng phiên bản hiện tại vẫn tạo phiên bản mới.
      parameters:
      - $ref: '#/components/parameters/ConnectionCodePath'
      - $ref: '#/components/parameters/EnvPath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretPayload'
      responses:
        '204':
          description: Thành công.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /connections/{connectionCode}/environments/{env}:enable:
    post:
      tags:
      - Giá trị môi trường và bí mật
      operationId: enableEnvironment
      summary: Bật giá trị môi trường (PROD tạo đề nghị duyệt)
      x-datahub-id: API-05-013
      x-datahub-fr:
      - FR-05-007
      x-datahub-permission:
        permission: PERM-05-connection
      description: Không có kiểm tra đạt 24 giờ khớp tham số và bí mật ERR-05-009; thiếu bí mật ERR-05-014. PROD chuyển PENDING_APPROVAL và tạo
        việc cho IA.
      parameters:
      - $ref: '#/components/parameters/ConnectionCodePath'
      - $ref: '#/components/parameters/EnvPath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableRequest'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment_'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /connections/{connectionCode}/environments/{env}:disable:
    post:
      tags:
      - Giá trị môi trường và bí mật
      operationId: disableEnvironment
      summary: Tắt giá trị môi trường
      x-datahub-id: API-05-014
      x-datahub-fr:
      - FR-05-007
      x-datahub-permission:
        permission: PERM-05-operate
      parameters:
      - $ref: '#/components/parameters/ConnectionCodePath'
      - $ref: '#/components/parameters/EnvPath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateChangeRequest'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment_'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /connections/{connectionCode}/environments/{env}:approve:
    post:
      tags:
      - Giá trị môi trường và bí mật
      operationId: approveEnvironment
      summary: Duyệt bật giá trị PROD
      x-datahub-id: API-05-015
      x-datahub-fr:
      - FR-05-007
      x-datahub-permission:
        permission: PERM-05-approve
      description: 'Bốn mắt: người duyệt khác người yêu cầu và người ghi bí mật (ERR-05-011, 403). Kiểm tra hết hạn trong lúc chờ trả ERR-05-009.'
      parameters:
      - $ref: '#/components/parameters/ConnectionCodePath'
      - $ref: '#/components/parameters/EnvPath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment_'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /connections/{connectionCode}/environments/{env}:reject:
    post:
      tags:
      - Giá trị môi trường và bí mật
      operationId: rejectEnvironment
      summary: Từ chối bật giá trị PROD
      x-datahub-id: API-05-016
      x-datahub-fr:
