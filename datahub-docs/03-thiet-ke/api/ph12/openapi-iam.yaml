# D03-04-PH12 · OpenAPI PH-12 (dh-platform, module iam). SINH TỰ ĐỘNG bởi tools/gen_openapi.py — không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-12 Định danh và phân quyền API
  version: 1.0.0-draft
  summary: Người dùng, vai trò, client của HTTT, token, realm theo tenant, chính sách OPA, quyết định ủy quyền, nhật ký và cảnh báo.
  description: 'API quản trị của module `iam` trong `dh-platform` (`/api/iam/v1`), API quyết định (`/api/authz/v1`) và các điểm cuối OIDC chuẩn
    của Keycloak (`/realms/dh-{tenant}/protocol/openid-connect/*`, lỗi theo RFC 6749). Người dùng gọi qua BFF console (Authorization Code + PKCE);
    PH-01, PH-15, PH-20, APISIX và DU gọi bằng token dịch vụ với scope `iam:*`.


    Quy ước (D03-04-PH12 §1): tenant lấy từ token; mọi `POST` tạo hoặc có tác dụng phụ nhận `Idempotency-Key`; sửa và đổi trạng thái bắt buộc
    `If-Match`; hậu tố `:{hành-động}`; lỗi RFC 9457 mã `ERR-12-nnn`; phân trang `page`/`size`. Không API nào trả mật khẩu, bí mật client hay khóa
    riêng; bí mật giao qua địa chỉ bọc dùng một lần. Mọi tên miền, dữ liệu là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-12
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH12
  x-datahub-phase: PH-12
servers:
- url: https://console.{tenantHost}.datahub.example.vn/api/iam/v1
  description: Qua BFF console của tenant — giả lập
  variables:
    tenantHost:
      default: lamdong
      description: Ví dụ `lamdong` cho T68 (giả lập).
- url: http://dh-platform.dh-control.svc:8080/api/iam/v1
  description: Trong cụm, cho phân hệ khác và APISIX
- url: http://localhost:8082/api/iam/v1
  description: Phát triển cục bộ
security:
- oauth2User: []
tags:
- name: Người dùng và phiên
- name: Nhập người dùng
- name: Vai trò, quyền và gán vai trò
- name: Tách nhiệm vụ
- name: Nhóm và đơn vị
- name: Quyền có thời hạn
- name: Rà soát quyền
- name: Sáp nhập tenant
- name: Liên kết định danh ngoài
- name: Client của HTTT
- name: Tài khoản dịch vụ nội bộ
- name: Điểm cuối OIDC của Keycloak
- name: Thu hồi truy cập
- name: Realm của tenant
- name: Quyết định ủy quyền
- name: Chính sách và gói
- name: Nhật ký, cảnh báo, báo cáo
- name: Tham số và danh bạ
paths:
  /users:
    get:
      tags:
      - Người dùng và phiên
      operationId: listUsers
      summary: Danh sách, tìm kiếm, lọc người dùng
      x-datahub-id: API-12-001
      x-datahub-fr:
      - FR-12-001
      x-datahub-permission:
        permission: PERM-12-read
        perms:
        - PERM-12-read
        scopes: []
      description: '`facets` kèm số người dùng thuộc nhóm bắt buộc MFA mà chưa có (`mfaRequiredMissing`) và số tài khoản sắp bị vô hiệu vì không
        dùng (`inactivitySoon`); lọc theo MFA bằng tham số `mfa`. Bản chiếu `ph12_iam` của tenant hiện hành; có thể chậm so với Keycloak, kèm
        tiêu đề `X-DH-Projection-Lag` (giây). `BLOCKED`, `LOCKED` xếp đầu khi không có `sort`.'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Q'
      - name: state
        in: query
        schema:
          $ref: '#/components/schemas/UserState'
      - name: orgCode
        in: query
        schema:
          type: string
          maxLength: 64
      - name: roleCode
        in: query
        schema:
          type: string
          maxLength: 64
      - name: mfa
        in: query
        schema:
          type: string
          enum:
          - 'on'
          - 'off'
      - name: authSource
        in: query
        schema:
          $ref: '#/components/schemas/AuthSource'
      - name: inactiveDays
        in: query
        schema:
          type: integer
          minimum: 1
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      x-datahub-errors:
      - ERR-12-003
      - ERR-12-007
      - ERR-12-116
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
          headers:
            X-DH-Projection-Lag:
              schema:
                type: integer
              description: Độ trễ bản chiếu so với Keycloak (giây).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
