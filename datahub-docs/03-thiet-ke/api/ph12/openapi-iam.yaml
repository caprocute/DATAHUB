components:
  securitySchemes:
    oauth2User:
      type: oauth2
      description: Keycloak realm dh-{tenant}; vai trò ánh xạ PERM-12-* (D02-08).
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes: {}
    oauth2Service:
      type: oauth2
      description: Token dịch vụ (`client_credentials` + mTLS hoặc `private_key_jwt`).
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            iam:client-provision: PH-01 tạo, sửa scope, thu hồi client
            iam:dev-client: PH-15 cấp client sandbox
            iam:realm-provision: PH-20 tạo realm, tạm ngừng, chuyển định danh
            iam:revocation-read: APISIX, DU đọc danh sách chặn
            iam:directory-read: Tra danh bạ người dùng
            iam:decide: Quyết định ủy quyền qua API
            iam:policy-data-read: OPA kéo dữ liệu vai trò–quyền
    mtlsClient:
      type: mutualTLS
      description: Xác thực client bằng chứng thư (RFC 8705).
    privateKeyJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '`client_assertion` ký bằng khóa riêng của client (RFC 7523).'
  parameters:
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
        maxLength: 55
        pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      description: W3C Trace Context.
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - vi
