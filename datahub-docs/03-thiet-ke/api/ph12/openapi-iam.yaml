      - ERR-12-003
      - ERR-12-004
      - ERR-12-005
      - ERR-12-007
      - ERR-12-010
      - ERR-12-037
      - ERR-12-038
      - ERR-12-040
      - ERR-12-043
      - ERR-12-045
      - ERR-12-116
      - ERR-12-120
      responses:
        '201':
