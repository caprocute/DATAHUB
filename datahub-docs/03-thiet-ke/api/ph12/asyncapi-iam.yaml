# D03-04-PH12 · AsyncAPI PH-12. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py — không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: 3.0.0
info:
  title: Datahub PH-12 Định danh và phân quyền — sự kiện
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-12-01…16 (D03-04-PH12 §4, FRS §9.3).


    EVT-12-01…15 ghi vào `ph12_iam.outbox` cùng giao dịch với thay đổi trạng thái (ADR-042), Debezium outbox router đưa lên Kafka, CloudEvents
    1.0 chế độ nhị phân. EVT-12-16 do Keycloak phát trực tiếp (không có giao dịch control plane). Tenant `PLATFORM` dùng tiền tố `platform`. Không
    sự kiện nào mang mật khẩu, bí mật client, khóa riêng hay mã bọc (ràng buộc `ck_outbox_no_secret`, kiểm thử canary). Người nhận xử lý lũy đẳng
    theo `ce_id`, bỏ qua sự kiện có `version` thấp hơn. Nhật ký quyết định ủy quyền không đi qua các topic này mà theo đường log (FR-12-057).
    Tương thích: BACKWARD ở Apicurio, chỉ thêm trường tùy chọn trong `v1`. Dữ liệu ví dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  license:
    name: Tài liệu nội bộ dự án Datahub
defaultContentType: application/json
