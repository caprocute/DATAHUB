components:
  parameters:
    tenant:
      description: Mã tenant chữ thường (`t68`) hoặc `platform`.
      examples:
      - t68
  securitySchemes:
    mtls:
      type: X509
      description: Chứng thư do cert-manager cấp; ACL Kafka theo CN.
  messages:
    userCreated:
      name: userCreated
      title: EVT-12-01
      summary: Tài khoản được tạo hoặc nhập (FR-12-003, 009, 026).
      payload:
        $ref: '#/components/schemas/UserCreated'
      headers: &id001
        type: object
        properties:
          ce_specversion:
            type: string
            const: '1.0'
          ce_id:
            type: string
            format: uuid
          ce_source:
            type: string
            description: '`/tenants/{tenant}/iam`'
          ce_type:
            type: string
            description: '`vn.datahub.iam.{đối tượng}.{sự kiện}.v1`'
          ce_time: &id002
            type: string
            format: date-time
          ce_subject:
            type: string
            description: Mã đối tượng chính.
          ce_datacontenttype:
            type: string
            const: application/json
          dhtenant:
            type: string
            description: Phải khớp tiền tố topic; không khớp chuyển DLQ (D03-10 §3).
          traceparent:
            type: string
        required:
        - ce_specversion
        - ce_id
        - ce_source
        - ce_type
        - ce_time
        - dhtenant
      bindings:
        kafka:
          key:
            type: string
            description: '`userId`'
    userStateChanged:
      name: userStateChanged
      title: EVT-12-02
      summary: Tài khoản đổi trạng thái hoặc đơn vị (FR-12-004, 005, 006, 008).
      payload:
        $ref: '#/components/schemas/UserStateChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`userId`'
    userRoleChanged:
      name: userRoleChanged
      title: EVT-12-03
      summary: Gán, gỡ vai trò, đổi phạm vi hoặc hạn (FR-12-012, 013).
      payload:
        $ref: '#/components/schemas/UserRoleChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`userId`'
    userCredentialChanged:
      name: userCredentialChanged
      title: EVT-12-04
      summary: Đổi mật khẩu, đăng ký hoặc đặt lại yếu tố thứ hai, liên kết VNeID. Không có giá trị bí mật.
      payload:
        $ref: '#/components/schemas/UserCredentialChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`userId`'
    accessRevoked:
      name: accessRevoked
      title: EVT-12-05
      summary: Thu hồi truy cập tức thời (FR-12-040); DU nhận ngay, APISIX kéo qua API-12-079.
      payload:
        $ref: '#/components/schemas/AccessRevoked'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`tenantCode`'
    clientProvisioned:
      name: clientProvisioned
      title: EVT-12-06
      summary: Client được cấp (FR-12-030, 032).
      payload:
        $ref: '#/components/schemas/ClientProvisioned'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`clientId`'
    clientStateChanged:
      name: clientStateChanged
      title: EVT-12-07
      summary: Client tạm ngừng, tiếp tục, thu hồi (FR-12-008, 031).
      payload:
        $ref: '#/components/schemas/ClientStateChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`clientId`'
    clientCredentialChanged:
      name: clientCredentialChanged
      title: EVT-12-08
      summary: Chứng thư, khóa, bí mật, scope của client hoặc tài khoản dịch vụ đổi (FR-12-033, 034, 036, 037).
      payload:
        $ref: '#/components/schemas/ClientCredentialChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`clientId` hoặc `accountCode`'
    policyPublished:
      name: policyPublished
      title: EVT-12-09
      summary: Phiên bản chính sách hoặc gói dữ liệu mới có hiệu lực (FR-12-051, 054).
      payload:
        $ref: '#/components/schemas/PolicyPublished'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`policyCode`'
    policyRevoked:
      name: policyRevoked
      title: EVT-12-10
      summary: Chính sách bị thu hồi hoặc gói bị quay lui (FR-12-055).
      payload:
        $ref: '#/components/schemas/PolicyRevoked'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`policyCode`'
    grantStateChanged:
      name: grantStateChanged
      title: EVT-12-11
      summary: Quyền có thời hạn đổi trạng thái (FR-12-017). Phát ở tenant bị truy cập.
      payload:
        $ref: '#/components/schemas/GrantStateChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`grantId`'
    sodExceptionChanged:
      name: sodExceptionChanged
      title: EVT-12-12
      summary: Ngoại lệ tách nhiệm vụ đổi trạng thái (FR-12-013).
      payload:
        $ref: '#/components/schemas/SodExceptionChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`exceptionId`'
    realmChanged:
      name: realmChanged
      title: EVT-12-13
      summary: Realm đổi trạng thái, xoay khóa ký, lệch cấu hình, đổi tham số bảo mật (FR-12-039, 041, 042, 043).
      payload:
        $ref: '#/components/schemas/RealmChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`tenantCode`'
    alertRaised:
      name: alertRaised
      title: EVT-12-14
      summary: Cảnh báo an ninh mới (FR-12-059).
      payload:
        $ref: '#/components/schemas/AlertRaised'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`alertId`'
    recertCompleted:
      name: recertCompleted
      title: EVT-12-15
      summary: Chiến dịch rà soát quyền đóng (FR-12-018).
      payload:
        $ref: '#/components/schemas/RecertCompleted'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`tenantCode`'
    authEventRecorded:
      name: authEventRecorded
      title: EVT-12-16
      summary: Sự kiện xác thực (đăng nhập, lỗi, đăng xuất, cấp token, làm mới) do Keycloak phát trực tiếp, không qua outbox (FR-12-056).
      payload:
        $ref: '#/components/schemas/AuthEventRecorded'
      headers:
        type: object
        properties:
          traceparent:
            type: string
          ce_id:
            type: string
            format: uuid
          dhtenant:
            type: string
        required:
        - dhtenant
      bindings:
        kafka:
          key:
            type: string
            description: '`userId` hoặc `clientId`'
  schemas:
    Actor:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - USER
          - SERVICE
          - SYSTEM
      required:
      - id
      - type
    UserCreated:
      type: object
      properties:
        tenantId: &id003
          type: string
          pattern: ^(T[0-9]{2}|PLATFORM)$
        userId: &id004
          type: string
          format: uuid
        username:
          type: string
        orgCode:
          type: string
        authSource:
          type: string
          enum:
          - LOCAL
          - LDAP
          - VNEID
        state: &id005
          type: string
          enum:
          - PENDING_ACTIVATION
          - ACTIVE
          - LOCKED
          - BLOCKED
          - DISABLED
        origin:
          type: string
          enum:
          - CONSOLE
          - IMPORT
          - LDAP_SYNC
          - SAGA
        actor:
          $ref: '#/components/schemas/Actor'
        version: &id006
          type: integer
          description: Số phiên bản đối tượng; người nhận bỏ qua sự kiện có số thấp hơn trạng thái đang giữ.
        occurredAt: *id002
      required:
      - tenantId
      - userId
      - username
      - orgCode
      - state
      - version
    UserStateChanged:
      type: object
      properties:
        tenantId: *id003
        userId: *id004
        from: *id005
        to: *id005
        orgCode:
          type: string
        previousOrgCode:
          type:
          - string
          - 'null'
        reason:
          type: string
          maxLength: 500
        actor:
          $ref: '#/components/schemas/Actor'
        version: *id006
        occurredAt: *id002
      required:
      - tenantId
      - userId
      - to
      - version
    UserRoleChanged:
      type: object
      properties:
        tenantId: *id003
        userId: *id004
        change:
          type: string
          enum:
          - ASSIGNED
          - REMOVED
          - SCOPE_CHANGED
          - EXPIRED
        assignmentId: *id004
        roleCode:
          type: string
        scopeType:
          type: string
          enum:
          - TENANT
          - ORG
          - WORKSPACE
        scopeRef:
          type:
          - string
          - 'null'
        validTo: &id009
          type:
          - string
          - 'null'
          format: date-time
        sodExceptionId:
          type:
          - string
          - 'null'
          format: uuid
        actor:
          $ref: '#/components/schemas/Actor'
        version: *id006
        occurredAt: *id002
      required:
      - tenantId
      - userId
      - change
      - roleCode
      - scopeType
      - version
    UserCredentialChanged:
      type: object
      properties:
        tenantId: *id003
        userId: *id004
        kind:
          type: string
          enum:
          - PASSWORD
          - TOTP
          - WEBAUTHN
          - VNEID
        change:
          type: string
          enum:
          - SET
          - REGISTERED
          - REMOVED
          - RESET
          - LINKED
          - UNLINKED
        actor:
          $ref: '#/components/schemas/Actor'
        version: *id006
        occurredAt: *id002
      required:
      - tenantId
      - userId
      - kind
      - change
      - version
    AccessRevoked:
      type: object
      properties:
        tenantId: *id003
        revocationId: *id004
        kind:
          type: string
          enum:
          - SUB
          - CLIENT
          - JTI
          - SESSION
        subject:
          type: string
        notBefore: *id002
        expiresAt: *id002
        blockAll:
          type: boolean
          description: '`true` tới khi Keycloak xác nhận đã vô hiệu (SEC-25).'
        reason:
          type: string
          maxLength: 500
        actor:
          $ref: '#/components/schemas/Actor'
        feedVersion: &id007
          type: integer
      required:
      - tenantId
      - revocationId
      - kind
      - subject
      - notBefore
      - expiresAt
    ClientProvisioned:
      type: object
      properties:
        tenantId: *id003
        clientId:
          type: string
        systemCode:
          type: string
        orgCode:
          type: string
        authMethod:
          type: string
          enum:
          - TLS_CLIENT_AUTH
          - PRIVATE_KEY_JWT
          - CLIENT_SECRET
        contractLevel:
          type: string
          enum:
          - PUBLIC
          - INTERNAL
          - RESTRICTED
          - SENSITIVE
        scopeCount: *id007
        certThumbprint:
          type: string
        actor:
          $ref: '#/components/schemas/Actor'
        version: *id006
        occurredAt: *id002
      required:
      - tenantId
      - clientId
      - systemCode
      - authMethod
      - contractLevel
      - version
    ClientStateChanged:
      type: object
      properties:
        tenantId: *id003
        clientId:
          type: string
        from: &id008
          type: string
          enum:
          - ENABLED
          - SUSPENDED
          - REVOKED
        to: *id008
        reason:
          type: string
          maxLength: 500
        automatic:
          type: boolean
        actor:
          $ref: '#/components/schemas/Actor'
        version: *id006
        occurredAt: *id002
      required:
      - tenantId
      - clientId
      - to
      - version
    ClientCredentialChanged:
      type: object
      properties:
        tenantId: *id003
        ownerKind:
          type: string
          enum:
          - CLIENT
          - SERVICE_ACCOUNT
        ownerId:
          type: string
        change:
          type: string
          enum:
          - CERTIFICATE
          - JWKS
          - SECRET
          - SCOPES
        thumbprint:
          type: string
          description: Dấu vân tay chứng thư hoặc `kid`; không có giá trị bí mật.
        scopesRevision: *id007
        overlapUntil: *id009
        actor:
          $ref: '#/components/schemas/Actor'
        version: *id006
        occurredAt: *id002
