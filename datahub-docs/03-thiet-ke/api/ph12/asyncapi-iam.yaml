        versionNo: *id007
        scope:
          type: string
          enum:
          - PLATFORM
          - TENANT
        contentHash:
          type: string
        bundleRevision:
          type: string
        dataRevision:
          type: string
        approvedBy:
          type: string
        submittedBy:
          type: string
        actor:
          $ref: '#/components/schemas/Actor'
        occurredAt: *id002
      required:
      - tenantId
      - bundleRevision
    PolicyRevoked:
      type: object
      properties:
        tenantId: *id003
        policyCode:
          type: string
        versionNo: *id007
        kind:
          type: string
          enum:
          - REVOKED
          - ROLLED_BACK
        bundleRevision:
          type: string
        previousBundleRevision:
          type: string
        reason:
          type: string
          maxLength: 1000
