          - PRIVILEGE
        requesterId: *id004
        homeTenant: *id003
        targetTenant: *id003
        roleCode:
          type: string
        from: &id010
          type: string
          enum:
          - REQUESTED
          - ACTIVE
          - REJECTED
          - EXPIRED
          - REVOKED
        to: *id010
        ticketRef:
          type: string
        expiresAt: *id009
        actor:
          $ref: '#/components/schemas/Actor'
        version: *id006
        occurredAt: *id002
      required:
      - tenantId
      - grantId
      - type
      - targetTenant
      - to
      - version
    SodExceptionChanged:
      type: object
      properties:
        tenantId: *id003
        exceptionId: *id004
        userId: *id004
        roleA:
          type: string
        roleB:
          type: string
        from: &id011
          type: string
          enum:
          - REQUESTED
          - ACTIVE
          - REJECTED
          - EXPIRED
          - REVOKED
        to: *id011
        expiresAt: *id002
        actor:
          $ref: '#/components/schemas/Actor'
        version: *id006
        occurredAt: *id002
      required:
      - tenantId
      - exceptionId
      - userId
      - to
      - version
    RealmChanged:
      type: object
      properties:
        tenantId: *id003
        tenantCode: *id003
        change:
          type: string
          enum:
          - STATE
          - KEY_ROTATED
          - DRIFT
          - SECURITY_PARAMS
        from: &id012
          type: string
          enum:
          - PROVISIONING
          - ACTIVE
          - SUSPENDED
          - READ_ONLY
          - DELETED
        to: *id012
        signingKeyId:
          type: string
        driftStatus:
          type: string
          enum:
          - IN_SYNC
          - DRIFTED
          - HELD
        changedParams:
          type: array
          items:
            type: string
