          - FAILURE
        errorCode:
          type:
          - string
          - 'null'
          pattern: ^ERR-12-[0-9]{3}$
        ip:
          type: string
        acr:
          type: integer
          enum:
          - 1
          - 2
          - 3
        time: *id002
      required:
      - tenantId
      - eventId
      - type
      - result
      - time
