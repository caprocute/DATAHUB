        campaignId: *id004
        scopeType:
          type: string
        scopeRef:
          type:
          - string
          - 'null'
        total: *id007
        kept: *id007
        removed: *id007
        escalated: *id007
        closedAt: *id002
        actor:
          $ref: '#/components/schemas/Actor'
