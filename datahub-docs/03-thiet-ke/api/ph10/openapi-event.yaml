  securitySchemes:
    oauth2User:
      type: oauth2
      description: Keycloak realm `dh-{tenant}`, Authorization Code + PKCE qua BFF; vai trò ánh xạ PERM-10-* (D02-08, FRS §3.2).
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes: {}
    oauth2Service:
      type: oauth2
      description: Tài khoản dịch vụ (`client_credentials` + `private_key_jwt`, mTLS mesh). Scope không cấp cho người.
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            event:topic-register: PH-05, DU nội bộ đăng ký topic CDC, SYSTEM và phiên bản lược đồ
            event:permission-check: PH-04 kiểm tra quyền phát, nhận và tra cứu topic
            event:runtime-config: dh-runtime đọc cấu hình, báo giao nhận, ngắt mạch, cầu nối
            event:dlq-read: PH-18 đọc siêu dữ liệu DLQ
            event:replay: PH-18 đề nghị phát lại; dh-runtime chạy phát lại
            event:metrics-read: PH-13 đọc lag, dashboard
    oauth2System:
      type: oauth2
      description: Token HTTT (`client_credentials`), scope `topic:{topicName}:publish`, `topic:{topicName}:subscribe` cấp khi publication, subscription
        được duyệt.
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            topic:{topicName}:publish: Phát lên topic
            topic:{topicName}:subscribe: Nhận từ topic
    mtlsSystem:
      type: mutualTLS
      description: Chứng thư khách do CA nội bộ cấp qua PH-12; principal `CN={systemCode}.{tenant}`.
  parameters:
    ProjectCodePath:
      name: projectCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ProjectCode'
    TopicNamePath:
      name: topicName
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TopicName'
    VersionNoPath:
      name: versionNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PublisherCodePath:
      name: publisherCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublisherCode'
    SubscriberCodePath:
      name: subscriberCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SubscriberCode'
    PublicationCodePath:
      name: publicationCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicationCode'
    SubscriptionCodePath:
      name: subscriptionCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SubscriptionCode'
    RequestCodePath:
      name: requestCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RequestCode'
    DlqEntryIdPath:
      name: dlqEntryId
      in: path
      required: true
      schema: &id004
        type: string
        format: uuid
    ReplayCodePath:
      name: replayCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ReplayCode'
    CommTypeCodePath:
      name: commTypeCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CommTypeCode'
    RoutingModeCodePath:
      name: routingModeCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RoutingModeCode'
    FlowCodePath:
      name: flowCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FlowCode'
    JobCodePath:
      name: jobCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/JobCode'
    MappingIdPath:
      name: mappingId
      in: path
      required: true
      schema: *id004
    BridgeCodePath:
      name: bridgeCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BridgeCode'
    RegistryPath:
      name: registryPath
      in: path
      required: true
      schema:
        type: string
        maxLength: 1024
      description: Phần đường sau `/registry/`, có thể chứa `/` (APISIX chuyển nguyên), ví dụ `apis/registry/v3/groups/t68/artifacts/{topicName}/versions/3/content`
        hoặc `apis/ccompat/v7/schemas/ids/1042`.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Số trang từ 0.
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
      description: Vượt 200 trả ERR-10-049.
    Sort:
      name: sort
      in: query
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-zA-Z]+(,(asc|desc))?$
      description: '`truong,asc|desc`, ví dụ `updatedAt,desc`.'
    Q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 100
        minLength: 1
      description: Tìm không dấu trên mã, tên, mô tả.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
      description: ETag hiện tại (`W/"{version}"`); lệch trả ERR-10-007 (412).
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
        maxLength: 64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 16
      description: Lưu 24 giờ ở Valkey `dh:{tenant}:evt:idem:{chủ thể}:{khóa}`; cùng khóa khác thân trả ERR-10-037; cùng khóa cùng thân trả lại
        phản hồi cũ.
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 128
        minLength: 1
      description: Tùy chọn; mặc định dùng `id` của CloudEvents (chống trùng 24 giờ theo bên phát).
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
        maxLength: 55
      description: W3C Trace Context.
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - vi
        - en
