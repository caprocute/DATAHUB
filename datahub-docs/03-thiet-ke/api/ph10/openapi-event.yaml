# D03-04-PH10 · OpenAPI PH-10 (dh-integration module event; cổng sự kiện dh-runtime). SINH TỰ ĐỘNG bởi tools/gen_openapi.py, không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-10 Sự kiện API
  version: 1.0.0-draft
  summary: Dự án, topic, lược đồ, bên phát, bên nhận, publication, subscription, DLQ, phát lại, di trú Pulsar; cổng phát, kéo sự kiện.
  description: 'Control plane: module `event` của `dh-integration`, gốc `/api/event/v1` (người dùng qua BFF; PH-04, PH-05, PH-13, PH-18 và `dh-runtime`
    bằng token máy). Data plane: cổng sự kiện của `dh-runtime`, gốc `/event/v1` qua `apisix-ext`, `apisix-int` cho HTTT (scope `topic:{topicName}:publish|subscribe`).
    Giao ĐẨY webhook ký HMAC mô tả ở `asyncapi-event.yaml`.


    Quy ước (D03-04-PH10 §1): tenant lấy từ token; tạo nhận `Idempotency-Key`; sửa và hành động bắt buộc `If-Match`; hậu tố `:{hành-động}`; lỗi
    RFC 9457 mã `ERR-10-nnn`; phân trang `page`, `size`. Mọi tên miền, dữ liệu là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-10
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH10
  x-datahub-phase: PH-10
servers:
- url: https://console.{tenantHost}.datahub.example.vn/api/event/v1
  description: Qua BFF console của tenant (giả lập)
  variables:
    tenantHost:
      default: t68
      description: Ví dụ `t68` (giả lập).
- url: http://dh-integration.dh-control.svc:8080/api/event/v1
  description: Trong cụm, cho PH-04, PH-05, PH-13, PH-18
- url: http://localhost:8081/api/event/v1
  description: Phát triển cục bộ
security:
- oauth2User: []
tags:
- name: Dự án tích hợp
  description: Nhóm Dự án tích hợp; bảng mã ở D03-04-PH10 §3.
- name: Topic
  description: Nhóm Topic; bảng mã ở D03-04-PH10 §3.
- name: Lược đồ sự kiện
  description: Nhóm Lược đồ sự kiện; bảng mã ở D03-04-PH10 §3.
- name: Bên phát, bên nhận
  description: Nhóm Bên phát, bên nhận; bảng mã ở D03-04-PH10 §3.
- name: Publication
  description: Nhóm Publication; bảng mã ở D03-04-PH10 §3.
- name: Subscription và giao nhận
  description: Nhóm Subscription và giao nhận; bảng mã ở D03-04-PH10 §3.
- name: Yêu cầu duyệt
  description: Nhóm Yêu cầu duyệt; bảng mã ở D03-04-PH10 §3.
- name: DLQ và phát lại
  description: Nhóm DLQ và phát lại; bảng mã ở D03-04-PH10 §3.
- name: Giám sát, dashboard, sơ đồ
  description: Nhóm Giám sát, dashboard, sơ đồ; bảng mã ở D03-04-PH10 §3.
- name: Danh mục, hạn mức, tham số
  description: Nhóm Danh mục, hạn mức, tham số; bảng mã ở D03-04-PH10 §3.
- name: Máy với máy (PH-04)
  description: Nhóm Máy với máy (PH-04); bảng mã ở D03-04-PH10 §3.
- name: Nội bộ dh-runtime
  description: Nhóm Nội bộ dh-runtime; bảng mã ở D03-04-PH10 §3.
- name: Xuất nhập, di trú Pulsar
  description: Nhóm Xuất nhập, di trú Pulsar; bảng mã ở D03-04-PH10 §3.
- name: 'Data plane: phát, kéo, lược đồ'
  description: 'Nhóm Data plane: phát, kéo, lược đồ; bảng mã ở D03-04-PH10 §3.'
paths:
  /projects:
    get:
      tags:
      - Dự án tích hợp
      operationId: listProjects
      summary: Danh sách, tìm kiếm, lọc dự án
      x-datahub-id: API-10-001
      x-datahub-fr:
      - FR-10-001
      x-datahub-permission:
        permission: PERM-10-read
      security:
      - oauth2User: []
      description: OR chỉ thấy dự án có HTTT của tổ chức mình. Mặc định `status=ACTIVE`; `sort` theo `projectCode`, `name`, `updatedAt`, `topicCount`.
      parameters:
      - $ref: '#/components/parameters/Q'
      - name: status
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ProjectStatus'
        style: form
        explode: false
      - name: ownerOrgCode
        in: query
        schema:
          $ref: '#/components/schemas/OrgCode'
      - name: label
        in: query
        schema:
          type: string
          maxLength: 63
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      x-datahub-errors:
      - ERR-10-053
      - ERR-10-054
      - ERR-10-049
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
              examples:
                vi-du:
                  $ref: '#/components/examples/ProjectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Dự án tích hợp
      operationId: createProject
      summary: Tạo dự án tích hợp
      x-datahub-id: API-10-002
      x-datahub-fr:
      - FR-10-003
      x-datahub-permission:
        permission: PERM-10-create
      security:
      - oauth2User: []
      description: Từ dành riêng của route ERR-10-003; mã trùng kể cả dự án đã lưu trữ ERR-10-002; vượt `maxProjects` ERR-10-011.
      x-datahub-idempotent: required
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      x-datahub-errors:
      - ERR-10-053
      - ERR-10-054
      - ERR-10-003
      - ERR-10-037
      - ERR-10-039
      - ERR-10-002
      - ERR-10-011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
            examples:
              vi-du:
                $ref: '#/components/examples/ProjectCreate'
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                vi-du:
                  $ref: '#/components/examples/Project'
          headers:
            ETag:
              schema:
                type: string
              description: '`W/"{version}"`.'
            Location:
              schema:
                type: string
              description: Đường dẫn tài nguyên mới hoặc tác vụ.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
  /projects/{projectCode}:
    get:
      tags:
      - Dự án tích hợp
      operationId: getProject
      summary: Chi tiết dự án
      x-datahub-id: API-10-003
      x-datahub-fr:
      - FR-10-002
      x-datahub-permission:
        permission: PERM-10-read
      security:
      - oauth2User: []
      parameters:
      - $ref: '#/components/parameters/ProjectCodePath'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      x-datahub-errors:
      - ERR-10-053
      - ERR-10-054
      - ERR-10-001
      - ERR-10-044
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                vi-du:
                  $ref: '#/components/examples/Project'
          headers:
            ETag:
              schema:
                type: string
              description: '`W/"{version}"`.'
        '401':
