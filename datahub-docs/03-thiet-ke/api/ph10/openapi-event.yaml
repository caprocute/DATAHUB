      summary: Sửa dự án
      x-datahub-id: API-10-004
      x-datahub-fr:
      - FR-10-004
      x-datahub-permission:
        permission: PERM-10-update
      security:
      - oauth2User: []
      description: Dự án `ARCHIVED` không sửa được (ERR-10-006).
      parameters:
      - $ref: '#/components/parameters/ProjectCodePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      x-datahub-errors:
      - ERR-10-053
      - ERR-10-054
      - ERR-10-001
      - ERR-10-003
      - ERR-10-007
      - ERR-10-039
      - ERR-10-006
      - ERR-10-044
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
            examples:
              vi-du:
                $ref: '#/components/examples/ProjectUpdate'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                vi-du:
                  $ref: '#/components/examples/Project'
          headers:
            ETag:
              schema:
                type: string
              description: '`W/"{version}"`.'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '423':
          $ref: '#/components/responses/Locked'
  /projects/{projectCode}:archive:
    post:
      tags:
      - Dự án tích hợp
      operationId: archiveProject
      summary: Lưu trữ dự án
      x-datahub-id: API-10-005
      x-datahub-fr:
      - FR-10-005
      x-datahub-permission:
        permission: PERM-10-update
      security:
      - oauth2User: []
      description: Còn topic `PENDING_APPROVAL`, `PROVISIONING`, `ACTIVE`, `DEPRECATED` trả ERR-10-010 kèm `dependents`. Topic `DRAFT` còn lại
        bị xóa mềm.
      parameters:
      - $ref: '#/components/parameters/ProjectCodePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      x-datahub-errors:
      - ERR-10-053
      - ERR-10-054
      - ERR-10-001
      - ERR-10-003
      - ERR-10-007
      - ERR-10-039
      - ERR-10-006
      - ERR-10-009
      - ERR-10-010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateChangeRequest'
            examples:
              vi-du:
                $ref: '#/components/examples/StateChangeRequest'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                vi-du:
                  $ref: '#/components/examples/Project'
          headers:
            ETag:
              schema:
                type: string
              description: '`W/"{version}"`.'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '423':
          $ref: '#/components/responses/Locked'
  /projects/{projectCode}:restore:
    post:
      tags:
      - Dự án tích hợp
      operationId: restoreProject
      summary: Khôi phục dự án đã lưu trữ
      x-datahub-id: API-10-006
      x-datahub-fr:
      - FR-10-005
      x-datahub-permission:
        permission: PERM-10-update
      security:
      - oauth2User: []
      parameters:
      - $ref: '#/components/parameters/ProjectCodePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      x-datahub-errors:
      - ERR-10-053
      - ERR-10-054
      - ERR-10-001
      - ERR-10-003
      - ERR-10-007
      - ERR-10-039
      - ERR-10-006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateChangeRequest'
            examples:
              vi-du:
                $ref: '#/components/examples/StateChangeRequest'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                vi-du:
                  $ref: '#/components/examples/Project'
          headers:
            ETag:
              schema:
                type: string
              description: '`W/"{version}"`.'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '423':
          $ref: '#/components/responses/Locked'
  /graph:
    get:
      tags:
      - Giám sát, dashboard, sơ đồ
      operationId: getGraph
      summary: Sơ đồ kết nối bên phát, topic, bên nhận
      x-datahub-id: API-10-007
      x-datahub-fr:
      - FR-10-058
      x-datahub-permission:
        permission: PERM-10-read
      security:
      - oauth2User: []
      description: Dựng ba lớp bên phát, topic, bên nhận; vượt `10.graph.max-nodes` trả ERR-10-049, đề nghị lọc theo dự án. Bố cục làm ở trình
        duyệt.
      parameters:
      - name: projectCode
        in: query
        schema:
          $ref: '#/components/schemas/ProjectCode'
      - name: topicName
        in: query
        schema:
          $ref: '#/components/schemas/TopicName'
      - name: systemCode
        in: query
        schema:
          $ref: '#/components/schemas/SystemCode'
        description: Lân cận một bước quanh một HTTT.
      - name: includeRetired
        in: query
        schema: &id001
          type: boolean
      - name: overlay
        in: query
        schema:
          $ref: '#/components/schemas/GraphOverlay'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      x-datahub-errors:
      - ERR-10-053
      - ERR-10-054
      - ERR-10-049
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
              examples:
                vi-du:
                  $ref: '#/components/examples/Graph'
          headers:
            ETag:
              schema:
                type: string
              description: '`W/"{version}"`.'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /topics:
    get:
      tags:
      - Topic
      operationId: listTopics
      summary: Danh sách topic; tra cứu topic dùng được cho luồng
      x-datahub-id: API-10-008
      x-datahub-fr:
      - FR-10-006
      - FR-10-069
      x-datahub-permission:
        anyOf:
        - PERM-10-read
        - scope:event:permission-check
      security:
      - oauth2User: []
      - oauth2Service:
        - event:permission-check
      description: Mặc định ẩn topic `DLQ`. `usableBy=flow:{flowCode}` kèm `action` trả topic luồng dùng được (bảng chọn của trình thiết kế PH-04,
        scope `event:permission-check` hoặc `PERM-10-read`).
      parameters:
      - $ref: '#/components/parameters/Q'
      - name: projectCode
        in: query
        schema:
          $ref: '#/components/schemas/ProjectCode'
      - name: status
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TopicStatus'
        style: form
        explode: false
      - name: topicKind
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TopicKind'
        style: form
        explode: false
      - name: dataClass
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/DataClass'
        style: form
        explode: false
      - name: domain
        in: query
        schema:
          type: string
          maxLength: 63
      - name: usableBy
        in: query
        schema:
          type: string
          maxLength: 70
          pattern: ^flow:[a-z][a-z0-9-]{2,62}$
      - name: action
        in: query
        schema:
          $ref: '#/components/schemas/PermissionAction'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      x-datahub-errors:
      - ERR-10-053
      - ERR-10-054
      - ERR-10-049
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicPage'
              examples:
                vi-du:
                  $ref: '#/components/examples/TopicPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Topic
      operationId: createTopic
      summary: Tạo topic (người) hoặc đăng ký topic CDC, SYSTEM (máy)
      x-datahub-id: API-10-009
      x-datahub-fr:
      - FR-10-008
      - FR-10-066
      - FR-10-067
      x-datahub-permission:
        anyOf:
        - PERM-10-create
        - scope:event:topic-register
      security:
      - oauth2User: []
      - oauth2Service:
        - event:topic-register
      description: 'Người dùng: topic `DRAFT` (hoặc `PENDING_APPROVAL` khi `submit`), 201. Tài khoản dịch vụ `event:topic-register` với `topicKind`
        `CDC`, `SYSTEM`: idempotent theo `topicName` (đã có cùng cấu hình trả 200, khác cấu hình ERR-10-002), tự duyệt theo BR-10-031 và trả 202
        với `PROVISIONING` hoặc `PENDING_APPROVAL` trong ≤ 2 giây. Miền dành riêng với người dùng ERR-10-004; tiền tố khác tenant ERR-10-005.'
      x-datahub-idempotent: required
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      x-datahub-errors:
      - ERR-10-053
      - ERR-10-054
      - ERR-10-003
      - ERR-10-037
      - ERR-10-039
      - ERR-10-002
      - ERR-10-004
      - ERR-10-005
      - ERR-10-006
      - ERR-10-011
      - ERR-10-012
      - ERR-10-015
      - ERR-10-017
      - ERR-10-018
      - ERR-10-020
      - ERR-10-029
      - ERR-10-046
      - ERR-10-048
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicCreate'
            examples:
              vi-du:
                $ref: '#/components/examples/TopicCreate'
      responses:
        '200':
          description: Máy đăng ký lại topic đã có cùng cấu hình (idempotent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
              examples:
                vi-du:
                  $ref: '#/components/examples/Topic'
          headers:
            ETag:
              schema:
                type: string
              description: '`W/"{version}"`.'
            Location:
              schema:
                type: string
              description: Đường dẫn tài nguyên mới hoặc tác vụ.
        '202':
          description: 'Máy đăng ký topic mới: đã tự duyệt hoặc chờ duyệt, đang cấp phát.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
              examples:
                vi-du:
                  $ref: '#/components/examples/TopicCdc'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /topics/{topicName}:
    get:
      tags:
      - Topic
      operationId: getTopic
      summary: Chi tiết topic
      x-datahub-id: API-10-010
