# D03-04-PH10 · AsyncAPI PH-10. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py, không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: 3.0.0
info:
  title: 'Datahub PH-10 Sự kiện: sự kiện và giao nhận'
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-10-01…16 (D03-04-PH10 §4, FRS §8.2, A.7), kênh giao ĐẨY webhook ký HMAC (ADR-044, ADR-071) và kênh mẫu của
    topic nghiệp vụ, topic DLQ.


    EVT-10 ghi vào `ph10_event.outbox_event` cùng giao dịch nghiệp vụ, Debezium đưa lên Kafka; CloudEvents 1.0 nhị phân, `ce_type = vn.datahub.event.{thực-thể}.{sự-kiện}`.
    Lưu giữ 7 ngày, 3 phân vùng (giả định theo mức của PH-05, Q10-58). Người nhận xử lý lũy đẳng theo `ce_id` (inbox) và bỏ qua `configVersion`
    cũ hơn bản đang giữ. Tương thích: chỉ thêm trường tùy chọn trong `v1` (ADR-070, BACKWARD). Không sự kiện nào mang giá trị khóa ký hay nội
    dung sự kiện nghiệp vụ. Dữ liệu ví dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
defaultContentType: application/json
servers:
  kafka-internal:
    host: dh-kafka-kafka-bootstrap.dh-kafka.svc:9093
    protocol: kafka-secure
    description: 'Listener `internal`: DU, `dh-runtime`, Kafka Connect; mTLS, ACL theo CN và tiền tố tenant (D03-09).'
    security:
    - $ref: '#/components/securitySchemes/mtls'
  kafka-external:
    host: kafka-ext.{tenantHost}.datahub.example.vn:9093
    protocol: kafka-secure
    description: Listener `external` cho HTTT khi `10.external-kafka.enabled`; SASL OAUTHBEARER (Keycloak, principal theo `azp`) hoặc mTLS.
    variables:
      tenantHost:
        default: t68
    security:
    - $ref: '#/components/securitySchemes/saslOauth'
    - $ref: '#/components/securitySchemes/mtls'
  webhook-endpoint:
    host: thue.t68.gov.vn
    protocol: https
    description: Đầu nhận của HTTT (giả lập); chỉ HTTPS, FQDN trong danh sách egress.
