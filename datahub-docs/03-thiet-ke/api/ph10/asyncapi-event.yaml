  businessTopic:
    address: '{tenant}.{domain}.{entity}.{eventName}.v{majorVersion}'
    title: Topic nghiệp vụ (mẫu)
    description: Mọi topic do PH-10 cấp phát theo BR-10-002. Cấu hình (`partitions`, `retentionHours`, `cleanupPolicy`, `maxMessageBytes`) theo
      khai báo topic; `replicas = 3`, `min.insync.replicas = 2` (BR-10-004). Bên phát `HTTP_PUBLISH` qua API-10-079; `KAFKA_NATIVE` qua listener
      `external` (SASL OAUTHBEARER hoặc mTLS); `INTERNAL_KAFKA`, `OUTBOX_CDC`, `DB_CDC` qua listener `internal` mTLS. ACL theo tiền tố tenant,
      cấp khi publication, subscription được duyệt. Khóa bản tin là giá trị `partitionKeyField` khi `KEY_HASH`.
    parameters: &id001
      tenant:
        $ref: '#/components/parameters/tenant'
      domain:
        description: Miền, `^[a-z][a-z0-9-]{1,30}$`, không thuộc miền dành riêng.
      entity:
        description: Thực thể, `^[a-z][a-z0-9-]{1,40}$`.
      eventName:
        description: Sự kiện, động từ quá khứ.
      majorVersion:
        description: Phiên bản chính của topic (`majorVersion`).
    messages:
      businessEvent:
        $ref: '#/components/messages/businessEvent'
  deadLetterTopic:
    address: '{tenant}.{domain}.{entity}.{eventName}.v{majorVersion}.dlq'
    title: Topic DLQ `{topicName}.dlq` (mẫu)
    description: Tạo cùng topic gốc (BR-10-023), lưu giữ `10.dlq.topic-retention-hours`. Bộ giao nhận, cổng kéo, API-10-083, bộ phát lại, cầu
      nối ghi bản tin gốc nguyên vẹn kèm tiêu đề `dh_dlq_*`; `DlqIngestor` (`dh-svc-dh-integration-{tenant}`) đọc và lưu bền ở `dlq_entry`, `dlq_payload`.
      HTTT không đọc trực tiếp.
    parameters: *id001
    messages:
      deadLetter:
        $ref: '#/components/messages/deadLetter'
  webhookDelivery:
    address: '{endpointUrl}'
    title: Giao ĐẨY webhook (PUSH)
    description: 'Bộ giao nhận webhook của `dh-runtime` (ADR-071) gửi `POST` tới `push.endpointUrl` đã xác minh, qua egress gateway, chỉ HTTPS
      TLS ≥ 1.2, không theo chuyển hướng, ghim IP đã kiểm (BR-10-026). Ký HMAC-SHA256 theo ADR-044. Kết quả: `2xx` thành công; `408`, `425`, `429`,
      `5xx`, quá `timeoutMs`, lỗi mạng là lỗi tạm thời, thử lại giãn dần (FR-10-039); `4xx` khác vào DLQ ngay (ERR-10-113); `410` vào DLQ và tạm
      ngừng subscription. Mỗi phân vùng giao tuần tự (BR-10-025), at-least-once; bên nhận chống trùng theo `Webhook-Id`.'
    parameters:
      endpointUrl:
        description: '`push.endpointUrl` của subscription, ví dụ `https://thue.t68.gov.vn/hooks/dh`.'
    servers:
    - $ref: '#/servers/webhook-endpoint'
    messages:
      webhookStructured:
        $ref: '#/components/messages/webhookStructured'
      webhookBinary:
        $ref: '#/components/messages/webhookBinary'
    bindings:
      http:
        bindingVersion: 0.3.0
  webhookHandshake:
    address: '{endpointUrl}'
    title: Bắt tay xác minh endpoint (OPTIONS)
    description: 'FR-10-036, API-10-051: `OPTIONS` theo CloudEvents HTTP Webhook (chống lạm dụng). Endpoint phải trả `200` hoặc `204` với `WebHook-Allowed-Origin`
      khớp `WebHook-Request-Origin` (hoặc `*`) trong `push.timeoutMs`. Ngoại lệ API-10-091 thay bằng một `POST` sự kiện `vn.datahub.event.subscription.verification`
      mà endpoint trả `2xx`.'
    parameters:
      endpointUrl:
        description: URL cần xác minh.
    servers:
    - $ref: '#/servers/webhook-endpoint'
    messages:
      webhookHandshake:
        $ref: '#/components/messages/webhookHandshake'
    bindings:
      http:
        bindingVersion: 0.3.0
