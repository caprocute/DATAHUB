components:
  securitySchemes:
    mtls:
      type: X509
      description: mTLS do Strimzi cấp; ACL theo topic do PH-10 quản lý.
  parameters:
    tenant:
      description: Mã tenant viết thường (`t68`), hoặc `common` cho danh mục COMMON.
      examples:
      - t68
      - common
  messageTraits:
    cloudEvent:
      headers:
        type: object
        required:
        - ce_specversion
        - ce_id
        - ce_source
        - ce_type
        - ce_time
        - ce_tenantid
        properties:
          ce_specversion:
            type: string
            const: '1.0'
          ce_id:
            type: string
            format: uuid
            description: event_id của outbox, UUID v7; khóa chống trùng.
          ce_source:
            type: string
            description: '`/datahub/{tenant}/rdm`'
          ce_type:
            type: string
            pattern: ^vn\.datahub\.rdm\.[a-z]+\.[a-z]+\.v1$
          ce_subject:
            type: string
            description: Mã danh mục hoặc mã tác vụ.
          ce_time:
            type: string
            format: date-time
          ce_tenantid:
            type: string
            pattern: ^(T\d{2}|COMMON|PLATFORM)$
          ce_traceparent:
            type: string
            description: W3C traceparent của thao tác gốc.
          content-type:
            type: string
            const: application/json
      bindings:
        kafka:
          key:
            type: string
            description: aggregate_id `{tenant}:{catalogCode}`
            examples:
            - T68:LOAI_HINH_DN
  schemas:
    TCode:
      type: string
      pattern: ^[A-Z0-9][A-Z0-9_.-]{0,63}$
    DiffSummary:
      type: object
      properties:
        added:
          type: integer
        changed:
          type: integer
        deprecated:
          type: integer
        reactivated:
          type: integer
        removed:
          type: integer
        breaking:
          type: boolean
        changeRatio:
          type: number
    SuccessionEvent:
      type: object
      required:
      - eventType
      - toCodes
      - legalBasis
      properties:
        eventType:
          type: string
          enum:
          - MERGE
          - SPLIT
          - RENAME
          - ABOLISH
          - ESTABLISH
          - RECODE
        fromCodes:
          type: array
          items:
            type: string
        toCodes:
          type: array
          items:
            type: string
        legalBasis:
          type: string
    CatalogCreatedData:
      type: object
      required:
      - catalogCode
      - name
      - sourceType
      - classification
      properties:
        catalogCode:
          $ref: '#/components/schemas/TCode'
        name:
          type: string
        sourceType:
          type: string
          enum:
          - LOCAL
          - NATIONAL
          - HYBRID
        classification:
          type: string
          enum:
          - PUBLIC
          - INTERNAL
          - RESTRICTED
        ownerOrgId:
          type:
          - string
          - 'null'
          format: uuid
      additionalProperties: true
    CatalogUpdatedData:
      type: object
      required:
      - catalogCode
      - changedFields
      properties:
        catalogCode:
          $ref: '#/components/schemas/TCode'
        changedFields:
          type: array
          items:
            type: string
      additionalProperties: true
    CatalogRetiredData:
      type: object
      required:
      - catalogCode
      - retireDate
      - reason
      properties:
        catalogCode:
          $ref: '#/components/schemas/TCode'
        retireDate:
          type: string
          format: date
        reason:
          type: string
        replacementCatalogCode:
          type:
          - string
          - 'null'
      additionalProperties: true
    CatalogSubmittedData:
      type: object
      required:
      - catalogCode
      - versionNo
      - submittedBy
      - diffSummary
      properties:
        catalogCode:
          $ref: '#/components/schemas/TCode'
        versionNo:
          type: integer
        submittedBy:
          type: string
        diffSummary:
          $ref: '#/components/schemas/DiffSummary'
        ownerOrgId:
          type:
          - string
          - 'null'
          format: uuid
      additionalProperties: true
    CatalogPublishedData:
      type: object
      required:
      - catalogCode
      - versionNo
      - effectiveFrom
      - breaking
      - schemaHash
      properties:
        catalogCode:
          $ref: '#/components/schemas/TCode'
        versionNo:
          type: integer
        effectiveFrom:
          type: string
          format: date
        stats:
          $ref: '#/components/schemas/DiffSummary'
        breaking:
          type: boolean
        origin:
          type: string
          enum:
          - MANUAL
          - IMPORT
          - API
          - SYNC
          - MIGRATION
        snapshotUri:
          type:
          - string
          - 'null'
          description: Đường dẫn ảnh chụp trên kho đối tượng; null khi đang sinh.
        schemaHash:
          type: string
          pattern: ^[0-9a-f]{64}$
      additionalProperties: true
    CatalogRejectedData:
      type: object
      required:
      - catalogCode
      - versionNo
      - action
      - rejectedBy
      properties:
        catalogCode:
          $ref: '#/components/schemas/TCode'
        versionNo:
          type: integer
        action:
          type: string
          enum:
          - REJECT
          - WITHDRAW
          - REVOKE
        reason:
          type: string
        rejectedBy:
          type: string
      additionalProperties: true
    ImportCompletedData:
      type: object
      required:
      - jobId
      - status
      properties:
        jobId:
          type: string
          format: uuid
        catalogCode:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - VALIDATED
          - COMMITTED
          - FAILED
          - CANCELLED
          - EXPIRED
        summary:
          type: object
          additionalProperties:
            type: integer
      additionalProperties: true
    ExportCompletedData:
      type: object
      required:
      - jobId
      - catalogCode
      - status
      properties:
        jobId:
          type: string
          format: uuid
        catalogCode:
          $ref: '#/components/schemas/TCode'
        status:
          type: string
          enum:
          - COMPLETED
          - FAILED
        rowCount:
          type:
          - integer
          - 'null'
      additionalProperties: true
    SyncCompletedData:
      type: object
      required:
      - runId
      - catalogCode
      - status
      - hasBreaking
      properties:
        runId:
          type: string
          format: uuid
        catalogCode:
          $ref: '#/components/schemas/TCode'
        status:
          type: string
          enum:
          - APPLIED
          - PENDING_CONFIRMATION
          - REJECTED
          - FAILED
        diffStats:
          type: object
          additionalProperties:
            type: integer
        hasBreaking:
          type: boolean
      additionalProperties: true
    AdminUnitReorganizedData:
      type: object
      required:
      - versionNo
      - effectiveFrom
      - events
      properties:
        versionNo:
          type: integer
        effectiveFrom:
          type: string
          format: date
        events:
          type: array
          items:
            $ref: '#/components/schemas/SuccessionEvent'
      additionalProperties: true
