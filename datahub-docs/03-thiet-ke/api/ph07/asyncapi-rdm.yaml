# Hợp đồng sự kiện PH-07 (AsyncAPI 3.0). Nguồn sự thật cho EVT-07-01…10; sinh mã và kiểm tra tương thích trong CI (D04-02).
# Dữ liệu ví dụ là giả lập.
asyncapi: 3.0.0
info:
  title: Datahub PH-07 Danh mục dùng chung — sự kiện
  version: 0.1.0
  description: 'Hợp đồng sự kiện EVT-07-01…10 của PH-07 (D03-04-PH07, FR-07-034).


    Sự kiện ghi vào outbox trong cùng giao dịch với thay đổi (DD-11, SAD §7.3), Debezium đưa lên Kafka. Bản tin theo CloudEvents 1.0 chế độ nhị phân: thuộc tính CloudEvents
    nằm ở tiêu đề Kafka `ce_*`, thân là `data`. Khóa bản tin là `aggregate_id = {tenant}:{catalogCode}` để giữ thứ tự theo danh mục. Sự kiện không chứa dữ liệu bản
    ghi; HTTT lấy dữ liệu qua API có kiểm soát quyền. Consumer chống trùng bằng `ce_id`. Tương thích: chỉ thêm trường tùy chọn trong cùng `v1`; thay đổi phá vỡ phải
    sang topic `v2` và phát song song tối thiểu 6 tháng (kiểm tra bằng Apicurio, chế độ BACKWARD).'
  license:
    name: Tài liệu nội bộ dự án Datahub
defaultContentType: application/json
servers:
  kafka-cum:
    host: kafka-bootstrap.dh-platform.svc:9093
    protocol: kafka-secure
    description: Kafka (Strimzi) của cụm; HTTT ngoài cụm đăng ký qua PH-10, không kết nối trực tiếp.
    security:
    - $ref: '#/components/securitySchemes/mtls'
