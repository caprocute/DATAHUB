      description: |
        Tra nhiều mã trong một lượt, dùng POST vì danh sách mã có thể dài hơn giới hạn URL. Thao
        tác an toàn và idempotent về ngữ nghĩa (không ghi gì) nên không cần `Idempotency-Key`.
        Mã trùng trong yêu cầu được gộp; thứ tự `items` theo thứ tự xuất hiện đầu tiên trong
        `codes`. Mã không tìm thấy nằm trong `notFound` thay vì làm cả lô lỗi. Vượt 500 mã trả
        400 ERR-07-026. Mục tiêu p95 ≤ 150 ms (NFR-07-002).
