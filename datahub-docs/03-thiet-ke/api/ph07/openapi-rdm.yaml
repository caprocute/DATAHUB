        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  # ------------------------------------------------------------------ Đơn vị hành chính
  /catalogs/{catalogCode}/items/{itemCode}/lineage:
    parameters:
      - $ref: '#/components/parameters/CatalogCode'
