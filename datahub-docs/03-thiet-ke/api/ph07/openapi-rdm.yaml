openapi: 3.1.0
# D03-04-PH07 · Đặc tả OpenAPI phân hệ PH-07 Danh mục dùng chung (RDM)
# Tài liệu văn xuôi đi kèm: ../D03-04-PH07-api-danh-muc.md
# Hợp đồng mã: API-07-001…075 (API-07-076 chuyển sang PH-18, xem x-datahub-notes),
# ERR-07-001…037 (+ ERR-07-040…047 đề xuất bổ sung), EVT-07-01…10 (asyncapi-rdm.yaml).
info:
  title: Datahub · PH-07 Danh mục dùng chung (RDM) API
  version: 1.0.0-draft
  summary: Quản trị, phát hành, khai thác và chuyển mã danh mục dùng chung đa tenant.
  description: |
    API của phân hệ PH-07 (module `rdm` trong đơn vị triển khai `dh-data`) phục vụ hai nhóm
    người dùng khác nhau và vì vậy được chia thành hai mặt:

    * **Mặt quản trị** (người dùng qua giao diện Datahub, token Authorization Code + PKCE):
      tạo danh mục, khai báo lược đồ thuộc tính, soạn bản nháp, nhập tệp, trình duyệt,
      phát hành, đồng bộ quốc gia, ánh xạ mã. Phân trang theo trang (`page`, `size` ≤ 200).
    * **Mặt khai thác** (HTTT thành viên, token Client Credentials với scope `rdm.read`,
      `rdm.query`, `rdm.write`): tra cứu một mã, tra lô, lấy toàn bộ theo con trỏ, cây,
      delta, truy vấn có cấu trúc, chuyển mã ĐVHC, chuyển mã qua bảng ánh xạ.
      Phân trang theo con trỏ (`cursor`, `limit` ≤ 1000), có ETag và Cache-Control vì
      phiên bản đã phát hành là bất biến.

    Quy ước chung (D03-01 SAD §7.2): tenant lấy từ token, không truyền qua tham số; lệnh
    tạo nhận `Idempotency-Key` (lưu 24 giờ, so băm SHA-256 thân yêu cầu); lệnh sửa và lệnh
    đổi trạng thái bắt buộc `If-Match` với ETag sinh từ cột `version`; lệnh đổi trạng thái
    dùng hậu tố `:{hành-động}`; lỗi theo RFC 9457 (`application/problem+json`) với mã
    `ERR-07-nnn`; header `traceparent` (W3C Trace Context) được truyền xuyên suốt.

    Mọi tên miền, máy chủ, client và dữ liệu trong tài liệu này là **giả lập** phục vụ
    minh họa; không có giá trị kết nối thật.
  contact:
    name: Nhóm phân hệ PH-07
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH07
  x-datahub-phase: PH-07
servers:
  - url: https://api.{tenantHost}.datahub.example.vn/api/rdm/v1
    description: Cổng API (APISIX) của một tenant tỉnh — giả lập
    variables:
      tenantHost:
        default: lamdong
        description: Tên máy chủ theo tenant, ví dụ `lamdong` cho tenant T68 (giả lập).
  - url: http://localhost:8080/api/rdm/v1
    description: Môi trường phát triển cục bộ (`dh-data` chạy trực tiếp, không qua APISIX)
security:
  - oauth2User: []
tags:
  - name: Danh mục
    description: Thông tin chung của danh mục, vòng đời DRAFT → ACTIVE → RETIRED (FR-07-001…009).
  - name: Nhóm danh mục
    description: Cây phân loại danh mục (FR-07-010).
  - name: Phiên bản
    description: Bản nháp, kiểm tra, trình duyệt, duyệt, phát hành, so sánh (FR-07-011…017).
  - name: Thuộc tính
    description: Lược đồ thuộc tính động theo từng phiên bản (FR-07-005, 006).
  - name: Bản ghi (quản trị)
    description: Thêm, sửa, ngừng dùng, xóa bản ghi trên bản nháp; nhập lô qua API (FR-07-012, 019, 023).
  - name: Nhập xuất
    description: Tệp mẫu, tác vụ nhập hai pha, tác vụ xuất, lịch sử tác vụ (FR-07-020…025).
  - name: Khai thác
    description: API tra cứu cho HTTT, có bộ đệm và ETag (FR-07-026…031, 033).
  - name: Truy vấn
    description: Truy vấn có cấu trúc bằng DSL JSON trên thuộc tính `queryable` (FR-07-032).
  - name: Đơn vị hành chính
    description: Sự kiện sắp xếp ĐVHC, dòng lịch sử, chuyển đổi mã cũ sang mới (FR-07-044…047).
  - name: Đồng bộ quốc gia
    description: Nguồn đồng bộ NDXP qua PH-14, lần chạy, xác nhận thay đổi phá vỡ, đề xuất bổ sung (FR-07-035…039).
  - name: Ánh xạ mã
    description: Hệ thống mã ngoài, bảng ánh xạ, chuyển mã, độ phủ (FR-07-040…043).
  - name: Kiểm toán và quyền khai thác
    description: Lịch sử kiểm toán (đọc từ PH-13), cấp quyền khai thác danh mục RESTRICTED (FR-07-050, 052).
  - name: Nền tảng
    description: API liên tenant dưới `/api/platform/rdm/v1`, chỉ dành cho PH-20 và quản trị nền tảng (FR-07-049).
x-datahub-notes:
  - id: API-07-076
    text: >-
      API-07-076 (GET/PATCH /settings) không còn được đặc tả ở PH-07. Theo quyết định ánh xạ
      DD-14, tham số PH-07 lưu ở `ph18_ops.config_param` với namespace `07.rdm` và được đọc,
      ghi qua API tham số của PH-18. Các khóa và ý nghĩa vẫn được mô tả ở D03-04-PH07 §2.12.
paths:
  # ------------------------------------------------------------------ Danh mục
  /catalogs:
    get:
      tags: [Danh mục]
      operationId: listCatalogs
      summary: Danh sách danh mục
      description: |
        Trả danh sách danh mục mà người gọi được thấy: danh mục của tenant hiện tại cộng danh mục
        COMMON (RLS `tenant_id IN (current, 'COMMON')`). Lọc theo nhóm, nguồn, trạng thái, phân
        loại; tìm từ khóa không dấu trên mã và tên. Kèm số đếm theo trạng thái trong `facets`
        để giao diện UI-07-01 hiển thị huy hiệu. HTTT có scope `rdm.read` cũng gọi được để khám
        phá danh mục (FR-07-033); khi đó danh mục RESTRICTED chỉ hiện nếu HTTT được cấp quyền.
      x-datahub-id: API-07-001
      x-datahub-fr: [FR-07-001, FR-07-033]
      x-datahub-permission:
        permission: PERM-07-read
        scopes: [rdm.read]
        orgScoped: false
      security:
        - oauth2User: []
        - oauth2Client: [rdm.read]
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: groupId
          in: query
          description: Lọc theo nhóm danh mục; bao gồm cả nhóm con.
          schema: { type: string, format: uuid }
        - name: sourceType
          in: query
          style: form
          explode: false
          description: Lọc theo nguồn, chọn nhiều bằng dấu phẩy.
          schema:
            type: array
            items: { $ref: '#/components/schemas/SourceType' }
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/CatalogStatus' }
        - name: classification
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/Classification' }
        - name: scope
          in: query
          description: '`ALL` (mặc định) gồm danh mục tenant và COMMON; `TENANT` chỉ của tenant; `COMMON` chỉ danh mục dùng chung toàn quốc.'
          schema: { type: string, enum: [ALL, TENANT, COMMON], default: ALL }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: Trường sắp xếp, tiền tố `-` cho giảm dần. Cho phép `code`, `name`, `updatedAt`, `itemCount`.
          schema: { type: string, default: code, pattern: '^-?(code|name|updatedAt|itemCount)$' }
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Một trang danh mục.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
              examples:
                trangDau: { $ref: '#/components/examples/CatalogPageExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Danh mục]
      operationId: createCatalog
      summary: Tạo danh mục kèm bản nháp phiên bản 1
      description: |
        Tạo danh mục mới ở trạng thái `DRAFT` cùng phiên bản nháp số 1 và các thuộc tính ban đầu
        trong một giao dịch. Mã danh mục được chuẩn hóa chữ hoa, phải duy nhất trong tenant và
        không trùng mã danh mục COMMON đang ACTIVE (BR-07-001). Danh mục `NATIONAL` không tạo
        được qua API này mà qua API-07-056 (nguồn đồng bộ). Danh mục `HYBRID` bắt buộc
        `extendsCatalogCode` trỏ tới danh mục COMMON/NATIONAL và `localCodePattern`.
        Thuộc tính có tên gợi ý dữ liệu cá nhân hoặc mức Nhạy cảm bị từ chối (BR-07-025).
        Phát sự kiện EVT-07-01 qua outbox.
      x-datahub-id: API-07-002
      x-datahub-fr: [FR-07-003, FR-07-005, FR-07-007, FR-07-008]
      x-datahub-permission:
        permission: PERM-07-create
        orgScoped: true
        note: DATA_STEWARD chỉ tạo được danh mục có `ownerOrgId` là tổ chức của mình hoặc tổ chức cấp dưới; PLATFORM_ADMIN tạo danh mục COMMON.
      x-datahub-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogCreateRequest' }
            examples:
              loaiHinhDn: { $ref: '#/components/examples/CatalogCreateLoaiHinhDn' }
              hybridDvhc: { $ref: '#/components/examples/CatalogCreateHybrid' }
      responses:
        '201':
          description: Đã tạo danh mục và bản nháp phiên bản 1.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
              examples:
                daTao: { $ref: '#/components/examples/CatalogLoaiHinhDn' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /catalogs/{catalogCode}:
    parameters:
      - $ref: '#/components/parameters/CatalogCode'
    get:
      tags: [Danh mục]
      operationId: getCatalog
      summary: Chi tiết danh mục
      description: |
        Trả thông tin danh mục, phiên bản hiện hành, phiên bản đang mở (nếu có), cấu hình phân cấp,
        nguồn và số liệu tóm tắt. Header `ETag` dùng cho PATCH/DELETE/`:retire` tiếp theo.
        Danh mục đã xóa mềm trả 404; danh mục RETIRED vẫn trả 200 với `status = RETIRED`.
      x-datahub-id: API-07-003
      x-datahub-fr: [FR-07-002]
      x-datahub-permission:
        permission: PERM-07-read
        scopes: [rdm.read]
      security:
        - oauth2User: []
        - oauth2Client: [rdm.read]
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Chi tiết danh mục.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
              examples:
                dvhc: { $ref: '#/components/examples/CatalogDvhc' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Danh mục]
      operationId: updateCatalog
      summary: Cập nhật thông tin danh mục
      description: |
        Cập nhật một phần theo JSON Merge Patch (RFC 7396): trường vắng mặt giữ nguyên, trường
        `null` xóa giá trị (chỉ với trường không bắt buộc). Không đổi được `code`, `sourceType`
        (trừ LOCAL → HYBRID khi chưa phát hành), `extendsCatalogCode` sau khi đã phát hành.
        Thay đổi `maxDepth` nhỏ hơn độ sâu thực tế của phiên bản hiện hành bị từ chối ERR-07-011.
        Phát EVT-07-02.
      x-datahub-id: API-07-004
      x-datahub-fr: [FR-07-004, FR-07-008]
      x-datahub-permission:
        permission: PERM-07-update
        orgScoped: true
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/CatalogUpdateRequest' }
            examples:
              doiTen:
                summary: Đổi mô tả và bật yêu cầu duyệt
                value: { description: "Danh mục loại hình doanh nghiệp theo Luật Doanh nghiệp 2020", requireApproval: true }
          application/json:
            examples:
              doiNhom: { $ref: '#/components/examples/CatalogUpdateExample' }
            schema: { $ref: '#/components/schemas/CatalogUpdateRequest' }
      responses:
        '200':
          description: Đã cập nhật.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              examples:
                daSua: { $ref: '#/components/examples/CatalogUpdated' }
              schema: { $ref: '#/components/schemas/Catalog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Danh mục]
      operationId: deleteCatalog
      summary: Xóa danh mục chưa phát hành
      description: |
        Xóa mềm (`deleted_at`) danh mục ở trạng thái `DRAFT` (chưa từng có phiên bản phát hành).
        Danh mục ACTIVE phải dùng `:retire`; gọi xóa trả 409 ERR-07-004. Thao tác yêu cầu xác
        nhận trên giao diện (FR-00-050) và sinh bản ghi kiểm toán.
      x-datahub-id: API-07-005
      x-datahub-fr: [FR-07-009]
      x-datahub-permission:
        permission: PERM-07-update
        orgScoped: true
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '204': { description: Đã xóa mềm. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /catalogs/{catalogCode}:retire:
    parameters:
      - $ref: '#/components/parameters/CatalogCode'
    post:
      tags: [Danh mục]
      operationId: retireCatalog
      summary: Ngừng hiệu lực danh mục
      description: |
        Chuyển danh mục ACTIVE sang RETIRED. Phiên bản hiện hành được đặt `effectiveTo` bằng
        `effectiveTo` trong yêu cầu (mặc định ngày mai theo giờ Việt Nam); phiên bản đang mở bị hủy.
        Bị chặn nếu danh mục đang được thuộc tính `CATALOG_REF` của danh mục ACTIVE khác tham chiếu
        (BR-07-020, ERR-07-032) hoặc đang có nguồn đồng bộ bật. Sau thời điểm ngừng, API khai thác
        trả 410 ERR-07-031 với truy vấn tại thời điểm sau `effectiveTo`; truy vấn `at` trong quá khứ
        vẫn trả dữ liệu lịch sử. Phát EVT-07-03.
      x-datahub-id: API-07-006
      x-datahub-fr: [FR-07-009]
      x-datahub-permission:
        permission: PERM-07-retire
        proposedForD0208: true
        note: TENANT_ADMIN trong tenant; PLATFORM_ADMIN với danh mục COMMON.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogRetireRequest' }
            example: { reason: "Thay thế bằng danh mục LOAI_HINH_DN_2026 theo Luật sửa đổi", effectiveTo: "2027-01-01" }
      responses:
        '200':
          description: Đã ngừng hiệu lực.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              examples:
                daNgung: { $ref: '#/components/examples/CatalogRetired' }
              schema: { $ref: '#/components/schemas/Catalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  # ------------------------------------------------------------------ Nhóm danh mục
  /catalog-groups:
    get:
      tags: [Nhóm danh mục]
      operationId: listCatalogGroups
      summary: Cây nhóm danh mục
      description: Trả toàn bộ cây nhóm của tenant cộng nhóm COMMON, kèm số danh mục trong mỗi nhóm (không gồm nhóm con).
      x-datahub-id: API-07-007
      x-datahub-fr: [FR-07-010]
      x-datahub-permission:
        permission: PERM-07-read
        scopes: [rdm.read]
      security:
        - oauth2User: []
        - oauth2Client: [rdm.read]
      parameters:
        - name: flat
          in: query
          description: '`true` trả danh sách phẳng có `parentId` thay vì cây lồng.'
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Cây nhóm.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogGroup' }
              examples:
                cay: { $ref: '#/components/examples/CatalogGroupTree' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Nhóm danh mục]
      operationId: createCatalogGroup
      summary: Tạo nhóm danh mục
      x-datahub-id: API-07-008
      x-datahub-fr: [FR-07-010]
      x-datahub-permission:
        permission: PERM-07-configure
        proposedForD0208: true
        note: TENANT_ADMIN; PLATFORM_ADMIN với nhóm COMMON.
      x-datahub-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogGroupCreateRequest' }
            example: { code: "KINH_TE", name: "Kinh tế, doanh nghiệp", parentId: null, sortOrder: 30, description: "Danh mục phục vụ quản lý doanh nghiệp, đầu tư" }
      responses:
        '201':
          description: Đã tạo nhóm.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              examples:
