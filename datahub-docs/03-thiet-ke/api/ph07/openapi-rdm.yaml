      description: |
        Áp dụng tối đa 5.000 thao tác `upsert`, `deprecate`, `delete` trong một giao dịch
        (`atomic = true`, mặc định: một thao tác lỗi thì không thao tác nào được ghi, trả 422 với
        `errors[].row` là chỉ số thao tác) hoặc từng phần (`atomic = false`: thao tác hợp lệ được
