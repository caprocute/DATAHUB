        hoặc đổi `dataType`. Đổi kiểu chỉ được khi mọi giá trị hiện có chuyển đổi được
        (BR-07-013); nếu không trả 422 ERR-07-014 kèm tối đa 100 phần tử `errors[]` chỉ rõ mã bản
        ghi vi phạm. Thu hẹp ràng buộc được phép nhưng bị đánh dấu thay đổi phá vỡ khi phát hành.
