    get:
      tags: [Khai thác]
      operationId: getSnapshot
      summary: Tải ảnh chụp phiên bản (chuyển hướng tới URL ký sẵn)
      description: |
        Trả 302 với `Location` là URL ký sẵn (hạn 15 phút) tới tệp ảnh chụp trên Garage.
        `versionRef = draft` không được hỗ trợ (ảnh chụp chỉ có với phiên bản đã phát hành).
        Nếu ảnh chụp đang được sinh (ngay sau phát hành), trả 503 kèm `Retry-After`. Tệp JSON nén
        gzip theo cấu trúc `ExportJsonDocument` (một dòng một bản ghi nếu `format=ndjson`).
      x-datahub-id: API-07-049
      x-datahub-fr: [FR-07-028]
      x-datahub-permission:
