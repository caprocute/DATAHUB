      requestBody:
        required: true
        content:
          application/merge-patch+json:
            examples:
              datNgay: { $ref: '#/components/examples/VersionUpdateExample' }
            schema: { $ref: '#/components/schemas/VersionUpdateRequest' }
          application/json:
            examples:
              datNgay: { $ref: '#/components/examples/VersionUpdateExample' }
            schema: { $ref: '#/components/schemas/VersionUpdateRequest' }
      responses:
        '200':
          description: Đã sửa.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              examples:
                daSua: { $ref: '#/components/examples/VersionUpdated' }
              schema: { $ref: '#/components/schemas/CatalogVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
