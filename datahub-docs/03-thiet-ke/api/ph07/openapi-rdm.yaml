        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Phiên bản]
      operationId: discardDraftVersion
      summary: Hủy bản nháp
      description: |
        Chuyển phiên bản `DRAFT` sang `DISCARDED`; bản ghi và thuộc tính của bản nháp được xóa
        vật lý bởi tác vụ dọn dẹp sau 7 ngày (giữ dấu vết `version_review` với hành động DISCARD).
        Phiên bản IN_REVIEW phải bị từ chối về DRAFT trước. Nếu đây là phiên bản 1 của danh mục
        DRAFT, danh mục vẫn tồn tại và có thể tạo lại bản nháp.
