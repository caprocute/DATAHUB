        `queryable` (BR-07-018); chọn trường (`select`), sắp xếp (≤ 3 khóa), phân trang con trỏ.
        Máy chủ dịch sang SQL tham số hóa trên `attrs jsonb` với `statement_timeout = 2s`
        (ADR-054). Lỗi cú pháp trả 400 ERR-07-023, thuộc tính không cho truy vấn 400 ERR-07-025,
        vượt giới hạn 422 ERR-07-024. Ngữ pháp đầy đủ ở D03-04-PH07 §5.
