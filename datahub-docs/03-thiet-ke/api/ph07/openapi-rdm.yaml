      description: |
        Trả dòng thời gian các phiên bản mà mã xuất hiện (tên, mã cha, trạng thái, thuộc tính thay
        đổi) cùng đồ thị kế thừa từ `item_succession` và `replacedBy`: tiền thân (`predecessors`)
