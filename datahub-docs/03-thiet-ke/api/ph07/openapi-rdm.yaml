        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Phiên bản]
      operationId: updateDraftVersion
      summary: Sửa ngày hiệu lực, căn cứ, ghi chú của bản nháp
      description: |
        Chỉ áp dụng cho phiên bản `DRAFT`. `effectiveFrom` phải lớn hơn `effectiveFrom` của phiên
        bản đã phát hành mới nhất (BR-07-007) và không sớm hơn hôm nay trừ phiên bản có
        `origin` SYNC/MIGRATION (BR-07-027). ETag của phiên bản đổi khi bất kỳ bản ghi hay thuộc
        tính nào của bản nháp thay đổi, vì `version` của phiên bản được tăng theo mọi thao tác.
      x-datahub-id: API-07-014
