  /admin-units:convert:
    post:
      tags: [Đơn vị hành chính]
      operationId: convertAdminUnits
      summary: Chuyển mã ĐVHC cũ sang mới (lô ≤ 1.000)
      description: |
        Với mỗi mã đầu vào (có thể kèm ngày của hồ sơ `asOf`), xác định đơn vị tại ngày đó rồi
        đi theo chuỗi sự kiện sắp xếp (`item_succession`) tới `targetDate` (mặc định hôm nay).
        Kết quả: `EXACT` (đúng một đơn vị đích), `UNCHANGED` (đơn vị không bị sắp xếp), `AMBIGUOUS`
        (đơn vị bị chia về nhiều đơn vị, trả `candidates` và không tự chọn — BR-07-022),
        `NOT_FOUND` (mã không tồn tại tại `asOf`). `direction = NEW_TO_OLD` tra ngược: từ mã mới
        trả các mã tiền thân tại `targetDate` trong quá khứ. Chuyển mã tệp (FR-07-046) do UI-07-11
        đọc tệp phía trình duyệt và gọi API này theo lô 1.000.
      x-datahub-id: API-07-051
      x-datahub-fr: [FR-07-046]
      x-datahub-permission:
        permission: PERM-07-read
        scopes: [rdm.read]
      security:
        - oauth2Client: [rdm.read]
        - oauth2User: []
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUnitConvertRequest' }
            examples:
              hoSoCu: { $ref: '#/components/examples/ConvertRequestExample' }
      responses:
        '200':
          description: Kết quả chuyển mã.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUnitConvertResponse' }
              examples:
                ketQua: { $ref: '#/components/examples/ConvertResponseExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
