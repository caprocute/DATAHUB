  /catalogs/{catalogCode}/changes:
    parameters:
      - $ref: '#/components/parameters/CatalogCode'
    get:
      tags: [Khai thác]
      operationId: getCatalogChanges
      summary: Lấy thay đổi kể từ một phiên bản (delta)
      description: |
        Trả danh sách thay đổi cộng dồn từ phiên bản `sinceVersion` (không gồm) tới `toVersion`
        (mặc định phiên bản đã phát hành mới nhất, kể cả phiên bản sắp hiệu lực nếu
        `includeUpcoming = true`). Mỗi mã chỉ xuất hiện một lần với trạng thái cuối cùng. Nếu
        `sinceVersion` cũ hơn cửa sổ giữ delta (mặc định 20 phiên bản) hoặc giữa hai phiên bản có
        thay đổi lược đồ phá vỡ, trả `fullResyncRequired = true` và `changes` rỗng: client phải nạp
        lại từ ảnh chụp. Nếu `sinceVersion` đã là mới nhất, trả 200 với `changes` rỗng (không trả
        304, để client luôn nhận `toVersionNo`).
      x-datahub-id: API-07-046
      x-datahub-fr: [FR-07-031]
      x-datahub-permission:
        permission: PERM-07-read
        scopes: [rdm.read]
        restrictedCheck: true
      security:
        - oauth2Client: [rdm.read]
        - oauth2User: []
      parameters:
        - name: sinceVersion
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
          description: Phiên bản client đang giữ; `0` nghĩa là chưa có gì (trả toàn bộ dưới dạng ADDED nếu ≤ 10.000 bản ghi, ngược lại yêu cầu nạp ảnh chụp).
        - name: toVersion
          in: query
          schema: { type: integer, minimum: 1 }
        - name: includeUpcoming
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Delta.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangesResponse' }
              examples:
                delta: { $ref: '#/components/examples/ChangesExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
