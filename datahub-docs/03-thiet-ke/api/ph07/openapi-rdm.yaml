        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  # ------------------------------------------------------------------ Bản ghi (quản trị)
  /catalogs/{catalogCode}/versions/{versionRef}/items:
    parameters:
      - $ref: '#/components/parameters/CatalogCode'
      - $ref: '#/components/parameters/VersionRef'
    get:
      tags: [Bản ghi (quản trị)]
      operationId: listVersionItems
      summary: Bản ghi của một phiên bản (quản trị)
      description: |
        Phục vụ UI-07-02/05: phân trang theo trang, lọc theo trạng thái, mã cha, trạng thái thay
        đổi so với phiên bản hiện hành (`changeState`, chỉ có nghĩa với bản nháp), tìm không dấu.
