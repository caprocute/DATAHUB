    post:
      tags: [Đơn vị hành chính]
      operationId: createSuccession
      summary: Ghi sự kiện sắp xếp vào bản nháp
      description: |
        Ghi một sự kiện `MERGE`, `SPLIT`, `RENAME`, `ABOLISH`, `ESTABLISH`, `RECODE`. Kiểm tra:
        `fromCodes` tồn tại trong phiên bản hiện hành, `toCodes` tồn tại trong bản nháp, số
        phần tử phù hợp loại sự kiện (MERGE n→1, SPLIT 1→n, RENAME/RECODE 1→1, ABOLISH n→0,
        ESTABLISH 0→n), có `legalBasis`, `effectiveDate` bằng `effectiveFrom` của bản nháp hoặc
        nằm trong khoảng của nó (BR-07-021, ERR-07-035). Tùy chọn `applyToItems = true` tự ngừng
