        `changes` phân trang theo trang. Mỗi thay đổi có cờ `breaking` theo quy tắc §3 mục 18 của
        khung (ngừng dùng/xóa mã, đổi mã cha, xóa thuộc tính, đổi kiểu, thu hẹp ràng buộc).
