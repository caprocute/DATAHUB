      description: |
        Thêm một bản ghi. Mã được chuẩn hóa chữ hoa, duy nhất trong phiên bản (BR-07-002,
        ERR-07-008). `attrs` được kiểm tra theo JSON Schema của phiên bản (ERR-07-009). Với danh
        mục phân cấp, `parentCode` phải tồn tại và độ sâu ≤ `maxDepth` (ERR-07-010, 011). Với
        danh mục HYBRID, mã phải khớp `localCodePattern` và không trùng mã danh mục gốc (ERR-07-012).
        `depth`, `path`, `levelName` do máy chủ tính. ETag trả về là ETag mới của phiên bản để
        client tiếp tục gửi `If-Match` cho thao tác sau.
