      operationId: getCatalogSchema
      summary: Lược đồ danh mục và JSON Schema
      description: |
        Trả metadata danh mục, cấu hình phân cấp, danh sách thuộc tính và JSON Schema (draft
        2020-12) mô tả một bản ghi của phiên bản yêu cầu, để HTTT sinh mã kiểm tra dữ liệu phía
        mình. `schemaHash` đổi khi và chỉ khi lược đồ đổi, nên client có thể so để biết có cần
        sinh lại mã hay không. Mặc định phiên bản hiện hành; `version` nhận số hoặc `current`.
      x-datahub-id: API-07-048
      x-datahub-fr: [FR-07-033]
      x-datahub-permission:
