      operationId: deleteSuccession
      summary: Xóa sự kiện sắp xếp trong bản nháp
      description: Chỉ với phiên bản DRAFT. Không tự khôi phục trạng thái bản ghi đã bị ngừng dùng bởi `applyToItems`.
