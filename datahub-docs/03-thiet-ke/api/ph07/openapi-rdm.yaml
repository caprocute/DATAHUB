        phiên bản trả 404 ERR-07-007 (khác với ERR-07-001 khi chính danh mục không tồn tại, để
        client phân biệt lỗi cấu hình và lỗi dữ liệu). Mục tiêu p95 ≤ 20 ms (NFR-07-001): đường
        đi không chạm CSDL khi trúng bộ đệm L1/L2.
