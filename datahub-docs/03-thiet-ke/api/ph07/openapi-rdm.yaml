  # ------------------------------------------------------------------ Nền tảng (đường dẫn gốc khác)
  /tenants/{tenantId}:seed:
    servers:
      - url: https://api.platform.datahub.example.vn/api/platform/rdm/v1
        description: Cổng API nền tảng (liên tenant) — giả lập
      - url: http://localhost:8080/api/platform/rdm/v1
        description: Phát triển cục bộ
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Nền tảng]
      operationId: seedTenantCatalogs
      summary: Nạp gói danh mục nền cho tenant mới
      description: |
        Đường dẫn đầy đủ `POST /api/platform/rdm/v1/tenants/{tenantId}:seed`. PH-20 gọi trong
        saga khởi tạo tenant (D03-10 §5). Gói nền gồm nhóm danh mục chuẩn và danh mục LOCAL mẫu
        (rỗng hoặc có dữ liệu mẫu), danh mục HYBRID mở rộng ĐVHC cho tỉnh; danh mục COMMON không
        sao chép mà chỉ liên kết. Idempotent theo (`tenantId`, `packageVersion`): gọi lại trả kết
        quả cũ và danh mục đã tồn tại được `SKIPPED_EXISTS`. Thao tác bù trừ của saga là
        `dryRun = false, rollback = true` (xóa mềm danh mục do lần nạp tạo khi còn DRAFT).
