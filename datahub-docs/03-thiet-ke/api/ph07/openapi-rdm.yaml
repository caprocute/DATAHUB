        permission: PLATFORM
        note: Chỉ client dịch vụ của PH-20 (scope `platform.tenant.provision`, giả định) hoặc ROLE-PLATFORM_ADMIN.
      x-datahub-idempotent: true
      security:
        - oauth2Client: [platform.tenant.provision]
        - oauth2User: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeedRequest' }
            examples:
              t68: { $ref: '#/components/examples/SeedRequestExample' }
      responses:
        '200':
          description: Đã nạp (hoặc trả lại kết quả lần nạp trước).
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeedResult' }
              examples:
                ketQua: { $ref: '#/components/examples/SeedResultExample' }
        '202':
          description: Gói lớn, đang nạp nền.
          headers:
            Location: { $ref: '#/components/headers/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  # ================================================================== Bảo mật
  securitySchemes:
    oauth2Client:
      type: oauth2
      description: |
        HTTT thành viên lấy token bằng Client Credentials tại realm Keycloak của tenant
        (`dh-t68` cho T68). Scope được sinh tự động từ đăng ký sử dụng đã duyệt (D02-08 §5):
        `rdm.read` tra cứu, `rdm.query` truy vấn có cấu trúc, `rdm.write` nhập lô vào bản nháp.
        APISIX kiểm tra chữ ký và scope trước khi chuyển tới `dh-data`; `dh-data` kiểm tra lại
        tenant và quyền khai thác danh mục RESTRICTED (BR-07-019).
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            rdm.read: Tra cứu danh mục (một mã, lô, toàn bộ, cây, delta, lược đồ, ảnh chụp, chuyển mã)
            rdm.query: Truy vấn có cấu trúc bằng DSL (items:query)
            rdm.write: Ghi lô bản ghi vào bản nháp (items:batch) với danh mục được cấp
            platform.tenant.provision: Chỉ client dịch vụ PH-20 — nạp gói danh mục nền (giả định)
    oauth2User:
      type: oauth2
      description: |
        Người dùng đăng nhập qua OIDC Authorization Code + PKCE (FR-00-001). Quyền chi tiết
        `PERM-07-*` lấy từ vai trò trong realm tenant và được OPA đánh giá theo D02-08; phạm vi
        tổ chức (○) căn cứ `catalog.ownerOrgId`.
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            openid: Định danh OIDC
            profile: Thông tin hồ sơ cơ bản
  # ================================================================== Tham số
  parameters:
    CatalogCode:
      name: catalogCode
      in: path
      required: true
      description: Mã danh mục (T-CODE). So khớp không phân biệt hoa thường; máy chủ chuẩn hóa chữ hoa.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
      example: DVHC
    VersionRef:
      name: versionRef
      in: path
      required: true
      description: Số phiên bản (1, 2, …), `current` (phiên bản hiệu lực hôm nay theo giờ Việt Nam) hoặc `draft` (phiên bản đang mở).
      schema:
        type: string
        pattern: '^([1-9][0-9]{0,5}|current|draft)$'
      examples:
        so: { value: '12' }
        hienHanh: { value: current }
        nhap: { value: draft }
    ItemCode:
      name: itemCode
      in: path
      required: true
      description: Mã bản ghi. Mã có ký tự đặc biệt phải mã hóa URL; so khớp không phân biệt hoa thường.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
      example: '24727'
    AttrCode:
      name: attrCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AttrCode' }
      example: loai_hinh
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MappingId:
      name: mappingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SuccessionId:
      name: successionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CsCode:
      name: csCode
      in: path
      required: true
      description: Mã hệ thống mã ngoài (T-CODE).
      schema: { $ref: '#/components/schemas/TCode' }
      example: MOTCUA_T68
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TenantCode' }
      example: T68
    At:
      name: at
      in: query
      description: |
        Ngày cần tra (T-DATE, `yyyy-MM-dd`). Mặc định ngày hiện tại theo giờ Việt Nam (UTC+7).
        Phiên bản được chọn là phiên bản đã phát hành có `effectiveFrom ≤ at < effectiveTo`.
        Không dùng cùng `versionNo`.
      schema: { type: string, format: date }
      example: '2025-06-30'
    VersionNoQuery:
      name: versionNo
      in: query
      description: Chỉ định chính xác phiên bản đã phát hành (thay cho `at`).
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      description: Số trang, bắt đầu từ 0.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Số dòng mỗi trang (FR-00-021). Tối đa 200.
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Con trỏ mờ lấy từ `cursor.next` của trang trước. Không tự tạo hay giải mã; hết hạn sau 24 giờ.
      schema: { type: string, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
    Limit:
      name: limit
      in: query
      description: Số bản ghi tối đa mỗi trang con trỏ.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
    Fields:
      name: fields
      in: query
      style: form
      explode: false
      description: Chọn trường trả về, ví dụ `code,name,attrs.loai_hinh`. Mặc định tất cả.
      schema:
        type: array
        maxItems: 50
        items: { type: string, pattern: '^(code|name|parentCode|depth|path|levelName|sortOrder|status|replacedBy|validFrom|validTo|isLocalExtension|attrs|attrs\.[a-z][a-z0-9_]{0,62})$' }
    IncludeDeprecated:
      name: includeDeprecated
      in: query
      description: Kèm bản ghi `DEPRECATED`. Mặc định `false` cho danh sách; tra một mã luôn trả kể cả ngừng dùng.
      schema: { type: boolean, default: false }
    Q:
      name: q
      in: query
      description: Từ khóa tìm không phân biệt hoa thường và dấu tiếng Việt (FR-00-020).
      schema: { type: string, maxLength: 100 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag nhận từ lần đọc trước (sinh từ cột `version`). Không khớp trả 412 ERR-07-018; thiếu trả 428 được quy về 400 ERR-07-040.
      schema: { type: string, example: 'W/"7"' }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag đang giữ; trùng thì máy chủ trả 304 không thân.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Khóa chống trùng do client sinh (khuyến nghị UUID v4/v7), 16–128 ký tự. Máy chủ lưu
        (khóa, chủ thể, phương thức, đường dẫn, SHA-256 thân) trong 24 giờ: gửi lại cùng khóa và
        cùng thân trả lại phản hồi đã lưu kèm `Idempotent-Replayed: true`; cùng khóa khác thân trả
        409 ERR-07-022. Bắt buộc với HTTT, khuyến nghị với giao diện.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Như `Idempotency-Key` nhưng bắt buộc.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context. Nếu vắng, APISIX sinh mới. `traceId` trong lỗi lấy từ đây.
      schema: { type: string, pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$' }
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    Prefer:
      name: Prefer
      in: header
      required: false
      description: RFC 7240. `respond-async` yêu cầu xử lý nền và nhận 202.
      schema: { type: string, enum: [respond-async] }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: '`vi` (mặc định) hoặc `en`; ảnh hưởng `title`/`detail` của lỗi và nhãn hệ thống, không dịch dữ liệu danh mục.'
      schema: { type: string, default: vi }
  # ================================================================== Header phản hồi
  headers:
    ETag:
      description: Thẻ thực thể. Tài nguyên quản trị dùng ETag yếu `W/"{version}"`; tài nguyên khai thác dùng ETag mạnh gắn với `versionId` của phiên bản danh mục.
      schema: { type: string }
      example: W/"7"
    Location:
      description: URL tuyệt đối của tài nguyên vừa tạo, tác vụ nền, hoặc URL ký sẵn (302).
      schema: { type: string, format: uri }
    RetryAfter:
      description: Số giây nên chờ trước khi hỏi lại trạng thái tác vụ.
      schema: { type: integer, minimum: 1 }
    CacheControl:
      description: |
        API khai thác: `public, max-age=300, stale-while-revalidate=60` khi yêu cầu tra theo
        `versionNo` cụ thể có thể dùng `max-age=86400, immutable`. API quản trị: `no-store`.
      schema: { type: string }
      example: public, max-age=300, stale-while-revalidate=60
    DatahubVersionNo:
      description: Số phiên bản danh mục đã dùng để trả lời (giúp client biết phiên bản hiện hành mà không cần gọi thêm).
      schema: { type: integer }
      example: 12
    IdempotentReplayed:
      description: '`true` khi phản hồi là bản lưu của lần gọi trước cùng `Idempotency-Key`.'
      schema: { type: boolean }
    ContentDisposition:
      description: Tên tệp tải về, ví dụ `attachment; filename="DVHC_v12.xlsx"`.
      schema: { type: string }
    SnapshotSha256:
      description: SHA-256 (hex) của tệp ảnh chụp để client kiểm tra toàn vẹn sau khi tải.
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    RateLimitLimit:
      description: Hạn mức yêu cầu trong cửa sổ hiện tại (do APISIX đặt, theo draft IETF RateLimit headers).
      schema: { type: integer }
    RateLimitRemaining:
      description: Số yêu cầu còn lại trong cửa sổ.
      schema: { type: integer }
    RateLimitReset:
      description: Số giây đến khi cửa sổ đặt lại.
      schema: { type: integer }
  # ================================================================== Phản hồi lỗi dùng chung
  responses:
    NotModified:
      description: Không đổi so với ETag client đang giữ.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
    BadRequest:
      description: Yêu cầu sai cú pháp hoặc vi phạm giới hạn đầu vào (ERR-07-023, 025, 026, 040).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          examples:
            loTooLon: { $ref: '#/components/examples/ProblemBatchTooLarge' }
            truyVanSai: { $ref: '#/components/examples/ProblemQuerySyntax' }
            khongChoTruyVan: { $ref: '#/components/examples/ProblemNotQueryable' }
            thamSoSai: { $ref: '#/components/examples/ProblemBadParam' }
    Unauthorized:
      description: Thiếu token hoặc token không hợp lệ, hết hạn (ERR-07-041).
      headers:
        WWW-Authenticate:
          schema: { type: string }
          description: 'Ví dụ `Bearer realm="dh-t68", error="invalid_token"`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          examples:
            hetHan: { $ref: '#/components/examples/ProblemUnauthorized' }
    Forbidden:
      description: Không đủ quyền (ERR-07-046), danh mục chỉ đọc (ERR-07-003), tự duyệt (ERR-07-015), HTTT chưa được cấp quyền danh mục hạn chế (ERR-07-030).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          examples:
            chiDoc: { $ref: '#/components/examples/ProblemReadOnly' }
            tuDuyet: { $ref: '#/components/examples/ProblemSelfApproval' }
            hanChe: { $ref: '#/components/examples/ProblemRestricted' }
            thieuQuyen: { $ref: '#/components/examples/ProblemForbidden' }
    NotFound:
      description: Không tìm thấy danh mục (ERR-07-001), phiên bản (ERR-07-006), mã bản ghi tại thời điểm (ERR-07-007), ánh xạ (ERR-07-027) hoặc tài nguyên khác (ERR-07-045). Đối tượng của tenant khác luôn trả 404 để không lộ sự tồn tại (FR-00-011).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          examples:
            danhMuc: { $ref: '#/components/examples/ProblemCatalogNotFound' }
            maBanGhi: { $ref: '#/components/examples/ProblemItemNotFound' }
    Conflict:
      description: Xung đột trạng thái (ERR-07-002, 004, 005, 008, 013, 016, 020, 022, 029, 032, 033, 037).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          examples:
            daCoBanMo: { $ref: '#/components/examples/ProblemOpenVersion' }
            canDuyet: { $ref: '#/components/examples/ProblemApprovalRequired' }
            trungKhoa: { $ref: '#/components/examples/ProblemIdempotencyReused' }
            dangThamChieu: { $ref: '#/components/examples/ProblemReferenced' }
    Gone:
      description: Danh mục đã ngừng hiệu lực tại thời điểm tra (ERR-07-031).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          examples:
            ngung: { $ref: '#/components/examples/ProblemRetired' }
    PreconditionFailed:
      description: ETag không khớp, đối tượng đã bị người khác sửa (ERR-07-018).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          examples:
            etag: { $ref: '#/components/examples/ProblemPrecondition' }
    PayloadTooLarge:
      description: Thân yêu cầu hoặc tệp vượt kích thước tối đa (ERR-07-042).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          examples:
            tepLon: { $ref: '#/components/examples/ProblemTooLarge' }
    UnsupportedMediaType:
      description: Kiểu nội dung không hỗ trợ (ERR-07-043).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          examples:
            kieu: { $ref: '#/components/examples/ProblemMediaType' }
    UnprocessableEntity:
      description: Dữ liệu đúng cú pháp nhưng vi phạm quy tắc nghiệp vụ (ERR-07-009…012, 014, 017, 019, 021, 024, 034, 035, 036).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          examples:
            thuocTinh: { $ref: '#/components/examples/ProblemAttrInvalid' }
            maCha: { $ref: '#/components/examples/ProblemParentInvalid' }
            ngayHieuLuc: { $ref: '#/components/examples/ProblemEffectiveDate' }
            tepLoi: { $ref: '#/components/examples/ProblemImportHasErrors' }
            truyVanVuot: { $ref: '#/components/examples/ProblemQueryLimit' }
            nhayCam: { $ref: '#/components/examples/ProblemSensitive' }
    TooManyRequests:
      description: Vượt giới hạn tần suất (ERR-07-044), do APISIX hoặc `dh-data` trả.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          examples:
            vuot: { $ref: '#/components/examples/ProblemRateLimited' }
    BadGateway:
      description: Nguồn quốc gia NDXP (qua PH-14) không phản hồi hoặc trả lỗi (ERR-07-028).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          examples:
            ndxp: { $ref: '#/components/examples/ProblemNdxp' }
    ServiceUnavailable:
      description: Tài nguyên tạm chưa sẵn sàng (ảnh chụp đang sinh) hoặc phân hệ phụ thuộc không sẵn sàng (ERR-07-047).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          examples:
            dangSinh: { $ref: '#/components/examples/ProblemUnavailable' }
  # ================================================================== Lược đồ dữ liệu
  schemas:
    # ---------------------------------------------------------------- Kiểu chuẩn D00-01 §5
    TId:
      type: string
      format: uuid
      description: T-ID, UUID phiên bản 7.
    TCode:
      type: string
      pattern: '^[A-Z0-9][A-Z0-9_.-]{0,63}$'
      description: T-CODE, chữ hoa. Đầu vào chữ thường được chuẩn hóa thành chữ hoa trước khi kiểm tra.
    TName:
      type: string
      minLength: 1
      maxLength: 255
      description: T-NAME, Unicode NFC.
    TText:
      type: string
      maxLength: 4000
    TDate:
      type: string
      format: date
    TTs:
      type: string
      format: date-time
    TenantCode:
      type: string
      pattern: '^(T\d{2}|PLATFORM|COMMON)$'
    AttrCode:
      type: string
      pattern: '^([a-z][a-z0-9_]{0,62}|[A-Z0-9][A-Z0-9_.-]{0,63})$'
      description: Mã thuộc tính, dạng snake_case hoặc T-CODE. Không trùng tên trường hệ thống.
    ItemCodeValue:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
      description: Mã bản ghi; lưu chữ hoa (BR-07-002).
    AuditFields:
      type: object
      properties:
        createdAt: { $ref: '#/components/schemas/TTs' }
        createdBy: { type: string, description: "Định danh người tạo (T-ID) hoặc `client:{clientId}` với HTTT." }
        updatedAt: { $ref: '#/components/schemas/TTs' }
        updatedBy: { type: string }
        version: { type: integer, minimum: 0, description: 'Khóa lạc quan; ETag = `W/"{version}"`.' }
    # ---------------------------------------------------------------- Liệt kê
    SourceType:
      type: string
      enum: [LOCAL, NATIONAL, HYBRID]
      description: LOCAL tỉnh tự quản; NATIONAL đồng bộ từ NDXP, chỉ đọc với người dùng; HYBRID mở rộng danh mục COMMON/NATIONAL bằng bản ghi địa phương.
    Classification:
      type: string
      enum: [PUBLIC, INTERNAL, RESTRICTED]
    CatalogStatus:
      type: string
      enum: [DRAFT, ACTIVE, RETIRED]
    VersionStatus:
      type: string
      enum: [DRAFT, IN_REVIEW, APPROVED, PUBLISHED, DISCARDED]
    EffectiveState:
      type: string
      enum: [CURRENT, UPCOMING, EXPIRED]
      description: Nhãn tính từ khoảng hiệu lực của phiên bản PUBLISHED so với hôm nay; không lưu.
    VersionOrigin:
      type: string
      enum: [MANUAL, IMPORT, API, SYNC, MIGRATION]
    ItemStatus:
      type: string
      enum: [ACTIVE, DEPRECATED]
    ItemChangeType:
      type: string
      enum: [ADDED, CHANGED, DEPRECATED, REACTIVATED, DELETED]
    AttributeDataType:
      type: string
      enum: [STRING, TEXT, INTEGER, DECIMAL, BOOLEAN, DATE, DATETIME, ENUM, CATALOG_REF, URI, EMAIL]
      description: |
        STRING ≤ 1000 ký tự (mặc định 255); TEXT ≤ 4000; INTEGER int64; DECIMAL số thập phân
        lưu dạng chuỗi số trong JSON nếu vượt độ chính xác double; BOOLEAN; DATE `yyyy-MM-dd`;
        DATETIME ISO 8601 có múi giờ; ENUM giá trị trong `enumValues`; CATALOG_REF mã bản ghi của
        danh mục `refCatalogCode` (kiểm tra tại thời điểm hiệu lực); URI; EMAIL.
    AttributeStatus:
      type: string
      enum: [ACTIVE, HIDDEN]
    SuccessionEventType:
      type: string
      enum: [MERGE, SPLIT, RENAME, ABOLISH, ESTABLISH, RECODE]
    ImportMode:
      type: string
      enum: [UPSERT, REPLACE, APPEND, CREATE_CATALOG]
    ImportTemplate:
      type: string
      enum: [STANDARD, LEGACY_AITA]
    FileFormat:
      type: string
      enum: [XLSX, CSV, JSON]
    ImportJobStatus:
      type: string
      enum: [UPLOADED, SCANNING, PARSING, VALIDATING, VALIDATED, COMMITTING, COMMITTED, FAILED, CANCELLED, EXPIRED]
      description: UPLOADED → SCANNING (quét mã độc DD-12) → PARSING → VALIDATING → VALIDATED → COMMITTING → COMMITTED; FAILED khi tệp nhiễm mã độc, sai định dạng hoặc lỗi hệ thống; EXPIRED sau 24 giờ không commit.
    ImportRowAction:
      type: string
      enum: [INSERT, UPDATE, DEPRECATE, UNCHANGED, DELETE_DRAFT]
    ExportJobStatus:
      type: string
      enum: [QUEUED, RUNNING, COMPLETED, FAILED, EXPIRED]
    SyncRunStatus:
      type: string
      enum: [RUNNING, NO_CHANGE, APPLIED, PENDING_CONFIRMATION, REJECTED, FAILED]
    SyncChangeType:
      type: string
      enum: [ADDED, CHANGED, REMOVED, ATTRIBUTE_ADDED, ATTRIBUTE_REMOVED, ATTRIBUTE_TYPE_CHANGED]
    MappingRelation:
      type: string
      enum: [EQUAL, BROADER, NARROWER, RELATED]
      description: Quan hệ ngữ nghĩa từ mã danh mục tới mã ngoài theo SKOS (exactMatch, broadMatch, narrowMatch, relatedMatch).
    # ---------------------------------------------------------------- Lỗi RFC 9457
    ProblemDetails:
      type: object
      description: Lỗi theo RFC 9457 mở rộng. `title`, `detail` bằng tiếng Việt (FR-00-080).
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
          description: '`https://datahub.gov.vn/problems/rdm/{slug}` (tên miền giả định, chờ chốt).'
        title: { type: string, description: 'Tóm tắt ngắn, cố định theo `code`.' }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: Mô tả cụ thể lần lỗi này và cách khắc phục. }
        instance: { type: string, format: uri-reference, description: Đường dẫn yêu cầu gây lỗi. }
        code:
          type: string
          pattern: '^ERR-(07|00)-\d{3}$'
          description: Mã lỗi ERR-07-nnn (hoặc ERR-00-nnn của tầng dùng chung).
        traceId: { type: string, pattern: '^[0-9a-f]{32}$', description: 'T-TRACE từ `traceparent`.' }
        timestamp: { $ref: '#/components/schemas/TTs' }
        errors:
          type: array
          maxItems: 1000
          description: Lỗi chi tiết theo dòng/trường. Với lô, `row` là chỉ số thao tác (từ 0); với tệp, `row` là số dòng trong tệp (từ 1).
          items: { $ref: '#/components/schemas/ProblemError' }
        errorsTruncated: { type: boolean, description: '`true` nếu có hơn 1000 lỗi; tải đầy đủ qua báo cáo lỗi.' }
      additionalProperties: true
    ProblemError:
      type: object
      required: [code, message]
      properties:
        row: { type: integer, minimum: 0 }
        itemCode: { type: string }
        field: { type: string, description: 'Trường hoặc đường dẫn, ví dụ `attrs.loai_hinh`, `parentCode`, cột `MA_CHA`.' }
        code: { type: string, description: 'Mã lỗi con, ví dụ `REQUIRED`, `MAX_LENGTH`, `PATTERN`, `ENUM`, `TYPE`, `UNIQUE`, `REF_NOT_FOUND`, `PARENT_NOT_FOUND`, `CYCLE`, `DEPTH`, `LOCAL_RANGE`.' }
        message: { type: string }
        value: { description: Giá trị gây lỗi (đã cắt ≤ 200 ký tự). }
    # ---------------------------------------------------------------- Phân trang
    PageMeta:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 200 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    CursorMeta:
      type: object
      required: [limit, hasMore]
      properties:
        limit: { type: integer, minimum: 1, maximum: 1000 }
        next: { type: [string, 'null'], description: 'Con trỏ trang kế; `null` khi hết.' }
        hasMore: { type: boolean }
        total: { type: integer, description: 'Tổng số bản ghi của phiên bản (chỉ trả ở trang đầu, có thể bỏ qua khi tốn kém).' }
    # ---------------------------------------------------------------- Danh mục
    Catalog:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required: [id, tenantId, code, name, sourceType, classification, status, isHierarchical, requireApproval]
          properties:
            id: { $ref: '#/components/schemas/TId' }
            tenantId: { $ref: '#/components/schemas/TenantCode' }
            code: { $ref: '#/components/schemas/TCode' }
            name: { $ref: '#/components/schemas/TName' }
            description: { $ref: '#/components/schemas/TText' }
            groupId: { type: [string, 'null'], format: uuid }
            groupName: { type: [string, 'null'], readOnly: true }
            ownerOrgId: { type: [string, 'null'], format: uuid, description: Tổ chức chủ quản (FK logic DD-02). }
            ownerOrgName: { type: [string, 'null'], readOnly: true }
            sourceType: { $ref: '#/components/schemas/SourceType' }
            classification: { $ref: '#/components/schemas/Classification' }
            status: { $ref: '#/components/schemas/CatalogStatus' }
            isHierarchical: { type: boolean }
            maxDepth: { type: [integer, 'null'], minimum: 1, maximum: 10 }
            levelNames:
              type: array
              maxItems: 10
              items: { type: string, maxLength: 64 }
              description: 'Tên từng cấp theo độ sâu, ví dụ `["Tỉnh","Xã"]`.'
            localCodePattern: { type: [string, 'null'], maxLength: 255, description: Biểu thức chính quy dải mã địa phương (HYBRID). }
            extendsCatalogId: { type: [string, 'null'], format: uuid }
            extendsCatalogCode: { type: [string, 'null'], readOnly: true }
            requireApproval: { type: boolean }
            currentVersionId: { type: [string, 'null'], format: uuid }
            currentVersionNo: { type: [integer, 'null'], readOnly: true }
            currentEffectiveFrom: { type: [string, 'null'], format: date, readOnly: true }
            openVersion:
              type: [object, 'null']
              readOnly: true
              description: Phiên bản đang mở (DRAFT/IN_REVIEW/APPROVED) nếu có.
              properties:
                versionNo: { type: integer }
                status: { $ref: '#/components/schemas/VersionStatus' }
                updatedAt: { $ref: '#/components/schemas/TTs' }
            itemCount: { type: integer, readOnly: true, description: Số bản ghi ACTIVE của phiên bản hiện hành. }
            hasSyncSource: { type: boolean, readOnly: true }
            retiredAt: { type: [string, 'null'], format: date-time, readOnly: true }
            retireReason: { type: [string, 'null'], readOnly: true }
            legacyRef: { type: [string, 'null'], description: Định danh danh mục ở hệ cũ Aita (di trú). }
    CatalogCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/TCode' }
        name: { $ref: '#/components/schemas/TName' }
        description: { $ref: '#/components/schemas/TText' }
        groupId: { type: string, format: uuid }
        ownerOrgId: { type: string, format: uuid, description: Mặc định tổ chức của người tạo. }
        sourceType: { type: string, enum: [LOCAL, HYBRID], default: LOCAL }
        classification: { $ref: '#/components/schemas/Classification' }
        isHierarchical: { type: boolean, default: false }
        maxDepth: { type: integer, minimum: 1, maximum: 10 }
        levelNames:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 64 }
        localCodePattern: { type: string, maxLength: 255 }
        extendsCatalogCode: { $ref: '#/components/schemas/TCode' }
        requireApproval: { type: boolean, default: true }
        attributes:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AttributeDefCreateRequest' }
        initialVersion: { $ref: '#/components/schemas/VersionCreateRequest' }
      allOf:
        - if:
            properties: { sourceType: { const: HYBRID } }
            required: [sourceType]
          then:
            required: [extendsCatalogCode, localCodePattern]
        - if:
            properties: { isHierarchical: { const: true } }
            required: [isHierarchical]
          then:
            required: [maxDepth]
    CatalogUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/TName' }
        description: { type: [string, 'null'], maxLength: 4000 }
        groupId: { type: [string, 'null'], format: uuid }
        ownerOrgId: { type: string, format: uuid }
        sourceType: { type: string, enum: [LOCAL, HYBRID] }
        classification: { $ref: '#/components/schemas/Classification' }
        isHierarchical: { type: boolean }
        maxDepth: { type: [integer, 'null'], minimum: 1, maximum: 10 }
        levelNames:
          type: [array, 'null']
          maxItems: 10
          items: { type: string, maxLength: 64 }
        localCodePattern: { type: [string, 'null'], maxLength: 255 }
        requireApproval: { type: boolean }
    CatalogRetireRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 1000 }
        effectiveTo: { $ref: '#/components/schemas/TDate' }
    CatalogPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Catalog' }
        page: { $ref: '#/components/schemas/PageMeta' }
        facets:
          type: object
          description: Số đếm theo trạng thái, nguồn trên toàn tập kết quả trước phân trang (UI-07-01).
          properties:
            status: { type: object, additionalProperties: { type: integer } }
            sourceType: { type: object, additionalProperties: { type: integer } }
    # ---------------------------------------------------------------- Nhóm
    CatalogGroup:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required: [id, code, name]
          properties:
            id: { $ref: '#/components/schemas/TId' }
            tenantId: { $ref: '#/components/schemas/TenantCode' }
            code: { $ref: '#/components/schemas/TCode' }
            name: { $ref: '#/components/schemas/TName' }
            parentId: { type: [string, 'null'], format: uuid }
            sortOrder: { type: integer, default: 0 }
            description: { type: [string, 'null'], maxLength: 4000 }
            catalogCount: { type: integer, readOnly: true }
            children:
              type: array
              items: { $ref: '#/components/schemas/CatalogGroup' }
    CatalogGroupCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/TCode' }
        name: { $ref: '#/components/schemas/TName' }
        parentId: { type: [string, 'null'], format: uuid }
        sortOrder: { type: integer, default: 0 }
        description: { type: [string, 'null'], maxLength: 4000 }
    CatalogGroupUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/TName' }
        parentId: { type: [string, 'null'], format: uuid }
        sortOrder: { type: integer }
        description: { type: [string, 'null'], maxLength: 4000 }
    # ---------------------------------------------------------------- Phiên bản
    VersionStats:
      type: object
      description: Thống kê thay đổi so với phiên bản trước (cột `stats jsonb`).
      properties:
        added: { type: integer, minimum: 0 }
        changed: { type: integer, minimum: 0 }
        deprecated: { type: integer, minimum: 0 }
        reactivated: { type: integer, minimum: 0 }
        deleted: { type: integer, minimum: 0, description: Chỉ khác 0 với phiên bản SYNC/MIGRATION. }
        attributeChanges: { type: integer, minimum: 0 }
        breaking: { type: integer, minimum: 0, description: Số thay đổi phá vỡ. }
        changeRatio: { type: number, minimum: 0, description: '(added+changed+deprecated)/số bản ghi phiên bản trước; so với ngưỡng `07.rdm.large-change-threshold-percent`.' }
    VersionReview:
      type: object
      required: [action, actor, at]
      properties:
        action: { type: string, enum: [SUBMIT, APPROVE, REJECT, PUBLISH, DISCARD] }
        actor: { type: string }
        actorName: { type: string }
        comment: { type: [string, 'null'] }
        diffStats: { $ref: '#/components/schemas/VersionStats' }
        at: { $ref: '#/components/schemas/TTs' }
    CatalogVersion:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required: [id, catalogCode, versionNo, status, origin]
          properties:
            id: { $ref: '#/components/schemas/TId' }
            catalogId: { $ref: '#/components/schemas/TId' }
            catalogCode: { $ref: '#/components/schemas/TCode' }
            versionNo: { type: integer, minimum: 1 }
            status: { $ref: '#/components/schemas/VersionStatus' }
            effectiveState: { oneOf: [{ $ref: '#/components/schemas/EffectiveState' }, { type: 'null' }] }
            effectiveFrom: { type: [string, 'null'], format: date }
            effectiveTo: { type: [string, 'null'], format: date, description: Không gồm (khoảng nửa mở). }
            legalBasis: { type: [string, 'null'], maxLength: 1000, description: 'Căn cứ ban hành (số, ngày, cơ quan ban hành văn bản).' }
            changeNote: { type: [string, 'null'], maxLength: 4000 }
            origin: { $ref: '#/components/schemas/VersionOrigin' }
            baseVersionNo: { type: [integer, 'null'], description: Phiên bản gốc khi tạo bản nháp. }
            itemCount: { type: integer, minimum: 0 }
            stats: { $ref: '#/components/schemas/VersionStats' }
            requiresApproval: { type: boolean, readOnly: true, description: Tính theo BR-07-012/026 tại thời điểm đọc. }
            submittedBy: { type: [string, 'null'] }
            submittedAt: { type: [string, 'null'], format: date-time }
            approvedBy: { type: [string, 'null'] }
            approvedAt: { type: [string, 'null'], format: date-time }
            publishedBy: { type: [string, 'null'] }
            publishedAt: { type: [string, 'null'], format: date-time }
            snapshotAvailable: { type: boolean, readOnly: true, description: 'Ảnh chụp đã sinh xong; tải qua API-07-049 (không lộ `snapshotUri` nội bộ).' }
            schemaHash: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
            copying: { type: boolean, readOnly: true, description: Bản nháp đang được sao chép nền (202 của API-07-012). }
            lastValidation: { oneOf: [{ $ref: '#/components/schemas/ValidationReport' }, { type: 'null' }] }
            reviews:
              type: array
              items: { $ref: '#/components/schemas/VersionReview' }
    VersionCreateRequest:
      type: object
      properties:
        baseVersionNo: { type: integer, minimum: 1, description: Mặc định phiên bản hiện hành. }
        effectiveFrom: { $ref: '#/components/schemas/TDate' }
        legalBasis: { type: string, maxLength: 1000 }
        changeNote: { type: string, maxLength: 4000 }
    VersionUpdateRequest:
      type: object
      minProperties: 1
      properties:
        effectiveFrom: { type: [string, 'null'], format: date }
        legalBasis: { type: [string, 'null'], maxLength: 1000 }
        changeNote: { type: [string, 'null'], maxLength: 4000 }
        retroactiveReason: { type: [string, 'null'], maxLength: 1000, description: 'Bắt buộc khi `effectiveFrom` < hôm nay (chỉ origin SYNC/MIGRATION).' }
    VersionActionRequest:
      type: object
      description: |
        Thân của API-07-017 (trình, rút lại) và API-07-018 (duyệt, thu hồi duyệt) theo FR-07-015.
        `action` của API-07-017 nhận `SUBMIT` (mặc định) hoặc `WITHDRAW` (người trình rút lại);
        của API-07-018 nhận `APPROVE` (mặc định) hoặc `UNAPPROVE` (thu hồi duyệt trước khi phát hành).
        Giá trị không thuộc API tương ứng trả ERR-07-009.
      properties:
        action: { type: string, enum: [SUBMIT, WITHDRAW, APPROVE, UNAPPROVE] }
        comment: { type: string, maxLength: 4000 }
        effectiveFrom: { $ref: '#/components/schemas/TDate' }
        legalBasis: { type: string, maxLength: 1000 }
    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 2000 }
    PublishRequest:
      type: object
      properties:
        effectiveFrom: { $ref: '#/components/schemas/TDate' }
        legalBasis: { type: string, maxLength: 1000 }
        comment: { type: string, maxLength: 2000 }
        changeNote: { type: string, maxLength: 4000 }
        retroactiveReason:
          type: string
          minLength: 10
          maxLength: 1000
          description: Bắt buộc khi `effectiveFrom` trước hôm nay (chỉ phiên bản `origin` SYNC, MIGRATION; BR-07-027).
    ValidationReport:
      type: object
      required: [valid, errorCount, warningCount]
      properties:
        valid: { type: boolean }
        errorCount: { type: integer, minimum: 0 }
        warningCount: { type: integer, minimum: 0 }
        checkedAt: { $ref: '#/components/schemas/TTs' }
        stats: { $ref: '#/components/schemas/VersionStats' }
        breaking: { type: boolean }
        requiresApproval: { type: boolean }
        approvalReasons:
          type: array
          items: { type: string, enum: [CATALOG_POLICY, LARGE_CHANGE, BREAKING_CHANGE] }
        issues:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [severity, code, message]
            properties:
              severity: { type: string, enum: [ERROR, WARNING] }
              itemCode: { type: [string, 'null'] }
              field: { type: [string, 'null'] }
              code: { type: string }
              message: { type: string }
        issuesTruncated: { type: boolean }
    CatalogVersionPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CatalogVersion' }
        page: { $ref: '#/components/schemas/PageMeta' }
    # ---------------------------------------------------------------- Thuộc tính
    EnumValue:
      type: object
      required: [value, label]
      properties:
        value: { type: string, maxLength: 64 }
        label: { type: string, maxLength: 255 }
        deprecated: { type: boolean, default: false }
    AttributeDefBase:
      type: object
      properties:
        label: { $ref: '#/components/schemas/TName' }
        dataType: { $ref: '#/components/schemas/AttributeDataType' }
        required: { type: boolean, default: false }
        uniqueInVersion: { type: boolean, default: false }
        maxLength: { type: [integer, 'null'], minimum: 1, maximum: 4000 }
        pattern: { type: [string, 'null'], maxLength: 500, description: Biểu thức chính quy ECMA 262 (chỉ STRING). }
        minValue: { type: [number, string, 'null'], description: Với INTEGER/DECIMAL là số; với DATE/DATETIME là chuỗi ngày. }
        maxValue: { type: [number, string, 'null'] }
        enumValues:
          type: [array, 'null']
          maxItems: 500
          items: { $ref: '#/components/schemas/EnumValue' }
        refCatalogCode: { oneOf: [{ $ref: '#/components/schemas/TCode' }, { type: 'null' }] }
        defaultValue: { description: Giá trị mặc định đúng kiểu. }
        sortOrder: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/AttributeStatus' }
        queryable: { type: boolean, default: false, description: Cho phép dùng trong DSL truy vấn (tạo chỉ mục biểu thức). }
        searchable: { type: boolean, default: false, description: Tham gia tìm kiếm không dấu. }
        description: { type: [string, 'null'], maxLength: 4000 }
    AttributeDef:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - $ref: '#/components/schemas/AttributeDefBase'
        - type: object
          required: [id, code, label, dataType, required, status, sortOrder]
          properties:
            id: { $ref: '#/components/schemas/TId' }
            versionId: { $ref: '#/components/schemas/TId' }
            code: { $ref: '#/components/schemas/AttrCode' }
            legacyFieldId: { type: [string, 'null'] }
            inheritedFrom: { type: [string, 'null'], description: Mã danh mục gốc nếu thuộc tính kế thừa từ danh mục được mở rộng (HYBRID). }
    AttributeDefCreateRequest:
      allOf:
        - $ref: '#/components/schemas/AttributeDefBase'
        - type: object
          required: [code, label, dataType]
          properties:
            code: { $ref: '#/components/schemas/AttrCode' }
          allOf:
            - if:
                properties: { dataType: { const: ENUM } }
                required: [dataType]
              then:
                required: [enumValues]
            - if:
                properties: { dataType: { const: CATALOG_REF } }
                required: [dataType]
              then:
                required: [refCatalogCode]
    AttributeDefUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/AttributeDefBase'
        - type: object
          minProperties: 1
    # ---------------------------------------------------------------- Bản ghi
    ItemAttrs:
      type: object
      description: Giá trị thuộc tính động, khóa là mã thuộc tính; kiểm tra bằng JSON Schema của phiên bản (ADR-050).
      maxProperties: 100
      additionalProperties:
        type: [string, number, integer, boolean, 'null']
    CatalogItem:
      type: object
      required: [code, name, status]
      properties:
        id: { $ref: '#/components/schemas/TId' }
        catalogCode: { $ref: '#/components/schemas/TCode' }
        versionNo: { type: integer }
        code: { $ref: '#/components/schemas/ItemCodeValue' }
        name: { $ref: '#/components/schemas/TName' }
        parentCode: { type: [string, 'null'] }
        depth: { type: integer, minimum: 1, maximum: 10, readOnly: true }
        path:
          type: array
          readOnly: true
          items: { type: string }
          description: Mã tổ tiên từ gốc tới cha trực tiếp.
        levelName: { type: [string, 'null'], readOnly: true }
        sortOrder: { type: integer }
        status: { $ref: '#/components/schemas/ItemStatus' }
        replacedBy:
          type: array
          items: { type: string }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date }
        attrs: { $ref: '#/components/schemas/ItemAttrs' }
        isLocalExtension: { type: boolean, description: Bản ghi bổ sung của danh mục HYBRID. }
        changeState: { type: string, enum: [ADDED, CHANGED, DEPRECATED, UNCHANGED], description: Chỉ có ở API quản trị trên bản nháp. }
        legacyRef: { type: [string, 'null'] }
        updatedAt: { $ref: '#/components/schemas/TTs' }
        version: { type: integer }
    ItemCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/ItemCodeValue' }
        name: { $ref: '#/components/schemas/TName' }
        parentCode: { type: [string, 'null'], maxLength: 64 }
        sortOrder: { type: integer, default: 0 }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date }
        attrs: { $ref: '#/components/schemas/ItemAttrs' }
    ItemUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/TName' }
        parentCode: { type: [string, 'null'], maxLength: 64 }
        sortOrder: { type: integer }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date }
        attrs: { $ref: '#/components/schemas/ItemAttrs' }
    ItemDeprecateRequest:
      type: object
      properties:
        replacedBy:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/ItemCodeValue' }
        reason: { type: string, maxLength: 1000 }
        validTo: { $ref: '#/components/schemas/TDate' }
        cascade: { type: boolean, default: false }
        reactivate: { type: boolean, default: false, description: '`true` để khôi phục ACTIVE bản ghi đã ngừng dùng trong cùng bản nháp.' }
    CatalogItemPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CatalogItem' }
        page: { $ref: '#/components/schemas/PageMeta' }
    CatalogItemCursorPage:
      type: object
      required: [catalogCode, versionNo, items, cursor]
      properties:
        catalogCode: { $ref: '#/components/schemas/TCode' }
        versionNo: { type: integer }
        effectiveFrom: { $ref: '#/components/schemas/TDate' }
        effectiveTo: { type: [string, 'null'], format: date }
        at: { $ref: '#/components/schemas/TDate' }
        items:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/CatalogItem' }
        cursor: { $ref: '#/components/schemas/CursorMeta' }
    # ---------------------------------------------------------------- Lô
    BatchOp:
      type: object
      required: [op, code]
      properties:
        op: { type: string, enum: [upsert, deprecate, delete] }
        code: { $ref: '#/components/schemas/ItemCodeValue' }
        name: { $ref: '#/components/schemas/TName' }
        parentCode: { type: [string, 'null'], maxLength: 64 }
        sortOrder: { type: integer }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date }
        attrs: { $ref: '#/components/schemas/ItemAttrs' }
        replacedBy:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ItemCodeValue' }
        reason: { type: string, maxLength: 1000 }
      allOf:
        - if:
            properties: { op: { const: upsert } }
          then:
            required: [name]
    BatchItemsRequest:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          minItems: 1
          maxItems: 5000
          items: { $ref: '#/components/schemas/BatchOp' }
        atomic: { type: boolean, default: true }
        dryRun: { type: boolean, default: false, description: 'Chỉ kiểm tra, không ghi.' }
        createDraftIfMissing: { type: boolean, default: false }
        attrsMerge: { type: string, enum: [MERGE, REPLACE], default: MERGE, description: '`upsert` gộp `attrs` theo khóa hay thay toàn bộ.' }
    BatchResult:
      type: object
      required: [total, succeeded, failed, results]
      properties:
        catalogCode: { $ref: '#/components/schemas/TCode' }
        versionNo: { type: integer }
        dryRun: { type: boolean }
        total: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        summary:
          type: object
          properties:
            inserted: { type: integer }
            updated: { type: integer }
            deprecated: { type: integer }
            deleted: { type: integer }
            unchanged: { type: integer }
        results:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [index, code, status]
            properties:
              index: { type: integer, minimum: 0 }
              code: { type: string }
              status: { type: string, enum: [INSERTED, UPDATED, DEPRECATED, DELETED, UNCHANGED, FAILED] }
              errors:
                type: array
                items: { $ref: '#/components/schemas/ProblemError' }
    # ---------------------------------------------------------------- Khác biệt phiên bản (FR-07-014)
    DiffChangeType:
      type: string
      enum: [ADDED, CHANGED, DEPRECATED, REACTIVATED, REMOVED, ATTRIBUTE_ADDED, ATTRIBUTE_REMOVED, ATTRIBUTE_TYPE_CHANGED, ATTRIBUTE_CONSTRAINT_CHANGED, ATTRIBUTE_META_CHANGED]
    FieldChange:
      type: object
      required: [field]
      properties:
        field: { type: string, description: 'Trường hệ thống (`name`, `parentCode`, `sortOrder`, `replacedBy`, `validFrom`, `validTo`, `status`) hoặc `attrs.{code}`.' }
        before: { description: Giá trị trước; vắng mặt hoặc null là rỗng. }
        after: { description: Giá trị sau. }
    Diff:
      type: object
      required: [catalogCode, fromVersionNo, toVersion, summary, changes, page]
      properties:
        catalogCode: { $ref: '#/components/schemas/TCode' }
        fromVersionNo: { type: integer, description: Phiên bản "trước" (`against`). }
        toVersion: { type: string, description: 'Phiên bản "sau": số phiên bản hoặc `draft`.' }
        summary:
          type: object
          required: [added, changed, deprecated, reactivated, removed, attributeChanges, breakingCount, changeRatio, breaking, largeChange]
          properties:
            added: { type: integer }
            changed: { type: integer }
            deprecated: { type: integer }
            reactivated: { type: integer }
            removed: { type: integer }
            attributeChanges: { type: integer }
            breakingCount: { type: integer }
            changeRatio: { type: number, minimum: 0, description: '(added + changed + deprecated + reactivated + removed) / max(1, số bản ghi phiên bản trước).' }
            breaking: { type: boolean }
            largeChange: { type: boolean, description: 'changeRatio vượt `07.rdm.large-change-threshold-percent` (BR-07-012).' }
        schemaChanges:
          type: array
          items:
            type: object
            required: [attributeCode, changeType, breaking]
            properties:
              attributeCode: { $ref: '#/components/schemas/AttrCode' }
              changeType: { $ref: '#/components/schemas/DiffChangeType' }
              breaking: { type: boolean }
              fields: { type: array, items: { $ref: '#/components/schemas/FieldChange' } }
        changes:
          type: array
          maxItems: 200
          description: Sắp xếp thay đổi phá vỡ trước, sau đó theo mã.
          items:
            type: object
            required: [itemCode, changeType, breaking]
            properties:
              itemCode: { $ref: '#/components/schemas/ItemCodeValue' }
              changeType: { $ref: '#/components/schemas/DiffChangeType' }
              breaking: { type: boolean }
              fields: { type: array, items: { $ref: '#/components/schemas/FieldChange' } }
              breakingReasons: { type: array, items: { type: string }, description: 'Ví dụ `PARENT_CHANGED`, `REMOVED_PUBLISHED`.' }
        page: { $ref: '#/components/schemas/PageMeta' }
    # ---------------------------------------------------------------- Nhập tệp (FR-07-021, 022, 025)
    ImportJobCreateForm:
      type: object
      required: [file]
      description: Thân multipart của API-07-033. Trường `columnMapping`, `options`, `newCatalog` là phần JSON.
      properties:
        file: { type: string, format: binary, description: 'xlsx, xls hoặc csv; ≤ `07.rdm.import-max-mb` MB; ≤ `07.rdm.import-max-rows` dòng.' }
        catalogCode: { $ref: '#/components/schemas/TCode' }
        mode:
          type: string
          enum: [UPSERT, REPLACE, APPEND, CREATE_CATALOG, MAPPING, ADMIN_UNIT_CONVERT]
          default: UPSERT
        template: { type: string, enum: [AUTO, STANDARD, LEGACY_AITA], default: AUTO }
        sheetName: { type: string, maxLength: 255, description: 'Mặc định `DuLieu`; không có thì lấy sheet đầu tiên.' }
        headerRow: { type: integer, minimum: 1, maximum: 50 }
        firstDataRow: { type: integer, minimum: 2, maximum: 51 }
        encoding: { type: string, enum: [AUTO, UTF-8, UTF-16LE, UTF-16BE, WINDOWS-1258], default: AUTO }
        delimiter: { type: string, enum: [',', ';', "\t"], description: Chỉ với CSV; mặc định tự nhận. }
        columnMapping:
          type: object
          additionalProperties: { type: string }
          description: '`{ "tên cột trong tệp": "mã trường" }`; ghi đè đề xuất tự động.'
        createDraft: { type: boolean, default: false }
        options:
          type: object
          properties:
            emptyMeansNull: { type: boolean, default: false }
            autoSortOrder: { type: boolean, default: true }
        newCatalog:
          description: Chỉ với `mode = CREATE_CATALOG`; mã, tên do người dùng chọn ghi đè đề xuất.
          $ref: '#/components/schemas/CatalogCreateRequest'
    ImportSummary:
      type: object
      properties:
        totalRows: { type: integer }
        validRows: { type: integer }
        errorRows: { type: integer }
        warningRows: { type: integer }
        actions:
          type: object
          properties:
            INSERT: { type: integer }
            UPDATE: { type: integer }
            DEPRECATE: { type: integer }
            UNCHANGED: { type: integer }
            DELETE_DRAFT: { type: integer }
        encoding: { type: string }
        sheetName: { type: string }
        detectedTemplate: { type: string, enum: [STANDARD, LEGACY_AITA] }
    ProposedAttribute:
      type: object
      required: [code, label, dataType]
      properties:
        code: { $ref: '#/components/schemas/AttrCode' }
        label: { $ref: '#/components/schemas/TName' }
        sourceColumn: { type: string }
        dataType: { $ref: '#/components/schemas/AttributeDataType' }
        required: { type: boolean }
        maxLengthObserved: { type: integer }
        distinctValues: { type: integer }
        enumCandidates: { type: array, maxItems: 50, items: { type: string }, description: 'Khi suy ra kiểu ENUM (≤ 50 giá trị khác nhau, FR-07-051 bước 6).' }
    ImportJob:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required: [id, status, mode, catalogCode]
          properties:
            id: { $ref: '#/components/schemas/TId' }
            jobType: { type: string, enum: [IMPORT, ADMIN_UNIT_CONVERT, PROPOSAL], default: IMPORT }
            catalogCode: { type: [string, 'null'], description: Rỗng khi `CREATE_CATALOG` chưa commit. }
            versionNo: { type: [integer, 'null'] }
            mode: { type: string, enum: [UPSERT, REPLACE, APPEND, CREATE_CATALOG, MAPPING, ADMIN_UNIT_CONVERT] }
            template: { $ref: '#/components/schemas/ImportTemplate' }
            fileFormat: { $ref: '#/components/schemas/FileFormat' }
            fileName: { type: string }
            fileSize: { type: integer, description: Byte. }
            status: { $ref: '#/components/schemas/ImportJobStatus' }
            progress: { type: integer, minimum: 0, maximum: 100 }
            summary: { $ref: '#/components/schemas/ImportSummary' }
            columnMapping:
              type: object
              additionalProperties: { type: [string, 'null'] }
              description: Ánh xạ cột đang áp dụng; giá trị null là cột bị bỏ qua.
            proposedCatalog:
              type: [object, 'null']
              properties:
                code: { $ref: '#/components/schemas/TCode' }
                name: { $ref: '#/components/schemas/TName' }
            proposedAttributes: { type: array, items: { $ref: '#/components/schemas/ProposedAttribute' } }
            errorMessage: { type: [string, 'null'] }
            resultFileUrl: { type: [string, 'null'], format: uri, description: 'Tệp kết quả của `ADMIN_UNIT_CONVERT`; URL ký sẵn 24 giờ.' }
            startedAt: { $ref: '#/components/schemas/TTs' }
            finishedAt: { type: [string, 'null'], format: date-time }
            expiresAt: { type: [string, 'null'], format: date-time, description: 'Hạn commit (BR-07-016).' }
            committedVersionNo: { type: [integer, 'null'] }
    ImportCommitRequest:
      type: object
      properties:
        skipErrors: { type: boolean, default: false, description: 'Bỏ dòng lỗi và dòng phụ thuộc dòng lỗi (BR-07-015).' }
        changeNote: { type: string, maxLength: 1000 }
        newCatalog:
          description: Chỉ với `CREATE_CATALOG`; xác nhận mã, tên và lược đồ đề xuất đã chỉnh.
          type: object
          properties:
            catalog: { $ref: '#/components/schemas/CatalogCreateRequest' }
            attributes: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AttributeDefCreateRequest' } }
    ImportRow:
      type: object
      required: [rowNo, valid, action]
      properties:
        rowNo: { type: integer, minimum: 1, description: Số dòng trong tệp. }
        code: { type: [string, 'null'] }
        valid: { type: boolean }
        action: { type: string, enum: [INSERT, UPDATE, DEPRECATE, UNCHANGED, DELETE_DRAFT, SKIPPED] }
        values: { type: object, additionalProperties: true, description: Giá trị đã chuẩn hóa theo mã trường. }
        errors: { type: array, items: { $ref: '#/components/schemas/ProblemError' } }
        warnings: { type: array, items: { $ref: '#/components/schemas/ProblemError' } }
    ImportRowPage:
      type: object
      required: [jobId, items, page]
      properties:
        jobId: { $ref: '#/components/schemas/TId' }
        items: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/ImportRow' } }
        page: { $ref: '#/components/schemas/PageMeta' }
    # ---------------------------------------------------------------- Xuất (FR-07-024) và lịch sử tác vụ (FR-07-025)
    ExportJobRequest:
      type: object
      required: [catalogCode]
      properties:
        catalogCode: { $ref: '#/components/schemas/TCode' }
        version: { type: string, pattern: '^(current|draft|\d+)$', default: current }
        at: { $ref: '#/components/schemas/TDate' }
        format: { type: string, enum: [XLSX, CSV, JSON], default: XLSX }
        template: { type: string, enum: [STANDARD, LEGACY_AITA], default: STANDARD }
        filter:
          type: object
          properties:
            q: { type: string, maxLength: 100 }
            status: { $ref: '#/components/schemas/ItemStatus' }
            parentCode: { type: string, description: Kèm toàn bộ cây con. }
        includeDeprecated: { type: boolean, default: true }
        includeHidden: { type: boolean, default: false, description: Chỉ người có PERM-07-update. }
    ExportJob:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required: [id, status, catalogCode, format]
          properties:
            id: { $ref: '#/components/schemas/TId' }
            catalogCode: { $ref: '#/components/schemas/TCode' }
            versionNo: { type: integer }
            format: { $ref: '#/components/schemas/FileFormat' }
            template: { type: string, enum: [STANDARD, LEGACY_AITA] }
            status: { $ref: '#/components/schemas/ExportJobStatus' }
            rowCount: { type: [integer, 'null'] }
            fileName: { type: [string, 'null'] }
            fileSize: { type: [integer, 'null'] }
            downloadUrl: { type: [string, 'null'], format: uri, description: URL ký sẵn, hạn 24 giờ. }
            expiresAt: { type: [string, 'null'], format: date-time }
            errorMessage: { type: [string, 'null'] }
            startedAt: { $ref: '#/components/schemas/TTs' }
            finishedAt: { type: [string, 'null'], format: date-time }
    ExportJsonDocument:
      type: object
      required: [catalog, version, attributes, items]
      description: Định dạng JSON của xuất đồng bộ (≤ `07.rdm.export-sync-max-rows` dòng).
      properties:
        catalog:
          type: object
          properties:
            code: { $ref: '#/components/schemas/TCode' }
            name: { $ref: '#/components/schemas/TName' }
            sourceType: { $ref: '#/components/schemas/SourceType' }
        version:
          type: object
          properties:
            versionNo: { type: integer }
            effectiveFrom: { $ref: '#/components/schemas/TDate' }
            effectiveTo: { type: [string, 'null'], format: date }
            schemaHash: { type: string }
        attributes: { type: array, items: { $ref: '#/components/schemas/AttributeDef' } }
        items: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } }
        exportedAt: { $ref: '#/components/schemas/TTs' }
    JobSummary:
      type: object
      required: [id, jobType, status]
      properties:
        id: { $ref: '#/components/schemas/TId' }
        jobType: { type: string, enum: [IMPORT, EXPORT, ADMIN_UNIT_CONVERT, PROPOSAL] }
        catalogCode: { type: [string, 'null'] }
        versionNo: { type: [integer, 'null'] }
        mode: { type: [string, 'null'] }
        format: { type: [string, 'null'] }
        template: { type: [string, 'null'] }
        status: { type: string, description: Trạng thái theo loại (ImportJobStatus hoặc ExportJobStatus). }
        createdBy: { type: string }
        createdByName: { type: string }
        startedAt: { $ref: '#/components/schemas/TTs' }
        finishedAt: { type: [string, 'null'], format: date-time }
        stats: { type: object, additionalProperties: { type: integer }, description: 'Ví dụ `totalRows`, `errorRows`, `rowCount`.' }
    JobSummaryPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JobSummary' } }
        page: { $ref: '#/components/schemas/PageMeta' }
    # ---------------------------------------------------------------- Khai thác (FR-07-026…033)
    ItemLookupResult:
      allOf:
        - $ref: '#/components/schemas/CatalogItem'
        - type: object
          properties:
            catalogCode: { $ref: '#/components/schemas/TCode' }
            versionNo: { type: integer }
            at: { $ref: '#/components/schemas/TDate' }
            replacement:
              description: 'Bản ghi thay thế cuối chuỗi khi `resolveReplacement = true` và `replacedBy` có đúng một mã.'
              $ref: '#/components/schemas/CatalogItem'
    LookupRequest:
      type: object
      required: [codes]
      properties:
        codes: { type: array, minItems: 1, maxItems: 500, items: { type: string, maxLength: 64 }, description: 'Trùng lặp được gộp; giới hạn `07.rdm.lookup-batch-max`.' }
        at: { $ref: '#/components/schemas/TDate' }
        version: { type: integer, description: Loại trừ với `at`. }
        fields: { type: array, items: { type: string } }
        resolveReplacement: { type: boolean, default: false }
        includeDeprecated: { type: boolean, default: true }
    LookupResponse:
      type: object
      required: [catalogCode, versionNo, found, notFound]
      properties:
        catalogCode: { $ref: '#/components/schemas/TCode' }
        versionNo: { type: integer }
        at: { $ref: '#/components/schemas/TDate' }
        found:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ItemLookupResult' }
          description: Khóa là mã chuẩn hóa chữ hoa.
        notFound:
          type: array
          items:
            type: object
            required: [code, reason]
            properties:
              code: { type: string }
              reason: { type: string, enum: [NOT_FOUND, DEPRECATED_EXCLUDED] }
    TreeNode:
      type: object
      required: [code, name, status]
      properties:
        code: { $ref: '#/components/schemas/ItemCodeValue' }
        name: { $ref: '#/components/schemas/TName' }
        levelName: { type: [string, 'null'] }
        depth: { type: integer }
        status: { $ref: '#/components/schemas/ItemStatus' }
        attrs: { $ref: '#/components/schemas/ItemAttrs' }
        hasChildren: { type: boolean }
        children: { type: array, items: { $ref: '#/components/schemas/TreeNode' } }
    TreeResponse:
      type: object
      required: [catalogCode, versionNo, nodes]
      properties:
        catalogCode: { $ref: '#/components/schemas/TCode' }
        versionNo: { type: integer }
        at: { $ref: '#/components/schemas/TDate' }
        root: { type: [string, 'null'] }
        depth: { type: integer, minimum: 1, maximum: 10 }
        nodeCount: { type: integer, maximum: 10000 }
        nodes: { type: array, items: { $ref: '#/components/schemas/TreeNode' } }
    SearchResponse:
      type: object
      required: [catalogCode, versionNo, items]
      properties:
        catalogCode: { $ref: '#/components/schemas/TCode' }
        versionNo: { type: integer }
        q: { type: string }
        items:
          type: array
          maxItems: 50
          items:
            allOf:
              - $ref: '#/components/schemas/CatalogItem'
              - type: object
                properties:
                  matchType: { type: string, enum: [CODE_EXACT, CODE_PREFIX, NAME_PREFIX, NAME_WORD, ATTRIBUTE] }
                  path: { type: array, items: { type: string }, description: Tên các cấp cha, để hiển thị gợi ý. }
    ChangesResponse:
      type: object
      required: [catalogCode, fromVersion, toVersion, schemaChanged, changes, cursor]
      properties:
        catalogCode: { $ref: '#/components/schemas/TCode' }
        fromVersion: { type: integer }
        toVersion: { type: integer }
        toEffectiveFrom: { $ref: '#/components/schemas/TDate' }
        schemaChanged: { type: boolean }
        schemaChanges:
          type: array
          items:
            type: object
            properties:
              attributeCode: { $ref: '#/components/schemas/AttrCode' }
              changeType: { $ref: '#/components/schemas/DiffChangeType' }
        fullReloadRecommended: { type: boolean, description: Tổng thay đổi vượt 50% số bản ghi. }
        changes:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [code, changeType]
            properties:
              code: { $ref: '#/components/schemas/ItemCodeValue' }
              changeType: { type: string, enum: [ADDED, CHANGED, DEPRECATED, REACTIVATED, REMOVED] }
              item: { $ref: '#/components/schemas/CatalogItem' }
              changedFields: { type: array, items: { type: string } }
        cursor: { $ref: '#/components/schemas/CursorMeta' }
    QueryCondition:
      type: object
      description: 'Điều kiện lá `{field, op, value}` hoặc nhóm `{and: [...]}`, `{or: [...]}`, `{not: {...}}`; ≤ 20 lá, lồng ≤ 3 cấp.'
      properties:
        field: { type: string, description: 'Trường hệ thống hoặc `attrs.{code}` có `queryable = true`.' }
        op: { type: string, enum: [eq, ne, in, nin, lt, lte, gt, gte, between, contains, startsWith, isNull, isNotNull] }
        value: { description: Vô hướng, mảng hoặc vắng mặt tùy toán tử. }
        and: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/QueryCondition' } }
        or: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/QueryCondition' } }
        not: { $ref: '#/components/schemas/QueryCondition' }
    QueryRequest:
      type: object
      properties:
        at: { $ref: '#/components/schemas/TDate' }
        version: { type: integer }
        filter: { $ref: '#/components/schemas/QueryCondition' }
        select: { type: array, maxItems: 120, items: { type: string } }
        sort:
          type: array
          maxItems: 3
          items:
            type: object
            required: [field]
            properties:
              field: { type: string }
              dir: { type: string, enum: [asc, desc], default: asc }
        limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        cursor: { type: string, description: Con trỏ ký HMAC, gắn với băm của filter và sort. }
        includeDeprecated: { type: boolean, default: false }
    QueryResponse:
      type: object
      required: [items, catalogVersion, took]
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
        nextCursor: { type: [string, 'null'] }
        catalogVersion: { type: integer }
        took: { type: integer, description: Mili giây. }
    SchemaMetadata:
      type: object
      required: [catalog, version, attributes, jsonSchema]
      properties:
        catalog: { $ref: '#/components/schemas/Catalog' }
        version:
          type: object
          properties:
            versionNo: { type: integer }
            effectiveFrom: { $ref: '#/components/schemas/TDate' }
            effectiveTo: { type: [string, 'null'], format: date }
            schemaHash: { type: string, description: 'SHA-256 của lược đồ đã chuẩn hóa; dùng để HTTT biết lược đồ có đổi.' }
        attributes: { type: array, items: { $ref: '#/components/schemas/AttributeDef' } }
        levelNames: { type: array, items: { type: string } }
        jsonSchema: { type: object, additionalProperties: true, description: JSON Schema 2020-12 của một bản ghi. }
    # ---------------------------------------------------------------- ĐVHC (FR-07-045…047)
    SuccessionCreateRequest:
      type: object
      required: [eventType, effectiveDate, legalBasis]
      properties:
        eventType: { $ref: '#/components/schemas/SuccessionEventType' }
        fromCodes: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ItemCodeValue' } }
        toCodes: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ItemCodeValue' } }
        newUnits:
          type: array
          items:
            type: object
            required: [code, name, unitType]
            properties:
              code: { $ref: '#/components/schemas/ItemCodeValue' }
              name: { $ref: '#/components/schemas/TName' }
              parentCode: { type: [string, 'null'] }
              unitType: { type: string, description: 'Ví dụ `TINH`, `THANH_PHO_TW`, `XA`, `PHUONG`, `DAC_KHU`.' }
              shortName: { type: string, maxLength: 255 }
        effectiveDate: { $ref: '#/components/schemas/TDate' }
        legalBasis: { type: string, minLength: 10, maxLength: 1000 }
        legalBasisFileId: { $ref: '#/components/schemas/TId' }
        note: { type: string, maxLength: 4000, description: Bắt buộc với SPLIT. }
    Succession:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - $ref: '#/components/schemas/SuccessionCreateRequest'
        - type: object
          required: [id, versionNo]
          properties:
            id: { $ref: '#/components/schemas/TId' }
            versionNo: { type: integer }
            affectedItems:
              type: array
              readOnly: true
              items:
                type: object
                properties:
                  code: { type: string }
                  action: { type: string, enum: [ADDED, DEPRECATED, RENAMED, REPARENTED, NEEDS_PARENT] }
    SuccessionPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Succession' } }
        page: { $ref: '#/components/schemas/PageMeta' }
    SuccessionRef:
      type: object
      properties:
        eventType: { $ref: '#/components/schemas/SuccessionEventType' }
        effectiveDate: { $ref: '#/components/schemas/TDate' }
        legalBasis: { type: string }
        codes: { type: array, items: { type: string } }
    AdminUnitConvertRequest:
      type: object
      required: [codes]
      properties:
        direction: { type: string, enum: [OLD_TO_NEW, NEW_TO_OLD], default: OLD_TO_NEW }
        at: { $ref: '#/components/schemas/TDate' }
        codes:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [code]
            properties:
              code: { type: string, maxLength: 64 }
              asOf: { type: string, format: date, default: '2025-06-30' }
    AdminUnitConvertResponse:
      type: object
      required: [results, stats]
      properties:
        direction: { type: string, enum: [OLD_TO_NEW, NEW_TO_OLD] }
        at: { $ref: '#/components/schemas/TDate' }
        results:
          type: array
          items:
            type: object
            required: [input, status]
            properties:
              input:
                type: object
                properties:
                  code: { type: string }
                  asOf: { $ref: '#/components/schemas/TDate' }
              status: { type: string, enum: [MAPPED, UNCHANGED, AMBIGUOUS, NOT_FOUND] }
              newCode: { type: [string, 'null'] }
              newName: { type: [string, 'null'] }
              newPath:
                type: [object, 'null']
                properties:
                  provinceCode: { type: string }
                  provinceName: { type: string }
                  communeCode: { type: string }
                  communeName: { type: string }
              candidates:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string }
                    name: { type: string }
