        `requireApproval = false` và thay đổi không vượt ngưỡng, không phá vỡ (BR-07-012,
        BR-07-026; nếu vi phạm trả 409 ERR-07-016). Trong một giao dịch: chốt `effectiveFrom`,
        đặt `effectiveTo` của phiên bản trước bằng `effectiveFrom` mới (BR-07-007), cập nhật
        `catalog.currentVersionId` nếu `effectiveFrom` ≤ hôm nay, chuyển danh mục DRAFT → ACTIVE,
