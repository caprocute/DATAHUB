          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Một trang phiên bản.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogVersionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Phiên bản]
      operationId: createDraftVersion
      summary: Tạo bản nháp từ phiên bản hiện hành
      description: |
        Tạo phiên bản `DRAFT` mới với `versionNo` = số lớn nhất + 1, sao chép toàn bộ lược đồ thuộc
        tính và bản ghi của phiên bản gốc (mặc định là phiên bản hiện hành; có thể chọn
        `baseVersionNo` là một phiên bản đã phát hành khác để khôi phục). Sao chép thực hiện bằng
        `INSERT … SELECT` trong một giao dịch nên với 200.000 bản ghi vẫn nằm trong vài giây;
        nếu vượt 3 giây, máy chủ trả 202 kèm `Location` tới phiên bản ở trạng thái đang sao chép
        (`copying = true`). Bị từ chối nếu danh mục đã có phiên bản mở (BR-07-005, ERR-07-005),
        là danh mục NATIONAL (ERR-07-003) hoặc RETIRED (ERR-07-031).
      x-datahub-id: API-07-012
      x-datahub-fr: [FR-07-011]
      x-datahub-permission:
        permission: PERM-07-create
        orgScoped: true
      x-datahub-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Prefer'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionCreateRequest' }
            examples:
              macDinh:
                summary: Tạo nháp từ phiên bản hiện hành
                value: { effectiveFrom: "2027-01-01", legalBasis: "Quyết định số 123/QĐ-UBND ngày 15/12/2026 của UBND tỉnh Lâm Đồng (giả lập)", changeNote: "Bổ sung loại hình hợp tác xã" }
      responses:
        '201':
          description: Đã tạo bản nháp.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogVersion' }
              examples:
                nhap: { $ref: '#/components/examples/VersionDraft' }
        '202':
          description: Bản nháp đang được sao chép nền; theo dõi qua `Location`.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
