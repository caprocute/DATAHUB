        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  # ------------------------------------------------------------------ Nhập xuất
  /catalogs/{catalogCode}/import-template:
    parameters:
      - $ref: '#/components/parameters/CatalogCode'
    get:
      tags: [Nhập xuất]
      operationId: downloadImportTemplate
      summary: Tải tệp mẫu nhập theo lược đồ
      description: |
        Sinh tệp mẫu theo lược đồ của bản nháp (nếu có) hoặc phiên bản hiện hành. Xlsx gồm sheet
        `HuongDan`, `DuLieu` (dòng 1 nhãn tiếng Việt, dòng 2 mã cột ẩn và khóa, dữ liệu từ dòng 3;
        cột cố định `MA`, `TEN`, `MA_CHA`, `THU_TU`, `TRANG_THAI`, `MA_THAY_THE`, `HIEU_LUC_TU`,
        `HIEU_LUC_DEN` rồi thuộc tính động theo `sortOrder`) và `GiaTriHopLe` (giá trị ENUM, có
        data validation). CSV: RFC 4180, UTF-8 có BOM, dòng tiêu đề là mã cột. `withData = true`
        điền sẵn bản ghi hiện có để sửa rồi nhập lại (chế độ UPSERT).
      x-datahub-id: API-07-032
      x-datahub-fr: [FR-07-020]
      x-datahub-permission:
        permission: PERM-07-read
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [xlsx, csv], default: xlsx }
        - name: withData
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Tệp mẫu.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /import-jobs:
    post:
      tags: [Nhập xuất]
      operationId: createImportJob
      summary: Tải tệp và tạo tác vụ nhập (pha 1)
      description: |
        Nhận tệp multipart, lưu vào kho đối tượng (DD-12 `file_object`, `scan_status = PENDING`),
        tạo `import_job` trạng thái `SCANNING` và trả 202 ngay. Tác vụ nền quét mã độc, nhận dạng
        định dạng theo nội dung (không tin phần mở rộng), tự nhận mã hóa (UTF-8, UTF-8 BOM,
        UTF-16 LE/BE) nếu không chỉ định, phân tích luồng ghi vào `import_row`, kiểm tra hợp lệ và
        chuyển `VALIDATED` (hoặc `FAILED`). Client theo dõi qua `Location` hoặc sự kiện EVT-07-07.
        Kiểm tra đồng bộ trước khi nhận: kích thước ≤ 50 MB (413), kiểu nội dung (415), danh mục
        và bản nháp tồn tại, quyền ghi. Với `mode = CREATE_CATALOG` không cần `catalogCode` có sẵn
        mà dùng `newCatalog`. Với `template = LEGACY_AITA`, ô A2 là tên danh mục, dòng 4 là tên
        thuộc tính, dữ liệu từ dòng 5 (ADR-056).
      x-datahub-id: API-07-033
      x-datahub-fr: [FR-07-021, FR-07-022]
      x-datahub-permission:
        permission: PERM-07-update
        orgScoped: true
        note: CREATE_CATALOG cần thêm PERM-07-create.
      x-datahub-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImportJobCreateForm' }
            encoding:
              file:
                contentType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, text/csv, application/vnd.ms-excel
              columnMapping:
                contentType: application/json
              newCatalog:
                contentType: application/json
      responses:
        '202':
          description: Đã nhận tệp, tác vụ đang xử lý.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
              examples:
                dangQuet: { $ref: '#/components/examples/ImportJobScanning' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /import-jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Nhập xuất]
      operationId: getImportJob
      summary: Trạng thái, tóm tắt và xem trước tác vụ nhập
      description: |
        Trả trạng thái, tiến độ, số dòng hợp lệ/lỗi, tóm tắt hành động (INSERT/UPDATE/DEPRECATE/
        UNCHANGED), 20 dòng xem trước đầu tiên và thời điểm hết hạn xem trước (24 giờ, BR-07-016).
        ETag của tác vụ dùng làm `If-Match` cho `:commit`.
      x-datahub-id: API-07-034
      x-datahub-fr: [FR-07-021]
      x-datahub-permission:
        permission: PERM-07-update
        note: Người tạo tác vụ hoặc người có PERM-07-update trên danh mục.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Tác vụ nhập.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
              examples:
                daKiemTra: { $ref: '#/components/examples/ImportJobValidated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /import-jobs/{jobId}/rows:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Nhập xuất]
      operationId: listImportRows
      summary: Dòng xem trước hoặc báo cáo lỗi
      description: |
        Mặc định trả JSON phân trang. `valid=false` chỉ lấy dòng lỗi. `format=xlsx` (hoặc
        `Accept: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`) trả báo cáo
        lỗi là chính tệp người dùng tải lên có thêm cột `LOI` mô tả lỗi từng dòng và tô đỏ ô lỗi,
        để người dùng sửa và tải lên lại.
      x-datahub-id: API-07-035
      x-datahub-fr: [FR-07-021, FR-07-025]
      x-datahub-permission:
        permission: PERM-07-update
      parameters:
        - name: valid
          in: query
          schema: { type: boolean }
        - name: action
          in: query
          schema: { $ref: '#/components/schemas/ImportRowAction' }
        - name: format
          in: query
          schema: { type: string, enum: [json, xlsx], default: json }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Danh sách dòng hoặc tệp báo cáo lỗi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportRowPage' }
              examples:
                dongLoi: { $ref: '#/components/examples/ImportRowPageExample' }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /import-jobs/{jobId}:commit:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Nhập xuất]
      operationId: commitImportJob
      summary: Ghi kết quả nhập vào bản nháp (pha 2)
      description: |
        Chỉ khi tác vụ `VALIDATED`, chưa hết hạn và bản nháp chưa bị sửa kể từ lúc phân tích
        (so `version` phiên bản lưu trong tác vụ; nếu khác trả 409 ERR-07-020 và client phải chạy
        lại tác vụ). Có dòng lỗi mà `skipInvalidRows = false` trả 422 ERR-07-021. Ghi trong một
        giao dịch bằng `COPY` vào bảng tạm rồi `INSERT … ON CONFLICT`, mục tiêu ≤ 60 giây cho
        100.000 dòng (NFR-07-005). Với ≤ 5.000 dòng trả 200 đồng bộ; lớn hơn trả 202 và trạng thái
        `COMMITTING`. Với `CREATE_CATALOG`, tạo danh mục, phiên bản 1 và thuộc tính trong cùng giao dịch.
      x-datahub-id: API-07-036
      x-datahub-fr: [FR-07-021, FR-07-022]
      x-datahub-permission:
        permission: PERM-07-update
        orgScoped: true
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportCommitRequest' }
            example: { skipInvalidRows: true }
      responses:
        '200':
          description: Đã ghi vào bản nháp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '202':
          description: Đang ghi nền.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /import-jobs/{jobId}:cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Nhập xuất]
      operationId: cancelImportJob
      summary: Hủy tác vụ nhập
      description: Hủy tác vụ chưa commit (SCANNING, PARSING, VALIDATED). Dòng tạm bị xóa ngay; tệp gốc giữ 7 ngày để tra soát.
      x-datahub-id: API-07-037
      x-datahub-fr: [FR-07-021]
      x-datahub-permission:
        permission: PERM-07-update
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Đã hủy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /export-jobs:
    post:
      tags: [Nhập xuất]
      operationId: createExportJob
      summary: Xuất phiên bản danh mục
      description: |
        Nếu số dòng ước tính ≤ 10.000 và không có `Prefer: respond-async`, trả 200 kèm nội dung
        tệp trực tiếp (đồng bộ). Ngược lại tạo tác vụ nền, trả 202 kèm `Location` tới API-07-039;
        khi xong phát EVT-07-08 và thông báo người dùng (FR-00-031). Tệp xuất có hạn tải 24 giờ.
        Định dạng XLSX dùng đúng khuôn mẫu nhập nên tệp xuất nhập lại được.
      x-datahub-id: API-07-038
      x-datahub-fr: [FR-07-024]
      x-datahub-permission:
        permission: PERM-07-export
        scopes: [rdm.read]
      x-datahub-idempotent: true
      security:
        - oauth2User: []
        - oauth2Client: [rdm.read]
      parameters:
        - $ref: '#/components/parameters/Prefer'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportJobRequest' }
            examples:
              dvhc: { $ref: '#/components/examples/ExportRequestExample' }
      responses:
        '200':
          description: Tệp xuất trả trực tiếp (≤ 10.000 dòng).
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
            text/csv:
              schema: { type: string }
            application/json:
              schema: { $ref: '#/components/schemas/ExportJsonDocument' }
        '202':
          description: Đã tạo tác vụ xuất nền.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /export-jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Nhập xuất]
      operationId: getExportJob
      summary: Trạng thái tác vụ xuất và URL tải
      description: |
        Khi `COMPLETED`, `downloadUrl` là URL ký sẵn của Garage có hạn bằng `downloadExpiresAt`
        (tối đa 24 giờ kể từ khi xong); sau hạn trạng thái thành `EXPIRED` và tệp bị xóa.
      x-datahub-id: API-07-039
      x-datahub-fr: [FR-07-024]
      x-datahub-permission:
        permission: PERM-07-export
        scopes: [rdm.read]
      security:
        - oauth2User: []
        - oauth2Client: [rdm.read]
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Tác vụ xuất.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
              examples:
                xong: { $ref: '#/components/examples/ExportJobCompleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs:
    get:
      tags: [Nhập xuất]
      operationId: listJobs
      summary: Lịch sử tác vụ nhập xuất
      description: Liệt kê tác vụ nhập và xuất của tenant, mặc định của chính người gọi; người có PERM-07-update thấy mọi tác vụ trên danh mục mình quản lý.
      x-datahub-id: API-07-040
      x-datahub-fr: [FR-07-025]
      x-datahub-permission:
        permission: PERM-07-read
      parameters:
        - name: jobType
          in: query
          schema: { type: string, enum: [IMPORT, EXPORT] }
        - name: catalogCode
          in: query
          schema: { $ref: '#/components/schemas/TCode' }
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { type: string }
        - name: mine
          in: query
          schema: { type: boolean, default: true }
        - name: createdFrom
          in: query
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Một trang tác vụ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobSummaryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
