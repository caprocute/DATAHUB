        Thêm thuộc tính mới. Thuộc tính bắt buộc chỉ thêm được khi kèm `defaultValue` hoặc bản
        nháp chưa có bản ghi (nếu không, mọi bản ghi hiện có sẽ vi phạm, ERR-07-014). Mã thuộc
        tính không trùng mã cột cố định (`code`, `name`, `parentCode`…). Từ khóa gợi ý dữ liệu
        cá nhân (`cccd`, `so_dinh_danh`, `ho_ten`, `ngay_sinh`, `so_dien_thoai`…) bị chặn ERR-07-036.
