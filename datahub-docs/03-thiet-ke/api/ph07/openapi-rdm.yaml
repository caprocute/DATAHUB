      summary: Nhập lô bản ghi vào bản nháp (≤ 5.000 thao tác)
      description: |
        Áp dụng tối đa 5.000 thao tác `upsert`, `deprecate`, `delete` trong một giao dịch
        (`atomic = true`, mặc định: một thao tác lỗi thì không thao tác nào được ghi, trả 422 với
        `errors[].row` là chỉ số thao tác) hoặc từng phần (`atomic = false`: thao tác hợp lệ được
        ghi, trả 200 với `results[].status = FAILED` cho thao tác lỗi). `versionRef` thường là
        `draft`; nếu chưa có bản nháp và `createDraftIfMissing = true` thì máy chủ tạo bản nháp từ
        phiên bản hiện hành trước. Bắt buộc `Idempotency-Key` để HTTT gửi lại an toàn khi mất kết
        nối: cùng khóa và cùng băm thân trong 24 giờ trả lại đúng kết quả cũ với header
        `Idempotent-Replayed: true`; cùng khóa khác thân trả 409 ERR-07-022. Giới hạn 5.000 là
        tham số `07.rdm.batch-max-ops` (PH-18), vượt trả 400 ERR-07-026. Không yêu cầu `If-Match`
