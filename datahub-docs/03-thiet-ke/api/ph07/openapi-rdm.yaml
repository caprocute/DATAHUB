        lược đồ), duy nhất, mã cha tồn tại, không vòng, độ sâu (BR-07-014), dải mã địa phương
        (BR-07-010), khoảng hiệu lực, và tính phân loại thay đổi so với phiên bản hiện hành để
        trả `requiresApproval`. Không đổi trạng thái; idempotent. Với danh mục > 50.000 bản ghi
