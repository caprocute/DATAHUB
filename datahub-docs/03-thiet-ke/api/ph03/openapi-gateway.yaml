# D03-04-PH03 · OpenAPI PH-03 (dh-connect, module gateway). SINH TỰ ĐỘNG bởi tools/gen_openapi.py — không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-03 Cổng API, API quản trị cổng
  version: 1.0.0-draft
  summary: Route, consumer, hạn mức, WAF, ảnh chụp cấu hình, nút, nhật ký lượt gọi và tham số của mặt phẳng điều khiển cổng API.
  description: 'API của module `gateway` trong `dh-connect` (control plane PH-03). Người dùng gọi qua BFF console (Authorization Code + PKCE,
    quyền `PERM-03-*`); PH-01, PH-12 gọi một số thao tác bằng token dịch vụ (scope `gateway:sync`, `gateway:revoke`), PH-13 đọc trạng thái bằng
    `gateway:read-state`. API này **không** nằm trên đường chuyển tiếp lượt gọi: APISIX (mặt phẳng dữ liệu) chỉ đọc ảnh chụp cấu hình đã ký, không
    gọi vào đây.


    Quy ước (D03-04-PH03 §1): tenant lấy từ token; lệnh ghi consumer, tạo và xuất nhận `Idempotency-Key`; sửa và đổi trạng thái bắt buộc `If-Match`;
    hậu tố `:{hành-động}`; phân trang `page`/`size`; lỗi RFC 9457 mã `ERR-03-nnn`. Không API nào nhận hay trả bí mật. Mọi tên miền, dữ liệu là
    giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-03
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH03
  x-datahub-phase: PH-03
servers:
- url: https://console.{tenantHost}.datahub.example.vn/api/gateway/v1
  description: 'Production: qua BFF console của tenant, giả lập'
  variables:
    tenantHost:
      default: lamdong
      description: Ví dụ `lamdong` cho T68 (giả lập).
  x-internal: false
  x-environment: production
- url: https://dh-connect.dh-control.svc:8443/api/gateway/v1
  description: 'Production: trong cụm (mesh mTLS), cho PH-01, PH-12, PH-13'
  x-internal: true
  x-environment: production
- url: https://localhost:8443/api/gateway/v1
  description: 'Local: phát triển cục bộ'
  x-internal: true
  x-environment: development
security:
- oauth2User: []
tags:
- name: Route và upstream
- name: Consumer
- name: Tạm ngừng khẩn cấp
- name: Chính sách chiếu từ gói
- name: Hạn mức và hạn ngạch
- name: Lớp biên và TLS
- name: Chặn địa chỉ nguồn
- name: WAF
- name: CORS
- name: Xác thực, thu hồi, ủy quyền
- name: Ảnh chụp cấu hình
- name: Nút gateway
- name: Mẫu chính sách
- name: Chứng thư biên
- name: Yêu cầu thay đổi bốn mắt
- name: Nhật ký lượt gọi
- name: Tổng quan
- name: Kiểm tra tổng hợp
- name: Cảnh báo an ninh
- name: Tham số
- name: Chạy thử chính sách
- name: Báo cáo sử dụng
- name: Nhập từ gateway cũ
- name: Chuyển tiếp tenant sáp nhập
paths:
  /routes:
    get:
      tags:
      - Route và upstream
      operationId: listRoutes
      summary: Danh sách route
      x-datahub-id: API-03-001
      x-datahub-fr:
      - FR-03-028
      x-datahub-permission:
        permission: PERM-03-read
      security:
      - oauth2User: []
      description: Danh sách route của tenant theo lọc; mặc định sắp theo `routeCode`.
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
          minLength: 2
        description: Tìm không dấu trên mã route, mã API.
      - name: state
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RouteState'
          maxItems: 1000
        style: form
        explode: false
      - name: exposure
        in: query
        schema:
          $ref: '#/components/schemas/Exposure'
      - name: apiCode
        in: query
        schema:
          type: string
          maxLength: 100
      - name: upstreamCode
        in: query
        schema:
          $ref: '#/components/schemas/UpstreamCode'
      - name: sort
        in: query
        schema:
          type: string
          pattern: ^-?(routeCode|state|updatedAt)$
          maxLength: 255
        description: Tên trường, thêm `-` phía trước để giảm dần.
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePage'
          headers:
            ETag:
              schema:
                type: string
                maxLength: 255
              description: Phiên bản bản ghi, dùng cho `If-Match`.
            X-RateLimit-Limit: &id001
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining: &id002
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset: &id003
              $ref: '#/components/headers/RateLimitReset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/Problem'
      x-datahub-errors:
      - ERR-03-003
      - ERR-03-022
  /routes/{routeCode}:
    get:
      tags:
      - Route và upstream
      operationId: getRoute
      summary: Chi tiết route
      x-datahub-id: API-03-002
      x-datahub-fr:
      - FR-03-009
      - FR-03-017
      - FR-03-028
      - FR-03-033
      - FR-03-034
      - FR-03-035
      x-datahub-permission:
        permission: PERM-03-read
      security:
      - oauth2User: []
      description: Trả `allowedActions` và `disabledReasons` để giao diện bật, tắt nút đúng như máy chủ sẽ kiểm. Có `impact` để nêu hậu quả bằng
        số trước khi xác nhận; có `eligibility` khi gọi với `eligibility=true`. Có `ETag`.
      parameters:
      - $ref: '#/components/parameters/RouteCodePath'
      - name: eligibility
        in: query
        schema: &id004
          type: boolean
        description: Trả thêm danh sách điều kiện mở cửa Internet, đạt hoặc chưa (UI-03-03 tab Cửa vào).
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetail'
          headers:
            ETag:
              schema:
                type: string
                maxLength: 255
              description: Phiên bản bản ghi, dùng cho `If-Match`.
            X-RateLimit-Limit: *id001
            X-RateLimit-Remaining: *id002
            X-RateLimit-Reset: *id003
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/Problem'
      x-datahub-errors:
      - ERR-03-001
      - ERR-03-003
      - ERR-03-022
  /routes/{routeCode}:stop:
    post:
      tags:
      - Route và upstream
      operationId: stopRoute
      summary: Dừng API
      x-datahub-id: API-03-003
      x-datahub-fr:
      - FR-03-036
      x-datahub-permission:
        permission: PERM-03-operate
      security:
      - oauth2User: []
      description: Chuyển `ACTIVE` sang `STOPPED`; lượt gọi nhận ERR-03-123 (503) kèm `Retry-After`. Phát EVT-03-03 và ghi kiểm toán.
      parameters:
      - $ref: '#/components/parameters/RouteCodePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteStopRequest'
      responses:
