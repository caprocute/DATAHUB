      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseHoldResult'
          headers:
            X-RateLimit-Limit: *id001
            X-RateLimit-Remaining: *id002
            X-RateLimit-Reset: *id003
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/Problem'
      x-datahub-errors:
      - ERR-03-003
      - ERR-03-019
      - ERR-03-022
components:
  securitySchemes:
    oauth2User:
      type: oauth2
      description: Keycloak realm dh-{tenant}, JWT theo RFC8725 (JWT BCP), token truy cập sống ngắn (5 phút) làm mới bằng refresh token ở BFF;
        vai trò ánh xạ PERM-03-* (D02-08).
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          refreshUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes: {}
    oauth2Service:
      type: oauth2
      description: 'Token dịch vụ theo RFC8725 (JWT BCP), sống ngắn (5 phút): PH-01 (`gateway:sync`), PH-12 (`gateway:revoke`), PH-13 (`gateway:read-state`).'
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          refreshUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            gateway:sync: Tạo, cập nhật, gỡ consumer
            gateway:revoke: Đẩy danh sách chặn token
            gateway:read-state: Đọc cấu hình và trạng thái nút
  parameters:
    RouteCodePath:
      name: routeCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RouteCode'
    UpstreamCodePath:
      name: upstreamCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UpstreamCode'
    ConsumerCodePath:
      name: consumerCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConsumerCode'
    PolicyCodePath:
      name: policyCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    OverrideIdPath:
      name: overrideId
      in: path
      required: true
      schema: &id009
        type: string
        format: uuid
        maxLength: 36
    ExceptionIdPath:
      name: exceptionId
      in: path
      required: true
      schema: *id009
    BlockIdPath:
      name: blockId
      in: path
      required: true
      schema: *id009
    PatchIdPath:
      name: patchId
      in: path
      required: true
      schema: *id009
    SnapshotVersionPath:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        format: int32
        maximum: 2147483647
      description: Số phiên bản ảnh chụp, tăng đơn điệu theo site.
    NodeIdPath:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    TemplateCodePath:
      name: templateCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    CertCodePath:
      name: certCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema: *id009
    LogIdPath:
      name: logId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    CheckIdPath:
      name: checkId
      in: path
      required: true
      schema: *id009
    AlertIdPath:
      name: alertId
      in: path
      required: true
      schema: *id009
    ImportIdPath:
      name: importId
      in: path
      required: true
      schema: *id009
    RedirectIdPath:
      name: redirectId
      in: path
      required: true
      schema: *id009
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
        format: int32
        maximum: 2147483647
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
      description: Con trỏ mờ lấy từ `page.next` của lần gọi trước.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
        format: int32
      description: Số dòng mỗi trang, tối đa 100.
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        format: int32
      description: Tối đa 100.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: ETag hiện tại của đối tượng; lệch trả ERR-03-004 (412) kèm `currentEtag`.
    IfMatchOptional:
      name: If-Match
      in: header
      schema:
        type: string
        maxLength: 128
      description: ETag hiện tại; có thì kiểm, lệch trả ERR-03-004.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 16
      description: 'Lưu 24 giờ: cùng khóa cùng thân trả đúng phản hồi cũ; cùng khóa khác thân trả ERR-03-003.'
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
        maxLength: 55
      description: W3C Trace Context.
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - vi
        - en
  headers:
    RateLimitLimit:
      description: Giới hạn chặt nhất đang áp cho bên gọi (FR-03-025). API quản trị là một route của chính cổng nên chịu cùng cơ chế.
      schema:
        type: integer
        minimum: 0
        format: int32
        maximum: 2147483647
    RateLimitRemaining:
      description: Số lượt còn lại trong cửa sổ hiện tại.
      schema:
        type: integer
        minimum: 0
        format: int32
        maximum: 2147483647
    RateLimitReset:
      description: Thời điểm đặt lại, giây Unix.
      schema:
        type: integer
        minimum: 0
        format: int64
        maximum: 4102444800
    RetryAfter:
      description: Số giây nên chờ trước khi thử lại.
      schema:
        type: integer
        minimum: 0
        maximum: 86400
        format: int32
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ (ERR-03-003, 021); kèm `errors` theo trường.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-03-003
            title: Dữ liệu không hợp lệ
            status: 400
            code: ERR-03-003
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            errors:
            - field: certThumbprints[0]
              rule: pattern
              message: Phải là SHA-256 dạng hex 64 ký tự.
      headers:
        X-RateLimit-Limit: *id001
        X-RateLimit-Remaining: *id002
        X-RateLimit-Reset: *id003
    Forbidden:
      description: Không đủ quyền (ERR-03-022) hoặc vi phạm bốn mắt (ERR-03-008).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-03-022
            title: Không đủ quyền
            status: 403
            code: ERR-03-022
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      headers:
        X-RateLimit-Limit: *id001
        X-RateLimit-Remaining: *id002
        X-RateLimit-Reset: *id003
    NotFound:
      description: Không tìm thấy hoặc thuộc tenant khác, không phân biệt (ERR-03-001).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-03-001
            title: Không tìm thấy
            status: 404
            code: ERR-03-001
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      headers:
        X-RateLimit-Limit: *id001
        X-RateLimit-Remaining: *id002
        X-RateLimit-Reset: *id003
    Conflict:
      description: Trạng thái hoặc dữ liệu xung đột; mã cụ thể trong `code` (ERR-03-002, 006, 010, 017, 019, 023, 025).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-03-019
            title: Đối tượng đã ở trạng thái đích
            status: 409
            code: ERR-03-019
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      headers:
        X-RateLimit-Limit: *id001
        X-RateLimit-Remaining: *id002
        X-RateLimit-Reset: *id003
    PreconditionFailed:
      description: '`If-Match` không khớp (ERR-03-004); kèm `currentEtag`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-03-004
            title: Xung đột phiên bản bản ghi
            status: 412
            code: ERR-03-004
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            currentEtag: '"4"'
      headers:
        X-RateLimit-Limit: *id001
        X-RateLimit-Remaining: *id002
        X-RateLimit-Reset: *id003
    Unprocessable:
      description: Lỗi nghiệp vụ dạng dữ liệu; mã cụ thể trong `code` (ERR-03-005, 007, 009, 011, 012, 013, 016, 018, 020, 024, 027).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-03-005
            title: Cấu hình không hợp lệ
            status: 422
            code: ERR-03-005
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      headers:
        X-RateLimit-Limit: *id001
        X-RateLimit-Remaining: *id002
        X-RateLimit-Reset: *id003
    BadGateway:
      description: Không ghi được ảnh chụp tới Git hoặc bucket (ERR-03-014).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-03-014
            title: Không ghi được ảnh chụp
            status: 502
            code: ERR-03-014
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      headers:
        X-RateLimit-Limit: *id001
        X-RateLimit-Remaining: *id002
        X-RateLimit-Reset: *id003
    ServiceUnavailable:
      description: Phụ thuộc chưa sẵn sàng (ERR-03-015 ký, ERR-03-026 số liệu PH-13).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-03-015
            title: Dịch vụ ký không khả dụng
            status: 503
            code: ERR-03-015
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
            format: int32
            maximum: 2147483647
          description: Số giây chờ trước khi thử lại.
        X-RateLimit-Limit: *id001
        X-RateLimit-Remaining: *id002
        X-RateLimit-Reset: *id003
    TooManyRequests:
      description: Vượt hạn mức do gateway áp trước khi tới `dh-connect` (ERR-03-116 theo HTTT, ERR-03-118 toàn tenant).
      headers:
        X-RateLimit-Limit: *id001
        X-RateLimit-Remaining: *id002
        X-RateLimit-Reset: *id003
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GatewayProblem'
          example:
            type: https://datahub.gov.vn/errors/ERR-03-116
            title: Vượt tần suất của HTTT
            status: 429
            code: ERR-03-116
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            retryAfterSeconds: 1
    InternalError:
      description: Lỗi nội bộ của `dh-connect` chưa có mã ERR-03 (Q03-55); không kèm vết ngăn xếp hay tên nội bộ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GenericProblem'
          example:
            type: https://datahub.gov.vn/errors/internal
            title: Lỗi nội bộ
            status: 500
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      headers:
        X-RateLimit-Limit: *id001
        X-RateLimit-Remaining: *id002
        X-RateLimit-Reset: *id003
    Problem:
      description: Lỗi theo RFC 9457 (CC-API-02); mã cụ thể ở `code`, danh sách mã của thao tác ở `x-datahub-errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-03-003
            title: Dữ liệu không hợp lệ
            status: 400
            code: ERR-03-003
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            errors:
            - field: certThumbprints[0]
              rule: pattern
              message: Phải là SHA-256 dạng hex 64 ký tự.
      headers:
        X-RateLimit-Limit: *id001
        X-RateLimit-Remaining: *id002
        X-RateLimit-Reset: *id003
    Unauthorized:
      description: Thiếu token hoặc token hết hạn (lớp xác thực của `dh-connect`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GenericProblem'
          example:
            type: https://datahub.gov.vn/errors/unauthorized
            title: Chưa xác thực
            status: 401
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      headers:
        X-RateLimit-Limit: *id001
        X-RateLimit-Remaining: *id002
        X-RateLimit-Reset: *id003
  schemas:
    RouteCode:
      type: string
      maxLength: 127
      pattern: ^[a-z][a-z0-9.-]{2,126}$
      description: Mã route = mã API ở PH-02 kèm phiên bản, bất biến, không dùng lại (BR-03-026). Ví dụ `tra-cuu-ho-tich.v1`.
    UpstreamCode:
      type: string
      maxLength: 63
      pattern: ^[a-z][a-z0-9.-]{2,62}$
    ConsumerCode:
      type: string
      maxLength: 63
      pattern: ^[a-z][a-z0-9-]{2,62}$
      description: Trùng `clientId` ở Keycloak (BR-03-022).
    SystemCode:
      type: string
      maxLength: 64
      description: Mã HTTT ở PH-01.
    Sha256Hex:
      type: string
      maxLength: 64
      pattern: ^[0-9a-f]{64}$
    TenantCode:
      type: string
      maxLength: 16
      pattern: ^(T[0-9]{2}|COMMON)$
    Cidr:
      type: string
      maxLength: 43
      description: Địa chỉ hoặc dải CIDR IPv4, IPv6.
    Reason:
      type: string
      maxLength: 500
      minLength: 10
      description: Lý do 10…500 ký tự.
    Exposure:
      type: string
      enum:
      - INT
      - EXT
      description: '`INT` chỉ nạp ở `apisix-int`; `EXT` nạp thêm ở `apisix-ext` sau khi SO duyệt (BR-03-015).'
    RouteState:
      type: string
      enum:
      - PENDING
      - ACTIVE
      - STOPPED
      - SUSPENDED
      - SUNSET
      - RETIRED
    PriorityGroup:
      type: string
      enum:
      - ESSENTIAL
      - NORMAL
      - LOW
    ConsumerState:
      type: string
      enum:
      - ACTIVE
      - SUSPENDED
    AuthMethod:
      type: string
      enum:
      - OAUTH2
      - MTLS
      - API_KEY
    SecurityMode:
      type: string
      enum:
      - KEYLESS
      - API_KEY
      - OAUTH2
      - MTLS
    SyncState:
      type: string
      enum:
      - PENDING
      - IN_SYNC
      - PARTIAL
      - FAILED
    WafModeValue:
      type: string
      enum:
      - DETECT
      - BLOCK
    Period:
      type: string
      enum:
      - HOUR
      - DAY
      - MONTH
    Severity:
      type: string
      enum:
      - MEDIUM
      - HIGH
      - CRITICAL
    AllowedActions:
      type: object
      properties:
        allowedActions:
          type: array
          items:
            type: string
            maxLength: 255
          description: Hành động người gọi được làm ngay bây giờ.
          maxItems: 1000
        disabledReasons:
          type: object
          additionalProperties:
            type: string
            maxLength: 255
          description: Hành động có quyền nhưng trạng thái chưa cho phép, kèm lý do tiếng Việt.
    Finding:
      type: object
      properties:
        checkId:
          type: string
          maxLength: 16
          pattern: ^CHK-[0-9]{2}$
        severity:
          type: string
          enum:
          - ERROR
          - WARNING
        objectType:
          type: string
          maxLength: 32
        objectCode:
          type: string
          maxLength: 127
        message:
          type: string
          maxLength: 500
      additionalProperties: false
      required:
      - checkId
      - severity
      - message
    FieldError:
      type: object
      properties:
        field:
          type: string
          maxLength: 255
        rule:
          type: string
          maxLength: 255
        message:
          type: string
          maxLength: 255
        max:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        min:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
      additionalProperties: false
      required:
      - field
    ProblemDetails:
      type: object
      description: RFC 9457 `application/problem+json`, mở rộng theo D03-04-PH03 §1. Mã `ERR-03-001…027` (control plane).
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
          maxLength: 2048
        title:
          type: string
          maxLength: 255
        status:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        detail:
          type: string
          maxLength: 255
        instance:
          type: string
          maxLength: 255
        code:
          type: string
          pattern: ^ERR-03-0[0-9]{2}$
          maxLength: 255
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
          maxLength: 255
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          maxItems: 1000
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
          description: Kèm ERR-03-005, 012, 013.
          maxItems: 1000
        currentEtag:
          type: string
          description: Kèm ERR-03-004.
          maxLength: 255
        retryAfterSeconds:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        ceiling:
          type: integer
          description: 'Kèm ERR-03-018: trần cho phép.'
          format: int32
          minimum: 0
          maximum: 2147483647
        ruleId:
          type: string
          description: Kèm ERR-03-010.
          maxLength: 255
        existingExpiresAt: *id005
        activeSubscriptions:
          type: integer
          description: Kèm ERR-03-017.
          format: int32
          minimum: 0
          maximum: 2147483647
        detectDays:
          type: integer
          description: 'Kèm ERR-03-027: số ngày đã chạy phát hiện.'
          format: int32
          minimum: 0
          maximum: 2147483647
        requiredDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
      additionalProperties: true
    GenericProblem:
      type: object
      description: Lỗi do lớp hạ tầng của `dh-connect` trả (401 xác thực, 500 nội bộ), chưa tới lớp nghiệp vụ nên chưa có mã ERR-03 (Q03-55).
      required:
      - type
      - title
      - status
      - traceId
      properties:
        type:
          type: string
          format: uri
          maxLength: 2048
        title:
          type: string
          maxLength: 255
        status:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        detail:
          type: string
          maxLength: 255
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
          maxLength: 255
      additionalProperties: true
    GatewayProblem:
      type: object
      description: Thân RFC 9457 mà APISIX trả cho bên gọi API qua cổng (`ERR-03-101…130`), dựng bởi plugin `dh-problem`. Không phải phản hồi
        của API này, đưa vào đây để bên gọi và kiểm thử có một lược đồ.
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
          maxLength: 2048
        title:
          type: string
          maxLength: 255
        status:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        detail:
          type: string
          maxLength: 255
        instance:
          type: string
          maxLength: 255
        code:
          type: string
          pattern: ^ERR-03-1[0-3][0-9]$
          maxLength: 255
        traceId:
