    parameters:
      tenant:
        $ref: '#/components/parameters/tenant'
    bindings:
      kafka:
        topic: '{tenant}.gateway.snapshot.published.v1'
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
