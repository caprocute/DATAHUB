components:
  parameters:
    tenant:
      description: Mã tenant chữ thường (`t68`) hoặc `common`.
      examples:
      - t68
  securitySchemes:
    mtls:
      type: X509
      description: Chứng thư do cert-manager cấp; ACL Kafka theo CN.
  messages:
    snapshotPublished:
      name: snapshotPublished
      title: EVT-03-01
      summary: Ảnh chụp cấu hình được phát (FR-03-042).
      payload:
        $ref: '#/components/schemas/SnapshotPublished'
      headers: &id001
        type: object
        properties:
          ce_specversion:
            type: string
            const: '1.0'
          ce_id:
            type: string
            format: uuid
            description: UUID v7, khóa lũy đẳng của người tiêu thụ.
          ce_source:
            type: string
            const: /datahub/dh-connect/gateway
            description: 'Theo CC-API-04: `/datahub/{du}/{module}`.'
          ce_type:
            type: string
            pattern: ^vn\.datahub\.gateway\.[a-z-]+\.[a-z-]+\.v1$
            description: '`vn.datahub.gateway.{thực-thể}.{sự-kiện}.v1`'
          ce_time: &id004
            type: string
            format: date-time
          ce_subject:
            type: string
            description: Mã đối tượng.
          ce_dhtenant: &id002
            type: string
            pattern: ^(T[0-9]{2}|COMMON)$
            description: Mã tenant; `COMMON` cho phần dùng chung toàn nền tảng.
          ce_dataschema:
            type: string
            format: uri
            description: Lược đồ ở Apicurio.
          ce_datacontenttype:
            type: string
            const: application/json
          traceparent:
            type: string
        required:
        - ce_specversion
        - ce_id
        - ce_source
        - ce_type
        - ce_time
        - ce_dhtenant
      bindings:
        kafka:
          key:
            type: string
            description: '`scope` (mã tenant hoặc `COMMON`)'
    snapshotRolledBack:
      name: snapshotRolledBack
      title: EVT-03-02
      summary: Quay lui cấu hình bằng ảnh chụp mới (FR-03-044).
      payload:
        $ref: '#/components/schemas/SnapshotRolledBack'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`scope`'
    routeStateChanged:
      name: routeStateChanged
      title: EVT-03-03
      summary: Route dừng, mở, tạm ngừng, SUNSET, RETIRED hoặc đổi cửa vào (FR-03-035, 036, 038, 047).
      payload:
        $ref: '#/components/schemas/RouteStateChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{routeCode}`'
    consumerStateChanged:
      name: consumerStateChanged
      title: EVT-03-04
      summary: Consumer tạo, đổi, tạm ngừng, gỡ (FR-03-046, 047).
      payload:
        $ref: '#/components/schemas/ConsumerStateChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{consumerCode}`'
    wafExceptionChanged:
      name: wafExceptionChanged
      title: EVT-03-05
      summary: Ngoại lệ WAF được đề nghị, duyệt, từ chối, thu hồi, hết hạn (FR-03-007).
      payload:
        $ref: '#/components/schemas/WafExceptionChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{exceptionId}`'
    wafExceptionExpiring:
      name: wafExceptionExpiring
      title: EVT-03-06
      summary: Ngoại lệ WAF còn 7 ngày hết hạn (FR-03-007).
      payload:
        $ref: '#/components/schemas/WafExceptionExpiring'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{exceptionId}`'
    quotaThresholdReached:
      name: quotaThresholdReached
      title: EVT-03-07
      summary: HTTT đạt 80% hoặc 100% hạn ngạch; tenant sắp chạm hạn mức (FR-03-022, 023).
      payload:
        $ref: '#/components/schemas/QuotaThresholdReached'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{consumerCode}` hoặc `TENANT`'
    certificateExpiring:
      name: certificateExpiring
      title: EVT-03-08
      summary: Chứng thư biên còn dưới 30 ngày (FR-03-049).
      payload:
        $ref: '#/components/schemas/CertificateExpiring'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{certCode}`'
    securityAlertRaised:
      name: securityAlertRaised
      title: EVT-03-09
      summary: 'Sự kiện an ninh, vận hành của gateway (FR-03-004, 005, 006, 013, 014, 026, 027, 031, 047, 053, 054). Hai nguồn phát: APISIX qua
        `kafka-logger` và `dh-connect` qua outbox.'
      payload:
        $ref: '#/components/schemas/SecurityAlertRaised'
      headers:
        type: object
        properties:
          traceparent:
            type: string
          ce_id:
            type: string
            format: uuid
      bindings:
        kafka:
          key:
            type: string
            description: '`routeCode`, nếu không gắn route thì `node`'
    tenantRedirectChanged:
      name: tenantRedirectChanged
      title: EVT-03-10
      summary: Chuyển tiếp tenant sáp nhập bắt đầu, kết thúc (FR-03-037).
      payload:
        $ref: '#/components/schemas/TenantRedirectChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`fromTenant`'
    limitChanged:
      name: limitChanged
      title: EVT-03-11
      summary: Hạn mức toàn tenant, ghi đè hạn mức hoặc tham số hạn mức đổi (FR-03-023, 024, 056).
      payload:
        $ref: '#/components/schemas/LimitChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`scopeKey` (mã đối tượng hoặc khóa `gw.*`)'
    snapshotRejected:
      name: snapshotRejected
      title: EVT-03-12
      summary: Ảnh chụp bị từ chối khi kiểm tra hợp lệ, kèm danh sách lỗi (FR-03-040).
      payload:
        $ref: '#/components/schemas/SnapshotRejected'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`scope`'
  schemas:
    Actor:
      type: object
      properties:
        userId:
          type: string
        type:
          type: string
          enum:
          - USER
          - SYSTEM
      required:
      - userId
      - type
    SnapshotPublished:
      type: object
      properties:
        tenantId: *id002
        snapshotVersion: &id003
          type: integer
        site:
          type: string
        scope: *id002
        contentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        signatureKeyId:
          type: string
        trigger:
          type: string
          enum:
          - AUTO
          - MANUAL
          - ROLLBACK
          - IMPORT
          - RECONCILE
        builtFrom:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              cursor:
                type: string
            required:
            - source
        routes:
          type: object
          properties:
            added: *id003
            changed: *id003
            removed: *id003
        gitPending: &id006
          type: boolean
        publishedAt: *id004
        actor:
          $ref: '#/components/schemas/Actor'
      required:
      - tenantId
      - snapshotVersion
      - site
      - scope
      - contentHash
      - trigger
      - publishedAt
      examples:
      - tenantId: T68
        snapshotVersion: 48213
        site: dc1
        scope: T68
        contentHash: 9f2c5a0e7d4b3c1a8e6f0b2d4c6a8e0f1b3d5f7a9c1e3b5d7f9a1c3e5b7d9f0a
        signatureKeyId: dh-gateway-snapshot:3
        trigger: AUTO
        builtFrom:
        - source: catalog
          cursor: e-1204455
        routes:
          added: 2
          changed: 1
          removed: 0
        gitPending: false
        publishedAt: '2026-11-26T09:14:08+07:00'
        actor:
          userId: system:dh-connect
          type: SYSTEM
    SnapshotRolledBack:
      type: object
      properties:
        tenantId: *id002
        snapshotVersion: *id003
        targetVersion: *id003
        site:
          type: string
        scope: *id002
        holdUntil: *id004
        reason:
          type: string
          maxLength: 500
        rolledBackAt: *id004
        actor:
          $ref: '#/components/schemas/Actor'
