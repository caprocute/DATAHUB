# D03-04-PH03 · AsyncAPI PH-03. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py — không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: 3.0.0
info:
  title: Datahub PH-03 Cổng API, sự kiện
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-03-01…12 (D03-04-PH03 §4, FRS §9.3).


    Mọi sự kiện, trừ nhánh gateway của EVT-03-09, do `dh-connect` ghi vào `ph03_gateway.outbox` cùng giao dịch với thay đổi trạng thái; Debezium
    outbox đưa lên Kafka (ADR-042), CloudEvents 1.0 chế độ nhị phân, khóa phân vùng là mã đối tượng nên sự kiện của một đối tượng giữ thứ tự.
    EVT-03-09 do APISIX phát qua plugin `kafka-logger` (không giao dịch, giao ít nhất một lần) và do `dh-connect` phát khi tạm ngừng khẩn cấp.
    Không sự kiện nào mang bí mật, thân yêu cầu hay giá trị tiêu đề xác thực. Người nhận xử lý lũy đẳng theo `ce_id`. Tương thích BACKWARD ở Apicurio
    (ADR-070): chỉ thêm trường tùy chọn trong `v1`. Dữ liệu ví dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  license:
    name: Tài liệu nội bộ dự án Datahub
defaultContentType: application/json
servers:
  kafka-cum:
    host: kafka-bootstrap.dh-platform.svc:9093
    protocol: kafka-secure
    description: Kafka (Strimzi) của cụm; mTLS, ACL theo principal và tiền tố tenant.
    security:
    - $ref: '#/components/securitySchemes/mtls'
channels:
  snapshotPublished:
    address: '{tenant}.gateway.snapshot.published.v1'
    title: EVT-03-01
    description: Ảnh chụp cấu hình được phát (FR-03-042).
    messages:
