components:
  parameters:
    tenant:
      description: Mã tenant chữ thường (`t68`).
      examples:
      - t68
  securitySchemes:
    mtls:
      type: X509
      description: Chứng thư do cert-manager cấp; ACL Kafka theo CN.
  messages:
    systemSubmitted:
      name: systemSubmitted
      title: EVT-01-01
      summary: Hồ sơ được nộp hoặc nộp lại (FR-01-012).
      payload:
        $ref: '#/components/schemas/SystemSubmitted'
      headers: &id001
        type: object
        properties:
          ce_specversion:
            type: string
            const: '1.0'
          ce_id:
            type: string
            format: uuid
            description: ULID/UUID duy nhất của sự kiện; bên nhận lũy đẳng theo `(systemCode, updatedAt)`.
          ce_source:
            type: string
            description: '`/tenants/{tenant}/onboarding`'
          ce_type:
            type: string
            description: '`vn.datahub.connect.{thực-thể}.{sự-kiện}.v1`'
          ce_time: &id003
            type: string
            format: date-time
          ce_subject:
            type: string
            description: Mã HTTT (hoặc mã kỳ, mã tổ chức).
          ce_datacontenttype:
            type: string
            const: application/json
          traceparent:
            type: string
        required:
        - ce_specversion
        - ce_id
        - ce_source
        - ce_type
        - ce_time
      bindings:
        kafka:
          key:
            type: string
            description: '`systemCode`'
      examples:
      - name: Ví dụ giả lập
        payload:
          tenantId: T68
          systemCode: HT-TUPHAP
          applicationNo: KN-2026-000123
          ownerOrgId: SO-TUPHAP
          revisionNo: 1
          resubmitted: false
          submittedBy: an.nv
          submittedAt: '2026-11-26T09:00:00Z'
          steps:
          - stepType: TECHNICAL
            dueAt: '2026-11-30T10:00:00Z'
          - stepType: SECURITY
            dueAt: '2026-11-30T10:00:00Z'
    reviewDecided:
      name: reviewDecided
      title: EVT-01-02
      summary: Bước thẩm định hoàn tất, phân công, tham vấn, trả bổ sung, phê duyệt hoặc từ chối (FR-01-013…018).
      payload:
        $ref: '#/components/schemas/ReviewDecided'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`systemCode`'
      examples:
      - name: Ví dụ giả lập
        payload:
          tenantId: T68
          systemCode: HT-TUPHAP
          applicationNo: KN-2026-000123
          revisionNo: 1
          kind: STEP_DONE
          stepType: TECHNICAL
          result: PASS
          assigneeId: ie.tranb
          actor:
            userId: ie.tranb
            type: USER
          at: '2026-11-27T03:00:00Z'
    systemStateChanged:
      name: systemStateChanged
      title: EVT-01-03
      summary: Mọi chuyển trạng thái HTTT; ảnh chụp đối chiếu hằng giờ có `snapshot = true` (FR-01-037). Có hiệu lực ở bên nhận trong ≤ 60 giây
        (NFR-01-008).
      payload:
        $ref: '#/components/schemas/SystemStateChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`systemCode`'
      examples:
      - name: Ví dụ giả lập
        payload:
          tenantId: T68
          systemCode: HT-TUPHAP
          name: Hệ thống quản lý hộ tịch
          ownerOrgId: SO-TUPHAP
          from: ACTIVE
          to: SUSPENDED
          reviewStage: null
          provisionStage: null
          reasonCode: OVERLOAD
          reason: Tăng đột biến lưu lượng làm quá tải cổng
          emergency: false
          snapshot: false
          roles:
          - CONSUMER
          - PROVIDER
          securityLevel: L3
          group: 1
          ceilingDataTypes:
          - THONG_TIN_CONG_DAN
          version: 14
          updatedAt: '2026-12-12T02:00:00Z'
          actor: &id002
            userId: an.nv
            type: USER
    systemUpdated:
      name: systemUpdated
      title: EVT-01-04
      summary: 'Đổi thuộc tính: cấp độ ATTT, địa chỉ, IP, chủ quản, vai trò (FR-01-034).'
      payload:
        $ref: '#/components/schemas/SystemUpdated'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`systemCode`'
      examples:
      - name: Ví dụ giả lập
        payload:
          tenantId: T68
          systemCode: HT-TUPHAP
          changedFields:
          - baseUrls
          - ipAllowlist
          securityLevel: L3
          ownerOrgId: SO-TUPHAP
          roles:
          - CONSUMER
          - PROVIDER
          baseUrls:
          - https://hotich.tinh.example.gov.vn/api/v2
          ipAllowlist:
          - 10.20.0.0/24
          - 10.20.1.0/24
          version: 15
          updatedAt: '2026-12-13T02:00:00Z'
          actor: *id002
    credentialIssued:
      name: credentialIssued
      title: EVT-01-05
