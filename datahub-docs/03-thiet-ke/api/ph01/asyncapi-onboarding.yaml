  schemas:
    Actor:
      type: object
      properties:
        userId:
          type: string
        type:
          type: string
          enum:
          - USER
          - SYSTEM
      required:
      - userId
      - type
    SystemSubmitted:
      type: object
      properties:
        tenantId: &id004
          type: string
          pattern: ^(T[0-9]{2}|COMMON)$
          description: Mã tenant, ví dụ `T68`.
        systemCode: &id005
          type: string
          maxLength: 64
          pattern: ^[A-Z][A-Z0-9-]{2,63}$
          description: Mã HTTT.
        applicationNo:
          type: string
        ownerOrgId:
          type: string
        revisionNo:
          type: integer
          minimum: 1
        resubmitted: &id008
          type: boolean
        submittedBy:
          type: string
        submittedAt: *id003
        steps:
          type: array
          items:
            type: object
            properties:
              stepType: &id006
                type: string
                enum:
                - TECHNICAL
                - LEGAL
                - SECURITY
              dueAt: *id003
            required:
            - stepType
            - dueAt
      required:
      - tenantId
      - systemCode
      - applicationNo
      - revisionNo
      - submittedAt
      - steps
    ReviewDecided:
      type: object
      properties:
        tenantId: *id004
        systemCode: *id005
        applicationNo:
          type: string
        revisionNo: &id009
          type: integer
        kind:
          type: string
          enum:
          - STEP_DONE
          - ASSIGNED
          - CONSULTED
          - RESUMED
          - RETURNED
          - APPROVED
          - REJECTED
        stepType:
          oneOf:
          - *id006
          - type: 'null'
        result:
          oneOf:
          - type: string
            enum:
            - PASS
            - FAIL
          - type: 'null'
        assigneeId:
          type:
          - string
          - 'null'
        actor:
          $ref: '#/components/schemas/Actor'
        at: *id003
      required:
      - tenantId
      - systemCode
      - kind
      - actor
      - at
    SystemStateChanged:
      type: object
      properties:
        tenantId: *id004
        systemCode: *id005
        name:
          type: string
        ownerOrgId:
          type: string
        from:
          oneOf:
          - &id007
            type: string
            enum:
            - DRAFT
            - SUBMITTED
            - APPROVED
            - ACTIVE
            - SUSPENDED
            - TERMINATED
            - REJECTED
          - type: 'null'
        to: *id007
        reviewStage:
          type:
          - string
          - 'null'
        provisionStage:
          type:
          - string
          - 'null'
        reasonCode:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
          maxLength: 1000
        emergency: *id008
        snapshot: *id008
        roles:
          type: array
          items:
            type: string
            enum:
            - CONSUMER
            - PROVIDER
            - PUBLISHER
            - SUBSCRIBER
        securityLevel: &id010
          type: string
          enum:
          - L1
          - L2
          - L3
          - L4
          - L5
        group:
          type:
          - integer
          - 'null'
        ceilingDataTypes:
          type: array
          items:
            type: string
          description: Để bên nhận phát hiện lệch với EVT-01-11.
        version: *id009
        updatedAt: *id003
        actor:
          oneOf:
          - $ref: '#/components/schemas/Actor'
          - type: 'null'
      required:
      - tenantId
      - systemCode
      - to
      - snapshot
      - version
      - updatedAt
    SystemUpdated:
      type: object
      properties:
        tenantId: *id004
        systemCode: *id005
        changedFields:
          type: array
          items:
            type: string
            enum:
            - securityLevel
            - baseUrls
            - ipAllowlist
            - ownerOrgId
            - roles
            - name
          minItems: 1
        securityLevel: *id010
        ownerOrgId:
          type: string
        roles:
          type: array
          items:
            type: string
        baseUrls:
          type: array
          items:
            type: string
            format: uri
        ipAllowlist:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Danh sách CIDR đầy đủ khi `ipAllowlist` nằm trong `changedFields`.
        version: *id009
        updatedAt: *id003
        actor:
          $ref: '#/components/schemas/Actor'
      required:
      - tenantId
      - systemCode
      - changedFields
      - version
      - updatedAt
