# D03-04-PH01 · AsyncAPI PH-01. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py — không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: 3.0.0
info:
  title: Datahub PH-01 Kết nạp hệ thống thông tin — sự kiện
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-01-01…15 (D03-04-PH01 §4, D02-03-PH01 §9.3), miền `connect` của `dh-connect`.


    Mọi sự kiện ghi vào `ph01_onboarding.outbox` cùng giao dịch với thay đổi (ADR-042), Debezium (hoặc `OutboxRelay` ở `QM-NHO`) đưa lên Kafka,
    CloudEvents 1.0 chế độ nhị phân; khóa bản ghi là `systemCode` (trừ EVT-01-12 khóa mã kỳ, EVT-01-14 khóa mã tổ chức) nên mọi thay đổi của một
    HTTT đến đúng thứ tự. Không sự kiện nào mang giá trị bí mật, `secret_ref`, liên kết bàn giao hay dữ liệu liên hệ cá nhân (kiểm thử canary
    `DH-CANARY-…`, NFR-01-009). Người nhận xử lý lũy đẳng theo `(systemCode, updatedAt)` hoặc `version`, bỏ qua bản cũ hơn bản đang giữ. Tương
    thích: chỉ thêm trường tùy chọn trong `v1`.


    PH-01 cũng tiêu thụ ba loại sự kiện của phân hệ khác (tài khoản đầu mối bị vô hiệu hoặc đổi tổ chức của PH-12, thư bị trả lại của PH-18, tenant
    tạm ngừng của PH-20); tên topic của chúng do phân hệ phát chốt ở D03-04 của phân hệ đó (Q01-13) nên chưa có kênh `receive` ở tệp này. Dữ liệu
    ví dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  license:
    name: Tài liệu nội bộ dự án Datahub
defaultContentType: application/json
