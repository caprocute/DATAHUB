                $ref: '#/components/schemas/JobAccepted'
              example:
                jobId: 0194f2cd-a4b0-76aa-93ee-b1c2d3e4f506
                status: QUEUED
                statusUrl: /api/onboarding/v1/jobs/0194f2cd-a4b0-76aa-93ee-b1c2d3e4f506
            text/csv:
              schema:
                type: string
                contentEncoding: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                contentEncoding: binary
        '202':
          description: Đã nhận, xử lý bất đồng bộ.
          headers:
            Location:
              schema:
                type: string
              description: Nơi theo dõi tiến trình.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /statistics:
    get:
      tags:
      - Di trú, tham số, thống kê
      operationId: getStatistics
      summary: Thống kê kết nạp và thời gian xử lý
      x-datahub-id: API-01-086
      x-datahub-fr:
      - FR-01-051
      x-datahub-permission:
        permission: PERM-01-read
      description: Mặc định 90 ngày gần nhất.
      parameters:
      - name: from
        in: query
        schema: &id002
          type: string
          format: date
      - name: to
        in: query
        schema: *id002
      - name: ownerOrgId
        in: query
        schema:
          $ref: '#/components/schemas/OrgId'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      x-datahub-errors:
      - ERR-01-003
      - ERR-01-052
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsView'
              example:
                from: '2026-09-01'
                to: '2026-11-30'
                byStatus:
                  ACTIVE: 96
                  SUBMITTED: 7
                  DRAFT: 12
                stageDurations:
                  median: 9
                  p90: 22
                endToEnd:
                  median: 40
                  p90: 71
                  kpi05Met: true
                returnRate: 0.18
                backlog: 7
                weekly:
                - week: 2026-W47
                  submitted: 6
                  approved: 4
                  returned: 1
                  rejected: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /jobs/{jobId}:
    get:
      tags:
      - Di trú, tham số, thống kê
      operationId: getJob
      summary: Tra tác vụ nền xuất tệp hoặc báo cáo
      x-datahub-id: API-01-088
      x-datahub-fr:
      - FR-01-044
      - FR-01-047
      - FR-01-050
      x-datahub-permission:
        permission: PERM-01-read
      description: Chỉ người tạo tác vụ hoặc TA, AU. `downloadUrl` là liên kết ký, hết hạn 15 phút.
      parameters:
      - $ref: '#/components/parameters/JobIdPath'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      x-datahub-errors:
      - ERR-01-001
      - ERR-01-052
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              example:
                jobId: 0194f2cd-a4b0-76aa-93ee-b1c2d3e4f506
                kind: EXPORT_CONTACTS
                status: DONE
                createdAt: '2026-12-02T02:00:00Z'
                finishedAt: '2026-12-02T02:00:09Z'
                downloadUrl: https://files.t68.datahub.example.vn/exports/0194f2cd.xlsx?sig=demo
                rowCount: 842
                errorCode: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    oauth2User:
      type: oauth2
      description: Keycloak realm dh-{tenant}; vai trò ánh xạ PERM-01-*, PERM-18-* (D02-08). Thao tác nhạy cảm cần `acr` hai yếu tố trong `mfa.stepUpMinutes`.
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes: {}
    oauth2Service:
      type: oauth2
      description: Token dịch vụ của phân hệ khác; kiểm `azp` và `tenant`, không cấp cho người.
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            onboarding:internal-read: Đọc bản sao HTTT (PH-02, 03, 04, 05, 10, 13, 14, 15)
            onboarding:provision-callback: Trả kết quả bất đồng bộ của saga (PH-12, PH-03)
            onboarding:reconcile: Chạy đối chiếu trạng thái
  parameters:
    SystemCodePath:
      name: systemCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SystemCode'
    AttachmentIdPath:
      name: attachmentId
      in: path
      required: true
      schema: &id003
        type: string
        format: uuid
    ContactIdPath:
      name: contactId
      in: path
      required: true
      schema: *id003
    CredentialIdPath:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: ^cr-[0-9a-f-]{4,60}$
    HandoverIdPath:
      name: handoverId
      in: path
      required: true
      schema: *id003
    ActionIdPath:
      name: actionId
      in: path
      required: true
      schema: *id003
    ChangeRequestIdPath:
      name: changeRequestId
      in: path
      required: true
      schema: *id003
    CycleCodePath:
      name: cycleCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 32
        pattern: ^RS-[0-9]{4}-[0-9]{2}$
    TokenPath:
      name: token
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 43
      description: Mã trong liên kết gửi qua thư (256 bit, base64url). Cổng API che đoạn này trong log truy cập (Q01-55).
    OrgIdPath:
      name: orgId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OrgId'
    JobIdPath:
      name: jobId
      in: path
      required: true
      schema: *id003
    TemplateCodePath:
      name: templateCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Z][A-Z0-9-]{2,63}$
    KeyPath:
      name: key
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: ^onboarding\.[a-zA-Z][a-zA-Z0-9.]{2,55}$
      description: Khóa đầy đủ có tiền tố `onboarding.` (FRS §8.2).
    ReviewKindPath:
      name: reviewKind
      in: path
      required: true
      schema:
        type: string
        enum:
        - legal
        - security
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Số trang, bắt đầu từ 0.
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Số dòng mỗi trang (FR-00-021); 10, 20, 50 hoặc 100 trên giao diện.
    ReplicaSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
      description: Số dòng mỗi trang, ≤ 500 (`dh.onboarding.replica.max-page`); vượt trả ERR-01-003.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: ETag hiện tại (giá trị `version`); lệch trả ERR-01-007 (412).
    IfMatchOptional:
      name: If-Match
      in: header
      schema:
        type: string
        maxLength: 128
      description: 'Tùy chọn: có thì kiểm, lệch trả ERR-01-007. Không bắt buộc để thao tác khẩn không bị chặn bởi bản ghi cũ.'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 16
      description: Giữ 24 giờ; cùng khóa khác thân trả ERR-01-051; cùng khóa đang xử lý trả ERR-01-054.
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
        maxLength: 55
      description: W3C Trace Context.
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - vi
        - en
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ hoặc thiếu lý do, tệp sai cấu trúc (ERR-01-003, 033, 042); kèm `errors` theo trường.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-01-003
            title: Dữ liệu không hợp lệ
            status: 400
            code: ERR-01-003
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unauthorized:
      description: Thiếu hoặc hết hạn thông tin xác thực (ERR-01-052).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-01-052
            title: Không đủ quyền truy cập
            status: 401
            code: ERR-01-052
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Forbidden:
      description: Không đủ quyền hoặc scope, người nộp ngoài tổ chức, bốn mắt, không phải người nhận, cần xác thực lại (ERR-01-052, 006, 017,
        025, 035).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-01-052
            title: Không đủ quyền truy cập
            status: 403
            code: ERR-01-052
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    NotFound:
      description: Không tìm thấy hoặc thuộc tenant khác, ngoài phạm vi vai trò (không phân biệt; ERR-01-001).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-01-001
            title: Không tìm thấy
            status: 404
            code: ERR-01-001
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Conflict:
      description: Trạng thái không cho phép, trùng, đang xử lý; mã cụ thể trong `code` (ERR-01-002, 005, 009, 020, 022, 029, 030, 034, 036, 038,
        039, 043, 048, 050, 051, 053, 054).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-01-005
            title: Trạng thái không cho phép
            status: 409
            code: ERR-01-005
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Gone:
      description: Liên kết hoặc phiếu đã dùng, hết hạn, bị hủy; thân giống nhau cho mọi nguyên nhân (ERR-01-024, 040).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-01-024
            title: Liên kết không còn hiệu lực
            status: 410
            code: ERR-01-024
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    PreconditionFailed:
      description: ETag không khớp; kèm `currentEtag` (ERR-01-007).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-01-007
            title: Hồ sơ đã bị sửa
            status: 412
            code: ERR-01-007
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    PayloadTooLarge:
      description: Tệp vượt cỡ cho phép (ERR-01-012).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-01-012
            title: Tệp quá lớn
            status: 413
            code: ERR-01-012
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    UnsupportedMediaType:
      description: Định dạng tệp không được phép (ERR-01-013).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-01-013
            title: Định dạng tệp không được phép
            status: 415
            code: ERR-01-013
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unprocessable:
      description: Lỗi nghiệp vụ dạng dữ liệu; mã cụ thể trong `code` (ERR-01-004, 008, 010, 011, 014…016, 018, 019, 027, 028, 031, 032, 037,
        041, 044, 047, 049).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-01-008
            title: Hồ sơ chưa đủ điều kiện nộp
            status: 422
            code: ERR-01-008
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    TooManyRequests:
      description: Vượt giới hạn tốc độ hoặc liên kết bị khóa; kèm `Retry-After` (ERR-01-026, 045).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-01-045
            title: Vượt giới hạn tra cứu
            status: 429
            code: ERR-01-045
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      headers:
        Retry-After:
          schema:
            type: integer
          description: Giây phải chờ.
    ServiceUnavailable:
      description: Phụ thuộc chưa sẵn sàng (ERR-01-021, 023, 046); không đổi trạng thái đã đặt, không tiêu hao liên kết bàn giao.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-01-046
            title: Phụ thuộc không khả dụng
            status: 503
            code: ERR-01-046
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      headers:
        Retry-After:
          schema:
            type: integer
          description: Giây phải chờ.
  schemas:
    SystemCode:
      type: string
      maxLength: 64
      pattern: ^[A-Z][A-Z0-9-]{2,63}$
      description: Mã HTTT, bất biến, không dùng lại kể cả khi đã chấm dứt hoặc bị từ chối (BR-01-018).
    OrgId:
      type: string
      maxLength: 64
      description: Mã tổ chức ở PH-20 (DD-02).
    Reason:
      type: string
      maxLength: 1000
      minLength: 10
      description: Lý do ≥ 10 ký tự. Thiếu hoặc rỗng trả ERR-01-033.
    ReasonAny:
      type: string
      maxLength: 1000
      minLength: 1
      description: Lý do bắt buộc, không rỗng. Thiếu trả ERR-01-033.
    SystemStatus:
      type: string
      enum:
      - DRAFT
      - SUBMITTED
      - APPROVED
      - ACTIVE
      - SUSPENDED
      - TERMINATED
      - REJECTED
    ReviewStage:
      type: string
      enum:
      - WAITING_ASSIGN
      - IN_REVIEW
      - CONSULTING
      - WAITING_APPROVAL
      description: Chỉ có khi `status = SUBMITTED`.
    ProvisionStage:
      type: string
      enum:
      - PROVISIONING
      - AWAITING_KEY
      - SANDBOX_READY
      - PROVISION_FAILED
      description: Chỉ có khi `status = APPROVED`.
    SystemType:
      type: string
      enum:
      - PROVINCIAL
      - NATIONAL
      - MINISTRY
      - LEGACY
      - EXTERNAL
    SystemRole:
      type: string
      enum:
      - CONSUMER
      - PROVIDER
      - PUBLISHER
      - SUBSCRIBER
    SecurityLevel:
      type: string
      enum:
      - L1
      - L2
      - L3
      - L4
      - L5
    Classification:
      type: string
      enum:
      - PUBLIC
      - INTERNAL
      - RESTRICTED
      - SENSITIVE
      description: Công khai (CK), Nội bộ (NB), Hạn chế (HC), Nhạy cảm (NC).
    Direction:
      type: string
      enum:
      - CONSUME
      - PROVIDE
    ContactType:
      type: string
      enum:
      - BUSINESS
      - TECHNICAL
      - SECURITY
    StepType:
      type: string
      enum:
      - TECHNICAL
      - LEGAL
      - SECURITY
    StepResult:
      type: string
      enum:
      - PASS
      - FAIL
    Verdict:
      type: string
      enum:
      - APPROVED
      - NARROWED
      - REJECTED
    CredentialEnv:
      type: string
      enum:
      - SANDBOX
      - PRODUCTION
    AuthMethod:
      type: string
      enum:
      - CLIENT_SECRET
      - PRIVATE_KEY_JWT
      - MTLS
      - API_KEY
      description: '`API_KEY` chỉ cho API dữ liệu mở.'
    CredentialStatus:
      type: string
      enum:
      - PENDING
      - ACTIVE
      - ROTATING
      - REVOKED
      - EXPIRED
    HandoverStatus:
      type: string
      enum:
      - PENDING
      - OPENED
      - EXPIRED
      - CANCELLED
      description: Trạng thái kỹ thuật `OPENING` không lộ ra API (SDD §4.7).
    CycleStatus:
      type: string
      enum:
      - OPEN
      - WAITING
      - DECIDING
      - CLOSED
    ChangeClass:
      type: string
      enum:
      - TECHNICAL
      - OWNER_CHANGE
      - FULL
      - TERMINATE
    ChangeStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - CANCELLED
    AttachmentKind:
      type: string
      enum:
      - REQUEST_LETTER
      - LEGAL_BASIS
      - SECURITY_APPROVAL
      - TECH_DOC
      - OTHER
    Period:
      type: string
      enum:
      - SECOND
      - MINUTE
      - HOUR
      - DAY
    ExportFormat:
      type: string
      enum:
      - CSV
      - XLSX
    SystemFlag:
      type: string
      enum:
      - REVIEW_OVERDUE
      - CREDENTIAL_EXPIRING
      - SANDBOX_TOO_LONG
      - NO_TECH_CONTACT
    AllowedActions:
      type: object
      properties:
        allowedActions:
          type: array
          items:
            type: string
          description: Hành động người gọi được làm ngay bây giờ (đã tính quyền, trạng thái, bốn mắt).
        disabledReasons:
          type: object
          additionalProperties:
            type: string
          description: Hành động có quyền nhưng trạng thái chưa cho phép → lý do tiếng Việt.
    PageMeta:
      type: object
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 500
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - number
      - size
      - totalElements
      - totalPages
    ProblemDetails:
      type: object
      description: RFC 9457, mở rộng theo D03-04-PH01 §1.
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: ^ERR-(01|00)-[0-9]{3}$
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              rule:
                type: string
              message:
                type: string
            additionalProperties: false
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
          description: Kèm ERR-01-008.
        dependents:
          type: array
          items:
            $ref: '#/components/schemas/Dependent'
          description: Kèm ERR-01-034.
        currentEtag:
          type: string
          description: Kèm ERR-01-007.
        retryAfterSeconds:
          type: integer
          description: Kèm ERR-01-026, 045, 054.
        lockedUntil: *id004
      additionalProperties: true
    OrgRef:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OrgId'
        name:
          type: string
          maxLength: 255
      additionalProperties: false
      required:
      - id
    ValidationIssue:
      type: object
      properties:
        path:
          type: string
        code:
          type: string
          pattern: ^ERR-01-[0-9]{3}$
        severity:
          type: string
          enum:
          - ERROR
          - WARNING
        message:
          type: string
        guidance:
          type: string
      additionalProperties: false
      required:
      - path
      - code
      - severity
      - message
    Dependent:
      type: object
      properties:
        type:
          type: string
          enum:
          - SUBSCRIPTION
