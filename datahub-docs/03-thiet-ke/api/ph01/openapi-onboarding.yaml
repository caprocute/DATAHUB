# D03-04-PH01 · OpenAPI PH-01 (dh-connect, module onboarding). SINH TỰ ĐỘNG bởi tools/gen_openapi.py — không sửa tay. Dữ liệu ví dụ là giả lập.
openapi: 3.1.0
info:
  title: Datahub · PH-01 Kết nạp hệ thống thông tin API
  version: 1.0.0-draft
  summary: Hồ sơ kết nạp, thẩm định, định danh ứng dụng, bàn giao một lần, vòng đời thành viên, rà soát quyền, danh bạ đầu mối.
  description: 'API của module `onboarding` trong `dh-connect` (control plane PH-01). Người dùng gọi qua BFF console của tenant (Authorization
    Code + PKCE); `/internal/*` do phân hệ khác gọi bằng token dịch vụ (client credentials). HTTT thành viên không gọi API này; HTTT chỉ nhận
    thông tin xác thực qua trang bàn giao (API-01-040).


    Quy ước (D03-04-PH01 §1): tenant lấy từ token, không từ đường dẫn hay thân; tạo và lệnh có tác dụng phụ nhận `Idempotency-Key`; sửa và đổi
    trạng thái bắt buộc `If-Match` (ETag là `version`) trừ thao tác khẩn; hậu tố `:{hành-động}`; lỗi RFC 9457 mã `ERR-01-nnn`; phân trang `page`,
    `size`. **Chỉ một operation (API-01-040) trả giá trị bí mật**, một lần, `no-store`. Mọi tên miền, dữ liệu là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-01
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH01
  x-datahub-phase: PH-01
servers:
- url: https://console.{tenantHost}.datahub.example.vn/api/onboarding/v1
  description: Qua BFF console của tenant — giả lập
  variables:
    tenantHost:
      default: lamdong
      description: Ví dụ `lamdong` cho T68 (giả lập).
- url: http://dh-connect.dh-control.svc:8080/api/onboarding/v1
  description: Trong cụm, cho phân hệ khác (`/internal/*`)
- url: http://localhost:8082/api/onboarding/v1
  description: Phát triển cục bộ
security:
- oauth2User: []
tags:
- name: Hồ sơ HTTT
- name: Tài liệu và mẫu
- name: Hồ sơ kỹ thuật và nhu cầu
- name: Đầu mối
- name: Nộp, thẩm định, phê duyệt
- name: Định danh và bàn giao
- name: Vòng đời thành viên
- name: Nội bộ (phân hệ khác)
- name: Rà soát quyền định kỳ
- name: Danh bạ đầu mối
- name: Di trú, tham số, thống kê
paths:
  /systems:
    get:
      tags:
      - Hồ sơ HTTT
      operationId: listSystems
      summary: Danh sách, tìm kiếm, lọc HTTT thành viên
      x-datahub-id: API-01-001
      x-datahub-fr:
      - FR-01-001
      x-datahub-permission:
        permission: PERM-01-read
      description: OR chỉ thấy HTTT của tổ chức mình; DO chỉ thấy HTTT có dữ liệu của tổ chức mình (OPA). Kèm `facets`. `calls30d` rỗng khi PH-13
        không khả dụng.
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
          minLength: 1
        description: Tìm không dấu trên mã, tên, tổ chức.
      - name: status
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SystemStatus'
        style: form
        explode: false
      - name: ownerOrgId
        in: query
        schema:
          $ref: '#/components/schemas/OrgId'
      - name: group
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 4
      - name: role
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SystemRole'
        style: form
        explode: false
      - name: securityLevel
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SecurityLevel'
        style: form
        explode: false
      - name: flag
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SystemFlag'
        style: form
        explode: false
      - name: sort
        in: query
        schema:
          type: string
          pattern: ^(code|name|updatedAt|status|securityLevel):(asc|desc)$
          default: updatedAt:desc
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      x-datahub-errors:
      - ERR-01-003
      - ERR-01-052
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPage'
              example:
                items:
                - code: HT-TUPHAP
                  name: Hệ thống quản lý hộ tịch
                  ownerOrg:
                    id: SO-TUPHAP
                    name: Sở Tư pháp
                  status: SUBMITTED
                  reviewStage: IN_REVIEW
                  provisionStage: null
                  group: 1
                  roles:
                  - CONSUMER
                  - PROVIDER
                  securityLevel: L3
                  scopeCount: 0
                  calls30d: null
                  lastReviewAt: null
                  flags:
                  - REVIEW_OVERDUE
                  updatedAt: '2026-11-26T09:10:00Z'
                  allowedActions:
                  - view
                  disabledReasons: {}
                page:
                  number: 0
                  size: 20
                  totalElements: 1
                  totalPages: 1
                facets:
                  status:
                    SUBMITTED: 1
                  group:
                    '1': 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
