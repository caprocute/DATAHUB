    phân vùng `tenantId`, bên tiêu thụ khử trùng theo `eventId`. Dữ liệu sự kiện chỉ mang mã, trạng thái, số lượng và băm chủ thể, không có giá trị DLCN (BR-09-025).
    Tệp sinh bởi `tools/gen_asyncapi.py`; không sửa tay.
