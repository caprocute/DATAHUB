# D03-04-PH09 · OpenAPI PH-09 (module privacy của dh-data). SINH TỰ ĐỘNG bởi tools/gen_openapi.py, không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-09 Quyền riêng tư
  version: 1.0.0-draft
  summary: Phân loại dữ liệu, sổ hoạt động xử lý, mục đích và chấp thuận, che dữ liệu, giả danh và ẩn danh, lưu giữ, quyền chủ thể, đồng ý, DPIA, vi phạm, kiểm toán.
  description: 'Module `privacy` của `dh-data` (package `vn.datahub.data.privacy`): control plane `/api/privacy/v1` qua APISIX và BFF; data plane `/privacy/v1` chỉ
    trong cụm (mTLS, SPIFFE).


    Quy ước (D03-04-PH09 §1): tenant lấy từ token, không từ tham số; mọi `POST` nhận `Idempotency-Key`; `PUT`, `PATCH`, hành động có `If-Match`; hậu tố `:{hành-động}`;
    phân trang `page`, `size`, `sort`; lỗi RFC 9457 mã `ERR-09-nnn`. Không có giá trị DLCN rõ ở phản hồi trừ phiếu xem đầy đủ (`RevealGrantIssued`); định danh chủ
    thể chỉ vào, không ra. Mọi tên, mã, số trong ví dụ là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-09
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH09
  x-datahub-phase: PH-09
servers:
- url: https://api.{tenantHost}.datahub.example.vn/api/privacy/v1
  description: Control plane qua APISIX (giả lập)
  variables:
    tenantHost:
      default: t68
      description: Ví dụ `t68` (giả lập).
- url: http://dh-data.dh-data.svc:8080/api/privacy/v1
  description: Control plane trong cụm
- url: http://localhost:8083/api/privacy/v1
  description: Phát triển cục bộ
security:
- oauth2User: []
tags:
- name: Phân loại
  description: Mức phân loại, nhãn chặn, loại DLCN, phần tử dữ liệu, phân loại và quét phát hiện, mức hợp đồng (FR-09-001…008).
- name: Sổ hoạt động xử lý
  description: Hoạt động xử lý, liên kết, cơ sở pháp lý, văn bản căn cứ, xuất sổ (FR-09-009…013).
- name: Mục đích và chấp thuận
  description: Mục đích, yêu cầu khai thác, chấp thuận, bundle chính sách, cảnh báo khai thác, kiểm tra kích hoạt (FR-09-014…022).
- name: Che dữ liệu
  description: Kiểu che, chính sách che, mô phỏng, xem đầy đủ, che log, rò rỉ log (FR-09-023…030).
- name: Giả danh và ẩn danh
  description: Miền và khóa giả danh, khôi phục giá trị gốc, cấu hình và job ẩn danh, rủi ro, chuẩn bị dữ liệu, tập đã ẩn danh (FR-09-031…039).
- name: Lưu giữ
  description: Lịch lưu giữ, tác vụ xóa, giữ pháp lý, xóa mật mã tenant, báo cáo lưu giữ (FR-09-040…044).
- name: Quyền chủ thể
  description: Yêu cầu của chủ thể dữ liệu từ tiếp nhận đến đóng, báo cáo (FR-09-045…051).
- name: Sự đồng ý
  description: Mẫu đồng ý, bản ghi đồng ý, bằng chứng (FR-09-052…054).
- name: DPIA và vi phạm
  description: Hồ sơ đánh giá tác động, vụ việc vi phạm dữ liệu cá nhân, đồng hồ 72 giờ (FR-09-055…060).
- name: Kiểm toán và tham số
  description: Nhật ký bảo vệ dữ liệu, bảng điều khiển, báo cáo tuân thủ, tham số tenant (FR-09-061…064).
- name: Data plane
  description: API quyết định và áp che cho điểm thực thi, đường nóng, chỉ trong cụm (FR-09-007, 018, 019, 020, 027…029, 032, 047, 054).
