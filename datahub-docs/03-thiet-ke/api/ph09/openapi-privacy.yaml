      description: Token dịch vụ (client_credentials với mTLS hoặc private_key_jwt); kèm scope `purpose:{mã}` mang mục đích của lời gọi.
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            privacy:decide: Quyết định, kế hoạch che, chỉ mục phân loại, bundle, băm chủ thể, báo lượt
            privacy:apply: Áp che bản tin
            privacy:pseudonymize: Giả danh hóa lô giá trị
            privacy:register: Đăng ký phần tử, mức hợp đồng, kiểm tra kích hoạt, tiếp nhận yêu cầu chủ thể
            privacy:consent: Ghi và tra sự đồng ý
    mtlsSpiffe:
      type: mutualTLS
      description: Danh tính DU theo SPIFFE ID của Istio; data plane kiểm DU nào có scope nào (SEC-15).
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Số trang, từ 0.
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Cỡ trang, 1…100.
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: Khóa sắp xếp; tiền tố `-` là giảm dần.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Khóa chống trùng (BR-09-061); giữ 24 giờ; cùng khóa và thân trả lại phản hồi cũ.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: '`ETag` của đối tượng; thiếu trả `428`, lệch trả `409` ERR-09-004.'
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
      description: Trả `304` nếu nội dung không đổi.
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
        pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      description: W3C Trace Context.
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - vi
        - en
      description: Ngôn ngữ thông báo lỗi.
