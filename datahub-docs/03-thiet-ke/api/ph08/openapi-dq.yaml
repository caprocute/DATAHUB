# D03-04-PH08 · OpenAPI PH-08 (module dq của dh-data). SINH TỰ ĐỘNG bởi tools/gen_openapi.py, không sửa tay.
openapi: '3.1.0'
info:
  title: Datahub · PH-08 Chất lượng dữ liệu API
  version: 1.0.0-draft
  summary: Miền và đối tượng đo, hồ sơ dữ liệu, bộ quy tắc, lịch và lần đo, kiểm tra trực tuyến, bản ghi lỗi, ngoại lệ, phiếu khắc phục, cảnh báo, báo cáo, quản trị.
  description: 'Module `dq` của `dh-data`, gốc `/api/dq/v1` (người dùng qua BFF; PH-04, PH-06, PH-16, HTTT bằng token máy; `/internal` chỉ trong mạng nội bộ).


    Quy ước (D03-04-PH08 mục 1): tenant lấy từ token; tạo nhận `Idempotency-Key`; sửa và hành động có `If-Match`; hậu tố `:{hành-động}`; lỗi RFC 9457 mã `ERR-08-nnn`;
    phân trang `page`, `size`. Mọi tên miền, dữ liệu là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-08
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH08
  x-datahub-phase: PH-08
servers:
- url: https://console.{tenantHost}.datahub.example.vn/api/dq/v1
  description: Qua BFF console của tenant (giả lập)
  variables:
    tenantHost:
      default: t68
      description: Ví dụ `t68` (giả lập).
- url: https://api.{tenantHost}.datahub.example.vn/api/dq/v1
  description: Cổng API cho PH-04, PH-06, PH-16, HTTT (token máy)
  variables:
    tenantHost:
      default: t68
- url: http://dh-data.dh-data.svc:8080/api/dq/v1
  description: Trong cụm; chỉ nơi này có `/internal`
security:
- oauth2User: []
