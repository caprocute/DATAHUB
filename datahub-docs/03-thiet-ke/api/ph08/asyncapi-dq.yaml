  schemas:
    FieldError:
      type: object
      description: Lỗi theo trường.
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    Problem:
      type: object
      description: Lỗi theo RFC 9457.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - type
      - title
      - status
      - code
      - traceId
    CommentBody:
      type: object
      description: Ý kiến kèm hành động.
      properties:
        comment:
          type: string
          maxLength: 2000
    RejectBody:
      type: object
      description: 'Từ chối: bắt buộc nêu lý do từ 20 ký tự.'
      properties:
        comment:
          type: string
          minLength: 20
          maxLength: 2000
      required:
      - comment
    ReasonBody:
      type: object
      description: Hành động kèm lý do từ 20 ký tự (ERR-08-007).
      properties:
        reason:
          type: string
          minLength: 20
          maxLength: 2000
      required:
      - reason
    Domain:
      type: object
      description: Miền chất lượng (dq_domain).
      properties:
        domainCode:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,31}$
        name:
          type: string
        description:
          type: string
        ownerOrgCode:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,62}$
        stewardUser:
          type: string
        status:
          $ref: '#/components/schemas/DomainStatus'
        statusReason:
          type: string
        onDependencyFailure:
          $ref: '#/components/schemas/OnDependencyFailure'
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        version:
          type: integer
      required:
      - domainCode
      - name
      - ownerOrgCode
      - stewardUser
      - status
      - version
    DomainCreate:
      type: object
      description: Khai báo miền (FR-08-001).
      properties:
        domainCode:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,31}$
        name:
          type: string
