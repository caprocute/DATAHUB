components:
  securitySchemes:
    mtls:
      type: X509
      description: mTLS, ACL theo CN và tiền tố tenant.
  parameters:
    tenant:
      description: Mã tenant chữ thường, ví dụ `t68`.
      examples:
      - t68
  messages:
    rulesetActivated:
      name: rulesetActivated
      title: EVT-08-01
      summary: Phiên bản bộ quy tắc `ACTIVE`
      contentType: application/json
      payload:
        $ref: '#/components/schemas/rulesetActivatedEvent'
      bindings:
        kafka:
          key:
            type: string
            description: 'Khóa phân vùng: `assetCode`.'
      examples:
      - name: vi-du
        payload:
          specversion: '1.0'
          id: 0193a0c3-0000-7000-8000-000000000001
          type: vn.datahub.dq.ruleset.activated.v1
          source: dh-data/dq/T68
          time: '2026-11-26T09:15:00+07:00'
          datacontenttype: application/json
          data:
            assetCode: mdm-cong-dan
            ruleSetCode: bq-cong-dan
            versionNo: 4
            ruleCount: 18
            activatedAt: '2026-11-20T08:00:00+07:00'
    scanCompleted:
      name: scanCompleted
      title: EVT-08-02
      summary: Lần đo `SUCCEEDED` hoặc `PARTIAL` (kèm `flags`, `score`, `verdict`)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/scanCompletedEvent'
      bindings:
        kafka:
          key:
            type: string
            description: 'Khóa phân vùng: `assetCode`.'
      examples:
      - name: vi-du
        payload:
          specversion: '1.0'
