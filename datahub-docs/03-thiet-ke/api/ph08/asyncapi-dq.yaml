# D03-04-PH08 · AsyncAPI PH-08. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py, không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: '3.0.0'
info:
  title: 'Datahub PH-08 Chất lượng dữ liệu: sự kiện'
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-08-01…14 phát ra và 8 sự kiện tiêu thụ từ PH-06, PH-07 (D03-04-PH08 mục 4, FRS 9.3). Ghi vào `ph08_dq.outbox_event` cùng giao
    dịch nghiệp vụ, Debezium Outbox Event Router đưa lên Kafka; CloudEvents 1.0 dạng cấu trúc. Không sự kiện nào mang giá trị dữ liệu hay khóa bản ghi cá nhân: chỉ
    mã đối tượng, số đếm, điểm. Lưu giữ 7 ngày; ít nhất một lần, bên nhận khử trùng theo `id`. Tương thích BACKWARD: chỉ thêm trường tùy chọn trong `v1`. Dữ liệu
    ví dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
defaultContentType: application/json
servers:
  kafka-internal:
    host: dh-kafka-kafka-bootstrap.dh-kafka.svc:9093
    protocol: kafka-secure
    description: 'Listener `internal`: DU, `dh-runtime`, Kafka Connect; mTLS, ACL theo tiền tố tenant.'
    security:
    - $ref: '#/components/securitySchemes/mtls'
