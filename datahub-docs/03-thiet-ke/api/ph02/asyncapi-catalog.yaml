# D03-04-PH02 · AsyncAPI PH-02. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py — không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: 3.0.0
info:
  title: Datahub PH-02 Danh mục dịch vụ — sự kiện
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-02-01…16 (D03-04-PH02 §4, FRS §9.3) và sáu sự kiện PH-02 nhận từ PH-04, PH-10. Sự kiện phát ghi vào `ph02_catalog.outbox_event`
    cùng giao dịch, Debezium đưa lên Kafka, CloudEvents 1.0 chế độ nhị phân. Không sự kiện nào mang đặc tả, khóa, bí mật hay giá trị dữ liệu cá nhân. Người nhận xử
    lý lũy đẳng theo `eventId` và `configEpoch`. Tương thích BACKWARD ở Apicurio: chỉ thêm trường tùy chọn trong `v1`. Dữ liệu ví dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  license:
    name: Tài liệu nội bộ dự án Datahub
defaultContentType: application/json
servers:
  kafka-cum:
    host: kafka-bootstrap.dh-platform.svc:9093
    protocol: kafka-secure
    description: Kafka (Strimzi) của cụm; mTLS, ACL theo principal và tiền tố tenant.
    security:
    - $ref: '#/components/securitySchemes/mtls'
