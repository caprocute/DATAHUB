components:
  securitySchemes:
    oauth2User:
      type: oauth2
      description: Keycloak realm dh-{tenant}; vai trò ánh xạ PERM-02-* (D02-08). Người dùng qua BFF, token không ra trình duyệt.
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes: {}
    oauth2Service:
      type: oauth2
      description: 'Token máy: PH-03, PH-04, PH-15, PH-13, PH-16 (`private_key_jwt` hoặc mTLS) và HTTT khai thác (`catalog:read`).'
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            catalog:read: HTTT khai thác đọc danh mục công khai trong tenant, tải đặc tả
            catalog:gateway-read: PH-03 đọc dữ liệu công bố
            catalog:gateway-ack: PH-03 xác nhận đã nạp cấu hình (đề nghị bổ sung ở FRS §3.3)
            catalog:portal-read: PH-15 đọc danh mục cho cổng nhà phát triển
            catalog:read-meta: PH-17 (svc-assist-index) đọc siêu dữ liệu danh mục, không đặc tả, gói, backend
            catalog:flow-sync: PH-04 đăng ký API từ luồng và đọc đặc tả đã gộp
            catalog:metrics-read: PH-13, PH-16 đọc số liệu tuân thủ và thống kê
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Khóa chống trùng, giữ 24 giờ theo (tenant, người gọi, khóa); cùng khóa khác thân trả ERR-02-042 (422).
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: '`ETag` hiện tại; lệch trả ERR-02-015 (412).'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: '`ETag` lần trước; khớp thì trả `304`.'
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      description: Truy vết W3C.
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
        - vi
        - en
        default: vi
      description: Ngôn ngữ của `title`, `detail`.
    ApiCodePath:
      name: apiCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiCode'
    VersionNoPath:
      name: versionNo
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/VersionNo'
    PlanCodePath:
      name: planCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PlanCode'
    BackendCodePath:
      name: backendCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BackendCode'
    CategoryCodePath:
      name: categoryCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CategoryCode'
    FlowCodePath:
      name: flowCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FlowCode'
    SubscriptionIdPath:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewRequestIdPath:
