# D03-04-PH02 · OpenAPI PH-02 (dh-connect, module catalog). SINH TỰ ĐỘNG bởi tools/gen_openapi.py — không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-02 Danh mục dịch vụ API
  version: 1.0.0-draft
  summary: Danh mục, đăng ký, kiểm tra đặc tả, gói sử dụng, vòng đời, đăng ký sử dụng, đồng bộ quốc gia, SLA, giao diện nội bộ cho cổng API.
  description: API của module `catalog` trong `dh-connect` (control plane PH-02). Người dùng gọi qua BFF console (Authorization Code + PKCE); HTTT khai thác đọc danh
    mục bằng token máy (`catalog:read`); PH-03, PH-04, PH-15 gọi `/internal/*` bằng token dịch vụ. Tenant lấy từ token. Tạo và lệnh đổi trạng thái nhận `Idempotency-Key`;
    sửa và đổi trạng thái bắt buộc `If-Match`; hậu tố `:{hành-động}`; lỗi RFC 9457 mã `ERR-02-nnn`; phân trang `page`/`size`. Không API nào trả khóa, bí mật hay giá
    trị thật của dữ liệu cá nhân. Mọi tên miền, dữ liệu là giả lập. Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.
  contact:
    name: Nhóm phân hệ PH-02
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH02
  x-datahub-phase: PH-02
servers:
- url: https://console.{tenantHost}.datahub.example.vn/api/catalog/v1
  description: Qua BFF console của tenant, giả lập
  variables:
    tenantHost:
      default: lamdong
      description: Ví dụ `lamdong` cho T68 (giả lập).
- url: http://dh-connect.dh-control.svc:8080/api/catalog/v1
  description: Trong cụm, cho PH-03, PH-04, PH-15
- url: http://localhost:8082/api/catalog/v1
  description: Phát triển cục bộ
security:
- oauth2User: []
tags:
- name: Danh mục và tra cứu
- name: Phân loại, thẻ, dịch vụ sự kiện
- name: Đăng ký API và nạp đặc tả
- name: Kiểm tra đặc tả và bộ luật
- name: Backend, đường dẫn, khung route
- name: Gói sử dụng
- name: Vòng đời, duyệt, phiên bản
- name: Đăng ký sử dụng
- name: Đồng bộ quốc gia
- name: SLA, thông báo, thống kê
- name: Nội bộ cho PH-03, PH-04, PH-15
- name: Đối soát cấu hình
- name: Di trú từ APIM cũ
- name: Tham số
- name: Tác vụ bất đồng bộ
paths:
  /apis:
    get:
      tags:
      - Danh mục và tra cứu
      operationId: getApis
      summary: Danh sách API trong danh mục
      x-datahub-id: API-02-001
      x-datahub-fr:
      - FR-02-001
      x-datahub-permission:
        permission: PERM-02-read
      description: Mặc định ẩn phiên bản `RETIRED`; chỉ trả API người gọi được xem (BR-02-039). `facets` đếm theo trạng thái, loại dữ liệu, phân loại.
      parameters:
      - $ref: '#/components/parameters/Q_page'
      - $ref: '#/components/parameters/Q_size'
      - $ref: '#/components/parameters/Q_sort'
      - $ref: '#/components/parameters/Q_status'
      - $ref: '#/components/parameters/Q_dataClass'
      - $ref: '#/components/parameters/Q_visibility'
      - $ref: '#/components/parameters/Q_origin'
      - $ref: '#/components/parameters/Q_categoryCode'
      - $ref: '#/components/parameters/Q_tag'
      - $ref: '#/components/parameters/Q_providerSystemCode'
      - $ref: '#/components/parameters/Q_ownerOrgCode'
      - $ref: '#/components/parameters/Q_attention'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Đăng ký API và nạp đặc tả
      operationId: postApis
      summary: Đăng ký API mới (kèm phiên bản đầu `DRAFT`)
      x-datahub-id: API-02-014
      x-datahub-fr:
      - FR-02-010
      x-datahub-permission:
        permission: PERM-02-create
      description: 'Nhận `specId` từ API-02-015. Tạo API và phiên bản `1.0.0` ở `DRAFT`, `origin = OPENAPI`. Phát EVT-02-01. Trả `Location`, `ETag`. Mã lỗi riêng:
        ERR-02-002, ERR-02-003, ERR-02-004, ERR-02-016, ERR-02-019, ERR-02-043.'
      x-datahub-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreate'
            example:
              apiCode: tra-cuu-ho-tich
              name: Tra cứu thông tin hộ tịch
              description: Tra cứu giấy khai sinh theo số định danh (dữ liệu giả lập).
              providerSystemCode: HT-HOTICH
              ownerOrgCode: SO-TUPHAP
              dataClass: RESTRICTED
              visibility: TENANT
              categoryCode: ho-tich
              tags:
              - khai-sinh
              - tra-cuu
              contextPath: /ho-tich/tra-cuu-ho-tich/v1
              specId: 0192d3a1-6f10-7a00-8a11-0a1b2c3d4e5f
      responses:
        '201':
          description: Đã tạo.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /apis/{apiCode}:
    get:
      tags:
      - Danh mục và tra cứu
      operationId: getApis002
      summary: Chi tiết một API
      x-datahub-id: API-02-002
      x-datahub-fr:
      - FR-02-002
      x-datahub-permission:
        permission: PERM-02-read
      description: 'Trả `ETag`; `allowedActions[]` cho giao diện bật tắt nút đúng như máy chủ sẽ kiểm. Mã lỗi riêng: ERR-02-001.'
      parameters:
      - $ref: '#/components/parameters/ApiCodePath'
      - $ref: '#/components/parameters/Q_versionNo'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Đăng ký API và nạp đặc tả
      operationId: patchApis
      summary: Sửa thông tin API, context-path và thay đặc tả khi còn bản nháp
      x-datahub-id: API-02-018
      x-datahub-fr:
      - FR-02-014
      - FR-02-024
      x-datahub-permission:
        permission: PERM-02-create
      description: 'Thay đặc tả hoặc context-path chỉ khi phiên bản `DRAFT`; phiên bản `PUBLISHED` chỉ sửa mô tả, thẻ, đầu mối, SLA. Lưu `contextPath` ở đây sau khi
        kiểm bằng API-02-030. Mã lỗi riêng: ERR-02-001, ERR-02-003, ERR-02-005, ERR-02-015, ERR-02-019, ERR-02-038.'
      parameters:
      - $ref: '#/components/parameters/ApiCodePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiUpdate'
      responses:
        '200':
          description: Thành công.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags:
      - Vòng đời, duyệt, phiên bản
      operationId: deleteApis
      summary: Xóa API (xóa mềm)
      x-datahub-id: API-02-052
      x-datahub-fr:
      - FR-02-040
      x-datahub-permission:
        permission: PERM-02-create
      description: 'Chỉ khi mọi phiên bản `DRAFT` hoặc `RETIRED` và không còn đăng ký. Giữ chỗ mã vĩnh viễn. Phát EVT-02-03. Mã lỗi riêng: ERR-02-001, ERR-02-011,
        ERR-02-015, ERR-02-030.'
      parameters:
      - $ref: '#/components/parameters/ApiCodePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Không có nội dung.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /search/apis:
    get:
      tags:
      - Danh mục và tra cứu
      operationId: getSearchApis
      summary: Tìm kiếm toàn văn danh mục
      x-datahub-id: API-02-003
      x-datahub-fr:
      - FR-02-003
      x-datahub-permission:
        permission: PERM-02-read
      description: 'Tìm trên tên, mô tả, thẻ, tên thao tác; không dấu. Khi công cụ tìm kiếm ngoài lỗi, trả `degraded = true` và kết quả từ PostgreSQL. Mã lỗi riêng:
        ERR-02-003.'
      parameters:
      - $ref: '#/components/parameters/Q_qreq'
      - $ref: '#/components/parameters/Q_page'
      - $ref: '#/components/parameters/Q_size'
      - $ref: '#/components/parameters/Q_dataClass'
      - $ref: '#/components/parameters/Q_visibility'
      - $ref: '#/components/parameters/Q_categoryCode'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalog/apis:
    get:
      tags:
      - Danh mục và tra cứu
      operationId: getCatalogApis
      summary: Danh mục cho HTTT khai thác và cổng nhà phát triển
      x-datahub-id: API-02-004
      x-datahub-fr:
      - FR-02-004
      x-datahub-permission:
        permission: PERM-02-read
        scopes:
        - catalog:read
        - catalog:read-meta
      description: 'Lọc theo mức hiển thị của người gọi (BR-02-039); `Cache-Control: private, max-age=300`, `public` chỉ với tập `PUBLIC`. Hỗ trợ `If-None-Match`.
        Token `catalog:read-meta` (PH-17 `svc-assist-index`) chỉ nhận siêu dữ liệu, không nhận đặc tả, gói, backend.'
      parameters:
      - $ref: '#/components/parameters/Q_updatedSince'
      - $ref: '#/components/parameters/Q_page'
      - $ref: '#/components/parameters/Q_size'
      - $ref: '#/components/parameters/Q_categoryCode'
      - $ref: '#/components/parameters/Q_q'
      - $ref: '#/components/parameters/IfNoneMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '304':
          description: Không đổi so với `If-None-Match`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - oauth2User: []
      - oauth2Service: []
  /catalog/apis/{apiCode}:
    get:
      tags:
      - Danh mục và tra cứu
      operationId: getCatalogApis005
      summary: Một API trong danh mục cho HTTT khai thác
      x-datahub-id: API-02-005
      x-datahub-fr:
      - FR-02-004
      x-datahub-permission:
        permission: PERM-02-read
        scopes:
        - catalog:read
        - catalog:read-meta
      description: 'Cùng quy tắc hiển thị với API-02-004; API ngoài mức hiển thị của người gọi trả ERR-02-001. Token `catalog:read-meta` (PH-17 `svc-assist-index`)
        chỉ nhận siêu dữ liệu, không nhận đặc tả, gói, backend. Mã lỗi riêng: ERR-02-001.'
      parameters:
      - $ref: '#/components/parameters/ApiCodePath'
      - $ref: '#/components/parameters/IfNoneMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogApi'
        '304':
          description: Không đổi so với `If-None-Match`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - oauth2User: []
      - oauth2Service: []
  /apis/{apiCode}/versions/{versionNo}/usage-guide:
    get:
      tags:
      - Danh mục và tra cứu
      operationId: getApisVersionsUsageGuide
      summary: Đường dẫn sử dụng và mẫu gọi API
      x-datahub-id: API-02-006
      x-datahub-fr:
      - FR-02-005
      x-datahub-permission:
        permission: PERM-02-read
      description: 'Địa chỉ gateway ghép context-path, thao tác, `tokenUrl`, phạm vi và mẫu `curl`, `javascript`, `java` (giả lập, không chứa khóa thật). Mã lỗi riêng:
        ERR-02-001.'
      parameters:
      - $ref: '#/components/parameters/ApiCodePath'
      - $ref: '#/components/parameters/VersionNoPath'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageGuide'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /apis/{apiCode}/versions/{versionNo}/spec:
    get:
      tags:
      - Danh mục và tra cứu
      operationId: getApisVersionsSpec
      summary: Tải đặc tả OpenAPI đã công bố
      x-datahub-id: API-02-007
      x-datahub-fr:
      - FR-02-006
      - FR-02-059
      x-datahub-permission:
        permission: PERM-02-read
        scopes:
        - catalog:read
        - catalog:flow-sync
      description: 'Đặc tả đã gộp tham chiếu ngoài khi `resolved=true` (mặc định). Chỉ phiên bản đã công bố hoặc người gọi có quyền xem bản nháp. Trả `ETag`, `Content-Disposition`.
        Mã lỗi riêng: ERR-02-001.'
      parameters:
      - $ref: '#/components/parameters/ApiCodePath'
      - $ref: '#/components/parameters/VersionNoPath'
      - $ref: '#/components/parameters/Q_resolved'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/yaml:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/Spec'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
