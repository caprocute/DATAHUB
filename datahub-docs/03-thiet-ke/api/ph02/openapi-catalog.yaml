      x-datahub-fr:
      - FR-02-002
      x-datahub-permission:
        permission: PERM-02-read
      description: 'Tab Phiên bản của UI-02-02: số hiệu, trạng thái, `sunsetAt`, phiên bản kế nhiệm, số đăng ký `ACTIVE`, cờ thay đổi phá vỡ. Mã lỗi riêng: ERR-02-001.'
      parameters:
