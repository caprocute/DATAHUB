  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ theo lược đồ (ERR-02-003, kèm `errors[]` theo trường) hoặc thiếu lý do (ERR-02-041).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-02-003
            title: Dữ liệu không hợp lệ theo lược đồ, kèm danh sách lỗi theo trường
            status: 400
            code: ERR-02-003
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unauthorized:
      description: Thiếu token hoặc token hết hạn (ERR-02-014).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-02-014
            title: Không có quyền
            status: 401
            code: ERR-02-014
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Forbidden:
      description: Không có quyền (ERR-02-014) hoặc vi phạm bốn mắt (ERR-02-013).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-02-014
            title: Không có quyền
            status: 403
            code: ERR-02-014
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    NotFound:
      description: Không tìm thấy hoặc thuộc tenant khác, cùng thân (ERR-02-001).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-02-001
            title: Không tìm thấy đối tượng hoặc đối tượng thuộc tenant khác
            status: 404
            code: ERR-02-001
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Conflict:
      description: 'Trùng mã, trạng thái không cho phép, thiếu điều kiện hoặc còn đối tượng phụ thuộc: ERR-02-002, 011, 012, 017, 024, 025, 027, 030, 035, 038, 044.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-02-011
            title: Chuyển trạng thái hoặc thao tác không hợp lệ ở trạng thái hiện tại
            status: 409
            code: ERR-02-011
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    PreconditionFailed:
      description: Đối tượng đã thay đổi, `If-Match` không khớp (ERR-02-015).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-02-015
            title: Đối tượng đã thay đổi (`If-Match` không khớp)
            status: 412
            code: ERR-02-015
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    PayloadTooLarge:
      description: Đặc tả hoặc tệp vượt kích thước tối đa (ERR-02-009).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-02-009
            title: Đặc tả hoặc tệp vượt kích thước tối đa
            status: 413
            code: ERR-02-009
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unprocessable:
      description: 'Nghiệp vụ không hợp lệ: ERR-02-004…008, 010, 016, 018…023, 026, 028, 029, 031, 032, 037, 040, 042, 043, 045 (kèm `findings[]` hoặc `errors[]`
        khi có).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-02-006
            title: Đặc tả không đạt lớp 1 (chuẩn OpenAPI)
            status: 422
            code: ERR-02-006
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Locked:
      description: Đang đóng băng thay đổi môi trường thật (ERR-02-039).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-02-039
            title: Đang đóng băng thay đổi môi trường thật
            status: 423
            code: ERR-02-039
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    TooManyRequests:
      description: Vượt số lần kiểm tra, nạp URL hoặc thông báo tay cho phép (ERR-02-036, kèm `retryAfterSeconds`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-02-036
            title: Vượt số lần kiểm tra, nạp URL hoặc thông báo tay cho phép
            status: 429
            code: ERR-02-036
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unavailable:
      description: 'Cổng API hoặc dịch vụ phụ thuộc không khả dụng: ERR-02-033, 034.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-02-034
            title: Dịch vụ phụ thuộc không khả dụng (PH-01, PH-04, PH-10, PH-12, PH-13, PH-14, PH-18, kho đối tượng)
            status: 503
            code: ERR-02-034
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
  schemas:
    ApiCode:
      type: string
      description: Mã API duy nhất trong tenant (T-CODE chữ thường).
      pattern: ^[a-z][a-z0-9-]{2,62}$
      example: tra-cuu-ho-tich
    VersionNo:
      type: string
      description: Số hiệu `MAJOR.MINOR.PATCH`.
      pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
      example: 1.0.0
    PlanCode:
      type: string
      pattern: ^[a-z][a-z0-9-]{1,31}$
      example: co-ban
    BackendCode:
      type: string
      pattern: ^[a-z][a-z0-9-]{1,31}$
      example: ho-tich-a
    CategoryCode:
      type: string
      pattern: ^[a-z][a-z0-9-]{1,63}$
      example: ho-tich
    FlowCode:
      type: string
      pattern: ^[a-z][a-z0-9-]{2,62}$
      example: flow-tra-cuu-ho-tich
    SystemCode:
      type: string
      description: Mã HTTT ở PH-01 (T-CODE).
      pattern: ^[A-Z0-9][A-Z0-9_.-]{0,63}$
      example: HT-MOTCUA
    OrgCode:
      type: string
      description: Mã đơn vị.
      pattern: ^[A-Z0-9][A-Z0-9_.-]{0,63}$
      example: SO-TUPHAP
    Environment:
      type: string
      enum:
      - TEST
      - STAGING
      - PROD
    DataClass:
      type: string
      enum:
      - PUBLIC
      - INTERNAL
      - RESTRICTED
      - SENSITIVE
      description: Mức phân loại dữ liệu (SAD §8.2).
    Visibility:
      type: string
      enum:
      - TENANT
      - NATIONAL
      - PUBLIC
    Origin:
      type: string
      enum:
      - MANUAL
      - OPENAPI
      - FLOW
      - LEGACY
    VersionStatus:
      type: string
      enum:
      - DRAFT
      - PENDING
      - PUBLISHED
      - SUSPENDED
      - DEPRECATED
      - RETIRED
    PlanStatus:
      type: string
      enum:
      - STAGING
      - PUBLISHED
      - DEPRECATED
      - CLOSED
    SubscriptionStatus:
      type: string
      enum:
      - PENDING
      - ACTIVE
      - REJECTED
      - CANCELLED
      - SUSPENDED
      - REVOKED
      - EXPIRED
    AuthType:
      type: string
      enum:
      - KEYLESS
      - API_KEY
      - OAUTH2_SECRET
      - OAUTH2_PKJWT
      - OAUTH2_MTLS
    GrantStatus:
      type: string
      enum:
      - PENDING
      - GRANTED
      - AWAITING_CREDENTIAL
      - FAILED
    Severity:
      type: string
      enum:
      - ERROR
      - WARNING
      - INFO
    Layer:
      type: string
      enum:
      - STANDARD
      - CONVENTION
      - SECRET
    FindingStatus:
      type: string
      enum:
      - OPEN
      - RESOLVED
      - ACKNOWLEDGED
    ReviewKind:
      type: string
      enum:
      - VERSION_PUBLISH
      - VERSION_DEPRECATE
      - VERSION_RETIRE
      - PLAN_PUBLISH
      - PLAN_DEPRECATE
      - PLAN_CLOSE
      - BACKEND_CHANGE
      - VISIBILITY_RAISE
      - SUBSCRIPTION
      - SUBSCRIPTION_RENEW
    ReviewStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - WITHDRAWN
    SyncStatus:
      type: string
      enum:
      - QUEUED
      - SENT
      - ACKED
      - REJECTED
      - FAILED
      - NOT_CONFIGURED
    GatewayState:
      type: string
      enum:
      - APPLYING
      - SYNCED
      - FAILED
      description: Trạng thái đẩy cấu hình xuống gateway (lớp dịch vụ, không phải trạng thái vòng đời).
    Reason:
      type: string
      minLength: 1
      maxLength: 1000
      example: Hết căn cứ pháp lý sử dụng dịch vụ.
    ProblemDetails:
      type: object
      description: RFC 9457, mở rộng theo D03-04-PH02 §1.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: ^ERR-02-[0-9]{3}$
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              rule:
                type: string
              message:
                type: string
            additionalProperties: false
        missing:
          type: array
          items:
            type: string
          description: 'ERR-02-012: điều kiện còn thiếu.'
        findings:
          type: array
          items:
            type: object
            properties:
              ruleId:
                type: string
              severity:
                $ref: '#/components/schemas/Severity'
              location:
                type: string
              message:
                type: string
          description: ERR-02-006, 007, 008.
        usages:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              ref:
                type: string
          description: 'ERR-02-024, 030: nơi còn dùng.'
        retryAfterSeconds:
          type: integer
          minimum: 0
      required:
      - type
      - title
      - status
      - code
      - traceId
    LintSummary:
      type: object
      properties:
        errors:
          type: integer
          minimum: 0
        warnings:
          type: integer
          minimum: 0
        infos:
          type: integer
          minimum: 0
      required:
      - errors
      - warnings
      - infos
    OperationAccepted:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
        location:
          type: string
          format: uri-reference
      required:
      - operationId
      - status
      examples:
      - operationId: 0192d3a1-7c20-7a31-9b5e-1f2e3a4b5c6d
        status: QUEUED
        location: /api/catalog/v1/operations/0192d3a1-7c20-7a31-9b5e-1f2e3a4b5c6d
    ReasonRequest:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
      required:
      - reason
      additionalProperties: false
    NoteRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 1000
      additionalProperties: false
    ApiSummary:
      type: object
      properties:
        apiCode:
          $ref: '#/components/schemas/ApiCode'
        name:
          type: string
