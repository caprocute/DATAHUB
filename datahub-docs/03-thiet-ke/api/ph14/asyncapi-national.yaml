components:
  parameters:
    tenant:
      description: Mã tenant chữ thường (`t68`).
      examples:
      - t68
  securitySchemes:
    mtls:
      type: X509
      description: Chứng thư do cert-manager cấp; ACL Kafka theo CN và tiền tố `{tenant}.national.`.
  messages:
    platformChanged:
      name: platformChanged
      title: EVT-14-01
      summary: Nền tảng đổi trạng thái, đổi bước xoay thông tin xác thực, vào hoặc ra `SECURITY_HOLD`.
      payload:
        $ref: '#/components/schemas/PlatformChanged'
      headers: &id001
        type: object
        properties:
          ce_specversion:
            type: string
            const: '1.0'
          ce_id:
            type: string
            format: uuid
          ce_source:
            type: string
            description: '`/tenants/{tenant}/national`'
          ce_type:
            type: string
            description: '`vn.datahub.national.{đối tượng}.{sự kiện}.v1`'
          ce_time: &id002
            type: string
            format: date-time
          ce_subject:
            type: string
            description: Mã đối tượng.
          ce_datacontenttype:
            type: string
            const: application/json
          traceparent:
            type: string
        required:
        - ce_specversion
        - ce_id
        - ce_source
        - ce_type
        - ce_time
      bindings:
        kafka:
          key:
            type: string
            description: '`platformCode`'
    serviceChanged:
      name: serviceChanged
      title: EVT-14-02
      summary: Dịch vụ tạo, sửa, đổi nhãn đối chiếu, kích hoạt đặc tả, nhập từ hệ cũ.
      payload:
        $ref: '#/components/schemas/ServiceChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`serviceCode`'
    routingChanged:
      name: routingChanged
      title: EVT-14-03
      summary: Luật định tuyến đổi.
      payload:
        $ref: '#/components/schemas/RoutingChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`ruleId`'
    certificateChanged:
      name: certificateChanged
      title: EVT-14-04
      summary: Chứng thư hoặc neo tin cậy đổi trạng thái; chặn ký do chứng thư.
      payload:
        $ref: '#/components/schemas/CertificateChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`certCode`'
    certificateExpiring:
      name: certificateExpiring
      title: EVT-14-05
      summary: Chứng thư chạm mốc 60, 30, 7 ngày.
      payload:
        $ref: '#/components/schemas/CertificateExpiring'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`certCode`'
    signatureIncidentOpened:
      name: signatureIncidentOpened
      title: EVT-14-06
      summary: Mở sự cố chữ ký.
      payload:
        $ref: '#/components/schemas/SignatureIncidentOpened'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`incidentId`'
    quotaThresholdReached:
      name: quotaThresholdReached
      title: EVT-14-07
      summary: Mức dùng hạn mức chạm 70%, 85%, 95%.
      payload:
        $ref: '#/components/schemas/QuotaThresholdReached'
      headers: &id003
        type: object
        properties:
          traceparent:
            type: string
          ce_id:
            type: string
            format: uuid
          ce_type:
            type: string
          ce_time: *id002
      bindings:
        kafka:
          key:
            type: string
            description: '`quotaId`'
    quotaChanged:
      name: quotaChanged
      title: EVT-14-08
      summary: Hạn mức hoặc phân bổ đổi.
      payload:
        $ref: '#/components/schemas/QuotaChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`quotaId`'
    cacheInvalidated:
      name: cacheInvalidated
      title: EVT-14-09
      summary: Đệm bị vô hiệu.
      payload:
        $ref: '#/components/schemas/CacheInvalidated'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`serviceCode`'
    breakerChanged:
      name: breakerChanged
      title: EVT-14-10
      summary: Ngắt mạch đổi trạng thái hoặc hàng chờ tích lũy.
      payload:
        $ref: '#/components/schemas/BreakerChanged'
      headers: *id003
      bindings:
        kafka:
          key:
            type: string
            description: '`platformCode`'
    transactionRecorded:
      name: transactionRecorded
      title: EVT-14-11
      summary: Một giao dịch quốc gia kết thúc (siêu dữ liệu, không nội dung).
      payload:
        $ref: '#/components/schemas/TransactionRecorded'
      headers: *id003
      bindings:
        kafka:
          key:
            type: string
            description: '`transactionCode`'
    syncRunFinished:
      name: syncRunFinished
      title: EVT-14-12
      summary: Một phiên đồng bộ hoặc đối chiếu kết thúc.
      payload:
        $ref: '#/components/schemas/SyncRunFinished'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`runId`'
    inboundChanged:
      name: inboundChanged
      title: EVT-14-13
      summary: Điểm cuối chiều vào hoặc nguồn được phép đổi.
      payload:
        $ref: '#/components/schemas/InboundChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`endpointCode`'
    exposureChanged:
      name: exposureChanged
      title: EVT-14-14
      summary: Cung cấp lại tạo, sửa, gỡ.
      payload:
        $ref: '#/components/schemas/ExposureChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`serviceCode`'
    healthChanged:
      name: healthChanged
      title: EVT-14-15
      summary: Mức sức khỏe nền tảng đổi.
      payload:
        $ref: '#/components/schemas/HealthChanged'
      headers: *id003
      bindings:
        kafka:
          key:
            type: string
            description: '`platformCode`'
    anomalyDetected:
      name: anomalyDetected
      title: EVT-14-16
      summary: Phát hiện khai thác bất thường hoặc xem nội dung vượt ngưỡng.
      payload:
        $ref: '#/components/schemas/AnomalyDetected'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`alertId`'
    notificationReceived:
      name: notificationReceived
      title: EVT-14-17
      summary: Nhận thông báo thay đổi từ quốc gia.
      payload:
        $ref: '#/components/schemas/NotificationReceived'
      headers: *id003
      bindings:
        kafka:
          key:
            type: string
            description: '`notificationId`'
    workerCommand:
      name: workerCommand
      title: nội bộ
      summary: Lệnh cho `worker` (`probe`, `cert.selftest`, `token.test`, `sync.run`, `spec.fetch`, `catalog.fetch`), đi qua outbox.
      payload:
        $ref: '#/components/schemas/WorkerCommand'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`commandId`'
    workerResult:
      name: workerResult
      title: nội bộ
      summary: Kết quả lệnh của `worker`, xử lý lũy đẳng theo `commandId`.
      payload:
        $ref: '#/components/schemas/WorkerResult'
      headers: *id003
      bindings:
        kafka:
          key:
            type: string
            description: '`commandId`'
    quotaUsage:
      name: quotaUsage
      title: nội bộ
      summary: Mức dùng hạn mức tổng hợp từ cổng, để ghi `quota_usage`.
      payload:
        $ref: '#/components/schemas/QuotaUsage'
      headers: *id003
      bindings:
        kafka:
          key:
            type: string
            description: '`quotaId`'
  schemas:
    Actor:
      type: object
      properties:
        userId:
          type: string
        type:
          type: string
          enum:
          - USER
          - SYSTEM
      required:
      - userId
      - type
    Base:
      type: object
      properties:
        tenantId: &id009
          type: string
          pattern: ^(T[0-9]{2}|COMMON)$
        configVersion: &id005
          type: integer
        occurredAt: *id002
        actor:
          $ref: '#/components/schemas/Actor'
      required:
      - tenantId
      - occurredAt
    PlatformChanged:
      allOf:
      - $ref: '#/components/schemas/Base'
      - type: object
        properties:
          platformCode:
            type: string
          platformType:
            type: string
            enum:
            - NDXP
            - NDOP
            - REGISTRY
          from: &id004
            type: string
            enum:
            - DRAFT
            - TESTED
            - PENDING_ACTIVATION
            - ACTIVE
            - SUSPENDED
            - RETIRED
          to: *id004
          securityHold: &id007
            type: boolean
          change:
            type: string
            enum:
            - STATE
            - CREDENTIAL_ROTATION
            - SECURITY_HOLD
            - CONNECTION
            - SETTINGS
          rotationPhase:
            type: string
            enum:
            - TESTING
            - TRANSITION
            - COMPLETED
            - FAILED
          reason:
            type: string
            maxLength: 1000
        required:
        - platformCode
        - change
      examples:
      - tenantId: T68
        configVersion: 1842
        occurredAt: '2026-11-26T08:15:00Z'
        platformCode: ndxp-t68
        change: STATE
        from: TESTED
        to: ACTIVE
        actor:
          userId: u-ia-0017
          type: USER
    ServiceChanged:
      allOf:
      - $ref: '#/components/schemas/Base'
      - type: object
        properties:
          serviceCode:
            type: string
          platformCode:
            type: string
          change:
            type: string
            enum:
            - CREATED
            - UPDATED
            - LABEL_CHANGED
            - SPEC_ACTIVATED
            - STATE_CHANGED
            - IMPORTED
          state:
            type: string
            enum:
            - DRAFT
            - ACTIVE
            - DEPRECATED
            - RETIRED
          reconcileLabel:
            type: string
            enum:
            - STILL
            - SPEC_CHANGED
            - DISCONTINUED
            - UNKNOWN
          contractVersion:
            type: string
          specVersion:
            type: string
          sensitivity:
            type: string
            enum:
            - PUBLIC
            - INTERNAL
            - RESTRICTED
            - SENSITIVE
        required:
        - serviceCode
        - change
    RoutingChanged:
      allOf:
      - $ref: '#/components/schemas/Base'
      - type: object
        properties:
          ruleId:
            type: string
            format: uuid
          change:
            type: string
            enum:
            - ACTIVATED
            - UPDATED
            - DISABLED
          primaryServiceCode:
            type: string
          fallbackServiceCode:
            type:
            - string
            - 'null'
          priority: *id005
        required:
        - ruleId
        - change
    CertificateChanged:
      allOf:
      - $ref: '#/components/schemas/Base'
      - type: object
        properties:
          certCode:
            type: string
          purpose:
            type: string
            enum:
            - SIGNING
            - TLS_CLIENT
            - BOTH
          from: &id006
            type: string
            enum:
            - UPLOADED
            - PENDING_ACTIVATION
            - ACTIVE
            - EXPIRING
            - EXPIRED
            - SUPERSEDED
            - REVOKED
          to: *id006
          notAfter: *id002
          signingBlocked: *id007
          trustAnchorChange: *id007
          supersedes:
            type:
            - string
            - 'null'
        required:
        - certCode
    CertificateExpiring:
      allOf:
      - $ref: '#/components/schemas/Base'
      - type: object
        properties:
          certCode:
            type: string
          purpose:
            type: string
            enum:
            - SIGNING
            - TLS_CLIENT
            - BOTH
          daysLeft:
            type: integer
            enum:
            - 60
            - 30
            - 7
          notAfter: *id002
          replacementReady: *id007
        required:
        - certCode
        - daysLeft
        - notAfter
      examples:
      - tenantId: T68
        occurredAt: '2026-11-26T01:00:00Z'
        certCode: ky-so-t68-2026
        purpose: SIGNING
        daysLeft: 30
        notAfter: '2026-12-26T00:00:00Z'
        replacementReady: false
    SignatureIncidentOpened:
      allOf:
      - $ref: '#/components/schemas/Base'
      - type: object
        properties:
          incidentId:
            type: string
            format: uuid
          kind:
            type: string
            enum:
            - SIGNATURE_INVALID
            - CHAIN_UNTRUSTED
            - SIGNED_AT_SKEW
            - REPLAY
            - KEY_MISMATCH
          transactionCode:
            type: string
          platformCode:
            type: string
          securityHold: *id007
          recentCount10m: *id005
        required:
        - incidentId
        - kind
        - platformCode
    QuotaThresholdReached:
      allOf:
      - $ref: '#/components/schemas/Base'
      - type: object
        properties:
          quotaId:
            type: string
            format: uuid
          platformCode:
            type: string
          serviceCode:
            type:
            - string
            - 'null'
          period: &id008
            type: string
            enum:
            - HOUR
            - DAY
            - MONTH
          level:
            type: integer
            enum:
            - 70
            - 85
            - 95
          used: *id005
          limit: *id005
          resetAt: *id002
        required:
        - quotaId
        - level
        - used
        - limit
      examples:
      - tenantId: T68
        occurredAt: '2026-11-26T09:40:00Z'
        quotaId: 0b1d2c3e-4f50-4a6b-8c7d-9e0f1a2b3c4d
        platformCode: ndxp-t68
        period: DAY
        level: 85
        used: 4250
        limit: 5000
        resetAt: '2026-11-27T00:00:00Z'
    QuotaChanged:
      allOf:
      - $ref: '#/components/schemas/Base'
      - type: object
        properties:
          quotaId:
            type: string
            format: uuid
          platformCode:
            type: string
          serviceCode:
            type:
            - string
            - 'null'
          period: *id008
          limit: *id005
          systemCode:
            type:
            - string
            - 'null'
            description: Có khi là phân bổ cho HTTT.
          basisDocument:
            type: string
          scope:
            type: string
            enum:
            - POLICY
            - ALLOCATION
        required:
        - quotaId
        - scope
    CacheInvalidated:
      allOf:
      - $ref: '#/components/schemas/Base'
      - type: object
        properties:
          serviceCode:
            type: string
          scope:
            type: string
            enum:
            - SERVICE
            - SUBJECT
          invalidated: *id005
          reason:
            type: string
            maxLength: 500
        required:
        - serviceCode
        - scope
    BreakerChanged:
      allOf:
      - $ref: '#/components/schemas/Base'
      - type: object
        properties:
          platformCode:
            type: string
          from:
            type: string
          to:
            type: string
            enum:
            - CLOSED
            - OPEN
            - HALF_OPEN
            - FORCED_OPEN
            - FORCED_CLOSED
          failureRatio: &id011
            type: number
          calls: *id005
          queueDepth: *id005
          reason:
            type: string
            maxLength: 500
        required:
        - platformCode
        - to
    TransactionRecorded:
      type: object
      properties:
        transactionCode:
          type: string
        tenantId: *id009
        direction:
          type: string
          enum:
          - OUTBOUND
          - INBOUND
        serviceCode:
          type: string
        platformCode:
          type: string
        systemCode:
          type: string
        purposeCode:
          type:
          - string
          - 'null'
        procedureCode:
          type:
          - string
          - 'null'
        state:
          type: string
          enum:
          - REJECTED
          - COMPLETED_CACHE
          - QUOTA_EXCEEDED
          - SUCCEEDED
          - FAILED
          - TIMEOUT
          - UNKNOWN_RESULT
          - SIGNATURE_FAILED
        errorCode:
          type:
          - string
          - 'null'
          pattern: ^ERR-14-[0-9]{3}$
        fromCache: *id007
        stale: *id007
        durationMs: *id005
        certCode:
          type:
          - string
          - 'null'
        payloadRef:
          type:
          - string
          - 'null'
          description: Tham chiếu nội dung mã hóa; không mang nội dung.
        payloadHash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
        startedAt: *id002
        finishedAt: *id002
      required:
      - transactionCode
      - tenantId
      - direction
      - serviceCode
      - state
      - startedAt
      examples:
      - transactionCode: T68-20261126-0000184320
        tenantId: T68
        direction: OUTBOUND
        serviceCode: lltp-tra-trang-thai
        platformCode: ndxp-t68
        systemCode: DVC
        purposeCode: GIAI_QUYET_TTHC
        procedureCode: '1.001234'
        state: SUCCEEDED
        errorCode: null
        fromCache: false
        stale: false
        durationMs: 842
        certCode: ky-so-t68-2026
        payloadRef: dh-nat-payload/T68/20261126/0000184320
        payloadHash: sha256:abababababababababababababababababababababababababababababababab
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        startedAt: '2026-11-26T08:15:01Z'
        finishedAt: '2026-11-26T08:15:02Z'
    SyncRunFinished:
      allOf:
      - $ref: '#/components/schemas/Base'
      - type: object
        properties:
          runId:
            type: string
            format: uuid
          kind:
            type: string
            enum:
            - SERVICE_CATALOG
            - MASTER_DATA
            - OPEN_DATA
            - SERVICE_RECONCILE
          state:
            type: string
            enum:
            - SUCCEEDED
            - PARTIAL
            - FAILED
            - TIMED_OUT
          sent: *id005
          accepted: *id005
          rejected: *id005
          error: *id005
          receiptRef:
            type:
            - string
            - 'null'
        required:
        - runId
        - kind
        - state
    InboundChanged:
      allOf:
      - $ref: '#/components/schemas/Base'
      - type: object
        properties:
          endpointCode:
            type: string
          path:
            type: string
          state:
            type: string
            enum:
            - DRAFT
            - PENDING_CONFIRM
            - ACTIVE
            - DISABLED
          clientCertFingerprints:
            type: array
            items:
              type: string
              pattern: ^[0-9a-f]{64}$
          senders:
            type: array
            items:
              type: object
              properties:
                senderCode:
                  type: string
                serviceCodes:
                  type: array
                  items:
                    type: string
        required:
        - endpointCode
        - state
    ExposureChanged:
      allOf:
      - $ref: '#/components/schemas/Base'
      - type: object
        properties:
          serviceCode:
            type: string
          apiCode:
            type:
            - string
            - 'null'
          change:
            type: string
            enum:
            - CREATED
            - UPDATED
            - PUBLISHED
            - WITHDRAWN
          path:
            type: string
          contractVersion:
            type: string
          requestId:
            type: string
            format: uuid
        required:
        - serviceCode
        - change
    HealthChanged:
      type: object
      properties:
        tenantId: *id009
        platformCode:
          type: string
        from: &id010
          type: string
          enum:
          - HEALTHY
          - DEGRADED
          - UNHEALTHY
          - UNKNOWN
        to: *id010
        reasonCode:
          type: string
        reasonDetail:
          type: string
          maxLength: 1000
        evaluatedAt: *id002
        metrics:
          type: object
          properties:
            calls5m: *id005
            errorRate5m: *id011
            p95Ms: *id005
            tokenOk: *id007
            crlAgeDays: *id005
      required:
      - tenantId
      - platformCode
      - to
    AnomalyDetected:
      allOf:
      - $ref: '#/components/schemas/Base'
      - type: object
        properties:
          alertId:
            type: string
            format: uuid
          rule:
            type: string
            enum:
            - LOOKUPS_PER_HOUR
            - OFF_HOURS_CALLS
            - SUBJECTS_PER_CASE
            - SPIKE
            - REVEAL_OVER_LIMIT
          systemCode:
            type: string
          serviceCode:
            type: string
          evidenceSummary:
            type: string
            maxLength: 1000
            description: Số liệu tổng hợp, không có dữ liệu cá nhân.
        required:
        - alertId
        - rule
    NotificationReceived:
      type: object
      properties:
        notificationId:
          type: string
          format: uuid
        tenantId: *id009
        endpointCode:
          type: string
        notificationType:
          type: string
          enum:
          - CATALOG_CHANGED
          - SERVICE_SPEC_CHANGED
          - SERVICE_DISCONTINUED
          - OTHER
        subjectRef:
          type: string
        transactionCode:
          type: string
        receivedAt: *id002
      required:
      - notificationId
      - tenantId
      - notificationType
      - receivedAt
    WorkerCommand:
      type: object
      properties:
        commandId:
          type: string
          format: uuid
        tenantId: *id009
        kind:
          type: string
          enum:
          - probe
          - cert.selftest
          - token.test
          - sync.run
          - spec.fetch
          - catalog.fetch
        platformCode:
          type: string
        environment:
          type: string
          enum:
          - TEST
          - STAGING
          - PROD
        args:
          type: object
          additionalProperties: true
          description: Tham số lệnh; không có bí mật, worker tự đọc OpenBao.
        deadline: *id002
      required:
      - commandId
      - tenantId
      - kind
      - deadline
    WorkerResult:
      type: object
      properties:
        commandId:
          type: string
          format: uuid
        tenantId: *id009
        status:
          type: string
          enum:
          - OK
          - FAILED
          - TIMEOUT
        result:
          type: object
          additionalProperties: true
        causeCode:
          type: string
        hint:
          type: string
          maxLength: 1000
        finishedAt: *id002
      required:
      - commandId
      - tenantId
      - status
    QuotaUsage:
      type: object
      properties:
        tenantId: *id009
        quotaId:
          type: string
          format: uuid
        bucket:
          type: string
        used: *id005
        windowStart: *id002
        reportedAt: *id002
        replica:
          type: string
      required:
      - tenantId
      - quotaId
      - used
      - reportedAt
