# D03-04-PH14 · AsyncAPI PH-14. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py — không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: 3.0.0
info:
  title: Datahub PH-14 Kết nối quốc gia — sự kiện
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-14-01…17 (D03-04-PH14 §4, FRS §9.3) và ba topic nội bộ giữa `dh-integration` và hồ sơ `national-gateway`.


    Sự kiện phát từ `dh-integration` ghi vào `ph14_national.outbox` cùng giao dịch, Debezium hoặc bộ quét 500 ms đưa lên Kafka, CloudEvents 1.0
    chế độ nhị phân. Sự kiện phát từ cổng (`gateway`, `worker`) đi qua `LedgerSpool` (ghi đĩa rồi đẩy Kafka, ít nhất một lần). Không sự kiện nào
    mang nội dung bản tin, thông tin xác thực, khóa hay dữ liệu cá nhân; chỉ siêu dữ liệu và mã tham chiếu. Bên nhận xử lý lũy đẳng theo `configVersion`,
    `transactionCode` hoặc `commandId`. Lược đồ đăng ký ở Apicurio, chế độ BACKWARD: chỉ thêm trường tùy chọn trong `v1` (ADR-070). Dữ liệu ví
    dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  license:
    name: Tài liệu nội bộ dự án Datahub
defaultContentType: application/json
