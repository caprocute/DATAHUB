        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PlatformState'
        style: form
        explode: false
      - name: platformType
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PlatformType'
        style: form
        explode: false
      - name: scope
        in: query
        schema:
          $ref: '#/components/schemas/PlatformScope'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
          minLength: 2
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformList'
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      x-datahub-errors:
      - ERR-14-003
    post:
      tags:
      - Nền tảng quốc gia
      operationId: createPlatform
