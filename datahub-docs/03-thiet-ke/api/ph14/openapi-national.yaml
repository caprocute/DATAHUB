            type: https://datahub.gov.vn/errors/ERR-14-016
            title: Lỗi nghiệp vụ theo dữ liệu; mã cụ thể trong `code`
            status: 422
            code: ERR-14-016
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    TooManyRequests:
