    Conflict:
      description: Trạng thái không cho phép, trùng mã, `ETag` lệch, chạy trùng (ERR-14-002, 004, 006, 010, 013, 023, 026, 033, 116, 122, 130).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-14-004
            title: Trạng thái không cho phép, trùng mã, `ETag` lệch, chạy trùng
