# D03-04-PH14 · OpenAPI PH-14 (điều khiển, dữ liệu nội bộ, chiều vào). SINH TỰ ĐỘNG bởi tools/gen_openapi.py — không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-14 Kết nối quốc gia API
  version: 1.0.0-draft
  summary: Nền tảng và dịch vụ quốc gia, định tuyến, chứng thư và chữ ký số, hạn mức và đệm, chiều vào, đồng bộ, giám sát; cổng gọi nội bộ và
    cổng danh mục dùng chung.
  description: 'API của PH-14 (module `national` ở `dh-integration` và hồ sơ `national-gateway` ở `dh-runtime`), ba mặt phẳng:


    1. **Điều khiển** `/api/national/v1`: người dùng gọi qua BFF console (Authorization Code + PKCE); PH-02, PH-06, PH-13 và luồng PH-04 gọi bằng
    token dịch vụ ở vài endpoint.

    2. **Dữ liệu nội bộ** `/internal/national/v1`: HTTT, luồng PH-04, PH-07 gọi qua mesh hoặc APISIX bằng token dịch vụ; `dh-runtime` đọc cấu
    hình.

    3. **Chiều vào** `/inbound/v1`: nền tảng quốc gia gọi vào tỉnh qua APISIX vùng biên bằng mTLS.


    Quy ước (D03-04-PH14 §1): tenant lấy từ token hoặc điểm cuối; tạo nhận `Idempotency-Key`; sửa và đổi trạng thái bắt buộc `If-Match`; hậu tố
    `:{hành-động}`; lỗi RFC 9457 mã `ERR-14-nnn`; phân trang `page`/`size`. Không API nào trả thông tin xác thực, khóa riêng hay nội dung bản
    tin thô (trừ API-14-063 của SO). Mọi tên miền và dữ liệu là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-14
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH14
  x-datahub-phase: PH-14
servers:
- url: https://console.{tenantHost}.datahub.example.vn
  description: Qua BFF console của tenant (điều khiển) — giả lập
  variables:
    tenantHost:
      default: lamdong
      description: Ví dụ `lamdong` cho T68 (giả lập).
- url: http://dh-national-gateway.dh-runtime.svc:8080
  description: Trong cụm, mặt phẳng dữ liệu nội bộ (`/internal/national/v1`)
- url: https://edge.{tenantHost}.datahub.example.vn
  description: Vùng biên, chiều vào (`/inbound/v1`) — giả lập
  variables:
    tenantHost:
      default: lamdong
- url: http://localhost:8091
  description: Phát triển cục bộ
security:
- oauth2User: []
tags:
- name: Nền tảng quốc gia
- name: Dịch vụ quốc gia
- name: Định tuyến
- name: Chứng thư và sự cố chữ ký
- name: Hạn mức và đệm
- name: Điểm cuối chiều vào
- name: Đồng bộ
- name: Giám sát và nhật ký khai thác
- name: Tham số và chuyển đổi
- name: Gọi dịch vụ (nội bộ)
- name: Cổng danh mục và cấu hình (nội bộ)
- name: Chiều vào (vùng biên)
paths:
