components:
  securitySchemes:
    oauth2User:
      type: oauth2
      description: Keycloak realm dh-{tenant}; vai trò ánh xạ PERM-14-* (D02-08).
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes: {}
    oauth2Service:
      type: oauth2
      description: Token dịch vụ (client credentials + `private_key_jwt`); tenant ở claim `tenant`, mã HTTT ở `azp`.
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes:
            national.invoke: Gọi dịch vụ quốc gia; thực tế dùng `national.invoke.{nhóm}` (vd `national.invoke.lltp`)
            national.runtime-config: Đọc ảnh chụp cấu hình không bí mật (`dh-runtime`)
            national.health-read: Đọc chỉ số sức khỏe (PH-13)
            national.catalog.read: Đọc danh mục dùng chung quốc gia (PH-07)
            national.catalog.propose: Gửi đề xuất bổ sung danh mục (PH-07)
            national.sync.trigger: Kích hoạt đồng bộ (PH-02, PH-06)
            national.parallel-observe: Gửi quan sát chạy song song (luồng PH-04; scope đề xuất, Q14-55)
    mtlsEdge:
      type: mutualTLS
      description: Chứng thư mTLS của nền tảng quốc gia; vân tay phải khớp nguồn được phép của điểm cuối (SEC-10, 11).
  parameters:
    PlatformCodePath:
      name: platformCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PlatformCode'
    ServiceCodePath:
      name: serviceCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ServiceCode'
    CertCodePath:
      name: certCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CertCode'
    EndpointCodePath:
      name: endpointCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EndpointCode'
    SystemCodePath:
      name: systemCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SystemCode'
    RunIdPath:
      name: runId
      in: path
      required: true
      schema: &id004
        type: string
        format: uuid
    RuleIdPath:
      name: ruleId
      in: path
      required: true
      schema: *id004
    IncidentIdPath:
      name: incidentId
      in: path
      required: true
      schema: *id004
    AlertIdPath:
      name: alertId
      in: path
      required: true
      schema: *id004
    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema: *id004
    ProposalIdPath:
      name: proposalId
      in: path
      required: true
      schema: *id004
    SpecVersionPath:
      name: specVersion
      in: path
      required: true
      schema:
        type: string
        maxLength: 16
        pattern: ^[0-9]+\.[0-9]+(\.[0-9]+)?$
    TransactionCodePath:
      name: transactionCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    DatasetCodePath:
      name: datasetCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 63
    RemoteCodePath:
      name: remoteCode
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Vượt 100 trả ERR-14-003 kèm `max`.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: ETag hiện tại; lệch trả ERR-14-004 (409) kèm `currentEtag`.
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 16
      description: Lưu 24 giờ; cùng khóa khác thân trả ERR-14-116.
    IdempotencyKeyOpt:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 128
        minLength: 16
      description: 'Bắt buộc khi dịch vụ có `operationType = WRITE` (thiếu: ERR-14-003); cùng khóa khác nội dung trả ERR-14-116.'
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
        maxLength: 55
      description: W3C Trace Context.
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - vi
        - en
    AcceptStale:
      name: X-DH-Accept-Stale
      in: header
      schema: *id003
      description: '`true`: chấp nhận dữ liệu đệm quá hạn khi nền tảng lỗi (FR-14-037).'
    ParallelRunHeader:
      name: X-DH-Parallel-Run
      in: header
      schema: *id004
      description: Gắn lượt gọi vào phiên chạy song song (FR-14-055).
    OnBehalfOf:
      name: X-DH-On-Behalf-Of
      in: header
      schema:
        type: string
        maxLength: 64
      description: Mã HTTT gốc khi luồng PH-04 gọi thay HTTT; cổng đối chiếu với đăng ký của luồng.
    ServiceHeader:
      name: X-DH-Service
      in: header
      schema:
        $ref: '#/components/schemas/ServiceCode'
      description: APISIX gắn khi viết lại tuyến cung cấp lại (FR-14-009).
    OperationHeader:
      name: X-DH-Operation
      in: header
      schema:
        type: string
        maxLength: 41
      description: Thao tác của bộ điều hợp khi dịch vụ có nhiều thao tác.
    TenantHeader:
      name: X-DH-Tenant
      in: header
      schema:
        type: string
        maxLength: 16
      description: 'APISIX gắn từ điểm cuối (BR-14-027); lệch claim: 403 và sự kiện an ninh.'
    ServiceCodeHeader:
      name: Service-code
      in: header
      schema:
        type: string
        maxLength: 64
      description: Mã dịch vụ quốc gia do trung ương gửi.
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ (ERR-14-003, 121, theo trường trong `errors`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-14-003
            title: Dữ liệu không hợp lệ
            status: 400
            code: ERR-14-003
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unauthorized:
      description: Thiếu token hoặc token hết hạn; chứng thư mTLS sai (ERR-14-120).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: about:blank
            title: Chưa xác thực
            status: 401
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Forbidden:
      description: Không đủ quyền, sai tenant, bốn mắt (ERR-14-007), chưa xác thực lại (ERR-14-030), mục đích hoặc nguồn bị chặn (ERR-14-106,
        119, 126).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
