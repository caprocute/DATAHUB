      description: Mã tenant chữ thường, ví dụ `t68`.
      examples:
      - t68
  messages:
    goldenCreated:
      name: goldenCreated
      title: EVT-06-01
      summary: Tạo bản ghi vàng
      contentType: application/json
      payload:
        $ref: '#/components/schemas/goldenCreatedEvent'
      bindings:
        kafka:
          key:
            type: string
            description: 'Khóa phân vùng: `goldenId`.'
