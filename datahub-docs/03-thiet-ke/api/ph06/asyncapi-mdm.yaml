            domainCode: CITIZEN
            goldenId: 0193b1d4-7c2a-7b10-9f3e-5a6c8d2e4f01
            version: 1
            changeType: CREATE
            method: DETERMINISTIC
            sourceCode: HT-YTE
            operationId: 0193a0c3-1111-7000-8000-000000000002
