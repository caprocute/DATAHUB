# D03-04-PH06 · AsyncAPI PH-06. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py, không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: 3.0.0
info:
  title: 'Datahub PH-06 Dữ liệu chủ: sự kiện'
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-06-01…15 (D03-04-PH06 §4, FRS 9.3). Ghi vào `ph06_mdm.outbox_event` cùng giao dịch nghiệp vụ, Debezium Outbox Event Router đưa
    lên Kafka; CloudEvents 1.0 dạng cấu trúc. Không sự kiện nào mang giá trị thuộc tính (BR-06-012): chỉ mã, phiên bản, tên thuộc tính; bên nhận tra lại bản ghi vàng
    bằng API có kiểm soát. Lưu giữ 3 ngày ở outbox; ít nhất một lần, bên nhận khử trùng theo `id`. Tương thích BACKWARD: chỉ thêm trường tùy chọn trong `v1` (ADR-070).
    Dữ liệu ví dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
defaultContentType: application/json
servers:
  kafka-internal:
    host: dh-kafka-kafka-bootstrap.dh-kafka.svc:9093
    protocol: kafka-secure
    description: 'Listener `internal`: DU, `dh-runtime`, Kafka Connect; mTLS, ACL theo tiền tố tenant.'
    security:
    - $ref: '#/components/securitySchemes/mtls'
