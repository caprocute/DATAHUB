# D03-04-PH06 · OpenAPI PH-06 (module mdm của dh-data). SINH TỰ ĐỘNG bởi tools/gen_openapi.py, không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-06 Dữ liệu chủ API
  version: 1.0.0-draft
  summary: Domain, nguồn, nạp ứng viên, đối sánh, hàng đợi, sống sót, bản ghi vàng, liên kết chéo, tra cứu, cung cấp, đồng bộ quốc gia, vận hành.
  description: 'Module `mdm` của `dh-data`, gốc `/api/mdm/v1` (người dùng qua BFF; HTTT, PH-04, PH-08, PH-14 bằng token máy; `/internal` chỉ trong mạng nội bộ).


    Quy ước (D03-04-PH06 §1): tenant lấy từ token; tạo nhận `Idempotency-Key`; sửa và hành động có `If-Match`; hậu tố `:{hành-động}`; lỗi RFC 9457 mã `ERR-06-nnn`;
    phân trang `page`, `size`. Mọi tên miền, dữ liệu là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-06
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH06
  x-datahub-phase: PH-06
servers:
- url: https://console.{tenantHost}.datahub.example.vn/api/mdm/v1
  description: Qua BFF console của tenant (giả lập)
  variables:
    tenantHost:
      default: t68
      description: Ví dụ `t68` (giả lập).
- url: https://api.{tenantHost}.datahub.example.vn/api/mdm/v1
  description: Cổng API cho HTTT, PH-04, PH-08, PH-14 (token máy)
  variables:
    tenantHost:
      default: t68
- url: http://dh-data.dh-data.svc:8080/api/mdm/v1
  description: Trong cụm; chỉ nơi này có `/internal`
security:
- oauth2User: []
tags:
- name: Domain và mô hình
  description: Nhóm Domain và mô hình; bảng mã ở D03-04-PH06 §3.
- name: Nguồn và ưu tiên nguồn
