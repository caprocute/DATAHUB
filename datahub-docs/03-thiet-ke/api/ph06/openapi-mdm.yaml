- name: Bản ghi vàng
  description: Nhóm Bản ghi vàng; bảng mã ở D03-04-PH06 §3.
- name: Liên kết chéo và tra cứu
  description: Nhóm Liên kết chéo và tra cứu; bảng mã ở D03-04-PH06 §3.
- name: Cung cấp dữ liệu
