      type: object
      properties:
        name:
          type: string
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{1,62}$
        description:
          type: string
          maxLength: 500
        values:
          type: object
          properties:
            TEST:
              type: string
              maxLength: 2000
            STAGING:
              type: string
              maxLength: 2000
            PROD:
              type: string
              maxLength: 2000
          additionalProperties: false
        usedBy:
          type: integer
      additionalProperties: false
      required:
      - name
      - values
    EnvVarList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
          maxItems: 500
      additionalProperties: false
      required:
      - items
    HistoryEntry:
      type: object
      properties:
        at: *id004
        action:
          type: string
          maxLength: 64
        actor:
          type: string
          maxLength: 64
        actorName:
          type: string
          maxLength: 255
        target:
          type: string
          maxLength: 255
        versionNo:
          type: integer
        environment:
          $ref: '#/components/schemas/Environment'
        reason:
          type: string
          maxLength: 1000
        before: {}
        after: {}
        traceId:
          type: string
      additionalProperties: false
      required:
      - at
      - action
      - actor
    HistoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
        page:
          $ref: '#/components/schemas/CursorMeta'
      additionalProperties: false
      required:
      - items
      - page
