      - TEST
      - STAGING
      - PROD
    ResourceKind:
      type: string
      enum:
      - ROUTE
      - KAMELET
      - PIPE
      - TEST
    Transport:
      type: string
      enum:
      - SYNC
      - ASYNC
      - SCHEDULED
      - MIXED
