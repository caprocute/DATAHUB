            type: https://datahub.gov.vn/errors/ERR-04-046
            title: Kiểu nội dung không hỗ trợ
            status: 415
            code: ERR-04-046
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unprocessable:
