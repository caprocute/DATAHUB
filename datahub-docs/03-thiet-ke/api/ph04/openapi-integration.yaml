components:
  securitySchemes:
    oauth2User:
      type: oauth2
      description: Keycloak realm dh-{tenant}; vai trò ánh xạ PERM-04-* (D02-08).
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes: {}
  parameters:
    FlowCodePath:
      name: flowCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FlowCode'
    VersionNoPath:
      name: versionNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    WorkspacePath:
      name: workspaceCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WorkspaceCode'
    RunIdPath:
      name: runId
      in: path
      required: true
      schema: *id001
    CaseIdPath:
      name: caseId
      in: path
      required: true
      schema: *id001
    DeploymentIdPath:
      name: deploymentId
      in: path
      required: true
      schema: *id001
    CommandIdPath:
      name: commandId
      in: path
      required: true
      schema: *id001
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
      description: Con trỏ mờ từ `page.next`.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Vượt 100 trả ERR-04-026.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: ETag hiện tại; thiếu trả ERR-04-007 (428), lệch trả ERR-04-006 (412).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 16
      description: 16…128 ký tự, lưu 24 giờ; cùng khóa khác nội dung trả ERR-04-018.
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
        maxLength: 55
      description: W3C Trace Context.
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - vi
        - en
  responses:
    BadRequest:
      description: Tham số hoặc thân yêu cầu không hợp lệ (gồm ERR-04-025 thiếu lý do, ERR-04-026 vượt kích thước trang).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/integration/err-04-049
            title: Tham số hoặc thân yêu cầu không hợp lệ
            status: 400
            code: ERR-04-049
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unauthorized:
      description: Thiếu token hoặc token hết hạn.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/integration/err-04-044
            title: Thiếu token hoặc token hết hạn
            status: 401
            code: ERR-04-044
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Forbidden:
      description: Không đủ quyền chức năng hoặc phạm vi không gian làm việc (gồm ERR-04-003, ERR-04-015).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/integration/err-04-045
            title: Không đủ quyền chức năng hoặc phạm vi không gian làm việc
            status: 403
            code: ERR-04-045
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    NotFound:
      description: Không tìm thấy hoặc không có quyền xem (không phân biệt).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/integration/err-04-001
            title: Không tìm thấy hoặc không có quyền xem
            status: 404
            code: ERR-04-001
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Conflict:
      description: Trạng thái không cho phép thao tác, hoặc xung đột nghiệp vụ (mã cụ thể trong `code`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/integration/err-04-005
            title: Trạng thái không cho phép thao tác, hoặc xung đột nghiệp vụ
            status: 409
            code: ERR-04-005
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    PreconditionFailed:
      description: ETag không khớp; kèm `currentEtag`, `savedBy`, `savedAt`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/integration/err-04-006
            title: ETag không khớp
            status: 412
            code: ERR-04-006
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    PreconditionRequired:
      description: Thiếu tiêu đề If-Match.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/integration/err-04-007
            title: Thiếu tiêu đề If-Match
            status: 428
            code: ERR-04-007
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    PayloadTooLarge:
      description: Thân vượt giới hạn (định nghĩa 512 KiB ERR-04-033, bản tin 256 KiB ERR-04-021).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/integration/err-04-033
            title: Thân vượt giới hạn
            status: 413
            code: ERR-04-033
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    UnsupportedMediaType:
      description: Kiểu nội dung không hỗ trợ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/integration/err-04-046
            title: Kiểu nội dung không hỗ trợ
            status: 415
            code: ERR-04-046
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unprocessable:
      description: Định nghĩa còn lỗi kiểm tra hợp lệ hoặc lỗi nghiệp vụ dạng dữ liệu; kèm `findings`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/problems/integration/err-04-009
            title: Định nghĩa còn lỗi kiểm tra hợp lệ hoặc lỗi nghiệp vụ dạng dữ liệu
            status: 422
            code: ERR-04-009
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
