components:
  securitySchemes:
    oauth2User:
      type: oauth2
      description: Keycloak realm dh-{tenant}; vai trò ánh xạ PERM-04-* (D02-08).
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-t68/protocol/openid-connect/token
          scopes: {}
  parameters:
    FlowCodePath:
      name: flowCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FlowCode'
      example: tra-cuu-ho-tich
    VersionNoPath:
      name: versionNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 3
    WorkspacePath:
      name: workspaceCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WorkspaceCode'
      example: ho-tich
    RunIdPath:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 0193a2b4-5c6d-7e8f-9a0b-1c2d3e4f5a41
    CaseIdPath:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 0193a2b4-5c6d-7e8f-9a0b-1c2d3e4f5a44
    DeploymentIdPath:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 0193a2b4-5c6d-7e8f-9a0b-1c2d3e4f5a54
    CommandIdPath:
      name: commandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 0193a2b4-5c6d-7e8f-9a0b-1c2d3e4f5a61
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
      description: Con trỏ mờ từ `page.next`.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Vượt 100 trả ERR-04-026.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: ETag hiện tại; thiếu trả ERR-04-007 (428), lệch trả ERR-04-006 (412).
      example: W/"3-3f9a1c2e"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 16
      description: 16…128 ký tự, lưu 24 giờ; cùng khóa khác nội dung trả ERR-04-018.
      example: 6f0b1d8c-2f7e-4b7a-9d0e-4c1f7a5e2b10
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
        maxLength: 55
      description: W3C Trace Context.
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - vi
        - en
  responses:
    BadRequest:
      description: Tham số hoặc thân sai (ERR-04-049; thiếu lý do ERR-04-025; trang quá 100 ERR-04-026).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-04-049
            title: Tham số hoặc thân sai
            status: 400
            code: ERR-04-049
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unauthorized:
      description: Thiếu hoặc hết hạn token (ERR-04-044).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-04-044
            title: Thiếu hoặc hết hạn token
            status: 401
            code: ERR-04-044
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Forbidden:
      description: Thiếu quyền (ERR-04-045; mức không gian ERR-04-003; bốn mắt ERR-04-015).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-04-045
            title: Thiếu quyền
            status: 403
            code: ERR-04-045
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    NotFound:
      description: Không tìm thấy hoặc không được xem (ERR-04-001).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datahub.gov.vn/errors/ERR-04-001
            title: Không tìm thấy hoặc không được xem
            status: 404
            code: ERR-04-001
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Conflict:
