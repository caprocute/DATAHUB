# D03-04-PH04 · OpenAPI PH-04 (dh-integration, module flow). SINH TỰ ĐỘNG bởi tools/gen_openapi.py — không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-04 Lõi tích hợp và trình thiết kế luồng API
  version: 1.0.0-draft
  summary: 'Quản lý luồng Camel: không gian, luồng, phiên bản, kiểm tra hợp lệ, chạy thử, duyệt, triển khai GitOps, điều khiển runtime, catalog.'
  description: 'API của module `flow` trong `dh-integration` (control plane PH-04). Chỉ người dùng giao diện Datahub gọi (token Authorization
    Code + PKCE qua BFF của console); HTTT thành viên không gọi API này mà gọi **luồng** qua APISIX.


    Quy ước (D03-04-PH04 §1): tenant lấy từ token; lệnh tạo nhận `Idempotency-Key`; lệnh sửa, đổi trạng thái bắt buộc `If-Match`; hậu tố `:{hành-động}`;
    lỗi RFC 9457 mã `ERR-04-nnn`; phân trang con trỏ; `traceparent` xuyên suốt. Mọi tên miền, máy chủ, dữ liệu là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-04
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH04
  x-datahub-phase: PH-04
servers:
- url: https://console.{tenantHost}.datahub.example.vn/api/integration/v1
  description: Qua BFF console của tenant — giả lập
  variables:
    tenantHost:
      default: lamdong
      description: Ví dụ `lamdong` cho T68 (giả lập).
- url: http://localhost:8081/api/integration/v1
  description: Phát triển cục bộ
security:
- oauth2User: []
tags:
- name: Không gian làm việc
- name: Luồng
- name: Phiên bản
- name: Di trú
- name: Kiểm tra hợp lệ
- name: Chạy thử
- name: Duyệt
- name: Triển khai
- name: Vận hành
- name: Danh mục thành phần
- name: Khuôn mẫu
- name: Tham số
paths:
  /workspaces:
    get:
      tags:
      - Không gian làm việc
      operationId: listWorkspaces
      summary: Danh sách không gian làm việc
      x-datahub-id: API-04-001
      x-datahub-fr:
      - FR-04-007
      x-datahub-permission:
        permission: PERM-04-read
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Không gian làm việc
      operationId: createWorkspace
      summary: Tạo không gian làm việc
      x-datahub-id: API-04-002
      x-datahub-fr:
      - FR-04-007
      x-datahub-permission:
        permission: PERM-04-admin
      description: Mã trùng trả ERR-04-028.
      x-datahub-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspaceCode}:
    patch:
      tags:
      - Không gian làm việc
      operationId: updateWorkspace
      summary: Sửa không gian làm việc
      x-datahub-id: API-04-002
      x-datahub-fr:
      - FR-04-007
      x-datahub-permission:
        permission: PERM-04-admin
        workspaceLevel: MAINTAIN
      parameters:
      - $ref: '#/components/parameters/WorkspacePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /workspaces/{workspaceCode}:archive:
    post:
      tags:
      - Không gian làm việc
      operationId: archiveWorkspace
      summary: Lưu trữ không gian làm việc
      x-datahub-id: API-04-003
      x-datahub-fr:
      - FR-04-007
      x-datahub-permission:
        permission: PERM-04-admin
      description: Không gian còn luồng chưa gỡ vẫn lưu trữ được (ẩn khỏi ô chọn khi tạo luồng). Xóa hẳn không có API; xóa khi còn luồng trả ERR-04-017.
      parameters:
      - $ref: '#/components/parameters/WorkspacePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /workspaces/{workspaceCode}/members:
    get:
      tags:
      - Không gian làm việc
      operationId: listWorkspaceMembers
      summary: Danh sách thành viên
      x-datahub-id: API-04-004
      x-datahub-fr:
      - FR-04-007
      x-datahub-permission:
        permission: PERM-04-read
        workspaceLevel: VIEW
      parameters:
      - $ref: '#/components/parameters/WorkspacePath'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Không gian làm việc
      operationId: replaceWorkspaceMembers
      summary: Thay danh sách thành viên
      x-datahub-id: API-04-004
      x-datahub-fr:
      - FR-04-007
      x-datahub-permission:
        permission: PERM-04-admin
        workspaceLevel: MAINTAIN
      description: TA hoặc thành viên mức MAINTAIN. Kiểm toán ghi danh sách thêm, bớt.
      parameters:
      - $ref: '#/components/parameters/WorkspacePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMembers'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /flows:
    get:
      tags:
      - Luồng
      operationId: listFlows
      summary: Danh sách luồng
      x-datahub-id: API-04-010
      x-datahub-fr:
      - FR-04-001
      x-datahub-permission:
        permission: PERM-04-read
      description: Lọc theo phạm vi không gian làm việc ở SQL khi `04.workspace.enforce` bật. Kèm `facets` đếm theo trạng thái, môi trường.
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
          minLength: 2
        description: Tìm không dấu trên mã, tên, mô tả.
      - name: workspace
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceCode'
        style: form
        explode: false
      - name: status
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/FlowStatus'
        style: form
        explode: false
      - name: environment
        in: query
        schema:
          $ref: '#/components/schemas/Environment'
      - name: health
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/HealthStatus'
        style: form
        explode: false
      - name: resourceKind
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ResourceKind'
        style: form
        explode: false
      - name: exposure
        in: query
        schema:
          $ref: '#/components/schemas/Exposure'
      - name: endpoint
        in: query
        schema:
          type: string
          maxLength: 255
        description: Chuỗi con của URI điểm kết nối đã chuẩn hóa (EN-04-04b).
      - name: label
        in: query
        schema:
          type: array
          items:
            type: string
            maxLength: 127
        style: form
        explode: true
        description: '`khóa:giá-trị`.'
      - name: sort
        in: query
        schema:
          type: string
          pattern: ^-?(code|name|updatedAt|status)$
          default: -updatedAt
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Luồng
      operationId: createFlow
      summary: Tạo luồng và phiên bản 1
      x-datahub-id: API-04-011
      x-datahub-fr:
      - FR-04-003
      - FR-04-025
      x-datahub-permission:
        permission: PERM-04-create
        workspaceLevel: EDIT
      description: Ghi luồng, phiên bản 1 `DRAFT`, chỉ mục, outbox EVT-04-01 trong một giao dịch. Mã trùng ERR-04-002; không gian không tồn tại
        ERR-04-027; khuôn không tồn tại ERR-04-039; YAML lỗi ERR-04-008; loại tài nguyên không khớp ERR-04-009; vượt kích thước ERR-04-033.
      x-datahub-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowCreate'
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDetail'
          headers:
            ETag:
              schema:
                type: string
              description: W/"{version}-{contentHash[0..8]}"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /flows/{flowCode}:
    get:
      tags:
      - Luồng
      operationId: getFlow
      summary: Chi tiết luồng
      x-datahub-id: API-04-012
      x-datahub-fr:
      - FR-04-002
      x-datahub-permission:
        permission: PERM-04-read
        workspaceLevel: VIEW
      parameters:
      - $ref: '#/components/parameters/FlowCodePath'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDetail'
          headers:
            ETag:
              schema:
                type: string
              description: W/"{version}-{contentHash[0..8]}"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Luồng
      operationId: updateFlow
      summary: Sửa thông tin luồng
      x-datahub-id: API-04-013
      x-datahub-fr:
      - FR-04-004
      x-datahub-permission:
        permission: PERM-04-update
        workspaceLevel: EDIT
      description: Chuyển không gian cần mức EDIT ở cả hai nơi. Luồng đã gỡ ERR-04-034.
      parameters:
      - $ref: '#/components/parameters/FlowCodePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowUpdate'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDetail'
          headers:
            ETag:
              schema:
                type: string
              description: W/"{version}-{contentHash[0..8]}"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /flows/{flowCode}:clone:
    post:
      tags:
      - Luồng
      operationId: cloneFlow
      summary: Nhân bản luồng
      x-datahub-id: API-04-014
      x-datahub-fr:
      - FR-04-005
      x-datahub-permission:
        permission: PERM-04-create
        workspaceLevel: EDIT
      x-datahub-idempotent: true
      parameters:
      - $ref: '#/components/parameters/FlowCodePath'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneRequest'
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /flows/{flowCode}:retire:
    post:
      tags:
      - Luồng
      operationId: retireFlow
      summary: Gỡ luồng
      x-datahub-id: API-04-015
      x-datahub-fr:
      - FR-04-006
      x-datahub-permission:
        permission: PERM-04-delete
      description: Rút luồng khỏi các môi trường theo thứ tự PROD → TEST qua Git rồi chuyển RETIRED. Còn phụ thuộc cứng ERR-04-017 kèm `dependencies`;
        thiếu lý do ERR-04-025.
      parameters:
      - $ref: '#/components/parameters/FlowCodePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetireRequest'
      responses:
        '202':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDetail'
          headers:
            Location:
              schema:
                type: string
              description: Tài nguyên theo dõi tiến trình.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /flows/{flowCode}/dependencies:
    get:
      tags:
      - Luồng
      operationId: getFlowDependencies
      summary: Phụ thuộc của luồng
      x-datahub-id: API-04-016
      x-datahub-fr:
      - FR-04-006
      - FR-04-002
      x-datahub-permission:
        permission: PERM-04-read
        workspaceLevel: VIEW
      parameters:
      - $ref: '#/components/parameters/FlowCodePath'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependencies'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /flows/{flowCode}/versions:
    get:
      tags:
      - Phiên bản
      operationId: listVersions
      summary: Danh sách phiên bản
      x-datahub-id: API-04-024
      x-datahub-fr:
      - FR-04-011
      x-datahub-permission:
        permission: PERM-04-read
        workspaceLevel: VIEW
      parameters:
      - $ref: '#/components/parameters/FlowCodePath'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Phiên bản
      operationId: createVersion
      summary: Tạo phiên bản mới từ phiên bản có sẵn
      x-datahub-id: API-04-021
      x-datahub-fr:
      - FR-04-011
      x-datahub-permission:
        permission: PERM-04-update
        workspaceLevel: EDIT
      description: Sao chép định nghĩa, bố cục, bản tin mẫu, ánh xạ. Đã có phiên bản mở ERR-04-016.
      x-datahub-idempotent: true
      parameters:
      - $ref: '#/components/parameters/FlowCodePath'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewVersionRequest'
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetail'
          headers:
            ETag:
              schema:
                type: string
              description: W/"{version}-{contentHash[0..8]}"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /flows/{flowCode}/versions/{versionNo}:
    get:
      tags:
      - Phiên bản
      operationId: getVersion
      summary: Lấy phiên bản (định nghĩa, bố cục, bản tin mẫu)
      x-datahub-id: API-04-020
      x-datahub-fr:
      - FR-04-010
      x-datahub-permission:
        permission: PERM-04-read
        workspaceLevel: VIEW
      description: Trả ETag để lưu nháp. ERR-04-004 khi phiên bản không tồn tại.
      parameters:
      - $ref: '#/components/parameters/FlowCodePath'
      - $ref: '#/components/parameters/VersionNoPath'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetail'
          headers:
            ETag:
              schema:
                type: string
              description: W/"{version}-{contentHash[0..8]}"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /flows/{flowCode}/versions/{versionNo}/draft:
    put:
      tags:
      - Phiên bản
      operationId: saveDraft
      summary: Lưu nháp
      x-datahub-id: API-04-022
      x-datahub-fr:
      - FR-04-024
      - FR-04-010
      - FR-04-022
      x-datahub-permission:
        permission: PERM-04-update
        workspaceLevel: EDIT
      description: Chỉ ở DRAFT, CHANGES_REQUESTED (ERR-04-005). Chạy kiểm tra mức DESIGN (không chặn lưu) trừ VR-01 cú pháp (ERR-04-008) và VR-03
        bí mật (ERR-04-010). Thêm người gọi vào danh sách người đóng góp. ERR-04-041 chỉ khi tỉnh đóng băng cả việc soạn.
      parameters:
      - $ref: '#/components/parameters/FlowCodePath'
      - $ref: '#/components/parameters/VersionNoPath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
