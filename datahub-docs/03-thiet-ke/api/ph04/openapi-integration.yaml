# D03-04-PH04 · OpenAPI PH-04 (dh-integration, module flow). SINH TỰ ĐỘNG bởi tools/gen_openapi.py — không sửa tay.
openapi: 3.1.0
info:
  title: Datahub · PH-04 Lõi tích hợp và trình thiết kế luồng API
  version: 1.0.0-draft
  summary: 'Quản lý luồng Camel: không gian, luồng, phiên bản, kiểm tra hợp lệ, chạy thử, duyệt, triển khai GitOps, điều khiển runtime, catalog.'
  description: 'API của module `flow` trong `dh-integration` (control plane PH-04). Chỉ người dùng giao diện Datahub gọi (token Authorization
    Code + PKCE qua BFF của console); HTTT thành viên không gọi API này mà gọi **luồng** qua APISIX.


    Quy ước (D03-04-PH04 §1): tenant lấy từ token; lệnh tạo nhận `Idempotency-Key`; lệnh sửa, đổi trạng thái bắt buộc `If-Match`; hậu tố `:{hành-động}`;
    lỗi RFC 9457 mã `ERR-04-nnn`; phân trang con trỏ; `traceparent` xuyên suốt. Mọi tên miền, máy chủ, dữ liệu là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-04
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH04
  x-datahub-phase: PH-04
servers:
- url: https://console.{tenantHost}.datahub.example.vn/api/integration/v1
  description: Qua BFF console của tenant — giả lập
  variables:
    tenantHost:
      default: lamdong
      description: Ví dụ `lamdong` cho T68 (giả lập).
- url: http://localhost:8081/api/integration/v1
  description: Phát triển cục bộ
security:
- oauth2User: []
tags:
- name: Không gian làm việc
- name: Luồng
- name: Phiên bản
- name: Di trú
- name: Kiểm tra hợp lệ
- name: Chạy thử
- name: Duyệt
- name: Triển khai
- name: Vận hành
- name: Danh mục thành phần
- name: Khuôn mẫu
- name: Tham số
paths:
  /workspaces:
    get:
      tags:
      - Không gian làm việc
      operationId: listWorkspaces
      summary: Danh sách không gian làm việc
      x-datahub-id: API-04-001
      x-datahub-fr:
      - FR-04-007
      x-datahub-permission:
        permission: PERM-04-read
      description: Trả mọi không gian làm việc của tenant mà người gọi thấy được, kèm `myAccess` (mức của người gọi) và `flowCount`. Danh sách
        nhỏ nên trả trọn, không phân trang.
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
              example:
                items:
                - id: 0193a2b4-5c6d-7e8f-9a0b-1c2d3e4f5a01
                  code: ho-tich
                  name: Hộ tịch
                  ownerOrgCode: STP-T68
                  status: ACTIVE
                  flowCount: 12
                  myAccess: MAINTAIN
                  allowedActions: &id001
                  - update
                  - archive
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Không gian làm việc
      operationId: createWorkspace
      summary: Tạo không gian làm việc
      x-datahub-id: API-04-002
      x-datahub-fr:
      - FR-04-007
      x-datahub-permission:
        permission: PERM-04-admin
      description: Mã trùng trả ERR-04-028.
      x-datahub-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
            example:
              code: dat-dai
              name: Đất đai
              ownerOrgCode: STNMT-T68
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              example:
                id: 0193a2b4-5c6d-7e8f-9a0b-1c2d3e4f5a02
                code: dat-dai
                name: Đất đai
                ownerOrgCode: STNMT-T68
                status: ACTIVE
                flowCount: 0
                myAccess: MAINTAIN
                allowedActions: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspaceCode}:
    patch:
      tags:
      - Không gian làm việc
      operationId: updateWorkspace
      summary: Sửa không gian làm việc
      x-datahub-id: API-04-002
      x-datahub-fr:
      - FR-04-007
      x-datahub-permission:
        permission: PERM-04-admin
        workspaceLevel: MAINTAIN
      description: Đổi tên, mô tả, đơn vị chủ quản. Mã không gian không đổi được. Không gian không tồn tại ERR-04-027.
      parameters:
      - $ref: '#/components/parameters/WorkspacePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
            example:
              name: Hộ tịch và chứng thực
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              example:
                id: 0193a2b4-5c6d-7e8f-9a0b-1c2d3e4f5a01
                code: ho-tich
                name: Hộ tịch và chứng thực
                ownerOrgCode: STP-T68
                status: ACTIVE
                flowCount: 12
                myAccess: MAINTAIN
                allowedActions: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /workspaces/{workspaceCode}:archive:
    post:
      tags:
      - Không gian làm việc
      operationId: archiveWorkspace
      summary: Lưu trữ không gian làm việc
      x-datahub-id: API-04-003
      x-datahub-fr:
      - FR-04-007
      x-datahub-permission:
        permission: PERM-04-admin
      description: Không gian còn luồng chưa gỡ vẫn lưu trữ được (ẩn khỏi ô chọn khi tạo luồng). Xóa hẳn không có API; xóa khi còn luồng trả ERR-04-017.
      parameters:
      - $ref: '#/components/parameters/WorkspacePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              example:
                id: 0193a2b4-5c6d-7e8f-9a0b-1c2d3e4f5a01
                code: ho-tich
                name: Hộ tịch
                ownerOrgCode: STP-T68
                status: ARCHIVED
                flowCount: 12
                myAccess: MAINTAIN
                allowedActions: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /workspaces/{workspaceCode}/members:
    get:
      tags:
      - Không gian làm việc
      operationId: listWorkspaceMembers
      summary: Danh sách thành viên
      x-datahub-id: API-04-004
      x-datahub-fr:
      - FR-04-007
      x-datahub-permission:
        permission: PERM-04-read
        workspaceLevel: VIEW
      description: Trả danh sách người dùng và nhóm cùng mức truy cập VIEW, EDIT, MAINTAIN (FR-04-007).
      parameters:
      - $ref: '#/components/parameters/WorkspacePath'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembers'
              example:
                members:
                - principalType: USER
                  principalId: an.nv
                  displayName: Nguyễn Văn An
                  accessLevel: MAINTAIN
                - principalType: GROUP
                  principalId: tt-cntt-t68
                  accessLevel: EDIT
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Không gian làm việc
      operationId: replaceWorkspaceMembers
      summary: Thay danh sách thành viên
      x-datahub-id: API-04-004
      x-datahub-fr:
      - FR-04-007
      x-datahub-permission:
        permission: PERM-04-admin
        workspaceLevel: MAINTAIN
      description: TA hoặc thành viên mức MAINTAIN. Kiểm toán ghi danh sách thêm, bớt.
      parameters:
      - $ref: '#/components/parameters/WorkspacePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMembers'
            example:
              members:
              - principalType: USER
                principalId: an.nv
                accessLevel: MAINTAIN
              - principalType: USER
                principalId: binh.tt
                accessLevel: EDIT
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembers'
              example:
                members:
                - principalType: USER
                  principalId: an.nv
                  accessLevel: MAINTAIN
                - principalType: USER
                  principalId: binh.tt
                  accessLevel: EDIT
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /flows:
    get:
      tags:
      - Luồng
      operationId: listFlows
      summary: Danh sách luồng
      x-datahub-id: API-04-010
      x-datahub-fr:
      - FR-04-001
      x-datahub-permission:
        permission: PERM-04-read
      description: Lọc theo phạm vi không gian làm việc ở SQL khi `04.workspace.enforce` bật. Kèm `facets` đếm theo trạng thái, môi trường.
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
          minLength: 2
        description: Tìm không dấu trên mã, tên, mô tả.
      - name: workspace
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceCode'
        style: form
        explode: false
      - name: status
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/FlowStatus'
        style: form
        explode: false
        example:
        - ACTIVE
      - name: environment
        in: query
        schema:
          $ref: '#/components/schemas/Environment'
        example: PROD
      - name: health
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/HealthStatus'
        style: form
        explode: false
      - name: resourceKind
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ResourceKind'
        style: form
        explode: false
      - name: exposure
        in: query
        schema:
          $ref: '#/components/schemas/Exposure'
      - name: endpoint
        in: query
        schema:
          type: string
          maxLength: 255
        description: Chuỗi con của URI điểm kết nối đã chuẩn hóa (EN-04-04b).
      - name: label
        in: query
        schema:
          type: array
          items:
            type: string
            maxLength: 127
        style: form
        explode: true
        description: '`khóa:giá-trị`.'
      - name: sourceSystem
        in: query
        schema:
          type: array
          items:
            type: string
            maxLength: 64
        style: form
        explode: false
        description: Mã HTTT nguồn.
      - name: targetSystem
        in: query
        schema:
          type: array
          items:
            type: string
            maxLength: 64
        style: form
        explode: false
        description: Mã HTTT đích.
      - name: transport
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Transport'
        style: form
        explode: false
      - name: namespace
        in: query
        schema:
          type: string
          maxLength: 64
        description: '`dh-runtime` hoặc `dh-rt-{tenant}`; thay cho tìm theo host của hệ cũ.'
      - name: hasOpenVersion
        in: query
        schema:
          type: boolean
        description: Chỉ luồng có phiên bản mở.
      - name: pendingMyReview
        in: query
        schema:
          type: boolean
        description: Chỉ luồng có phiên bản chờ người dùng hiện tại duyệt.
      - name: updatedFrom
        in: query
        schema:
          type: string
          format: date
        description: Ngày sửa cuối từ (gồm).
      - name: updatedTo
        in: query
        schema:
          type: string
          format: date
        description: Ngày sửa cuối đến (gồm).
      - name: sort
        in: query
        schema:
          type: string
          pattern: ^-?(code|name|updatedAt|status)$
          default: -updatedAt
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowPage'
              example:
                items:
                - id: 0193a2b4-5c6d-7e8f-9a0b-1c2d3e4f5a10
                  code: tra-cuu-ho-tich
                  name: Tra cứu hộ tịch qua NDXP
                  workspaceCode: ho-tich
                  resourceKind: ROUTE
                  transport: SYNC
                  exposure: EXTERNAL
                  status: ACTIVE
                  sourceSystem: DVC-T68
                  targetSystems: &id002
                  - NDXP
                  environments: &id003
                  - environment: PROD
                    versionNo: 2
                    syncStatus: SYNCED
                    healthStatus: HEALTHY
                  allowedActions: &id004
                  - update
                  - clone
                  - retire
                page:
                  next: eyJrIjoyNX0
                  hasMore: true
                facets:
                  status:
                    ACTIVE: 18
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Luồng
      operationId: createFlow
      summary: Tạo luồng và phiên bản 1
      x-datahub-id: API-04-011
      x-datahub-fr:
      - FR-04-003
      - FR-04-025
      x-datahub-permission:
        permission: PERM-04-create
        workspaceLevel: EDIT
      description: Ghi luồng, phiên bản 1 `DRAFT`, chỉ mục, outbox EVT-04-01 trong một giao dịch. Mã trùng ERR-04-002; không gian không tồn tại
        ERR-04-027; khuôn không tồn tại ERR-04-039; YAML lỗi ERR-04-008; loại tài nguyên không khớp ERR-04-009; vượt kích thước ERR-04-033.
      x-datahub-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowCreate'
            example:
              code: tra-cuu-ho-tich
              name: Tra cứu hộ tịch qua NDXP
              workspaceCode: ho-tich
              resourceKind: ROUTE
              origin: TEMPLATE
              templateCode: tpl-rest-proxy
              templateParams:
                upstream: ndxp-ho-tich
              sourceSystem: DVC-T68
              targetSystems:
              - NDXP
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDetail'
              example:
                id: 0193a2b4-5c6d-7e8f-9a0b-1c2d3e4f5a10
                code: tra-cuu-ho-tich
                name: Tra cứu hộ tịch qua NDXP
                workspaceCode: ho-tich
                resourceKind: ROUTE
                transport: SYNC
                exposure: EXTERNAL
                status: DRAFT
                sourceSystem: DVC-T68
                targetSystems: *id002
                environments: []
                allowedActions:
                - update
                - retire
                origin: TEMPLATE
                routes: &id005
                - routeId: tra-cuu
                  stepCount: 9
                openVersionNo: 1
          headers:
            ETag:
              schema:
                type: string
              description: W/"{version}-{contentHash[0..8]}"
              example: W/"3-3f9a1c2e"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /flows/{flowCode}:
    get:
      tags:
      - Luồng
      operationId: getFlow
      summary: Chi tiết luồng
      x-datahub-id: API-04-012
      x-datahub-fr:
      - FR-04-002
      x-datahub-permission:
        permission: PERM-04-read
        workspaceLevel: VIEW
      description: Trả thông tin luồng, route, trạng thái theo môi trường và `allowedActions`. Luồng của tenant khác hoặc ngoài phạm vi không
        gian trả ERR-04-001 (404).
      parameters:
      - $ref: '#/components/parameters/FlowCodePath'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDetail'
              example:
                id: 0193a2b4-5c6d-7e8f-9a0b-1c2d3e4f5a10
                code: tra-cuu-ho-tich
                name: Tra cứu hộ tịch qua NDXP
                workspaceCode: ho-tich
                resourceKind: ROUTE
                transport: SYNC
                exposure: EXTERNAL
                status: ACTIVE
                sourceSystem: DVC-T68
                targetSystems: *id002
                environments: *id003
                allowedActions: *id004
                origin: TEMPLATE
                routes: *id005
          headers:
            ETag:
              schema:
                type: string
              description: W/"{version}-{contentHash[0..8]}"
              example: W/"3-3f9a1c2e"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Luồng
      operationId: updateFlow
      summary: Sửa thông tin luồng
      x-datahub-id: API-04-013
      x-datahub-fr:
      - FR-04-004
      x-datahub-permission:
        permission: PERM-04-update
        workspaceLevel: EDIT
      description: Chuyển không gian cần mức EDIT ở cả hai nơi. Luồng đã gỡ ERR-04-034.
      parameters:
      - $ref: '#/components/parameters/FlowCodePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowUpdate'
            example:
              labels:
                linh-vuc: ho-tich
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDetail'
              example:
                id: 0193a2b4-5c6d-7e8f-9a0b-1c2d3e4f5a10
                code: tra-cuu-ho-tich
                name: Tra cứu hộ tịch qua NDXP
                workspaceCode: ho-tich
                resourceKind: ROUTE
                transport: SYNC
                exposure: EXTERNAL
                status: ACTIVE
                sourceSystem: DVC-T68
                targetSystems: *id002
                environments: *id003
                allowedActions: *id004
                origin: TEMPLATE
                routes: *id005
                labels:
                  linh-vuc: ho-tich
          headers:
            ETag:
              schema:
                type: string
              description: W/"{version}-{contentHash[0..8]}"
              example: W/"3-3f9a1c2e"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /flows/{flowCode}:clone:
    post:
      tags:
      - Luồng
      operationId: cloneFlow
      summary: Nhân bản luồng
      x-datahub-id: API-04-014
      x-datahub-fr:
      - FR-04-005
      x-datahub-permission:
        permission: PERM-04-create
