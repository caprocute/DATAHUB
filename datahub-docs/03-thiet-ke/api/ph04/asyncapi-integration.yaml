components:
  parameters:
    tenant:
      description: Mã tenant chữ thường, ví dụ `t68`.
      examples:
      - t68
  securitySchemes:
    mtls:
      type: X509
      description: Chứng thư do cert-manager cấp; ACL Kafka theo CN.
  messages:
    flowCreated:
      name: flowCreated
      title: EVT-04-01
      summary: Tạo luồng (FR-04-003, FR-04-005).
      payload:
        $ref: '#/components/schemas/FlowCreated'
      headers: &id001
        type: object
        properties:
          ce_specversion:
            type: string
            const: '1.0'
          ce_id:
            type: string
            format: uuid
          ce_source:
            type: string
            description: '`/tenants/{tenant}/integration`'
          ce_type:
            type: string
          ce_time: &id004
            type: string
            format: date-time
          ce_subject:
            type: string
            description: Mã luồng.
          ce_datacontenttype:
            type: string
            const: application/json
          traceparent:
            type: string
        required:
        - ce_specversion
        - ce_id
        - ce_source
        - ce_type
        - ce_time
      bindings:
        kafka:
          key:
            type: string
            description: '`{tenant}:{flowId}` để giữ thứ tự theo luồng.'
    flowUpdated:
      name: flowUpdated
      title: EVT-04-02
      summary: Sửa thông tin luồng (FR-04-004).
      payload:
        $ref: '#/components/schemas/FlowUpdated'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{tenant}:{flowId}` để giữ thứ tự theo luồng.'
    versionSubmitted:
      name: versionSubmitted
      title: EVT-04-03
      summary: Gửi duyệt (FR-04-040).
      payload:
        $ref: '#/components/schemas/VersionEvent'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{tenant}:{flowId}` để giữ thứ tự theo luồng.'
    versionApproved:
      name: versionApproved
      title: EVT-04-04
      summary: Duyệt (FR-04-041).
      payload:
        $ref: '#/components/schemas/VersionEvent'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{tenant}:{flowId}` để giữ thứ tự theo luồng.'
    versionChangesRequested:
      name: versionChangesRequested
      title: EVT-04-05
      summary: Yêu cầu sửa (FR-04-041).
      payload:
        $ref: '#/components/schemas/VersionEvent'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{tenant}:{flowId}` để giữ thứ tự theo luồng.'
    deploymentRequested:
      name: deploymentRequested
      title: EVT-04-06
      summary: Yêu cầu phát hành, nâng, quay lui, gỡ (FR-04-042, 044, 045, 006).
      payload:
        $ref: '#/components/schemas/DeploymentRequested'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{tenant}:{flowId}` để giữ thứ tự theo luồng.'
    deploymentStatusChanged:
      name: deploymentStatusChanged
      title: EVT-04-07
      summary: Trạng thái triển khai đổi.
      payload:
        $ref: '#/components/schemas/DeploymentStatusChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{tenant}:{flowId}` để giữ thứ tự theo luồng.'
    flowRuntimeStateChanged:
      name: flowRuntimeStateChanged
      title: EVT-04-08
      summary: Tạm dừng, tiếp tục, dừng khẩn đã được xác nhận (FR-04-050).
      payload:
        $ref: '#/components/schemas/RuntimeStateChanged'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{tenant}:{flowId}` để giữ thứ tự theo luồng.'
    flowRetired:
      name: flowRetired
      title: EVT-04-09
      summary: Luồng đã gỡ (FR-04-006).
      payload:
        $ref: '#/components/schemas/FlowRetired'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{tenant}:{flowId}` để giữ thứ tự theo luồng.'
    testRunCompleted:
      name: testRunCompleted
      title: EVT-04-10
      summary: Lần chạy thử kết thúc (FR-04-030).
      payload:
        $ref: '#/components/schemas/TestRunCompleted'
      headers: *id001
      bindings:
        kafka:
          key:
            type: string
            description: '`{tenant}:{flowId}` để giữ thứ tự theo luồng.'
    runtimeCommand:
      name: runtimeCommand
      title: EVT-04-11
      summary: 'Lệnh điều khiển runtime có ký (ADR-065). Không qua outbox: dh-integration ghi trực tiếp sau khi lưu runtime_command.'
      payload:
        $ref: '#/components/schemas/RuntimeCommand'
      headers:
        type: object
        properties:
          traceparent:
            type: string
          ce_id:
            type: string
            format: uuid
      bindings:
        kafka:
          key:
            type: string
            description: '`{tenant}:{environment}`'
    runtimeHeartbeat:
      name: runtimeHeartbeat
      title: EVT-04-12
      summary: Nhịp tim mỗi 30 giây của bản sao runtime.
      payload:
        $ref: '#/components/schemas/Heartbeat'
      headers:
        type: object
        properties:
          traceparent:
            type: string
          ce_id:
            type: string
            format: uuid
      bindings:
        kafka:
          key:
            type: string
            description: '`{replica}`'
    runtimeCommandAck:
      name: runtimeCommandAck
      title: EVT-04-13
      summary: Xác nhận lệnh của từng bản sao.
      payload:
        $ref: '#/components/schemas/CommandAck'
      headers:
        type: object
        properties:
          traceparent:
            type: string
          ce_id:
            type: string
            format: uuid
      bindings:
        kafka:
          key:
            type: string
            description: '`{commandId}`'
    connectionLog:
      name: connectionLog
      title: EVT-04-14
      summary: 'Nhật ký kết nối từ chặng audit (BR-04-002). Chủ quản topic: PH-13; giữ online 12 tháng, WORM 5 năm ở PH-13.'
      payload:
        $ref: '#/components/schemas/ConnectionLog'
      headers:
        type: object
        properties:
          traceparent:
            type: string
          ce_id:
            type: string
            format: uuid
      bindings:
        kafka:
          key:
            type: string
            description: '`{tenant}:{flowCode}`'
  schemas:
    FlowRef:
      type: object
      properties:
        tenantId:
          type: string
          pattern: ^T[0-9]{2}$
        flowId:
          type: string
          format: uuid
        flowCode:
          type: string
        workspaceCode:
          type: string
      required:
      - tenantId
      - flowId
      - flowCode
    Actor:
      type: object
      properties:
        userId:
          type: string
        type:
          type: string
          enum:
          - USER
          - SYSTEM
      required:
      - userId
      - type
    FlowCreated:
      allOf:
      - $ref: '#/components/schemas/FlowRef'
      - type: object
        properties:
          name:
            type: string
          resourceKind:
            type: string
            enum:
            - ROUTE
            - KAMELET
            - PIPE
            - TEST
          origin:
            type: string
          transport:
            type: string
          exposure:
            type: string
          actor:
            $ref: '#/components/schemas/Actor'
        required:
        - name
        - resourceKind
    FlowUpdated:
      allOf:
      - $ref: '#/components/schemas/FlowRef'
      - type: object
        properties:
          changedFields:
            type: array
            items:
              type: string
          actor:
            $ref: '#/components/schemas/Actor'
        required:
        - changedFields
    VersionEvent:
      allOf:
      - $ref: '#/components/schemas/FlowRef'
      - type: object
        properties:
          versionNo: &id002
            type: integer
          contentHash:
            type: string
            pattern: ^sha256:[0-9a-f]{64}$
          status:
            type: string
          actor:
            $ref: '#/components/schemas/Actor'
          changeNote:
            type: string
            maxLength: 2000
          comment:
            type: string
            maxLength: 4000
          nodeCommentCount: *id002
          contributors:
            type: array
            items:
              type: string
        required:
        - versionNo
        - contentHash
        - status
    DeploymentRequested:
      allOf:
      - $ref: '#/components/schemas/FlowRef'
      - type: object
        properties:
          deploymentId:
            type: string
            format: uuid
          versionNo: *id002
          environment: &id003
            type: string
            enum:
            - TEST
            - STAGING
            - PROD
          kind:
            type: string
            enum:
            - RELEASE
            - PROMOTE
            - ROLLBACK
            - RETIRE
          contentHash:
            type: string
          runtimeProfile:
            type: string
          actor:
            $ref: '#/components/schemas/Actor'
        required:
        - deploymentId
        - versionNo
        - environment
        - kind
    DeploymentStatusChanged:
      allOf:
      - $ref: '#/components/schemas/FlowRef'
      - type: object
        properties:
          deploymentId:
            type: string
            format: uuid
          versionNo: *id002
          environment: *id003
          from:
            type: string
          to:
            type: string
            enum:
            - PENDING
            - SYNCING
            - SYNCED
            - OUT_OF_SYNC
            - FAILED
          healthStatus:
            type: string
          gitCommit:
            type: string
          errorCode:
            type: string
        required:
        - deploymentId
        - environment
        - to
    RuntimeStateChanged:
      allOf:
      - $ref: '#/components/schemas/FlowRef'
      - type: object
        properties:
          environment: *id003
          commandId:
            type: string
            format: uuid
          action:
            type: string
            enum:
            - PAUSE
            - RESUME
            - EMERGENCY_STOP
          routeIds:
            type: array
            items:
              type: string
          state:
            type: string
            enum:
            - RUNNING
            - PAUSED
            - STOPPED
          reason:
            type: string
            maxLength: 1000
          actor:
            $ref: '#/components/schemas/Actor'
        required:
        - environment
        - action
        - state
    FlowRetired:
      allOf:
      - $ref: '#/components/schemas/FlowRef'
      - type: object
        properties:
          reason:
            type: string
            maxLength: 1000
          actor:
            $ref: '#/components/schemas/Actor'
        required:
        - reason
    TestRunCompleted:
      allOf:
      - $ref: '#/components/schemas/FlowRef'
      - type: object
        properties:
          runId:
            type: string
            format: uuid
          versionNo: *id002
          definitionHash:
            type: string
          mode:
            type: string
            enum:
            - MOCK
            - SANDBOX_LIVE
            - SIMULATED
          status:
            type: string
            enum:
            - PASSED
            - FAILED
            - TIMED_OUT
            - CANCELLED
          testCaseId:
            type:
            - string
            - 'null'
            format: uuid
          durationMs: *id002
        required:
        - runId
        - versionNo
        - definitionHash
        - status
    RuntimeCommand:
      type: object
      properties:
        commandId:
          type: string
          format: uuid
        tenantId:
          type: string
          pattern: ^T[0-9]{2}$
        environment: *id003
        flowCode:
          type: string
        action:
          type: string
          enum:
          - PAUSE
          - RESUME
          - EMERGENCY_STOP
        routeIds:
          type: array
          items:
            type: string
        drain: &id005
          type: boolean
        issuedBy:
          type: string
        issuedAt: *id004
        expiresAt: *id004
        resendOf:
          type:
          - string
          - 'null'
          format: uuid
        keyId:
          type: string
          description: Khóa OpenBao transit, ví dụ `dh-runtime-cmd:3`.
        signature:
          type: string
          description: Ed25519 base64url trên JCS (RFC 8785) của toàn bộ trường trừ `signature`.
      required:
      - commandId
      - tenantId
      - environment
      - flowCode
      - action
      - issuedAt
      - expiresAt
      - keyId
      - signature
    Heartbeat:
      type: object
      properties:
        replica:
          type: string
        tenantId:
          type: string
        environment: *id003
        profile:
          type: string
          enum:
          - core-native
          - files-native
          - soap-jvm
          - legacy-jvm
        catalogVersion:
          type: string
        libVersion:
          type: string
        sentAt: *id004
        flows:
          type: array
          items:
            type: object
            properties:
              flowCode:
                type: string
              versionNo: *id002
              contentHash:
                type: string
              loaded: *id005
              loadError:
                type: string
                maxLength: 1000
              localOverride: *id005
              routes:
                type: array
                items:
                  type: object
                  properties:
                    routeId:
                      type: string
                    state:
                      type: string
                      enum:
                      - Started
                      - Suspended
                      - Stopped
                    inflight: *id002
                  required:
                  - routeId
                  - state
            required:
            - flowCode
            - versionNo
            - contentHash
            - loaded
      required:
      - replica
      - tenantId
      - environment
      - sentAt
      - flows
    CommandAck:
      type: object
      properties:
        commandId:
          type: string
          format: uuid
        replica:
          type: string
        tenantId:
          type: string
        environment: *id003
        result:
          type: string
          enum:
          - APPLIED
          - REJECTED
        reason:
          type: string
          enum:
          - BAD_SIGNATURE
          - EXPIRED
          - TENANT_MISMATCH
          - UNKNOWN_FLOW
          - UNKNOWN_ROUTE
          - DUPLICATE
          - INTERNAL
        ackedAt: *id004
      required:
      - commandId
      - replica
      - result
      - ackedAt
    ConnectionLog:
      type: object
      properties:
        tenantId:
          type: string
        flowCode:
          type: string
        versionNo: *id002
        routeId:
          type: string
        environment: *id003
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
        messageId:
          type: string
        sourceSystem:
          type: string
        targetSystem:
          type: string
        consumerClientId:
          type: string
        operation:
          type: string
        httpStatus: *id002
        outcome:
          type: string
          enum:
          - SUCCESS
          - BUSINESS_ERROR
          - TECHNICAL_ERROR
          - REJECTED
        errorCode:
          type: string
          pattern: ^ERR-04-1[0-9]{2}$
        receivedAt: *id004
        respondedAt: *id004
        durationMs: *id002
        requestBytes: *id002
        responseBytes: *id002
        legalBasisRef:
          type: string
        dataSubjectsCount: *id002
        maskedFields:
          type: array
          items:
            type: string
      required:
      - tenantId
      - flowCode
      - traceId
      - outcome
      - receivedAt
