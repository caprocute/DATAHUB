# D03-04-PH04 · AsyncAPI PH-04. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py — không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: 3.0.0
info:
  title: Datahub PH-04 Lõi tích hợp — sự kiện
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-04-01…14 (D03-04-PH04 §4, FRS §8.2).


    EVT-04-01…10 ghi vào outbox `ph04.outbox` trong cùng giao dịch, Debezium đưa lên Kafka, CloudEvents 1.0 chế độ nhị phân (tiêu đề `ce_*`).
    EVT-04-11…13 là topic hệ thống `dh.*`, chỉ `dh-integration` và `dh-runtime` có ACL; EVT-04-11 có chữ ký Ed25519 và hạn 60 giây. EVT-04-14
    do runtime phát, PH-13 sở hữu. Sự kiện không mang định nghĩa luồng hay thân bản tin. Tương thích: chỉ thêm trường tùy chọn trong `v1`; thay
    đổi phá vỡ sang `v2`, phát song song ≥ 6 tháng (Apicurio BACKWARD). Dữ liệu ví dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  license:
    name: Tài liệu nội bộ dự án Datahub
defaultContentType: application/json
servers:
  kafka-cum:
    host: kafka-bootstrap.dh-platform.svc:9093
    protocol: kafka-secure
    description: Kafka (Strimzi) của cụm; mTLS, ACL theo principal.
    security:
    - $ref: '#/components/securitySchemes/mtls'
