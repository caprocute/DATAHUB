  schemas:
    AccessKind:
      type: string
      enum:
      - READ
      - WRITE
      description: Loại truy cập liên tenant.
    AcknowledgeRequest:
      type: object
      description: Xác nhận đã xử lý cảnh báo.
      properties:
        comment:
          type: string
    ActivateRequest:
      type: object
      description: Kích hoạt tenant (FR-20-013).
      properties:
        activateAt:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 20
        ticketRef:
          type: string
    AlertState:
      type: string
      enum:
      - OPEN
      - ACKNOWLEDGED
      - RESOLVED
      description: Trạng thái cảnh báo hạn mức.
    AnnounceRequest:
      type: object
      description: Gửi thông báo phát hành, lịch bảo trì (FR-20-063).
      properties:
        planId:
          type: string
          format: uuid
        audience:
          $ref: '#/components/schemas/Audience'
        message:
          type: string
      required:
      - audience
    AnnounceResult:
      type: object
      description: Kết quả gửi thông báo.
      properties:
        announcementId:
          type: string
          format: uuid
        recipients:
          type: integer
        status:
          type: string
      required:
      - announcementId
      - recipients
      - status
    AppliedTarget:
      type: object
      description: Nơi thực thi đã xác nhận hạn mức.
      properties:
        target:
          type: string
        confirmedAt:
          type: string
          format: date-time
      required:
      - target
      - confirmedAt
    ApplyStatus:
      type: string
      enum:
      - APPLIED
      - PENDING
      - FAILED
      description: Kết quả áp cấu hình xuống nơi thực thi.
    Audience:
      type: string
      enum:
      - TA
      - ALL_USERS
      description: Đối tượng nhận thông báo phát hành.
    AuditEvent:
      type: object
      description: Sự kiện kiểm toán thao tác PH-20.
      properties:
        eventId:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actor:
          type: string
        actorRole:
          type: string
        action:
          type: string
        tenantCode:
          type: string
          pattern: ^T[0-9]{2}$
          description: Mã tenant dạng `T` và hai chữ số.
        objectType:
          type: string
        objectId:
          type: string
        reason:
          type: string
        ticketRef:
          type: string
        result:
          type: string
        traceId:
          type: string
      required:
      - eventId
      - at
      - actor
      - action
    AuditEventPage:
      type: object
      description: Trang `AuditEvent`.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        totalElements:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
    Banner:
      type: object
      description: Dải thông báo trên giao diện.
      properties:
        type:
          $ref: '#/components/schemas/BannerType'
        message:
          type: string
        until:
          type: string
          format: date-time
        link:
          type: string
      required:
      - type
      - message
    BannerType:
      type: string
      enum:
      - INFO
      - WARNING
      - CRITICAL
      description: Loại dải thông báo.
    BatchFailure:
      type: object
      description: Xung đột không quyết định được.
      properties:
        conflictId:
          type: string
          format: uuid
        code:
          type: string
      required:
      - conflictId
      - code
    BatchResolveRequest:
      type: object
      description: Quyết định hàng loạt.
      properties:
        conflictIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 200
        resolution:
          $ref: '#/components/schemas/ConflictResolution'
        newCode:
          type: string
        comment:
          type: string
      required:
      - conflictIds
      - resolution
