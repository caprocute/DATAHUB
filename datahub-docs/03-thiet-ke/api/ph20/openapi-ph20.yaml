components:
  securitySchemes:
    oauth2User:
      type: oauth2
      description: Người dùng đăng nhập OIDC (WebAuthn cho vai trò nền tảng), tenant lấy từ token (claim `tenant`); không nhận mã tenant từ thân yêu cầu.
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-platform/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-platform/protocol/openid-connect/token
          scopes:
            PERM-20-admin: Quyền chức năng PERM-20-admin do Keycloak cấp qua vai trò (D02-08).
            PERM-20-approve: Quyền chức năng PERM-20-approve do Keycloak cấp qua vai trò (D02-08).
            PERM-20-lifecycle: Quyền chức năng PERM-20-lifecycle do Keycloak cấp qua vai trò (D02-08).
            PERM-20-merge: Quyền chức năng PERM-20-merge do Keycloak cấp qua vai trò (D02-08).
            PERM-20-org: Quyền chức năng PERM-20-org do Keycloak cấp qua vai trò (D02-08).
            PERM-20-org-read: Quyền chức năng PERM-20-org-read do Keycloak cấp qua vai trò (D02-08).
            PERM-20-provision: Quyền chức năng PERM-20-provision do Keycloak cấp qua vai trò (D02-08).
            PERM-20-quota: Quyền chức năng PERM-20-quota do Keycloak cấp qua vai trò (D02-08).
            PERM-20-read: Quyền chức năng PERM-20-read do Keycloak cấp qua vai trò (D02-08).
            PERM-20-release: Quyền chức năng PERM-20-release do Keycloak cấp qua vai trò (D02-08).
            PERM-20-settings: Quyền chức năng PERM-20-settings do Keycloak cấp qua vai trò (D02-08).
            PERM-20-usage-read: Quyền chức năng PERM-20-usage-read do Keycloak cấp qua vai trò (D02-08).
    oauth2Service:
      type: oauth2
      description: Tài khoản máy của phân hệ khác (client credentials, mTLS trong mesh, ADR-006).
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-platform/protocol/openid-connect/token
          scopes:
            tenant:registry-read: Đọc registry tenant, cấu hình thực thi, chính sách liên tenant.
            tenant:org-read: Đọc tổ chức của tenant ngữ cảnh.
            tenant:provision-report: Báo tiến độ bước saga, chuyển sáp nhập, xuất gói bàn giao.
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: Ngữ cảnh truy vết W3C.
      schema:
        type: string
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa chống trùng (UUID), giữ 24 giờ; cùng khóa cùng thân trả lại phản hồi cũ, khác thân trả `409` ERR-20-009.
      schema:
        type: string
        format: uuid
      example: 0193c2a0-7000-7000-8000-000000000001
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Giá trị `ETag` đã đọc; lệch trả `412` ERR-20-005, thiếu trả `428` ERR-00-428.
      schema:
        type: string
      example: W/"3"
    AlertId:
      name: alertId
      in: path
      required: true
      description: Mã `alertId`.
      schema:
        type: string
        format: uuid
      example: 0193c2a0-1a2b-7c3d-8e4f-5a6b7c8d9e06
    ClusterCode:
      name: clusterCode
      in: path
      required: true
      description: Mã cụm đích.
      schema:
        type: string
      example: cl-t68-onprem
    ConflictId:
