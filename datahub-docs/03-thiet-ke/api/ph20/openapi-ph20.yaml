# D03-04-PH20 · OpenAPI PH-20 (module tenant và release của dh-platform). SINH TỰ ĐỘNG bởi tools/gen_openapi.py, không sửa tay. Tệp gộp ba nhóm.
openapi: '3.1.0'
info:
  title: Datahub · PH-20 Quản trị tenant và phát hành sản phẩm
  version: 0.1.0-draft
  summary: Hợp đồng REST của PH-20 Quản trị tenant và phát hành sản phẩm (D03-04-PH20).
  description: |-
    Gộp ba nhóm `/api/platform/v1` (134 operation), `/api/tenant/v1` (27) và `/internal/tenant/v1` (10).

    Quy ước (D03-04-PH20 chương 1, 2): tenant lấy từ token, không từ thân hay đường dẫn (trừ API nền tảng nêu `tenantCode` của tenant bị tác động); `POST` nhận `Idempotency-Key`; `PUT`, `PATCH` và hành động trên đối tượng có phiên bản nhận `If-Match`; hậu tố `:{hành-động}`; lỗi RFC 9457 `application/problem+json` mã `ERR-20-nnn`; phân trang `page`, `size`. Mọi tên miền, mã, dữ liệu là giả lập.

    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.
  contact:
    name: Nhóm phân hệ PH-20
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH20
  x-datahub-phase: PH-20
servers:
- url: https://nen-tang.datahub.example.vn
  description: Console nền tảng qua BFF và cổng quản trị (giả lập); chỉ tenant `PLATFORM`.
- url: https://console.{tenantHost}.datahub.example.vn
  description: Console của tỉnh qua BFF (giả lập).
  variables:
    tenantHost:
      default: t68
      description: Ví dụ `t68` (giả lập).
- url: http://dh-platform.dh-control.svc:8080
  description: Trong mesh `dh-control`; mTLS và scope dịch vụ, không qua cổng công khai.
tags:
- name: Hồ sơ tenant
  description: Khai báo, xem, sửa hồ sơ hành chính, kiểm tra sẵn sàng (nhóm A).
- name: Đầu mối và hợp đồng
  description: Đầu mối và hợp đồng dịch vụ của tenant (FR-20-005).
- name: Saga khởi tạo
  description: Chạy, theo dõi, thử lại, bù trừ, kiểm tra khói, kích hoạt (nhóm B).
- name: Mẫu khởi tạo và khởi tạo bổ sung
  description: Mẫu khởi tạo có phiên bản và đợt bổ sung (FR-20-015, 016).
- name: Cụm riêng
  description: Cụm đích `DEDICATED_CLUSTER` (FR-20-017).
- name: Cấu hình tenant
  description: Cấu hình nền tảng, phiên bản GitOps, lệch cấu hình, đổi chế độ cách ly (nhóm C).
- name: Hạn mức và sử dụng
  description: Hạn mức hợp đồng, đề nghị đổi, ghi đè, sử dụng, cảnh báo, báo cáo (nhóm D).
- name: Phân hệ và tính năng
  description: Danh mục phân hệ, bật tắt phân hệ, cờ tính năng (nhóm E).
- name: Vòng đời tenant
  description: Tạm ngừng, khôi phục, chấm dứt, gói bàn giao, lịch sử (nhóm F).
- name: Sáp nhập tenant
  description: Kế hoạch, ánh xạ, chuyển dữ liệu, xung đột, cutover (nhóm G).
- name: Phát hành sản phẩm
  description: Phiên bản, kênh, kế hoạch nâng cấp theo sóng (nhóm I).
- name: Quản trị nền tảng
  description: Bảng điều khiển, kiểm toán, tham số, kiểm thử rò rỉ (nhóm J).
- name: Cài đặt và ngữ cảnh tỉnh
  description: Cài đặt, chính sách liên tenant, sử dụng, ngữ cảnh của tỉnh (`/api/tenant/v1`).
- name: Tổ chức
  description: Danh mục tổ chức của tỉnh (nhóm H).
- name: Phiên bản và kiểm toán của tỉnh
  description: Phiên bản, bảo trì, kiểm toán của tỉnh.
- name: Registry tenant
  description: Registry và cấu hình thực thi cho phân hệ khác (`/internal`).
- name: Báo tiến độ
  description: Phân hệ báo tiến độ bước saga, sáp nhập, xuất gói (`/internal`).
- name: Đọc tổ chức
  description: API đọc tổ chức cho phân hệ khác (`/internal`).
paths:
  /api/platform/v1/tenants:
    get:
      tags:
      - Hồ sơ tenant
      operationId: getTenants001
      summary: Liệt kê, tìm, lọc tenant toàn nền tảng
      description: Chỉ tenant `PLATFORM` gọi được. `format=csv` trả tệp CSV UTF-8 tối đa 1.000 dòng, không chứa dữ liệu cá nhân; mặc định chỉ `kind = PROVINCE` và
        không tính tenant kiểm thử. Khối `facets` đếm theo trạng thái, chế độ cách ly, kênh.
      x-datahub-id: API-20-001
      x-datahub-fr:
      - FR-20-002
      - FR-20-060
      x-datahub-permission:
        permission: PERM-20-read
      security:
      - oauth2User:
        - PERM-20-read
      parameters:
      - name: q
        in: query
        schema:
          type: string
        example: lam vien
      - name: status
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TenantStatus'
        example:
        - ACTIVE
        style: form
        explode: true
      - name: isolationMode
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/IsolationMode'
        example:
        - SHARED
        style: form
        explode: true
      - name: scaleProfile
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ScaleProfile'
        example:
        - QM-VUA
        style: form
        explode: true
      - name: deploymentProfile
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentProfile'
        example:
        - HT-B
        style: form
        explode: true
      - name: channel
        in: query
        schema:
          $ref: '#/components/schemas/ReleaseChannel'
        example: STABLE
      - name: currentVersion
        in: query
        schema:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
          description: Phiên bản theo SemVer.
        example: '2.3.1'
      - name: quotaAlert
        in: query
        schema:
          $ref: '#/components/schemas/QuotaAlertLevel'
        example: WARN_80
      - name: kind
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TenantKind'
        example:
        - PROVINCE
        style: form
        explode: true
      - name: testTenant
        in: query
        schema:
          type: boolean
        example: false
      - name: sort
        in: query
        schema:
          type: string
        example: code
      - name: format
        in: query
        schema:
          $ref: '#/components/schemas/ListFormat'
        example: json
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        example: 20
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPage'
              example:
                items:
                - tenantCode: T68
                  name: Tỉnh Lâm Viên (giả định)
                  kind: PROVINCE
                  status: ACTIVE
                  isolationMode: SHARED
                  scaleProfile: QM-VUA
                  deploymentProfile: HT-B
                  currentVersion: '2.3.1'
                  channel: STABLE
                  lastRun:
                    runId: 0193c2a0-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    status: SUCCEEDED
                    failedStep: S06_EVENTING
                  openAlerts: 0
                  activatedAt: '2026-11-21T10:00:00+07:00'
                page: 0
                size: 20
                totalElements: 1
                facets:
                  byStatus:
                    ACTIVE: 31
                    PROVISIONING: 1
                    SUSPENDED: 1
                  byIsolationMode:
                    SHARED: 30
                    DEDICATED_DB: 3
                  byChannel:
                    STABLE: 30
                    PREVIEW: 3
            text/csv:
              schema:
                type: string
              example: |
                tenantCode,name,status
                T68,Tỉnh Lâm Viên (giả định),ACTIVE
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-datahub-errors:
      - ERR-20-004
    post:
      tags:
      - Hồ sơ tenant
      operationId: postTenants002
      summary: Khai báo tenant mới ở `PROVISIONING` (chưa chạy saga)
      description: Chỉ ghi hồ sơ ở `PROVISIONING`, chưa chạy saga và chưa tạo tài nguyên ở hệ khác. Mã theo mẫu `^T[0-9]{2}$`, dải `T90…T99` dành cho tenant kiểm
        thử (`testTenant = true`). Có `Idempotency-Key`; phản hồi kèm `Location` và `ETag`.
      x-datahub-id: API-20-002
      x-datahub-fr:
      - FR-20-001
      x-datahub-permission:
        permission: PERM-20-provision
      security:
      - oauth2User:
        - PERM-20-provision
      x-datahub-idempotent: required
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
            example:
              tenantCode: T68
              name: Tỉnh Lâm Viên (giả định)
              adminUnitId: 0193a000-1111-7000-8000-000000000068
              isolationMode: SHARED
              scaleProfile: QM-VUA
              deploymentProfile: HT-B
              clusterCode: cl-t68-onprem
              templateCode: tinh-chuan
              templateVersion: 3
              modulesExcluded:
              - PH-17
              contacts:
              - role: TENANT_ADMIN
                fullName: Nguyễn Thị Lan
                position: Giám đốc Sở Khoa học và Công nghệ
                officialEmail: nguyen.thi.lan@t68.example.vn
                phone: '0912345678'
                orgCode: SO-KHCN
              - role: TECHNICAL
                fullName: Trần Văn Nam
                position: Chuyên viên công nghệ thông tin
                officialEmail: tran.van.nam@t68.example.vn
                phone: '0987654321'
                orgCode: SO-KHCN
              contractRef: HĐ-15/2026/DH
              testTenant: false
              note: Tỉnh thí điểm đợt 2.
      responses:
        '201':
          description: Đã tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
              example:
                tenantCode: T68
                name: Tỉnh Lâm Viên (giả định)
                shortName: Tỉnh Lâm Viên
                kind: PROVINCE
                status: PROVISIONING
                isolationMode: SHARED
                scaleProfile: QM-VUA
                deploymentProfile: HT-B
                adminUnitId: 0193a000-1111-7000-8000-000000000068
                realm: dh-t68
                templateCode: tinh-chuan
                templateVersion: 3
                testTenant: false
                declaredAt: '2026-11-20T08:00:00+07:00'
                note: Tỉnh thí điểm đợt 2.
                readiness:
                  ready: true
                  checkedAt: '2026-11-27T09:15:00+07:00'
                  items:
                  - checkCode: CODE_UNIQUE
                    result: PASS
                    message: Mã T68 chưa dùng.
                  - checkCode: CAPACITY
                    result: PASS
                    message: Sức chứa nền tảng còn 7 tenant.
                createdAt: '2026-11-27T09:15:00+07:00'
                createdBy: nguyen.thi.lan
                updatedAt: '2026-11-27T09:15:00+07:00'
                updatedBy: nguyen.thi.lan
          headers:
            ETag:
              description: Phiên bản của đối tượng để dùng cho `If-Match`.
              schema:
                type: string
              example: W/"3"
            Location:
              description: Đường dẫn của đối tượng vừa tạo.
              schema:
                type: string
              example: /api/platform/v1/tenants/T68
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-datahub-errors:
      - ERR-20-003
      - ERR-20-004
      - ERR-20-009
      - ERR-20-011
      - ERR-20-012
      - ERR-20-015
      - ERR-20-017
      - ERR-20-021
      - ERR-20-062
      - ERR-20-064
