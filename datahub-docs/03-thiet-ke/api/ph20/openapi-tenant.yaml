      type: oauth2
      description: Người dùng đăng nhập OIDC (WebAuthn cho vai trò nền tảng), tenant lấy từ token (claim `tenant`); không nhận mã tenant từ thân yêu cầu.
      flows:
        authorizationCode:
          authorizationUrl: https://sso.datahub.example.vn/realms/dh-platform/protocol/openid-connect/auth
          tokenUrl: https://sso.datahub.example.vn/realms/dh-platform/protocol/openid-connect/token
          scopes:
            PERM-20-org: Quyền chức năng PERM-20-org do Keycloak cấp qua vai trò (D02-08).
            PERM-20-org-read: Quyền chức năng PERM-20-org-read do Keycloak cấp qua vai trò (D02-08).
            PERM-20-settings: Quyền chức năng PERM-20-settings do Keycloak cấp qua vai trò (D02-08).
            PERM-20-usage-read: Quyền chức năng PERM-20-usage-read do Keycloak cấp qua vai trò (D02-08).
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: Ngữ cảnh truy vết W3C.
      schema:
        type: string
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa chống trùng (UUID), giữ 24 giờ; cùng khóa cùng thân trả lại phản hồi cũ, khác thân trả `409` ERR-20-009.
      schema:
        type: string
        format: uuid
      example: 0193c2a0-7000-7000-8000-000000000001
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Giá trị `ETag` đã đọc; lệch trả `412` ERR-20-005, thiếu trả `428` ERR-00-428.
      schema:
        type: string
      example: W/"3"
    ImportId:
      name: importId
      in: path
      required: true
      description: Mã `importId`.
      schema:
        type: string
        format: uuid
      example: 0193c2a0-1a2b-7c3d-8e4f-5a6b7c8d9e0d
    OrgCode:
      name: orgCode
      in: path
      required: true
      description: Mã tổ chức trong tenant.
      schema:
        type: string
        pattern: ^[A-Z0-9][A-Z0-9-]{1,49}$
      example: SO-KHCN
    ProposalId:
      name: proposalId
      in: path
      required: true
      description: Mã `proposalId`.
      schema:
        type: string
        format: uuid
      example: 0193c2a0-1a2b-7c3d-8e4f-5a6b7c8d9e0e
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://datahub.example.vn/errors/ERR-20-004
            title: Dữ liệu sai định dạng
            status: 400
            code: ERR-20-004
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detail: Dữ liệu sai định dạng.
            instance: /api/platform/v1/tenants/T68
    Unauthorized:
      description: Chưa xác thực
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://datahub.example.vn/errors/ERR-00-401
            title: Chưa xác thực
            status: 401
            code: ERR-00-401
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detail: Chưa xác thực.
            instance: /api/platform/v1/tenants/T68
    Forbidden:
      description: Không đủ quyền hoặc bị chặn
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://datahub.example.vn/errors/ERR-00-403
            title: Không đủ quyền
            status: 403
            code: ERR-00-403
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detail: Không đủ quyền.
            instance: /api/platform/v1/tenants/T68
    NotFound:
      description: Không tìm thấy (kể cả đối tượng của tenant khác)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://datahub.example.vn/errors/ERR-20-002
            title: Không tìm thấy
            status: 404
            code: ERR-20-002
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detail: Không tìm thấy.
            instance: /api/platform/v1/tenants/T68
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://datahub.example.vn/errors/ERR-20-006
            title: Trạng thái không cho phép
            status: 409
            code: ERR-20-006
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detail: Trạng thái không cho phép.
            instance: /api/platform/v1/tenants/T68
    PreconditionFailed:
      description: Phiên bản lệch (`If-Match`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://datahub.example.vn/errors/ERR-20-005
            title: Phiên bản lệch
            status: 412
            code: ERR-20-005
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detail: Phiên bản lệch.
            instance: /api/platform/v1/tenants/T68
    Unprocessable:
      description: Không xử lý được do quy tắc nghiệp vụ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://datahub.example.vn/errors/ERR-20-008
            title: Thiếu lý do, phiếu
            status: 422
            code: ERR-20-008
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detail: Thiếu lý do, phiếu.
            instance: /api/platform/v1/tenants/T68
    PreconditionRequired:
      description: Thiếu `If-Match`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://datahub.example.vn/errors/ERR-00-428
            title: Thiếu If-Match
            status: 428
            code: ERR-00-428
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detail: Thiếu If-Match.
            instance: /api/platform/v1/tenants/T68
    ServiceUnavailable:
      description: Phụ thuộc không khả dụng
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://datahub.example.vn/errors/ERR-20-062
            title: Phụ thuộc không khả dụng
            status: 503
            code: ERR-20-062
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detail: Phụ thuộc không khả dụng.
            instance: /api/platform/v1/tenants/T68
  schemas:
