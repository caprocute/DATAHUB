# D03-04-PH20 · OpenAPI PH-20 (module tenant và release của dh-platform). SINH TỰ ĐỘNG bởi tools/gen_openapi.py, không sửa tay.
openapi: '3.1.0'
info:
  title: Datahub · PH-20 API nội bộ
  version: 0.1.0-draft
  summary: Hợp đồng REST của PH-20 Quản trị tenant và phát hành sản phẩm (D03-04-PH20).
  description: |-
    Nhóm `/internal/tenant/v1`: registry, tổ chức, báo tiến độ cho phân hệ khác; chỉ trong mesh, scope dịch vụ.

    Quy ước (D03-04-PH20 chương 1, 2): tenant lấy từ token, không từ thân hay đường dẫn (trừ API nền tảng nêu `tenantCode` của tenant bị tác động); `POST` nhận `Idempotency-Key`; `PUT`, `PATCH` và hành động trên đối tượng có phiên bản nhận `If-Match`; hậu tố `:{hành-động}`; lỗi RFC 9457 `application/problem+json` mã `ERR-20-nnn`; phân trang `page`, `size`. Mọi tên miền, mã, dữ liệu là giả lập.

    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.
  contact:
    name: Nhóm phân hệ PH-20
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH20
  x-datahub-phase: PH-20
servers:
- url: http://dh-platform.dh-control.svc:8080
  description: Trong mesh `dh-control`; mTLS và scope dịch vụ, không qua cổng công khai.
tags:
- name: Registry tenant
  description: Registry và cấu hình thực thi cho phân hệ khác (`/internal`).
- name: Báo tiến độ
  description: Phân hệ báo tiến độ bước saga, sáp nhập, xuất gói (`/internal`).
- name: Đọc tổ chức
  description: API đọc tổ chức cho phân hệ khác (`/internal`).
paths:
  /internal/tenant/v1/tenants:
    get:
      tags:
      - Registry tenant
      operationId: getTenants162
      summary: Registry tenant (`?status=ACTIVE` cho tác vụ nền)
      description: Registry cho phân hệ khác; `?status=ACTIVE` cho tác vụ nền. Kết quả được đệm tối đa `20.registry.cache-seconds` giây.
      x-datahub-id: API-20-162
      x-datahub-fr:
      - FR-20-065
      x-datahub-permission:
        permission: Scope tenant:registry-read
      security:
      - oauth2Service:
        - tenant:registry-read
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/TenantStatus'
        example: ACTIVE
      - name: isolationMode
        in: query
        schema:
          $ref: '#/components/schemas/IsolationMode'
        example: SHARED
      - name: module
        in: query
        schema:
          type: string
          pattern: ^PH-[0-9]{2}$
          description: Mã phân hệ dạng `PH-nn`.
        example: PH-01
      - name: updatedSince
        in: query
        schema:
          type: string
          format: date-time
        example: '2026-11-01T00:00:00+07:00'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
        example: 20
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryPage'
              example:
                items:
                - tenantCode: T68
                  tenantId: 0193a000-1111-7000-8000-000000000001
                  status: ACTIVE
                  kind: PROVINCE
                  isolationMode: SHARED
                  realm: dh-t68
                  hosts:
                  - api.t68.datahub.example.vn
                  apiPrefix: /t68
                  modules:
                  - moduleCode: PH-01
                    state: ENABLED
                  configVersion: 8
                  updatedAt: '2026-11-27T09:15:00+07:00'
                page: 0
                size: 20
                totalElements: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-datahub-errors:
      - ERR-20-002
      - ERR-20-004
      - ERR-20-104
  /internal/tenant/v1/tenants/{tenantCode}:
    get:
      tags:
      - Registry tenant
      operationId: getTenants163
      summary: Bản ghi registry của một tenant kèm phân hệ đang bật
      description: Bản ghi registry của một tenant kèm phân hệ đang bật; tenant không tồn tại trả `404`.
      x-datahub-id: API-20-163
      x-datahub-fr:
      - FR-20-037
      - FR-20-065
      - FR-20-066
      x-datahub-permission:
        permission: Scope tenant:registry-read
      security:
      - oauth2Service:
        - tenant:registry-read
      parameters:
      - $ref: '#/components/parameters/TenantCode'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryTenant'
              example:
                tenantCode: T68
                tenantId: 0193a000-1111-7000-8000-000000000001
                status: ACTIVE
                kind: PROVINCE
                isolationMode: SHARED
                realm: dh-t68
                hosts:
                - api.t68.datahub.example.vn
                apiPrefix: /t68
                modules:
                - moduleCode: PH-01
                  state: ENABLED
                configVersion: 8
                updatedAt: '2026-11-27T09:15:00+07:00'
        '401':
