        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-datahub-errors:
      - ERR-20-002
      - ERR-20-104
  /internal/tenant/v1/tenants/{tenantCode}/cross-tenant-policy:
    get:
      tags:
      - Registry tenant
      operationId: getTenantsCrossTenantPolicy165
      summary: Chính sách tiếp nhận cho PH-12
      description: Chính sách tiếp nhận liên tenant cho PH-12 khi cấp truy cập liên tenant.
      x-datahub-id: API-20-165
      x-datahub-fr:
      - FR-20-023
