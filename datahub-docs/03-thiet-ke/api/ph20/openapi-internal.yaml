                createdBy: nguyen.thi.lan
                updatedAt: '2026-11-27T09:15:00+07:00'
                updatedBy: nguyen.thi.lan
          headers:
            ETag:
              description: Phiên bản của đối tượng để dùng cho `If-Match`.
              schema:
                type: string
