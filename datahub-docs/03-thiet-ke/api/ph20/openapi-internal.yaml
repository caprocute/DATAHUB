  /internal/tenant/v1/provisioning-runs/{runId}/steps/{stepCode}:report:
    post:
      tags:
      - Báo tiến độ
      operationId: postProvisioningRunsStepsReport166
      summary: Phân hệ báo tiến độ bước saga bất đồng bộ
      description: Phân hệ báo kết quả bước bất đồng bộ của saga (`S06`, `S09`, `S10`, `S12`, `S15`). Chỉ bên thực hiện của bước mới báo được (ERR-20-104); sai bước
        hoặc trạng thái trả ERR-20-105. Báo lặp cùng kết quả vẫn trả `200`.
      x-datahub-id: API-20-166
      x-datahub-fr:
      - FR-20-008
      x-datahub-permission:
        permission: Scope tenant:provision-report
      security:
      - oauth2Service:
        - tenant:provision-report
      x-datahub-idempotent: required
      parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/StepCode'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepReport'
            example:
              status: SUCCEEDED
              attempt: 1
              outputRef: kv/dh/t68/eventing
              detail:
                topicsCreated: 12
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportAck'
              example:
                accepted: true
                stepStatus: SUCCEEDED
                runStatus: RUNNING
                message: Đã ghi tiến độ.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-datahub-errors:
      - ERR-20-002
      - ERR-20-004
      - ERR-20-104
      - ERR-20-105
