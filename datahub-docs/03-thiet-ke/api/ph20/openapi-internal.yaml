components:
  securitySchemes:
    oauth2Service:
      type: oauth2
      description: Tài khoản máy của phân hệ khác (client credentials, mTLS trong mesh, ADR-006).
      flows:
        clientCredentials:
          tokenUrl: https://sso.datahub.example.vn/realms/dh-platform/protocol/openid-connect/token
          scopes:
            tenant:registry-read: Đọc registry tenant, cấu hình thực thi, chính sách liên tenant.
            tenant:org-read: Đọc tổ chức của tenant ngữ cảnh.
            tenant:provision-report: Báo tiến độ bước saga, chuyển sáp nhập, xuất gói bàn giao.
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: Ngữ cảnh truy vết W3C.
      schema:
        type: string
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa chống trùng (UUID), giữ 24 giờ; cùng khóa cùng thân trả lại phản hồi cũ, khác thân trả `409` ERR-20-009.
      schema:
        type: string
        format: uuid
      example: 0193c2a0-7000-7000-8000-000000000001
    MergePlanId:
      name: mergePlanId
      in: path
      required: true
      description: Mã kế hoạch sáp nhập, ví dụ `SN-2026-001`.
      schema:
        type: string
      example: SN-2026-001
    Module:
      name: module
      in: path
      required: true
      description: Mã phân hệ `PH-nn`.
      schema:
        type: string
        pattern: ^PH-[0-9]{2}$
        description: Mã phân hệ dạng `PH-nn`.
      example: PH-01
    OrgCode:
      name: orgCode
      in: path
      required: true
      description: Mã tổ chức trong tenant.
      schema:
        type: string
        pattern: ^[A-Z0-9][A-Z0-9-]{1,49}$
      example: SO-KHCN
    PackageId:
      name: packageId
      in: path
      required: true
      description: Mã `packageId`.
      schema:
        type: string
        format: uuid
      example: 0193c2a0-1a2b-7c3d-8e4f-5a6b7c8d9e03
    RunId:
      name: runId
      in: path
      required: true
      description: Mã lần chạy saga.
      schema:
        type: string
        format: uuid
      example: 0193c2a0-1a2b-7c3d-8e4f-5a6b7c8d9e01
    StepCode:
      name: stepCode
      in: path
      required: true
      description: Mã bước saga `S01_RECORD` … `S17_ACTIVATE`.
      schema:
        $ref: '#/components/schemas/StepCode'
      example: S06_EVENTING
    TenantCode:
      name: tenantCode
      in: path
      required: true
      description: Mã tenant, ví dụ `T68`.
      schema:
        type: string
        pattern: ^T[0-9]{2}$
        description: Mã tenant dạng `T` và hai chữ số.
      example: T68
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://datahub.example.vn/errors/ERR-20-004
            title: Dữ liệu sai định dạng
            status: 400
            code: ERR-20-004
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detail: Dữ liệu sai định dạng.
            instance: /api/platform/v1/tenants/T68
    Unauthorized:
      description: Chưa xác thực
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://datahub.example.vn/errors/ERR-00-401
            title: Chưa xác thực
            status: 401
            code: ERR-00-401
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detail: Chưa xác thực.
            instance: /api/platform/v1/tenants/T68
    Forbidden:
      description: Không đủ quyền hoặc bị chặn
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://datahub.example.vn/errors/ERR-00-403
            title: Không đủ quyền
            status: 403
            code: ERR-00-403
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detail: Không đủ quyền.
            instance: /api/platform/v1/tenants/T68
    NotFound:
      description: Không tìm thấy (kể cả đối tượng của tenant khác)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://datahub.example.vn/errors/ERR-20-002
            title: Không tìm thấy
            status: 404
            code: ERR-20-002
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detail: Không tìm thấy.
            instance: /api/platform/v1/tenants/T68
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://datahub.example.vn/errors/ERR-20-006
            title: Trạng thái không cho phép
            status: 409
            code: ERR-20-006
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detail: Trạng thái không cho phép.
            instance: /api/platform/v1/tenants/T68
  schemas:
    CrossTenantPolicy:
      type: object
      description: Chính sách tiếp nhận truy cập liên tenant (EN-20-29).
      properties:
        allowRead:
          type: boolean
        allowWrite:
          type: boolean
        requirePriorApproval:
          type: boolean
        maxHours:
          type: integer
          minimum: 1
          maximum: 4
        notifyContacts:
          type: array
          items:
            type: string
            format: email
        blockedReasons:
          type: array
          items:
            type: string
        effectiveFrom:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
      required:
      - allowRead
      - allowWrite
      - requirePriorApproval
      - maxHours
    EnforcementConfig:
      type: object
      description: Cấu hình thực thi cho PH-03, PH-04, PH-10 (FR-20-066).
      properties:
        tenantCode:
          type: string
          pattern: ^T[0-9]{2}$
          description: Mã tenant dạng `T` và hai chữ số.
        status:
          $ref: '#/components/schemas/TenantStatus'
        hosts:
          type: array
          items:
            type: string
        apiPrefix:
          type: string
        quotas:
          type: array
          items:
            $ref: '#/components/schemas/QuotaEnforcement'
        redirects:
          type: array
          items:
            $ref: '#/components/schemas/MergeRedirect'
        configVersion:
          type: integer
        essentialApisAllowed:
          type: boolean
      required:
      - tenantCode
      - status
      - hosts
      - quotas
      - configVersion
    ExportItemReport:
      type: object
      description: Phân hệ báo đã xuất phần dữ liệu của mình (FR-20-041).
      properties:
        status:
          $ref: '#/components/schemas/ExportItemStatus'
        itemType:
          type: string
        rowCount:
          type: integer
        sizeBytes:
          type: integer
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        fileId:
          type: string
          format: uuid
        errorMessage:
          type: string
      required:
      - status
    ExportItemStatus:
      type: string
      enum:
      - DONE
      - PENDING
      - COLLECTING
      - FAILED
      description: Trạng thái phần dữ liệu của một phân hệ trong gói.
    FieldError:
      type: object
      description: Lỗi theo trường.
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
      required:
      - field
      - message
    IsolationMode:
      type: string
      enum:
      - SHARED
      - DEDICATED_DB
      - DEDICATED_CLUSTER
      description: Chế độ cách ly.
    MergeRedirect:
      type: object
      description: Ánh xạ chuyển tiếp khi tenant nguồn `MERGED`.
      properties:
        fromPrefix:
          type: string
        toTenant:
          type: string
          pattern: ^T[0-9]{2}$
          description: Mã tenant dạng `T` và hai chữ số.
        toPrefix:
          type: string
        sunsetAt:
          type: string
          format: date-time
      required:
      - fromPrefix
      - toTenant
      - toPrefix
    ModuleState:
      type: string
      enum:
      - ENABLED
      - DISABLED
      - ENABLING
      - DISABLING
      - SUSPENDED
      - FAILED
      description: Trạng thái phân hệ theo tenant.
    OrgLookupRequest:
      type: object
      description: Tra hàng loạt tổ chức (FR-20-057, 058).
      properties:
        codes:
          type: array
          items:
            type: string
            pattern: ^[A-Z0-9][A-Z0-9-]{1,49}$
          minItems: 1
          maxItems: 500
        asOf:
          type: string
          format: date
      required:
      - codes
    OrgLookupResult:
      type: object
      description: Kết quả tra hàng loạt.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationRef'
        notFound:
          type: array
          items:
            type: string
            pattern: ^[A-Z0-9][A-Z0-9-]{1,49}$
      required:
      - items
      - notFound
    OrgStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - DISSOLVED
      - MERGED
      description: Trạng thái tổ chức.
    OrgType:
      type: string
      enum:
      - DEPARTMENT
      - PROVINCE_PC
      - COMMUNE_PC
      - PUBLIC_UNIT
      - OTHER
      description: Loại tổ chức (DD-02).
    OrganizationRef:
      type: object
      description: Tổ chức cho phân hệ đọc (FR-20-057), có tổ chức kế thừa đã giải.
      properties:
        orgCode:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,49}$
        name:
          type: string
        orgType:
          $ref: '#/components/schemas/OrgType'
        parentCode:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,49}$
        adminUnitId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrgStatus'
        isDataOwner:
          type: boolean
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        successorCode:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,49}$
        resolvedSuccessor:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,49}$
      required:
      - orgCode
      - name
      - orgType
      - status
      - isDataOwner
    OrganizationRefPage:
      type: object
      description: Trang `OrganizationRef`.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationRef'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        totalElements:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
    ParticipantPhase:
      type: string
      enum:
      - TRANSFER
      - DRY_RUN
      - IDENTITY
      - CUTOVER
      - VERIFY
      description: Pha chuyển dữ liệu của một phân hệ.
    ParticipantReport:
      type: object
      description: Phân hệ hoặc PH-18 báo tiến độ chuyển sáp nhập (FR-20-048).
      properties:
        phase:
          $ref: '#/components/schemas/ParticipantPhase'
        status:
          $ref: '#/components/schemas/ParticipantStatus'
        exportedCount:
          type: integer
        importedCount:
          type: integer
        verifiedCount:
          type: integer
        conflictCount:
          type: integer
        transferRef:
          type: string
        errorCode:
          type: string
          pattern: ^[A-Za-z0-9-]{3,32}$
        errorMessage:
          type: string
      required:
      - phase
      - status
    ParticipantStatus:
      type: string
      enum:
      - SUCCEEDED
      - PENDING
      - RUNNING
      - FAILED
      - SKIPPED
      description: Trạng thái lần chuyển của một phân hệ.
    Problem:
      type: object
      description: Thân lỗi RFC 9457 (`application/problem+json`).
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: ^ERR-(00|20)-[0-9]{3}$
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - type
      - title
      - status
      - code
      - traceId
    QuotaEnforcement:
      type: object
      description: Hạn mức hiệu lực để thực thi.
      properties:
        resource:
          $ref: '#/components/schemas/QuotaResource'
        effectiveValue:
          type: number
        unit:
          type: string
      required:
      - resource
      - effectiveValue
    QuotaResource:
      type: string
      enum:
      - API_RPS
      - ACTIVE_FLOWS
      - KAFKA_PRODUCE_MBPS
      - KAFKA_CONSUME_MBPS
      - OBJECT_STORAGE_GB
      - DATABASE_GB
      - USERS
      - MEMBER_SYSTEMS
      - PUBLISHED_APIS
      - TOPICS
      - RUNTIME_CPU
      - RUNTIME_MEMORY_GB
      description: Tài nguyên có hạn mức.
    RegistryModule:
      type: object
      description: Phân hệ đang bật của tenant trong registry.
      properties:
        moduleCode:
          type: string
          pattern: ^PH-[0-9]{2}$
          description: Mã phân hệ dạng `PH-nn`.
        state:
          $ref: '#/components/schemas/ModuleState'
      required:
      - moduleCode
      - state
    RegistryPage:
      type: object
      description: Trang `RegistryTenant`.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegistryTenant'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        totalElements:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
    RegistryTenant:
      type: object
      description: Bản ghi registry tenant (FR-20-065).
      properties:
        tenantCode:
          type: string
          pattern: ^T[0-9]{2}$
          description: Mã tenant dạng `T` và hai chữ số.
        tenantId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TenantStatus'
        kind:
          $ref: '#/components/schemas/TenantKind'
        isolationMode:
          $ref: '#/components/schemas/IsolationMode'
        realm:
          type: string
        hosts:
          type: array
          items:
            type: string
        apiPrefix:
          type: string
        modules:
          type: array
          items:
            $ref: '#/components/schemas/RegistryModule'
        configVersion:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required:
      - tenantCode
      - tenantId
      - status
      - isolationMode
      - realm
      - hosts
    ReportAck:
      type: object
      description: Xác nhận đã nhận báo cáo tiến độ.
      properties:
        accepted:
          type: boolean
        stepStatus:
          type: string
        runStatus:
          type: string
        message:
          type: string
      required:
      - accepted
    StepCode:
      type: string
      enum:
      - S01_RECORD
      - S02_CONFIG_REPO
      - S03_REALM
      - S04_SECRETS
      - S05_BUCKETS
      - S06_EVENTING
      - S07_DATABASE
      - S08_OBSERVABILITY
      - S09_GATEWAY
      - S10_INTEGRATION
      - S11_SEED_RDM
      - S12_SEED_MDM
      - S13_ORG_SEED
      - S14_KPI
      - S15_MODULES
      - S16_SMOKE
      - S17_ACTIVATE
      description: Mã bước saga khởi tạo.
    StepReport:
      type: object
      description: Phân hệ báo kết quả bước saga bất đồng bộ (FR-20-008).
      properties:
        status:
          $ref: '#/components/schemas/StepReportStatus'
        attempt:
          type: integer
        errorCode:
          type: string
          pattern: ^[A-Za-z0-9-]{3,32}$
        errorMessage:
          type: string
        outputRef:
          type: string
        detail:
          type: object
          additionalProperties: true
      required:
      - status
    StepReportStatus:
      type: string
      enum:
      - SUCCEEDED
      - FAILED
      description: Kết quả bên thực hiện báo cho bước bất đồng bộ.
    TenantKind:
      type: string
      enum:
      - PROVINCE
      - PLATFORM
      - COMMON
      description: Loại tenant.
    TenantStatus:
      type: string
      enum:
      - ACTIVE
      - PROVISIONING
      - SUSPENDED
      - MERGING
      - MERGED
      - DECOMMISSIONED
      - FAILED
      description: Trạng thái tenant (DD-01).
security:
- oauth2Service: []
