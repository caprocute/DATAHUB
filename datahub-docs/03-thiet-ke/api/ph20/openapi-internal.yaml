        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-datahub-errors:
      - ERR-20-002
      - ERR-20-104
  /internal/tenant/v1/tenants/{tenantCode}/enforcement:
