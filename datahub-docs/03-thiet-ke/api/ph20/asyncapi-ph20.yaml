# D03-04-PH20 · AsyncAPI PH-20. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py, không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: '3.0.0'
info:
  title: 'Datahub PH-20 Quản trị tenant và phát hành sản phẩm: sự kiện'
  version: 0.2.0-draft
  description: 'Hợp đồng sự kiện EVT-20-01…16 phát ra và 6 sự kiện tiêu thụ (D03-04-PH20 chương 5, FRS 9.3). Ghi vào `ph20_tenant.outbox` cùng giao dịch nghiệp vụ,
    Debezium đưa lên Kafka; CloudEvents 1.0 chế độ nhị phân, tiêu đề `ce_*` và thuộc tính mở rộng `dhtenant` (`ce_dhtenant`). Sự kiện vòng đời tenant và phát hành
    đi trên tiền tố nền tảng `platform.` vì tenant mới chưa có tiền tố Kafka riêng; sự kiện tổ chức đi trên `{tenant}.tenant.org.changed.v1`. Khóa phân vùng là mã
    đối tượng. Không sự kiện nào mang dữ liệu cá nhân (BR-20-039). Lưu giữ 7 ngày, ít nhất một lần, bên nhận khử trùng theo `ce_id`. Tương thích BACKWARD: chỉ thêm
    trường tùy chọn trong `v1`. Dữ liệu ví dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  contact:
    name: Nhóm phân hệ PH-20
  tags:
  - name: tenant
  - name: release
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
defaultContentType: application/json
servers:
  kafka-internal:
    host: dh-kafka-kafka-bootstrap.dh-kafka.svc:9093
    protocol: kafka-secure
    description: 'Listener `internal`: DU, `dh-runtime`, Kafka Connect; mTLS, ACL theo tiền tố tenant và tiền tố `platform.`.'
    security:
    - $ref: '#/components/securitySchemes/mtls'
