              example:
                items:
                - indicatorCode: httt-ket-noi-ty-le
                  name: Tỷ lệ HTTT kết nối nền tảng
                  description: Số HTTT đã kết nối trên tổng số HTTT cần kết nối
                  groupCode: KET_NOI
                  kind: RATIO
                  direction: HIGHER_BETTER
                  measurement: AUTO
                  unit: '%'
                  aggregation: LAST
                  mandatory: true
                  scope: TENANT
                  state: ACTIVE
                  activeVersion: 2
                  pendingVersion: 3
                  derivedFrom:
                    indicatorCode: httt-ket-noi-ty-le
                    version: 2
                  confirmerRoles:
                  - SO
                  brdRef: KPI-01
                  replacedBy: httt-ket-noi-ty-le-v2
                  activeDefinition:
                    indicatorCode: httt-ket-noi-ty-le
                    version: 3
                    state: DRAFT
                    formula: obs("ph01.httt.connected") / obs("ph01.httt.total") * 100
                    variables:
                    - alias: tong
                      metricCode: ph01.httt.total
                    dryRunHash: d41d8cd98f00b204
                    direction: HIGHER_BETTER
                    unit: '%'
                    target:
                      baseline: 40
                      target: 90
                      targetDate: '2027-12-31'
                      targetMode: ABSOLUTE
                    thresholds:
                      greenFrom: 90
                      amberFrom: 70
                      range:
                        low: 0
                        high: 0
                        tolerance: 0
                    decimals: 1
                    effectiveFrom: '2026-12-01'
                    changeNote: Nâng mục tiêu năm 2027 lên 90%.
                    submittedBy: nguyen.thi.lan
                    submittedAt: '2026-11-26T08:00:00+07:00'
                    approvedBy: tran.van.nam
                    approvedAt: '2026-11-26T08:00:00+07:00'
                    decisionComment: Đồng ý theo biên bản họp ngày 20/11/2026.
                    diff:
                    - field: target.target
                      from: '85'
                      to: '90'
                    createdAt: '2026-11-26T08:00:00+07:00'
                    createdBy: nguyen.thi.lan
                    updatedAt: '2026-11-26T08:00:00+07:00'
                    updatedBy: nguyen.thi.lan
                  createdAt: '2026-11-26T08:00:00+07:00'
                  createdBy: nguyen.thi.lan
