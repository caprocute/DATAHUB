# D03-04-PH16 · OpenAPI PH-16 (module kpi, arch của dh-platform). SINH TỰ ĐỘNG bởi tools/gen_openapi.py, không sửa tay.
openapi: '3.1.0'
info:
  title: Datahub · PH-16 Báo cáo chỉ tiêu và sổ kiến trúc API
  version: 1.0.0-draft
  summary: Bộ chỉ tiêu, nguồn số liệu, số liệu nhập tay, kỳ và lần tổng hợp, mẫu và báo cáo, xuất và phân phối, bảng điều khiển, sổ kiến trúc, tuân thủ, gửi quốc
    gia, quản trị.
  description: 'Module `kpi` và `arch` của `dh-platform` (control plane), gốc `/api/kpi/v1` (người dùng qua BFF; PH-17, cổng tỉnh, HTTT, phân hệ nguồn, PH-14 bằng
    tài khoản máy; `/internal` chỉ trong mạng nội bộ).


    Quy ước (D03-04-PH16 mục 1): tenant lấy từ phiên hoặc thông tin xác thực máy; tạo nhận `Idempotency-Key`; sửa và hành động có `If-Match`; hậu tố `:{hành-động}`;
    lỗi RFC 9457 mã `ERR-16-nnn`; phân trang `page`, `size`. Mọi tên miền, dữ liệu là giả lập.


    Tệp sinh bởi `tools/gen_openapi.py`; không sửa tay.'
  contact:
    name: Nhóm phân hệ PH-16
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
    identifier: LicenseRef-Datahub-Internal
  x-datahub-document: D03-04-PH16
  x-datahub-phase: PH-16
servers:
- url: https://console.{tenantHost}.datahub.example.vn/api/kpi/v1
  description: Qua BFF console của tenant (giả lập)
  variables:
    tenantHost:
      default: t68
      description: Ví dụ `t68` (giả lập).
- url: https://api.{tenantHost}.datahub.example.vn/api/kpi/v1
  description: Cổng API cho PH-17, cổng tỉnh, HTTT, phân hệ nguồn (tài khoản máy)
  variables:
    tenantHost:
      default: t68
- url: http://dh-platform.dh-platform.svc:8080/api/kpi/v1
  description: Trong cụm; chỉ nơi này có `/internal`
