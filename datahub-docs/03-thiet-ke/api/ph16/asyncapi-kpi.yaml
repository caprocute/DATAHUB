# D03-04-PH16 · AsyncAPI PH-16. SINH TỰ ĐỘNG bởi tools/gen_asyncapi.py, không sửa tay. Dữ liệu ví dụ là giả lập.
asyncapi: '3.0.0'
info:
  title: 'Datahub PH-16 Báo cáo chỉ tiêu và sổ kiến trúc: sự kiện'
  version: 1.0.0-draft
  description: 'Hợp đồng sự kiện EVT-16-01…13 phát ra và 18 sự kiện tiêu thụ của PH-01, 02, 04, 05, 07, 08, 10, 14, 19 (D03-04-PH16 mục 4, FRS 9.3). Ghi vào `ph16_kpi.outbox_event`
    cùng giao dịch nghiệp vụ, Debezium Outbox Event Router đưa lên Kafka; CloudEvents 1.0 dạng cấu trúc. Không sự kiện nào mang nội dung báo cáo hay bằng chứng: chỉ
    mã đối tượng, trạng thái, số tổng hợp. Lưu giữ 7 ngày; ít nhất một lần, bên nhận khử trùng theo `id`. Tương thích BACKWARD: chỉ thêm trường tùy chọn trong `v1`.
    Dữ liệu ví dụ là giả lập. Tệp sinh bởi `tools/gen_asyncapi.py`.'
  contact:
    name: Nhóm phân hệ PH-16
  tags:
  - name: kpi
  - name: arch
  license:
    name: Tài liệu nội bộ dự án Datahub (dự thảo)
defaultContentType: application/json
servers:
  kafka-internal:
    host: dh-kafka-kafka-bootstrap.dh-kafka.svc:9093
    protocol: kafka-secure
    description: 'Listener `internal`: DU, `dh-runtime`, Kafka Connect; mTLS, ACL theo tiền tố tenant.'
    security:
    - $ref: '#/components/securitySchemes/mtls'
