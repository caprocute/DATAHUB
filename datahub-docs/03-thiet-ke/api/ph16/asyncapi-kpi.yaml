  schemas:
    ComplianceLevel:
      type: string
      enum:
      - NOT_ASSESSED
      - COMPLIANT
      - PARTIAL
      - NON_COMPLIANT
      - EXEMPTED
    ComponentType:
      type: string
      enum:
      - HTTT
      - API
      - FLOW
      - TOPIC
      - ADAPTER
      - PLATFORM_SERVICE
      - NATIONAL_LINK
    ExportSubject:
      type: string
      enum:
      - REPORT
      - INDICATOR_VALUES
      - OBSERVATIONS
      - ARCH_REGISTRY
      - ARCH_GRAPH
    Format:
      type: string
      enum:
      - PDF
      - XLSX
      - CSV
      - JSON
    GroupCode:
      type: string
      enum:
      - KET_NOI
      - CHIA_SE
      - DU_LIEU
      - VAN_HANH
      - KIEN_TRUC
    IndicatorScope:
      type: string
      enum:
      - TENANT
      - COMMON
    Lifecycle:
      type: string
      enum:
      - PLANNED
      - ACTIVE
      - DEPRECATED
      - RETIRED
    Measurement:
      type: string
      enum:
      - AUTO
      - MANUAL
      - MIXED
    OpsStatus:
      type: string
      enum:
      - UP
      - DEGRADED
      - DOWN
      - UNKNOWN
    Origin:
      type: string
      enum:
      - AUTO
      - MANUAL
    ReportType:
      type: string
      enum:
      - PERIODIC
      - AD_HOC
      - NATIONAL
    RunFlag:
      type: string
      enum:
      - MISSING_SOURCE
      - STALE_SOURCE
      - MANUAL_PENDING
      - FORMULA_ERROR
    RunTrigger:
      type: string
      enum:
      - SCHEDULE
      - MANUAL
      - RECOMPUTE
      - LATE_DATA
    SourceState:
      type: string
      enum:
      - ACTIVE
      - STALE
      - FAILED
      - PAUSED
      - RETIRED
    SourceType:
      type: string
      enum:
      - EVENT
      - PULL_API
      - PUSH_API
      - MANUAL
    SubmissionState:
      type: string
      enum:
      - PENDING
      - SENDING
      - SENT
      - ACKNOWLEDGED
      - REJECTED
      - FAILED
    SubmissionType:
      type: string
      enum:
      - KPI_REPORT
      - ARCH_REGISTRY
    ValueStatus:
      type: string
      enum:
      - ON_TRACK
      - AT_RISK
      - OFF_TRACK
      - NO_DATA
    IndicatorActivatedData:
      type: object
      description: Phiên bản định nghĩa `ACTIVE` (FR-16-005).
      properties:
        indicatorCode:
          type: string
          pattern: ^[a-z][a-z0-9-]{2,62}$
        version:
          type: integer
        supersededVersion:
          type: integer
        groupCode:
          $ref: '#/components/schemas/GroupCode'
        measurement:
          $ref: '#/components/schemas/Measurement'
        mandatory:
          type: boolean
        scope:
          $ref: '#/components/schemas/IndicatorScope'
        effectiveFrom:
          type: string
          format: date
      required:
      - indicatorCode
      - version
      - groupCode
      - measurement
      - mandatory
      - scope
      - effectiveFrom
    IndicatorRetiredData:
      type: object
      description: Chỉ tiêu ngừng hoặc được thay thế (FR-16-006).
      properties:
        indicatorCode:
          type: string
          pattern: ^[a-z][a-z0-9-]{2,62}$
        replacedBy:
          type: string
          pattern: ^[a-z][a-z0-9-]{2,62}$
        effectivePeriod:
          type: string
          pattern: ^(M|Q|Y)-[0-9]{4}(-[0-9]{2}|-Q[1-4])?$
      required:
      - indicatorCode
      - effectivePeriod
    SourceStateChangedData:
      type: object
      description: Nguồn đổi trạng thái (FR-16-013).
      properties:
        sourceCode:
          type: string
          pattern: ^[a-z][a-z0-9-]{2,62}$
        sourceType:
          $ref: '#/components/schemas/SourceType'
        fromState:
          $ref: '#/components/schemas/SourceState'
        toState:
          $ref: '#/components/schemas/SourceState'
        errorCode:
          type: string
          pattern: ^ERR-16-[0-9]{3}$
        lastObservedAt:
          type: string
          format: date-time
        ageHours:
          type: number
      required:
      - sourceCode
      - sourceType
      - toState
    ManualValueDecidedData:
      type: object
      description: Số liệu tay được quyết định (FR-16-015); chỉ mã, không kèm giá trị bằng chứng.
      properties:
        manualId:
          type: string
          format: uuid
        indicatorCode:
          type: string
          pattern: ^[a-z][a-z0-9-]{2,62}$
        periodCode:
          type: string
          pattern: ^(M|Q|Y)-[0-9]{4}(-[0-9]{2}|-Q[1-4])?$
        decision:
          type: string
          enum:
          - ACCEPTED
          - REJECTED
        enteredBy:
          type: string
        decidedBy:
          type: string
      required:
      - manualId
      - indicatorCode
      - periodCode
      - decision
      - decidedBy
    PeriodComputedData:
      type: object
      description: Lần tổng hợp kết thúc (FR-16-018, 020).
      properties:
        runId:
          type: string
          format: uuid
        periodCode:
          type: string
          pattern: ^(M|Q|Y)-[0-9]{4}(-[0-9]{2}|-Q[1-4])?$
        trigger:
          $ref: '#/components/schemas/RunTrigger'
        state:
          type: string
          enum:
          - SUCCEEDED
          - PARTIAL
          - FAILED
        completeness:
          type: number
          minimum: 0
          maximum: 1
        flags:
          type: array
          items:
            $ref: '#/components/schemas/RunFlag'
        indicatorTotal:
          type: integer
        indicatorComputed:
          type: integer
      required:
      - runId
      - periodCode
      - trigger
      - state
      - completeness
      - flags
    IndicatorStatusChangedData:
      type: object
      description: Chỉ tiêu đổi trạng thái so mục tiêu (FR-16-021).
      properties:
        indicatorCode:
          type: string
          pattern: ^[a-z][a-z0-9-]{2,62}$
        periodCode:
          type: string
          pattern: ^(M|Q|Y)-[0-9]{4}(-[0-9]{2}|-Q[1-4])?$
        groupCode:
          $ref: '#/components/schemas/GroupCode'
        fromStatus:
          $ref: '#/components/schemas/ValueStatus'
        toStatus:
          $ref: '#/components/schemas/ValueStatus'
        value:
          type: number
        unit:
          type: string
        runId:
          type: string
          format: uuid
      required:
      - indicatorCode
      - periodCode
      - toStatus
    ReportSubmittedData:
      type: object
      description: Báo cáo gửi duyệt (FR-16-028).
      properties:
